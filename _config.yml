# Configuration Jekyll, lue par le constructeur de GitHub Pages a chaque push.
# Ce fichier n'est PAS relu a chaud : toute modification demande un nouveau
# push pour prendre effet.
#
# Le titre, la description et le nom d'auteur s'ecrivent en francais normal,
# avec leurs accents : ils seront lus par des visiteurs. La regle « sans
# accents » de ce depot vise les fichiers d'infrastructure, pas le contenu.
title: Ingénieurs et écuries de la F1
description: Les ingénieurs qui ont révolutionné la Formule 1, la généalogie des écuries et les voitures qui ont fait date — classement, méthode et chaînes causales des grandes innovations techniques.
author: Sylvain Geffroy

# L'adresse publique du site, sans barre oblique finale.
#   site de projet    : https://<utilisateur>.github.io
#   site d'utilisateur: https://<utilisateur>.github.io
#   domaine personnel : https://www.exemple.fr
url: "https://s-geffroy.github.io"

# LE PIEGE A CONNAITRE. baseurl est le chemin sous lequel le site est servi :
#
#   depot 'monsite'                 -> baseurl: "/monsite"
#   depot '<utilisateur>.github.io' -> baseurl: ""
#   des qu'un domaine personnalise est en place -> baseurl: ""
#
# Se tromper ne casse pas la construction : le site sort avec toutes ses URLs
# doublement prefixees (/monsite/monsite/...), images et feuilles de style
# comprises. La page s'affiche nue et l'erreur n'apparait nulle part dans les
# journaux.
baseurl: "/f1-eng"

lang: fr

# Pas de theme : l'apparence « encyclopedie » est portee par _layouts/,
# _includes/ et assets/css/ de ce depot.

# Le contenu est organise en deux collections, pas en articles dates :
#   _ingenieurs/ : une entree par ingenieur -> /ingenieurs/<nom>/
#   _dossiers/   : les textes de synthese  -> /dossiers/<nom>/
# Les anciennes adresses datees (blog) redirigent via redirect_from, porte
# dans le front matter de chaque entree. Ne pas le retirer : des liens
# exterieurs peuvent encore les viser.
collections:
  ingenieurs:
    output: true
    permalink: /ingenieurs/:name/
  dossiers:
    output: true
    permalink: /dossiers/:name/
  # Version anglaise : memes identifiants de fichier que les collections francaises
  # (la correspondance entre langues en depend). Textes d'interface : _data/i18n.yml.
  engineers:
    output: true
    permalink: /en/engineers/:name/
  features:
    output: true
    permalink: /en/features/:name/
  # Voitures : meme logique que les entrees (meme nom de fichier dans les deux langues)
  voitures:
    output: true
    permalink: /voitures/:name/
  cars:
    output: true
    permalink: /en/cars/:name/
  # Ecuries : une fiche par ecurie de _data/ecuries.yml, generee par outils/fiches-ecuries.py
  # (meme nom de fichier dans les deux langues ; le contenu vient des donnees).
  ecuries:
    output: true
    permalink: /ecuries/:name/
  teams:
    output: true
    permalink: /en/teams/:name/

defaults:
  # Image de partage (Open Graph) par defaut ; chaque entree a la sienne dans son
  # front matter (image:). Cartes generees par deck/cartes.js.
  - scope:
      path: ""
    values:
      image: /assets/partage/defaut.jpg
  - scope:
      path: ""
      type: ingenieurs
    values:
      layout: entree
  - scope:
      path: ""
      type: dossiers
    values:
      layout: dossier
  - scope:
      path: ""
      type: engineers
    values:
      layout: entree
      lang: en
  - scope:
      path: ""
      type: features
    values:
      layout: dossier
      lang: en
      image: /assets/partage/en/defaut.jpg
  - scope:
      path: ""
      type: voitures
    values:
      layout: voiture
  - scope:
      path: ""
      type: cars
    values:
      layout: voiture
      lang: en
  - scope:
      path: ""
      type: ecuries
    values:
      layout: ecurie
  - scope:
      path: ""
      type: teams
    values:
      layout: ecurie
      lang: en
  - scope:
      path: "en"
    values:
      lang: en
      image: /assets/partage/en/defaut.jpg

# Greffons. Le constructeur de GitHub Pages tourne en SAFE MODE : il ne charge
# que les greffons de sa liste blanche, quoi qu'on ecrive ici, et ignore
# purement et simplement tout fichier depose dans _plugins/. La liste a jour
# est publiee sur https://pages.github.com/versions.json -- va la lire plutot
# que de te fier a une recette trouvee ailleurs.
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# CE QUI NE DOIT PAS ETRE PUBLIE. Sans cette liste, Jekyll copie tout ce qu'il
# trouve a la racine dans le site final : CLAUDE.md, app.yaml et compose.yaml
# seraient servis en ligne, lisibles par n'importe qui.
exclude:
  - CLAUDE.md
  - README.md
  - app.yaml
  - compose.yaml
  - specs/
  - deck/
  - outils/
  - vendor/
  - Gemfile
  - Gemfile.lock

# Domaine personnalise : ce n'est PAS un reglage de ce fichier. C'est un fichier
# CNAME a la racine du depot, plus des enregistrements chez le registrar :
#
#   apex (exemple.fr)     : quatre enregistrements A vers
#                           185.199.108.153, 185.199.109.153,
#                           185.199.110.153, 185.199.111.153
#   sous-domaine (www)    : un CNAME vers <utilisateur>.github.io
#
# Le plus simple est de saisir le domaine dans Settings > Pages : GitHub cree
# lui-meme le commit du fichier CNAME. Poser ce fichier AVANT que le DNS
# resolve fait servir une erreur a la place du site.
