{%- comment -%}
  Forme du repère d'un événement de contexte, une par catégorie (lisible sans la couleur) :
  règlement = carré, sécurité = triangle, économie = rond, technologie = hexagone.
{%- endcomment -%}
<svg class="repere-contexte repere-{{ include.categorie }}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
{%- case include.categorie -%}
{%- when "reglement" %}<rect x="2.5" y="2.5" width="11" height="11"/>
{%- when "securite" %}<polygon points="8,1.8 14.6,14 1.4,14"/>
{%- when "economie" %}<circle cx="8" cy="8" r="6"/>
{%- else %}<polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75"/>
{%- endcase -%}
</svg>
