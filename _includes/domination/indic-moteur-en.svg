<svg class="graphique" viewBox="0 0 640 260" role="img" aria-labelledby="im-t-en im-d-en"><title id="im-t-en">In-house engine or someone else's, by decade</title><desc id="im-d-en">Share of Grands Prix won by a team that also builds its engine (blue) and by a team supplied by an engine maker (grey).</desc><style>.ci-t{font-family:var(--titre);font-size:13px;fill:var(--mine)}.ci-f{font-family:var(--titre);font-size:13px;font-weight:600;fill:var(--graphite)}.ci-g{stroke:#e1e5e7;stroke-width:1}.ci-a{stroke:var(--trait);stroke-width:1}.ci-c{stroke:#1f5fa8;fill:none;stroke-width:2;stroke-linejoin:round}.ci-c2{stroke:#8e979d;fill:none;stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}.ci-p{fill:#1f5fa8;stroke:#fff;stroke-width:1.5}.ci-b{fill:#1f5fa8}.ci-b2{fill:#c2c9cc}</style><line class="ci-a" x1="36" x2="626" y1="230" y2="230"/><g><title>1950–59: in-house engine 80%, someone else's engine 20%</title><rect class="ci-b2" x="50.0" y="34.0" width="45.7" height="37.7"/><rect class="ci-b" x="50.0" y="73.7" width="45.7" height="156.3"/></g><text class="ci-f" x="72.9" y="67.7" text-anchor="middle">80%</text><text class="ci-t" x="72.9" y="248" text-anchor="middle">1950–59</text><g><title>1960–69: in-house engine 28%, someone else's engine 72%</title><rect class="ci-b2" x="123.8" y="34.0" width="45.7" height="139.1"/><rect class="ci-b" x="123.8" y="175.1" width="45.7" height="54.9"/></g><text class="ci-f" x="146.6" y="169.1" text-anchor="middle">28%</text><text class="ci-t" x="146.6" y="248" text-anchor="middle">1960–69</text><g><title>1970–79: in-house engine 29%, someone else's engine 71%</title><rect class="ci-b2" x="197.5" y="34.0" width="45.7" height="136.8"/><rect class="ci-b" x="197.5" y="172.8" width="45.7" height="57.2"/></g><text class="ci-f" x="220.4" y="166.8" text-anchor="middle">29%</text><text class="ci-t" x="220.4" y="248" text-anchor="middle">1970–79</text><g><title>1980–89: in-house engine 21%, someone else's engine 79%</title><rect class="ci-b2" x="271.3" y="34.0" width="45.7" height="153.8"/><rect class="ci-b" x="271.3" y="189.8" width="45.7" height="40.2"/></g><text class="ci-f" x="294.1" y="183.8" text-anchor="middle">21%</text><text class="ci-t" x="294.1" y="248" text-anchor="middle">1980–89</text><g><title>1990–99: in-house engine 17%, someone else's engine 83%</title><rect class="ci-b2" x="345.0" y="34.0" width="45.7" height="160.1"/><rect class="ci-b" x="345.0" y="196.1" width="45.7" height="33.9"/></g><text class="ci-f" x="367.9" y="190.1" text-anchor="middle">17%</text><text class="ci-t" x="367.9" y="248" text-anchor="middle">1990–99</text><g><title>2000–09: in-house engine 61%, someone else's engine 39%</title><rect class="ci-b2" x="418.8" y="34.0" width="45.7" height="73.5"/><rect class="ci-b" x="418.8" y="109.5" width="45.7" height="120.5"/></g><text class="ci-f" x="441.6" y="103.5" text-anchor="middle">61%</text><text class="ci-t" x="441.6" y="248" text-anchor="middle">2000–09</text><g><title>2010–19: in-house engine 61%, someone else's engine 39%</title><rect class="ci-b2" x="492.5" y="34.0" width="45.7" height="74.2"/><rect class="ci-b" x="492.5" y="110.2" width="45.7" height="119.8"/></g><text class="ci-f" x="515.4" y="104.2" text-anchor="middle">61%</text><text class="ci-t" x="515.4" y="248" text-anchor="middle">2010–19</text><g><title>2020–25: in-house engine 31%, someone else's engine 69%</title><rect class="ci-b2" x="566.3" y="34.0" width="45.7" height="134.2"/><rect class="ci-b" x="566.3" y="170.2" width="45.7" height="59.8"/></g><text class="ci-f" x="589.1" y="164.2" text-anchor="middle">31%</text><text class="ci-t" x="589.1" y="248" text-anchor="middle">2020–25</text><rect class="ci-b" x="36" y="4" width="14" height="10"/><text class="ci-f" x="56" y="14">in-house engine</text><rect class="ci-b2" x="206" y="4" width="14" height="10"/><text class="ci-f" x="226" y="14">someone else's engine</text></svg>
