    fr: Le tableau de Wikipedia fait encore figurer Firestone (zéro victoire) en 1975, alors que deux articles de Motor Sport datent de 1975 le départ de Firestone et le monopole Goodyear. Nous suivons Motor Sport, qui écrit en 1977 et en 1997 de façon concordante ; une éventuelle présence marginale de pneus Firestone en 1975 n'est attestée par aucune source lue.
