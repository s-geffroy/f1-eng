  explication:
    fr: La fiche technique d'Autosport donne 2 491 cm³ au moteur Cosworth de la 011, la cylindrée d'un 2,5 litres. Les DFV et DFY de la F1 de 1966-1985 sont des 3 litres, comme l'indique la fiche FW08 du même site.
    en: Autosport's technical sheet gives the 011's Cosworth 2,491cc, the capacity of a 2.5-litre engine. The DFV and DFY of the 1966-1985 F1 were 3-litre units, as the same site's FW08 sheet states.
