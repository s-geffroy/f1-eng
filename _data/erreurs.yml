  source:
    titre: 'Motor Sport, « Legends: Froilan Gonzalez » (mars 2003)'
    titre_en: 'Motor Sport, “Legends: Froilan Gonzalez” (March 2003)'
    url: https://www.motorsportmagazine.com/archive/article/march-2003/16/legends-froilan-gonzalez/
    citation: It was my first win, and also the first for Englebert tyres in F1.
  juste:
    fr: 'González gagne en Pirelli. La première victoire d''Englebert vient plus tard : Spa 1952 si l''on compte les pneus arrière Englebert des Ferrari d''usine (Motor Sport), Monaco 1955 selon la liste de Motorsport-Magazin.'
