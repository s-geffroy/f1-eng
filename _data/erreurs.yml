- id: e015
  categorie: source_erronee
  gravite: mineure
  date: '2026-11-02'
  sujet:
    fr: Victoires des « roadsters » à Indianapolis dès 1950
    en: Indianapolis wins by “roadsters” from 1950
  source:
    titre: 'Indianapolis Motor Speedway, Paul Kelly, « Memory Lane: A.J. Foyt, 1964 » (mai 2018)'
    titre_en: 'Indianapolis Motor Speedway, Paul Kelly, “Memory Lane: A.J. Foyt, 1964” (May 2018)'
    url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2018/05/04/memory-lane-aj-foyt-1964-2018
    citation: Those cars had won every Indianapolis 500 from 1950 through 1963
  juste:
    fr: Les voitures à moteur avant gagnent de 1950 à 1964, mais le premier roadster Kurtis n'apparaît qu'en 1952 ; les vainqueurs de 1951 et 1952 sont des voitures de type dirt-track
    en: Front-engined cars won from 1950 to 1964, but the first Kurtis roadster appeared only in 1952; the 1951 and 1952 winners were dirt-track-type cars
  explication:
    fr: L'IMS rattache « ces voitures » à l'ère des roadsters, alors que son propre récapitulatif date le premier roadster Kurtis de 1952 et décrit les vainqueurs de 1951 et 1952 comme des voitures de dirt-track. La valeur « moteur avant » de nos données reste juste, et nos « pourquoi », qui reprenaient la formule « les roadsters ont gagné toutes les éditions de 1950 à 1963 », sont corrigés.
    en: IMS ties “those cars” to the roadster era, whereas its own recap dates the first Kurtis roadster to 1952 and describes the 1951 and 1952 winners as dirt-track cars. Our “front engine” value remains correct, and our explanations, which repeated the phrase “roadsters won every edition from 1950 to 1963”, have been corrected.
  preuves:
  - titre: 'Indianapolis Motor Speedway, « Year-by-Year Indy 500 Race Recaps: 1950s » (mai 2020)'
    titre_en: 'Indianapolis Motor Speedway, “Year-by-Year Indy 500 Race Recaps: 1950s” (May 2020)'
    url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2020/05/01/indy-500-race-recaps-year-by-year-1950s
    citation: Bill Vukovich led for almost three quarters of the race with the first of the Kurtis–Kraft “roadsters,” so nicknamed because of their resemblance to a street-going sports car.
  - titre: 'Indianapolis Motor Speedway, « Year-by-Year Indy 500 Race Recaps: 1950s » (mai 2020)'
    titre_en: 'Indianapolis Motor Speedway, “Year-by-Year Indy 500 Race Recaps: 1950s” (May 2020)'
    url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2020/05/01/indy-500-race-recaps-year-by-year-1950s
    citation: in spite of his lightweight dirt track–type car giving him a most uncomfortable ride.
