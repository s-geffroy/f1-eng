    citation: A second place would give Piquet the championship if Prost finished third or worse.
  juste:
    fr: 'Deuxième, Piquet n''était titré que si Prost finissait quatrième ou plus loin : à égalité de points (61), Prost l''emportait au nombre de victoires (4 contre 3).'
    en: 'Finishing second, Piquet would only win the title if Prost finished fourth or worse: level on points (61), Prost would win on victories (4 to 3).'
  explication:
