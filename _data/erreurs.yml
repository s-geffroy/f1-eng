    fr: 'RM Sotheby''s parle d''une boîte séquentielle, Motorious d''une grille en H classique. Nous ne tranchons pas : nos données ne retiennent que le point commun, une boîte manuelle et non semi-automatique, ce qui suffit à la valeur « non ».'
