    citation: It was also the first time on pole position for Pirelli, Brian Hart’s engine, the Toleman car and their sponsors Benetton.
  juste:
    fr: 'Pas la première : Pirelli avait signé des poles dans les années 1950 (Alfa Romeo, Ferrari, Maserati) et, à son retour, celle d''Elio de Angelis au Grand Prix d''Europe 1983 (Lotus Renault)'
    en: 'Not the first: Pirelli had taken poles in the 1950s (Alfa Romeo, Ferrari, Maserati) and, after its return, Elio de Angelis''s at the 1983 European Grand Prix (Lotus Renault)'
  explication:
    fr: 'La pole de Fabi au Nürburgring est bien la première de Toleman et de Hart, mais pas celle de Pirelli : nos données donnent à Pirelli les poles des Alfa Romeo, Ferrari et Maserati de 1950 à 1957, et les résultats officiels la pole du Grand Prix d''Europe 1983 à de Angelis, sur une Lotus en Pirelli.'
    en: 'Fabi''s pole at the Nürburgring was indeed Toleman''s and Hart''s first, but not Pirelli''s: our data credits Pirelli with the poles of the 1950-1957 Alfa Romeos, Ferraris and Maseratis, and the official results give the 1983 European Grand Prix pole to de Angelis, in a Pirelli-shod Lotus.'
  preuves:
