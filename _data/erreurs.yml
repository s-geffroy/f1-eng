# Erreurs relevees dans les sources (pages /erreurs/ et /en/errors/), saisies a la main.
# Chaque citation a ete controlee mot pour mot sur sa page ou sa copie archivee (releve du
# 2 novembre 2026). categorie : source_erronee, wikipedia_dementie, recoupement, desaccord ;
# gravite : majeure, mineure, coquille ; numerisation = coquille de l'OCR des archives.
# Lu par _includes/pages/erreurs.html et outils/bibliographie.py (renvoi sur la page Sources).
categories:
- source_erronee
- wikipedia_dementie
- recoupement
- desaccord
