    en: 'Type of manual gearbox on the Benetton B192 (1992): sequential or H-pattern'
  source:
    titre: RM Sotheby's, « 1992 Benetton B192 Formula 1 » (Monaco 2018, lot 153)
    titre_en: RM Sotheby's, “1992 Benetton B192 Formula 1” (Monaco 2018, lot 153)
    url: https://rmsothebys.com/auctions/mc18/lots/r0032-1992-benetton-b192-formula-1/
    citation: With conventional ‘passive’ suspension and sequential gearbox
