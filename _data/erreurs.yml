    fr: Wikipedia affirme que seul Tambay disposait de la 126C3 à Silverstone et qu'Arnoux ne l'a reçue qu'en Allemagne ; l'ancien pourquoi reprenait « confiée à Arnoux dès Hockenheim ». Le bilan Ferrari de Motor Sport donne les deux C3 de Silverstone, 066 pour Arnoux et 067 pour Tambay, et la pole d'Arnoux avec la nouvelle voiture.
    en: Wikipedia states that only Tambay had the 126C3 at Silverstone and that Arnoux only got one in Germany; the former rationale repeated 'given to Arnoux from Hockenheim'. Motor Sport's Ferrari season review lists both Silverstone C3s, 066 for Arnoux and 067 for Tambay, with Arnoux on pole in the new car.
