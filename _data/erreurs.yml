  explication:
    fr: Interrogé en 2003, González se souvient de Silverstone 1951 comme de la première victoire d'Englebert. Le compte rendu d'époque décrit au contraire sa 375 en Pirelli (seul Villoresi est en Englebert).
    en: Interviewed in 2003, González remembered Silverstone 1951 as Englebert's first win. The contemporary report instead describes his 375 on Pirellis (only Villoresi was on Engleberts).
