    fr: Châssis 098 selon Girardo & Co. ; le numéro 097 de notre pourquoi ne reposait que sur Ultimatecarpage
    en: Chassis 098 according to Girardo & Co.; the 097 in our text rested only on Ultimatecarpage
  explication:
    fr: Ultimatecarpage, site d'amateurs, attribue les deux victoires de Berger au châssis 097 ; le marchand Girardo & Co., qui retrace la carrière du châssis 098 course par course et cite la correspondance d'usine, les attribue au 098. Nous retenons 098, mieux documenté, et notre pourquoi est corrigé en conséquence. Le modèle (F1/87) n'est pas en cause.
    en: Ultimatecarpage, an enthusiast site, credits Berger's two wins to chassis 097; the dealer Girardo & Co., which traces chassis 098's career race by race and cites factory correspondence, credits them to 098. We follow 098, the better documented, and our text has been corrected accordingly. The model (F1/87) is not in question.
