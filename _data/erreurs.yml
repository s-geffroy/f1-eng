    citation: The 126C3 was first introduced for the British Grand Prix at Silverstone in 1983, with Patrick Tambay, while Arnoux would get to drive a 126C3 at the subsequent race in Germany at Hockenheim, which he ended up winning.
  juste:
    fr: Arnoux et Tambay disposent tous deux d'une 126C3 dès Silverstone (126C3/066 pour Arnoux, qui y signe la pole).
