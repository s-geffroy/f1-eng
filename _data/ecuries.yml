- id: ligier
  nom: 'Ligier : de Ligier à Prost'
  segments:
  - ecurie: ligier
    de: 1976
    a: 1996
  - ecurie: prost
    de: 1997
    a: 2001
    lien:
      type: rachat
      preuve: atteste
      pourquoi: En février 1997, Alain Prost signe à Genève le rachat de l'équipe Ligier à Flavio Briatore, après dix-huit mois de négociations ; la FIA autorise aussitôt les châssis Ligier à prendre le nom Prost, et Prost se dit seul propriétaire, sur ses fonds propres (GrandPrix.com, février 1997).
      sources:
      - titre: GrandPrix.com, « Prost takes over Ligier... » (février 1997)
        url: https://www.grandprix.com/news/prost-takes-over-ligier.html
- id: arrows
  nom: 'Arrows : Arrows et Footwork'
  segments:
  - ecurie: arrows
    de: 1978
    a: 1990
  - ecurie: footwork
    de: 1991
    a: 1996
    lien:
      type: rachat
      preuve: atteste
      pourquoi: À la fin des années 1980, Wataru Ohashi, patron du transporteur japonais Footwork, rachète l'équipe à 100 % ; en 1991 elle devient Footwork Grand Prix International et ses voitures des Footwork, Jackie Oliver restant à sa tête (Adam Cooper, Motor Sport, qui cite Oliver).
      sources:
      - titre: 'Motor Sport Magazine, Adam Cooper, « Jackie Oliver''s army: the story of the Arrows F1 team » (septembre 1998)'
        url: https://www.motorsportmagazine.com/archive/article/september-1998/58/olivers-army/
  - ecurie: arrows
    de: 1997
    a: 2002
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Oliver, qui avait racheté l'équipe à Ohashi en 1995, s'associe au début de 1996 à Tom Walkinshaw, qui prend 40 % et les pleins pouvoirs (Oliver, cité par Adam Cooper) ; TWR achève la reprise en juillet 1996 et Walkinshaw devient président et directeur général (GrandPrix.com). Le nom Arrows revient en 1997, première saison complète sous son contrôle.
      sources:
      - titre: 'Motor Sport Magazine, Adam Cooper, « Jackie Oliver''s army: the story of the Arrows F1 team » (septembre 1998)'
        url: https://www.motorsportmagazine.com/archive/article/september-1998/58/olivers-army/
      - titre: GrandPrix.com, « TWR completes Arrows takeover » (juillet 1996)
        url: https://www.grandprix.com/news/twr-completes-arrows-takeover.html
- id: osella
  nom: 'Osella : d''Osella à Fondmetal'
  segments:
  - ecurie: osella
    de: 1980
    a: 1990
  - ecurie: fondmetal
    de: 1991
    a: 1992
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Gabriele Rumi, dont la société Fondmetal commanditait Osella, en prend une large part en 1990 puis toute l'écurie pour 1991, qui court désormais sous le nom de Fondmetal (Fondmetal). Enzo Osella s'en va et l'équipe déménage à Palosco, près de Bergame (GrandPrix.com, Joe Saward).
      sources:
