- id: manor
  nom: Virgin, Marussia et Manor
  segments:
  - ecurie: virgin
    de: 2010
    a: 2011
  - ecurie: marussia
    de: 2012
    a: 2015
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Fin 2010, le constructeur russe Marussia Motors devient actionnaire important de Virgin Racing, présenté comme tel par le directeur Graeme Lowdon (Crash.net) ; l'équipe, entrée en 2010 sous le nom Virgin, est reprise par Marussia et ses voitures sont officiellement rebaptisées à partir de 2012 (Formula1.com, Motor Sport).
      sources:
      - titre: Crash.net, Craig Llewellyn, « Marussia ups stake in Virgin » (2010)
        url: https://www.crash.net/f1/news/164951/1/virgin-looks-to-future-after-russian-buy-in
      - titre: Formula1.com, « Marussia reach the end of the road » (novembre 2014)
        url: https://www.formula1.com/en/latest/article/marussia-reach-the-end-of-the-road.3hOQBfrcgFA1oqsVSigpbn
      - titre: Motor Sport Magazine, base de données, « Manor Grand Prix »
        url: https://www.motorsportmagazine.com/database/teams/manor-grand-prix/
  - ecurie: manor
    de: 2016
    a: 2016
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Sauvée de l'administration judiciaire début 2015 avec l'appui de Stephen Fitzpatrick (Autosport), l'équipe court en 2015 sous le nom Manor Marussia, puis confirme qu'elle s'appellera Manor Racing en 2016 (ESPN).
      sources:
      - titre: ESPN, Nate Saunders, « Manor reveals new name and logo » (janvier 2016)
        url: https://www.espn.com/f1/story/_/id/14608552/manor-reveals-new-name-logo
