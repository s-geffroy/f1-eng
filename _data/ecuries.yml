- id: enstone
  nom: 'Enstone : de Toleman à Alpine'
  actuelle: true
  segments:
  - ecurie: toleman
    de: 1981
    a: 1985
  - ecurie: benetton
    de: 1986
    a: 2001
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Commanditaire de Toleman en 1985, la famille Benetton rachète l'équipe en difficulté et la rebaptise Benetton Formula, lancée officiellement en février 1986 (GrandPrix.com ; The Race).
      sources:
      - titre: GrandPrix.com, « Benetton Formula Ltd. »
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
      - titre: The Race, Edd Straw, « Ranking Renault/Alpine's five previous F1 identities » (septembre 2020)
        url: https://www.the-race.com/formula-1/ranking-renault-alpines-five-previous-f1-identities/
  - ecurie: renault
    de: 2002
    a: 2011
    lien:
      type: usine-motoriste
      preuve: etabli
      pourquoi: Renault rachète l'équipe Benetton début 2000 pour 120 millions de dollars ; elle court encore sous le nom de Benetton en 2000 et 2001, le moteur prenant le nom de Renault en 2001, puis devient l'équipe d'usine Renault en 2002 (Motor Sport ; GrandPrix.com).
      sources:
      - titre: 'Motor Sport Magazine, James Elson, « Teapots, turbos and titles: Renault''s wild F1 ride » (décembre 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
      - titre: GrandPrix.com, « Benetton Formula Ltd. »
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
  - ecurie: lotus-f1
    de: 2012
    a: 2015
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Renault a vendu 75 % de son équipe à Genii Capital, la société de Gérard Lopez, durant l'hiver 2009-2010, mais elle garde le nom de Renault ; Lotus devenu commanditaire principal, Genii obtient pour 2012 de la renommer Lotus, avec l'accord de Renault, qui reste motoriste (Autosport).
      sources:
      - titre: 'Autosport, Jonathan Noble, « Renault: No regrets about selling stake » (octobre 2010)'
        url: https://www.autosport.com/f1/news/renault-no-regrets-about-selling-stake-4441218/4441218/
      - titre: Autosport, Jonathan Noble, « Renault backs Formula 1 team name change to Lotus » (octobre 2011)
        url: https://www.autosport.com/f1/news/renault-backs-formula-1-team-name-change-to-lotus-4450345/4450345/
      - titre: Formula 1, « Alpine - Year by Year »
        url: https://www.formula1.com/en/information/alpine-year-by-year.26lcAj4zKxSs1w959B6yV
  - ecurie: renault
    de: 2016
    a: 2020
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Le 18 décembre 2015, le groupe Renault, motoriste de l'équipe, achève le rachat d'une participation de contrôle dans Lotus F1 Team auprès d'une filiale de Genii Capital, et revient en F1 comme constructeur ; l'équipe court sous le nom de Renault dès 2016 (formula1.com ; Motor Sport).
      sources:
      - titre: Formula 1, « Renault formally complete Lotus takeover » (décembre 2015)
        url: https://www.formula1.com/en/latest/article/renault-formally-complete-lotus-takeover.5aFbvhNiNzoO5DxGIZ5iQr
      - titre: 'Motor Sport Magazine, James Elson, « Teapots, turbos and titles: Renault''s wild F1 ride » (décembre 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
  - ecurie: alpine
    de: 2021
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Le 6 septembre 2020, Renault annonce que son équipe s'appellera Alpine F1 Team dès 2021, du nom de sa marque sportive, dans le cadre de la réorganisation du groupe par Luca de Meo ; les moteurs restent des Renault construits à Viry-Châtillon (Motor Sport ; formula1.com).
      sources:
      - titre: Motor Sport Magazine, Jake Williams-Smith, « Renault to become Alpine F1 Team from 2021 season » (septembre 2020)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/renault-to-become-alpine-f1-team-from-2021-season/
      - titre: Formula 1, « Renault to rebrand as Alpine F1 Team in 2021 » (septembre 2020)
        url: https://www.formula1.com/en/latest/article/renault-alpine-f1-team-2021.7eY84dCU9MythQjcYG8T45
- id: faenza
  nom: 'Faenza : de Minardi aux Racing Bulls'
  actuelle: true
  segments:
  - ecurie: minardi
    de: 1985
    a: 2005
  - ecurie: toro-rosso
    de: 2006
    a: 2019
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Red Bull rachète Minardi à Paul Stoddart lors du Grand Prix de Belgique 2005, pour environ 35 millions de dollars selon la presse ; l'équipe de Faenza débute en 2006 sous le nom de Scuderia Toro Rosso (GrandPrix.com ; formula1.com).
      sources:
      - titre: GrandPrix.com, « Red Bull acquires Minardi! » (septembre 2005)
        url: https://www.grandprix.com/news/red-bull-acquires-minardi.html
      - titre: Formula 1, « Toro Rosso from A-Z » (mars 2015)
        url: https://www.formula1.com/en/latest/article/toro-rosso-from-a-z.94qRWgpnalObzkOr0UNGX
  - ecurie: alphatauri
    de: 2020
    a: 2023
    lien:
      type: renommage
      preuve: atteste
      pourquoi: La liste provisoire des engagés 2020 publiée par la FIA confirme que la Scuderia Toro Rosso devient la Scuderia AlphaTauri, du nom de la marque de vêtements de Red Bull, qui reste propriétaire (formula1.com).
      sources:
      - titre: Formula 1, « Toro Rosso's name change to AlphaTauri confirmed in provisional 2020 entry list » (novembre 2019)
        url: https://www.formula1.com/en/latest/article/toro-rossos-name-change-to-alpha-tauri-confirmed-in-provisional-2020-entry.5tIxtPAMsY8MACQAyvg41j
  - ecurie: rb
    de: 2024
    a: 2024
    lien:
      type: renommage
      preuve: atteste
      pourquoi: En janvier 2024, l'équipe sœur de Red Bull annonce qu'elle s'appellera désormais RB, de son nom complet Visa Cash App RB Formula One Team (formula1.com).
      sources:
      - titre: Formula 1, « AlphaTauri rebrand confirmed for 2024 season as new team name revealed » (janvier 2024)
        url: https://www.formula1.com/en/latest/article/alphatauri-rebrand-confirmed-for-2024-season-as-new-team-name-revealed.4xAWHWI66d5L9mFELLGb6J
  - ecurie: racing-bulls
    de: 2025
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Pour 2025, Visa Cash App RB devient Visa Cash App Racing Bulls : selon son directeur général Peter Bayer, le sigle RB, adopté dans la précipitation, prêtait à confusion, et Racing Bulls est le nom de la société (The Race).'
      sources:
      - titre: The Race, Josh Suttill et Scott Mitchell-Malm, « Why Red Bull's second F1 squad is fixing its 'rushed' team name » (décembre 2024)
        url: https://www.the-race.com/formula-1/why-red-bulls-second-f1-team-is-fixing-its-rushed-team-name/
- id: silverstone
  nom: 'Silverstone : de Jordan à Aston Martin'
  actuelle: true
  segments:
  - ecurie: jordan
    de: 1991
    a: 2005
  - ecurie: midland
    de: 2006
    a: 2006
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Le groupe Midland d'Alex Shnaider annonce le 24 janvier 2005 la signature du contrat de rachat de Jordan ; l'équipe court encore sous le nom Jordan toute la saison 2005 et n'apparaît sous son nouveau nom, Midland F1 Racing, qu'en 2006 (Matt Bishop, Motor Sport).
      sources:
      - titre: Motor Sport Magazine, Matt Bishop, « The billionaire Trump associate who bought Jordan F1 team — and turned a quick profit » (janvier 2025)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/the-billionaire-trump-associate-who-bought-jordan-f1-team-and-turned-a-quick-profit/
      - titre: 'Formula 1, Samarth Kanal, « Team guide: Aston Martin''s complex F1 roots » (janvier 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: spyker
    de: 2007
    a: 2007
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Le 9 septembre 2006, à Monza, le groupe Midland annonce la vente de 100 % des parts de Midland F1 Limited au constructeur néerlandais Spyker Cars (Autosport, communiqué officiel cité).
      sources:
      - titre: Autosport, « Midland sale to Spyker now complete » (septembre 2006)
        url: https://www.autosport.com/f1/news/midland-sale-to-spyker-now-complete-4405729/4405729/
  - ecurie: force-india
    de: 2008
    a: 2018
    lien:
      type: rachat
      preuve: etabli
      pourquoi: L'homme d'affaires indien Vijay Mallya rachète Spyker en 2007 avec le Néerlandais Michiel Mol, pour 61 millions de livres (Motor Sport) ; l'équipe prend le nom de Force India en 2008 (formula1.com).
      sources:
      - titre: Motor Sport Magazine, Samarth Kanal, « Force India's F1 decade » (juillet 2018)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/force-indias-f1-decade/
      - titre: 'Formula 1, Samarth Kanal, « Team guide: Aston Martin''s complex F1 roots » (janvier 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: racing-point
    de: 2019
    a: 2020
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Force India placée en administration judiciaire, les administrateurs vendent l'entreprise et ses actifs en août 2018 au consortium mené par Lawrence Stroll (Racing Point UK Limited) ; la FIA accorde une nouvelle inscription, et « Racing Point Force India » repart de zéro point dès le Grand Prix de Belgique (formula1.com). Le nom Force India disparaît en 2019.
      sources:
      - titre: Formula 1, « FIA approve Racing Point Force India F1 entry » (août 2018)
        url: https://www.formula1.com/en/latest/article/fia-approve-racing-point-force-india-f1-entry.3BsgxEhqbYeUqec40OaSEw
      - titre: 'Formula 1, Samarth Kanal, « Team guide: Aston Martin''s complex F1 roots » (janvier 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: aston-martin
    de: 2021
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Le consortium de Lawrence Stroll, déjà propriétaire de Racing Point, prend 16,7 % d''Aston Martin pour 182 millions de livres en janvier 2020 ; l''équipe annonce qu''elle deviendra l''équipe d''usine Aston Martin à partir de 2021 et portera ce nom au moins dix ans (formula1.com ; Dominic Tobin, Motor Sport). Même propriétaire, même usine : c''est un changement de nom.'
      sources:
      - titre: Formula 1, « Racing Point set to become Aston Martin works team for 2021 » (janvier 2020)
        url: https://www.formula1.com/en/latest/article/racing-point-set-to-become-aston-martin-racing-for-2021.2YwShWhMbZr2NK1M4Q1nMn
      - titre: Motor Sport Magazine, Dominic Tobin, « Racing Point to become Aston Martin F1 in 2021 » (janvier 2020)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/racing-point-to-become-aston-martin-in-2021/
- id: hinwil
  nom: 'Hinwil : de Sauber à Audi'
  actuelle: true
  segments:
  - ecurie: sauber
    de: 1993
    a: 2005
  - ecurie: bmw-sauber
    de: 2006
    a: 2009
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Le 22 juin 2005, BMW annonce qu'après avoir acquis la majorité de l'équipe suisse Sauber, une équipe gérée par BMW disputera le championnat dès 2006 (communiqué BMW) ; Peter Sauber garde 20 % des parts (Edd Straw, The Race).
      sources:
      - titre: BMW Group, « BMW managed team from 2006 » (juin 2005)
        url: https://www.press.bmwgroup.com/latin-america-caribbean/article/detail/T0050556EN/bmw-managed-team-from-2006?language=en
      - titre: The Race, Edd Straw, « The 10 key moments in Sauber's F1 history ahead of Audi deal » (octobre 2022)
        url: https://www.the-race.com/formula-1/the-10-key-moments-in-saubers-f1-history-ahead-of-audi-deal/
  - ecurie: sauber
    de: 2010
    a: 2018
    lien:
      type: rachat
      preuve: atteste
      pourquoi: BMW annonce son retrait de la F1 à la fin de 2009 ; Peter Sauber parvient à un accord avec le constructeur et rachète l'équipe (Crash.net). Autosport rappelle qu'en novembre 2009 BMW avait choisi de revendre l'équipe à son fondateur.
      sources:
      - titre: Crash.net, « 40 Years of Sauber Motorsport - A Tale of the Unexpected » (juillet 2010)
        url: https://www.crash.net/f1/news/161819/1/the-sauber-story-at-40-a-tale-of-the-unexpected
      - titre: Autosport, Jonathan Noble, « BMW Sauber name to remain for now » (janvier 2010)
        url: https://www.autosport.com/f1/news/bmw-sauber-name-to-remain-for-now-4435180/4435180/
  - ecurie: alfa-romeo
    de: 2019
    a: 2023
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Après un an de partenariat-titre (2018), l''équipe devient Alfa Romeo Racing en 2019 ; le nom Sauber quitte la grille après 26 ans, mais propriétaires (Longbow Finance depuis 2016) et direction restent les mêmes : l''équipe « reste Sauber en tout sauf le nom » (Lawrence Barretto, formula1.com).'
      sources:
      - titre: Formula 1, Lawrence Barretto, « What dropping Sauber name means for Alfa Romeo Racing » (février 2019)
        url: https://www.formula1.com/en/latest/article/what-dropping-sauber-name-means-for-alfa-romeo-racing.5mXcTEz3dv63T9SLuAInDl
  - ecurie: kick-sauber
    de: 2024
    a: 2025
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Alfa Romeo annonce en août 2022 qu''il mettra fin à son parrainage-titre de Sauber à l''expiration du contrat, fin 2023 (formula1.com) ; l''équipe s''inscrit pour 2024 sous le nom « Stake F1 Team Kick Sauber », avec un châssis baptisé Kick Sauber C44 (The Race). L''équipe de Hinwil ne change pas de mains : seul le parrain-titre change.'
      sources:
      - titre: Formula 1, « Alfa Romeo to end Sauber partnership at end of 2023 season » (août 2022)
        url: https://www.formula1.com/en/latest/article/alfa-romeo-to-end-sauber-partnership-at-end-of-2023-season.4bKd4sn2aDCTbpbCAQWeGQ
      - titre: The Race, « Sauber relaunches under new Stake F1 team identity » (janvier 2024)
        url: https://www.the-race.com/formula-1/stake-f1-team-sauber-relaunch/
  - ecurie: audi
    de: 2026
    a: 2026
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Audi choisit en 2022 le groupe Sauber comme partenaire de son entrée en F1, avec un groupe propulseur conçu par Audi (FIA) ; en mars 2024, le constructeur décide de prendre 100 % de Sauber avant ses débuts de 2026 (formula1.com).
      sources:
      - titre: FIA, « FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry » (octobre 2022)
        url: https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry
      - titre: Formula 1, « Audi expands commitment to Formula 1 with 100% takeover of Sauber » (mars 2024)
        url: https://www.formula1.com/en/latest/article/audi-expands-commitment-to-formula-1-with-100-takeover-of-sauber.4g5fNv9jl03sw5btt4LuSw
