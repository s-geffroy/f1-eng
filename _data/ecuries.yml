      pourquoi: Tony Fernandes, qui courait sous un nom Lotus concédé par Proton, rachète Caterham Cars et rebaptise son équipe Caterham F1 Team pour 2012 (Motor Sport) ; « nous nous appellerons Caterham F1 Team, avec les mêmes personnes », annonce-t-il (Autosport). Le nom Lotus passe alors à l'écurie d'Enstone, une autre équipe.
