# Genealogie des ecuries (pages /ecuries/, accueil, bande de la chronologie).
# lignees : une rangee de la frise = une meme structure (usine, equipe, engagement) a travers ses noms.
#   actuelle : true si la lignee est engagee en 2026 (son dernier segment va jusqu'a 2026)
#   segments : ecurie (identifiant ci-dessous), de / a = premiere et derniere saison sous ce nom
#     lien (tout segment sauf le premier) : passage depuis le nom precedent
#       type    : rachat | renommage | reprise-partielle | usine-motoriste (libelles : _data/i18n.yml)
#       preuve  : atteste | etabli | discute (comme la chronologie)
#       pourquoi, sources : obligatoires (_dossiers/causalite.md) ; sinon le passage n'est pas publie
# ecuries : une fiche par nom. voitures = identifiants _voitures/ (chaque voiture dans une seule ecurie),
#   ingenieurs = [{id, de, a}] (_ingenieurs/), jalons = identifiants de _data/chronologie.yml,
#   sources = saisons disputees sous ce nom.
# Meme structure dans _data/en/ecuries.yml : seuls les textes changent (controle : outils/verifier.py).
lignees:
- id: ferrari
  nom: Ferrari
  actuelle: true
  segments:
  - ecurie: ferrari
    de: 1950
    a: 2026
- id: mclaren
  nom: McLaren
  actuelle: true
  segments:
  - ecurie: mclaren
    de: 1966
    a: 2026
- id: brackley
  nom: 'Brackley : de Tyrrell à Mercedes'
  actuelle: true
  segments:
  - ecurie: tyrrell
    de: 1970
    a: 1998
  - ecurie: bar
    de: 1999
    a: 2005
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Le 28 novembre 1997, Ken Tyrrell vend son équipe à British American Tobacco, pour une somme évaluée à 30 millions de livres, en vue de créer British American Racing ; l'équipe court encore sous le nom de Tyrrell en 1998, puis devient BAR en 1999 (Autosport ; Motor Sport).
      sources:
      - titre: Autosport, Maurice Hamilton, « How Tyrrell became a racing Rubik's cube as it faded out of F1 » (février 2023)
        url: https://www.autosport.com/f1/news/how-tyrrell-became-a-racing-rubiks-cube-as-it-faded-out-of-f1/10427616/
      - titre: 'Motor Sport Magazine, Pablo Elizalde, « From Tyrrell shed via Brawn fairytale: the evolution of Mercedes'' F1 team » (septembre 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/from-tyrrell-shed-via-brawn-fairytale-the-evolution-of-mercedes-f1-team/
  - ecurie: honda
    de: 2006
    a: 2008
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Honda, motoriste de BAR et déjà actionnaire à 45 %, annonce le 4 octobre 2005 qu'il rachète toutes les parts de BARH Ltd., dont les 55 % de British American Tobacco, pour engager sa propre équipe à partir de 2006 ; elle prend le nom de Lucky Strike Honda Racing F1 Team (Honda).
      sources:
      - titre: Honda, « Honda acquires all shares in BARH Ltd. » (octobre 2005)
        url: https://global.honda/en/newsroom/news/2005/c051004-eng.html
      - titre: Honda, « 2006 | F1 »
        url: https://global.honda/en/F1/2006/
  - ecurie: brawn
    de: 2009
    a: 2009
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Après l'annonce du retrait de Honda fin 2008, Honda cède le 6 mars 2009 la totalité des parts de son équipe à Ross Brawn, son directeur ; ce rachat par la direction, avec des moteurs Mercedes, donne naissance au Brawn GP Formula One Team (Honda ; Motor Sport).
      sources:
      - titre: Honda, « Honda Announces Sale of the Honda Racing F1 Team » (mars 2009)
        url: https://global.honda/en/newsroom/news/2009/c090306eng.html
      - titre: Motor Sport Magazine, Ed Foster, « Brawn GP gets the green light » (mars 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/brawn-gp-gets-green-light/
  - ecurie: mercedes
    de: 2010
    a: 2026
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Le 16 novembre 2009, Mercedes-Benz, motoriste de Brawn, en rachète 75,1 % (45,1 % pour Daimler, 30 % pour Aabar Investments) et la rebaptise Mercedes Grand Prix ; Dieter Zetsche annonce une équipe d'usine dès 2010 (Autosport ; Motor Sport).
      sources:
      - titre: Autosport, Edd Straw, « Mercedes takes over Brawn » (novembre 2009)
        url: https://www.autosport.com/f1/news/mercedes-takes-over-brawn-4433692/4433692/
      - titre: Motor Sport Magazine, Ed Foster, « Mercedes buys out Brawn GP » (novembre 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/mercedes-buys-out-brawn-gp/
