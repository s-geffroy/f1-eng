    de: 1975
    a: 1975
    lien:
      type: renommage
      preuve: etabli
      pourquoi: Les voitures de la série IR/FW, appelées Iso-Marlboro en 1973 et 1974, prennent le nom Williams en 1975 ; mêmes voitures, mêmes pilotes (Merzario, Laffite) (Allen Brown, OldRacingCars.com).
      sources:
      - titre: OldRacingCars.com, Allen Brown, « Williams IR/FW car-by-car histories »
        url: https://www.oldracingcars.com/williams/ir/fw/
  - ecurie: wolf-williams
    de: 1976
    a: 1976
    lien:
      type: rachat
      preuve: etabli
      pourquoi: 'À la fin de 1975, Walter Wolf prend 60 % de Frank Williams (Racing Cars) Ltd en épongeant ses dettes, rachète les actifs de Hesketh — la 308C devient la FW05 — et laisse Williams en place comme directeur : l''équipe Wolf-Williams est née (GrandPrix.com ; Allen Brown, OldRacingCars.com).'
      sources:
      - titre: GrandPrix.com, « Walter Wolf Racing »
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: OldRacingCars.com, Allen Brown, « Williams FW05 car-by-car histories »
        url: https://www.oldracingcars.com/williams/fw05/
  - ecurie: wolf
    de: 1977
    a: 1979
    lien:
      type: rachat
      preuve: atteste
      pourquoi: 'Après une saison 1976 désastreuse, Wolf écarte Frank Williams de la direction et restructure l''équipe, qui devient Walter Wolf Racing ; Williams part fonder Williams Grand Prix Engineering avec Patrick Head (GrandPrix.com). Wolf le dit lui-même : « J''ai racheté les actifs de Frank Williams et lancé Walter Wolf Racing » (René Fagnan, Motorsport.com).'
      sources:
      - titre: GrandPrix.com, « Walter Wolf Racing »
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: Motorsport.com, René Fagnan, « The story of Formula 1's first winning Wolf » (décembre 2015)
        url: https://www.motorsport.com/f1/news/the-story-of-formula-1-s-first-winning-wolf/662835/
