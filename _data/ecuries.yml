# Genealogie des ecuries (pages /ecuries/, accueil, bande de la chronologie).
# lignees : une rangee de la frise = une meme structure (usine, equipe, engagement) a travers ses noms.
#   actuelle : true si la lignee est engagee en 2026 (son dernier segment va jusqu'a 2026)
#   segments : ecurie (identifiant ci-dessous), de / a = premiere et derniere saison sous ce nom
#     lien (tout segment sauf le premier) : passage depuis le nom precedent
#       type    : rachat | renommage | reprise-partielle | usine-motoriste (libelles : _data/i18n.yml)
#       preuve  : atteste | etabli | discute (comme la chronologie)
#       pourquoi, sources : obligatoires (_dossiers/causalite.md) ; sinon le passage n'est pas publie
# ecuries : une fiche par nom. voitures = identifiants _voitures/ (chaque voiture dans une seule ecurie),
#   ingenieurs = [{id, de, a}] (_ingenieurs/), jalons = identifiants de _data/chronologie.yml,
#   sources = saisons disputees sous ce nom.
# Meme structure dans _data/en/ecuries.yml : seuls les textes changent (controle : outils/verifier.py).
lignees:
