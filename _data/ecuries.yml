- id: march
  nom: 'March : March et Leyton House'
  segments:
  - ecurie: march
    de: 1970
    a: 1977
  - ecurie: march
    de: 1987
    a: 1989
    lien:
      type: reprise-partielle
      preuve: atteste
      pourquoi: 'En 1987, Robin Herd ramène March en F1 avec l''argent de Leyton House ; ce n''est pas l''équipe RAM de 1982 mais une nouvelle équipe créée par la société March, que Herd confie à Ian Phillips : « Il y a une usine prête », raconte Phillips — vide, en réalité (Marcus Simmons, Motor Sport ; GrandPrix.com).'
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: GrandPrix.com, « Robin Herd »
        url: https://www.grandprix.com/people/robin-herd.html
  - ecurie: leyton-house
    de: 1990
    a: 1991
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'Commanditaire de March depuis 1987, Akira Akagi rachète l''équipe de F1 de March en mai 1989 ; elle garde le nom March cette saison-là, puis est rebaptisée Leyton House pour 1990, sans plus aucune mention de March (Marcus Simmons, Motor Sport ; Russell Campbell, Goodwood). Le rachat précède le changement de nom : celui-ci est un renommage par le même propriétaire.'
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, « A bolt from the blue: the rise and fall of Leyton House Racing » (juin 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
  - ecurie: march
    de: 1992
    a: 1992
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Akagi est arrêté en septembre 1991 dans un scandale financier et son associé Ken Marrable prend le contrôle de l'équipe (Goodwood) ; pour 1992, elle est rachetée par un consortium comprenant Marrable, et la voiture redevient une March (Marcus Simmons, Motor Sport).
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, « A bolt from the blue: the rise and fall of Leyton House Racing » (juin 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
- id: wolf
  nom: Frank Williams Racing Cars et Wolf
  segments:
  - ecurie: politoys
    de: 1972
    a: 1972
  - ecurie: iso-marlboro
    de: 1973
    a: 1974
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'Même équipe, Frank Williams, nouveaux commanditaires : Politoys parti, les FX3 deviennent des Iso-Marlboro FX3B en 1973, et les nouvelles voitures de John Clarke portent aussi le nom Iso-Marlboro (Allen Brown, OldRacingCars.com).'
      sources:
      - titre: OldRacingCars.com, Allen Brown, « Williams FX3 car-by-car histories »
        url: https://www.oldracingcars.com/williams/fx3/
      - titre: OldRacingCars.com, Allen Brown, « Williams IR/FW car-by-car histories »
        url: https://www.oldracingcars.com/williams/ir/fw/
  - ecurie: frank-williams-racing-cars
    de: 1975
    a: 1975
    lien:
      type: renommage
      preuve: etabli
      pourquoi: Les voitures de la série IR/FW, appelées Iso-Marlboro en 1973 et 1974, prennent le nom Williams en 1975 ; mêmes voitures, mêmes pilotes (Merzario, Laffite) (Allen Brown, OldRacingCars.com).
      sources:
      - titre: OldRacingCars.com, Allen Brown, « Williams IR/FW car-by-car histories »
        url: https://www.oldracingcars.com/williams/ir/fw/
  - ecurie: wolf-williams
    de: 1976
    a: 1976
    lien:
      type: rachat
      preuve: etabli
      pourquoi: 'À la fin de 1975, Walter Wolf prend 60 % de Frank Williams (Racing Cars) Ltd en épongeant ses dettes, rachète les actifs de Hesketh — la 308C devient la FW05 — et laisse Williams en place comme directeur : l''équipe Wolf-Williams est née (GrandPrix.com ; Allen Brown, OldRacingCars.com).'
      sources:
      - titre: GrandPrix.com, « Walter Wolf Racing »
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: OldRacingCars.com, Allen Brown, « Williams FW05 car-by-car histories »
        url: https://www.oldracingcars.com/williams/fw05/
  - ecurie: wolf
    de: 1977
    a: 1979
    lien:
      type: rachat
      preuve: atteste
      pourquoi: 'Après une saison 1976 désastreuse, Wolf écarte Frank Williams de la direction et restructure l''équipe, qui devient Walter Wolf Racing ; Williams part fonder Williams Grand Prix Engineering avec Patrick Head (GrandPrix.com). Wolf le dit lui-même : « J''ai racheté les actifs de Frank Williams et lancé Walter Wolf Racing » (René Fagnan, Motorsport.com).'
      sources:
      - titre: GrandPrix.com, « Walter Wolf Racing »
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: Motorsport.com, René Fagnan, « The story of Formula 1's first winning Wolf » (décembre 2015)
        url: https://www.motorsport.com/f1/news/the-story-of-formula-1-s-first-winning-wolf/662835/
- id: ensign
  nom: 'Ensign : d''Ensign à Theodore'
  segments:
  - ecurie: ensign
    de: 1973
    a: 1982
  - ecurie: theodore
    de: 1983
    a: 1983
    lien:
      type: rachat
      preuve: discute
      pourquoi: 'Pour 1983, Teddy Yip réunit Theodore et Ensign : l''équipe garde le nom Theodore mais court avec l''Ensign N183 de Nigel Bennett, et ferme à la fin de l''année. GrandPrix.com parle de fusion, Allen Brown (OldRacingCars.com) d''un rachat de l''équipe de Mo Nunn par Yip ; la continuité des voitures, elle, est attestée — le châssis Ensign MN16 de 1982 est reconstruit en N183.'
      sources:
      - titre: GrandPrix.com, « Theodore Racing »
        url: https://www.grandprix.com/constructors/theodore-racing.html
