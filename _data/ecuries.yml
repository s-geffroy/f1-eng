- id: march
  nom: 'March : March et Leyton House'
  segments:
  - ecurie: march
    de: 1970
    a: 1977
  - ecurie: march
    de: 1987
    a: 1989
    lien:
      type: reprise-partielle
      preuve: atteste
      pourquoi: 'En 1987, Robin Herd ramène March en F1 avec l''argent de Leyton House ; ce n''est pas l''équipe RAM de 1982 mais une nouvelle équipe créée par la société March, que Herd confie à Ian Phillips : « Il y a une usine prête », raconte Phillips — vide, en réalité (Marcus Simmons, Motor Sport ; GrandPrix.com).'
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: GrandPrix.com, « Robin Herd »
        url: https://www.grandprix.com/people/robin-herd.html
  - ecurie: leyton-house
    de: 1990
    a: 1991
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'Commanditaire de March depuis 1987, Akira Akagi rachète l''équipe de F1 de March en mai 1989 ; elle garde le nom March cette saison-là, puis est rebaptisée Leyton House pour 1990, sans plus aucune mention de March (Marcus Simmons, Motor Sport ; Russell Campbell, Goodwood). Le rachat précède le changement de nom : celui-ci est un renommage par le même propriétaire.'
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, « A bolt from the blue: the rise and fall of Leyton House Racing » (juin 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
  - ecurie: march
    de: 1992
    a: 1992
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Akagi est arrêté en septembre 1991 dans un scandale financier et son associé Ken Marrable prend le contrôle de l'équipe (Goodwood) ; pour 1992, elle est rachetée par un consortium comprenant Marrable, et la voiture redevient une March (Marcus Simmons, Motor Sport).
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, « Marching to civil war » (juin 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, « A bolt from the blue: the rise and fall of Leyton House Racing » (juin 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
