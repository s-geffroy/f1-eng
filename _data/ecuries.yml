- id: larrousse
  nom: Lola (Larrousse), Venturi et Larrousse
  segments:
  - ecurie: lola-larrousse
    de: 1987
    a: 1991
  - ecurie: venturi
    de: 1992
    a: 1992
    lien:
      type: rachat
      preuve: atteste
      pourquoi: À l'automne 1991, après un dépôt de bilan et la rupture avec Lola, Gérard Larrousse commande un châssis à la Fomet 1 de Robin Herd et cède 65 % de l'équipe au constructeur automobile Venturi ; l'équipe court en 1992 sous le nom de Venturi (GrandPrix.com, « Larrousse »).
      sources:
      - titre: GrandPrix.com, « Larrousse »
        url: https://www.grandprix.com/constructors/larrousse.html
  - ecurie: larrousse
    de: 1993
    a: 1994
    lien:
      type: rachat
      preuve: etabli
      pourquoi: En septembre 1992, Venturi revend sa participation à un groupe appelé Comstock ; dès 1993, l'équipe, financée par Gérard Larrousse, court sous son nom, avant une nouvelle réorganisation en 1994 avec Fast Group SA (GrandPrix.com, « Larrousse »). La source atteste la vente ; le lien direct avec le retour au nom Larrousse est une déduction.
      sources:
      - titre: GrandPrix.com, « Larrousse »
        url: https://www.grandprix.com/constructors/larrousse.html
