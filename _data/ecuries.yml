    a: 1992
    lien:
      type: reprise-partielle
      preuve: etabli
      pourquoi: 'En septembre 1991, Enzo Coloni vend son écurie au chausseur Andrea Sassetti, qui la fait courir en 1992 sous le nom de sa marque, Andrea Moda (GrandPrix.com). Mais la FISA estime qu''il n''a racheté que le matériel et non l''inscription de Coloni : l''équipe est traitée en nouvelle venue et exclue du Grand Prix d''Afrique du Sud faute d''avoir versé la caution de 100 000 dollars (RaceFans, Motor Sport).'
