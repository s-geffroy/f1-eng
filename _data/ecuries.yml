      preuve: etabli
      pourquoi: Les voitures de la série IR/FW, appelées Iso-Marlboro en 1973 et 1974, prennent le nom Williams en 1975 ; mêmes voitures, mêmes pilotes (Merzario, Laffite) (Allen Brown, OldRacingCars.com).
