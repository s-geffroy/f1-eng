# Croisement formula1.com / Jolpica (successeur d'Ergast), calculé par outils/releve-jolpica.py :
# ne pas modifier à la main. Comparaison par nom de famille, sans accents (avec l'initiale du prénom
# quand deux pilotes de la saison portent le même nom) ; une course comptée
# concordante si un pilote est commun aux deux sources (équipages partagés). absents = champ manquant
# dans l'une des sources. ecurie et motoriste : comparés là où le pilote concorde ; motoriste
# non_renseignes = Jolpica ne le donne pas (hors suffixes « -climax », « -repco »... des années
# 1950-1970). Un désaccord est signalé, jamais corrigé ici ; examine = constat après lecture des
# deux sources (table EXAMINES du script). identite : noms formula1.com et driverId Jolpica des
# pilotes comparés, qui doivent se répondre un à un (domination.py compte les pilotes par leur nom).
