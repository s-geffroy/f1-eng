# Manufacturiers de pneumatiques, saisis à la main, chaque fait sourcé (recherche du 30 octobre 2026).
# Lu par outils/domination.py. monopoles = un seul fournisseur (nature : impose par contrat ou
# reglement, ou de_fait) ; cas = manufacturier de chaque écurie qui a gagné ou signé une pole hors monopole :
#   changements = nouveau manufacturier à partir d'un GP ; exceptions = un GP isolé (pour : victoire ou
#   pole quand les deux diffèrent). Une course non classée arrête le script.
monopoles:
- de: 1961
  a: 1963
  pneus: Dunlop
  nature: de_fait
  pourquoi: Doug Nye écrit que de 1961 à 1963 les F1 de 1,5 litre roulaient exclusivement en Dunlop, ce que confirment les comptes rendus d'époque (« everyone uses Dunlop tyres » en 1961, « all the top Grand Prix cars use Dunlop tyres » en 1963) ; les 500 miles d'Indianapolis, courus en Firestone, sortent du championnat en 1961, au passage à la formule de 1,5 litre.
  sources:
  - titre: 'Motor Sport, Doug Nye, « Doug Nye: When the wheels fall off » (octobre 2020)'
    url: https://www.motorsportmagazine.com/archive/article/october-2020/21/doug-nye-when-the-wheels-fall-off
  - titre: Motor Sport, Bill Boddy, « 1961 British Grand Prix race report - Another Ferrari triumph » (août 1961)
    url: https://www.motorsportmagazine.com/archive/article/august-1961/20/14th-r-a-c-british-grand-prix
  - titre: 'Motor Sport, Denis Jenkinson, « 1963 French Grand Prix race report: Clark completes his hat-trick » (août 1963)'
    url: https://www.motorsportmagazine.com/archive/article/august-1963/26/49th-french-grand-prix
  - titre: Motor Sport, Paul Fearnley, « Formula 1 and the Indianapolis 500's separate worlds » (avril 2019)
    url: https://motorsportmagazine.com/articles/single-seaters/f1/f1-and-indy-500s-separate-worlds
- de: 1975
  a: 1976
  pneus: Goodyear
  nature: de_fait
  pourquoi: 'Firestone se retire après 1974 et Michelin n''arrive qu''en 1977, avec la Renault turbo : Goodyear est seul à fournir le plateau, monopole que Motor Sport attribue en 1977 à la défection des autres manufacturiers et non à une règle. Seule exception : au GP du Japon 1976, Bridgestone et Dunlop chaussent deux engagés locaux.'
  sources:
  - titre: Motor Sport, « 50 Goodyear Wolverhampton 1927-1977 » (août 1977)
    url: https://www.motorsportmagazine.com/archive/article/august-1977/74/50-good-year-wolverhampton-1927-1977
  - titre: Motor Sport, Nigel Roebuck, « Compound fractures » (avril 1997)
    url: https://www.motorsportmagazine.com/archive/article/april-1997/30/compound-fractures/
- de: 1987
  a: 1988
  pneus: Goodyear
  nature: de_fait
  pourquoi: 'Pirelli quitte la F1 à la fin de 1986 ; Michelin refuse de revenir et les petits manufacturiers ne s''y intéressent que de loin : faute de concurrent, Goodyear chausse tout le plateau en 1987 et 1988, par un accord passé avec la FISA et la FOCA (un pneu de spécification unique), et non par une règle qui exclurait les autres. Pirelli revient en 1989, « après deux saisons d''absence », et rouvre la guerre des pneus.'
  sources:
  - titre: Motor Sport, Denis Jenkinson, « Emergency Answers » (février 1987)
    url: https://www.motorsportmagazine.com/archive/article/february-1987/8/emergency-answers/
  - titre: 'Motor Sport, Denis Jenkinson, « Formula One: 1987 San Marino GP » (juin 1987)'
    url: https://www.motorsportmagazine.com/archive/article/june-1987/15/japanese-domination
  - titre: 'Fondazione Pirelli, « Pirelli in F1: Challenges and Successes – 1980s and 1990s Photos Go Online » (septembre 2026)'
    url: https://www.fondazionepirelli.org/en/historical-archive/pirelli-in-f1-challenges-and-successes-1980s-and-1990s-photos-go-online/
  - titre: GrandPrix.com, « Brazilian GP 1989 » (encyclopédie, non daté)
    url: https://grandprix.com/gpe/rr469.html
- de: 1992
  a: 1996
  pneus: Goodyear
  nature: de_fait
  pourquoi: Pirelli quitte la F1 à la fin de 1991, en invoquant la récession mondiale. Goodyear profite alors de cinq ans de monopole et fournit des pneus identiques à toutes les équipes, jusqu'à l'arrivée de Bridgestone en 1997. Selon Bridgestone, avant son arrivée, Goodyear fournissait seul tous les pneus de la F1. Aucune de ces sources ne mentionne une règle imposant un fournisseur unique.
  sources:
  - titre: GrandPrix.com, « Pirelli to consider F1 again » (avril 1995)
    url: https://www.grandprix.com/news/pirelli-to-consider-f1-again.html
  - titre: GrandPrix.com, Joe Saward, « Bridgestone goes head to head with Goodyear » (octobre 1998)
    url: https://www.grandprix.com/features/joe-saward/news-feature-bridgestone-goes-head-to-head-with-goodyear.html
  - titre: 'Bridgestone, « Bridgestone in F1 14 years – Remembering an era : 1997 »'
    url: https://ms.bridgestone.co.jp/special/document/f1/en/episode/1997/
- de: 1999
  a: 2000
  pneus: Bridgestone
  pourquoi: Goodyear avait annoncé son retrait de la Formule 1 à la fin de 1998 (Joe Saward, GrandPrix.com). Bridgestone se présente comme seul fournisseur de pneus en 1999, puis parle de sa « deuxième année de fournisseur unique » en 2000, l'année où Michelin annonce son retour pour 2001. Ferrari confirme qu'en 1999 la F399 roulait en Bridgestone, Goodyear ayant quitté la F1.
  sources:
  - titre: GrandPrix.com, Joe Saward, « Goodyear and Formula 1 » (mars 1998)
    url: https://www.grandprix.com/features/joe-saward/news-feature-goodyear-and-formula-1.html
  - titre: 'Bridgestone, « Bridgestone in F1 14 years : 1999 » (Bridgestone F1 staff, Remembering an era)'
    url: https://ms.bridgestone.co.jp/special/document/f1/en/episode/1999/
  - titre: 'Bridgestone, « Bridgestone in F1 14 years : 2000 » (Bridgestone F1 staff, Remembering an era)'
    url: https://ms.bridgestone.co.jp/special/document/f1/en/episode/2000/
  - titre: Ferrari, « 1999 | History of Scuderia Ferrari Formula 1 » (Ferrari.com)
    url: https://www.ferrari.com/en-EN/formula1/year-1999
  nature: impose
- de: 2007
  a: 2010
  pneus: Bridgestone
  pourquoi: Michelin se retire fin 2006 ; Bridgestone, de nouveau seul fournisseur en 2007 (ce que confirment Bridgestone et Ferrari), signe ensuite un contrat d'exclusivité pour 2008-2010, annonce en novembre 2009 qu'il ne le renouvellera pas et quitte la F1 après le Grand Prix d'Abou Dhabi 2010.
  sources:
  - titre: 'Bridgestone, « Bridgestone in F1 14 years : 2007 » (Bridgestone F1 staff, Remembering an era)'
    url: https://ms.bridgestone.co.jp/special/document/f1/en/episode/2007/
