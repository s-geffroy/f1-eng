# Manufacturiers de pneumatiques, saisis à la main, chaque fait sourcé (recherche du 30 octobre 2026).
# Lu par outils/domination.py. monopoles = un seul fournisseur (nature : impose par contrat ou
# reglement, ou de_fait) ; cas = manufacturier de chaque écurie qui a gagné ou signé une pole hors monopole :
#   changements = nouveau manufacturier à partir d'un GP ; exceptions = un GP isolé (pour : victoire ou
#   pole quand les deux diffèrent). Une course non classée arrête le script.
monopoles:
- de: 1961
  a: 1963
  pneus: Dunlop
  nature: de_fait
  pourquoi: Doug Nye écrit que de 1961 à 1963 les F1 de 1,5 litre roulaient exclusivement en Dunlop, ce que confirment les comptes rendus d'époque (« everyone uses Dunlop tyres » en 1961, « all the top Grand Prix cars use Dunlop tyres » en 1963) ; les 500 miles d'Indianapolis, courus en Firestone, sortent du championnat en 1961, au passage à la formule de 1,5 litre.
