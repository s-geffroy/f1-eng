- de: 2011
  a: 2025
  pneus: Pirelli
  pourquoi: Ferrari note l'arrivée de Pirelli comme fournisseur unique en 2011, à la place de Bridgestone ; Formula1.com confirme que Pirelli tient ce rôle depuis 2011 et qu'il est reconduit comme fournisseur exclusif jusqu'en 2027.
