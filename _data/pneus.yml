    url: https://www.autoblog.com/2007/12/26/officially-official-bridgestone-signs-exclusive-deal-with-f1/
  - titre: 'Bridgestone, « Bridgestone in F1 14 years : 2009 » (Bridgestone F1 staff, Remembering an era)'
    url: https://ms.bridgestone.co.jp/special/document/f1/en/episode/2009/
