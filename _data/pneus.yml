# Manufacturiers de pneumatiques, saisis à la main, chaque fait sourcé (recherche du 30 octobre 2026).
# Lu par outils/domination.py. monopoles = un seul fournisseur (nature : impose par contrat ou
# reglement, ou de_fait) ; cas = manufacturier de chaque écurie qui a gagné ou signé une pole hors monopole :
#   changements = nouveau manufacturier à partir d'un GP ; exceptions = un GP isolé (pour : victoire ou
#   pole quand les deux diffèrent). Une course non classée arrête le script.
monopoles:
- de: 1987
  a: 1988
  pneus: Goodyear
  nature: de_fait
  pourquoi: 'Pirelli quitte la F1 après 1986 et n''y revient qu''en 1989 : Goodyear est seul à fournir le plateau, sans règle qui l''impose.'
  sources: &id001
  - titre: Wikipedia, « Formula One tyres » (tableau « Tyre manufacturers by season »)
    url: https://en.wikipedia.org/wiki/Formula_One_tyres
- de: 1992
  a: 1996
  pneus: Goodyear
  nature: de_fait
  pourquoi: 'Pirelli se retire après 1991 et Bridgestone n''arrive qu''en 1997 : Goodyear est seul à fournir le plateau, sans règle qui l''impose.'
  sources: *id001
- de: 1999
  a: 2000
  pneus: Bridgestone
  pourquoi: Goodyear se retire fin 1998 ; Bridgestone reste seul fournisseur en 1999 et 2000, avant l'arrivée de Michelin en 2001.
  sources:
  - titre: Wikipedia, « 1999 Formula One World Championship »
    url: https://en.wikipedia.org/wiki/1999_Formula_One_World_Championship
  - titre: Wikipedia, « 2000 Formula One World Championship »
    url: https://en.wikipedia.org/wiki/2000_Formula_One_World_Championship
  - titre: Wikipedia, « Formula One tyres » (tableau « Tyre manufacturers by season »)
    url: https://en.wikipedia.org/wiki/Formula_One_tyres
  nature: impose
- de: 2007
  a: 2010
  pneus: Bridgestone
  pourquoi: Michelin se retire fin 2006 ; Bridgestone est seul fournisseur de 2007 à 2010 (contrat exclusif 2008-2010), puis annonce son départ fin 2010.
  sources:
  - titre: Wikipedia, « 2007 Formula One World Championship »
    url: https://en.wikipedia.org/wiki/2007_Formula_One_World_Championship
  - titre: Wikipedia, « 2010 Formula One World Championship »
    url: https://en.wikipedia.org/wiki/2010_Formula_One_World_Championship
  - titre: Wikipedia, « Formula One tyres » (tableau « Tyre manufacturers by season »)
    url: https://en.wikipedia.org/wiki/Formula_One_tyres
  - titre: 'Autoblog, « Officially Official: Bridgestone signs exclusive deal with F1 » (26 décembre 2007)'
    url: https://www.autoblog.com/2007/12/26/officially-official-bridgestone-signs-exclusive-deal-with-f1/
  nature: impose
- de: 2011
  a: 2025
  pneus: Pirelli
  pourquoi: 'Pirelli est fournisseur unique depuis 2011, sans interruption jusqu''en 2025 (et au-delà : contrat prolongé jusqu''en 2027).'
  sources:
  - titre: Wikipedia, « Formula One tyres » (tableau « Tyre manufacturers by season »)
    url: https://en.wikipedia.org/wiki/Formula_One_tyres
  - titre: Formula1.com, « Pirelli to continue as Formula 1's exclusive tyre supplier until 2027 »
    url: https://www.formula1.com/en/latest/article.pirelli-to-continue-as-formula-1s-exclusive-tyre-supplier-until-2027.7xJIxJyMe84N3p7k4iIMjK.html
  nature: impose
