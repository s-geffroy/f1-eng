    pourquoi: 'Motor Sport présente la Lotus 78 de 1977, la « wing car », comme la voiture qui lance l''effet de sol en F1 : avant elle, aucun gagnant n''en tirait parti.'
    sources:
    - titre: 'Motor Sport, Keith Howard, « Lotus 78: the car that started F1''s ground-effect revolution » (août 2007)'
      url: https://www.motorsportmagazine.com/archive/article/august-2007/72/ground-force/
  - de: 1980
    a: 1982
    valeur: oui
    pourquoi: 'Après le succès de Lotus, « a swathe of ground effect cars appeared » ; en 1981 les jupes coulissantes sont interdites et une garde au sol de 6 cm imposée, mais les équipes contournent la règle, et les jupes, fixes, reviennent en 1982 avant le fond plat de 1983. Les voitures gagnantes sont, pour la plupart, décrites comme des voitures à effet de sol : la FW07 (Doug Nye) ; la RE20, dont les « side-skirts » sont améliorées (Jenkinson, janvier 1980) ; la RE30, dont la suspension raidie doit encaisser les « ground-effect loads » (Mark Hughes) ; la BT49 (Frankel, Keilloh) ; la JS11 (Keilloh) ; la 126CK, dont les jupes « would not seal » selon Forghieri ; la 126C2 (« Ferrari were no exception ») ; la Lotus 91, « a more conventional ground effect design » (Classic Team Lotus) ; la Tyrrell 011 (OldRacingCars) ; la FW08, dernière championne « first-generation ground-effect » (Autosport) ; et la MP4/1 (Barnard). Fin 1982, Jenkinson écrit qu''aucun concepteur n''acceptait de perdre son
      « ground effect » ; pour la Brabham BT50 et la Ligier JS17, que les pages consultées ne décrivent pas explicitement ainsi, le « oui » est une déduction.'
