- id: suspension-active
  nom: Suspension active
  nom_en: Active suspension
  jalon: active-gagne
  defaut:
  - de: 1950
    a: 1986
    valeur: non
    pourquoi: 'Selon Keith Howard (Motor Sport), avant 1987 la seule suspension active engagée en course est celle de la Lotus 92 en 1983 (deux 12es places à Rio et Long Beach) : aucune voiture gagnante ne l''a eue. Lotus la réintroduit en 1987 sur la 99T, qui lui donne ses deux premières victoires (Monaco, Detroit).'
    sources:
    - titre: Motor Sport, Keith Howard, « Active suspension » (décembre 2001)
      url: https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension
  - de: 1994
    a: 2025
    valeur: non
    pourquoi: 'La suspension active est interdite pour 1994 avec les autres aides au pilotage ; Patrick Head le rappelle (« it had been banned »), et Bonhams note que la FW16 en a été privée. L''interdiction n''a pas été levée depuis : en 2022 The Race juge « inconcevable » de la réintroduire, et en 2024 Motor Sport en discute encore le « retour ». Aucun gagnant de 1994 à 2025 ne l''a donc.'
    sources:
    - titre: Motor Sport, Keith Howard, « Grand designs 1994 » (janvier 2006)
      url: https://www.motorsportmagazine.com/archive/article/january-2006/62/grand-designs-1994/
    - titre: Bonhams, « The ex-Damon Hill 1994 Williams-Renault FW16B, chassis no. FW16B-05 » (Williams F1 Reserve Collection, 14 décembre 2005)
      url: https://cars.bonhams.com/auction/13928/lot/210/the-ex-damon-hill-nine-grand-prix-races-four-grands-prix-winning-one-pole-position-four-fastest-laps-and-world-championship-losing1994-williams-renault-fw16b-formula-1-racing-single-seater-chassis-no-fw16b-05/
    - titre: The Race, Edd Straw, « Active suspension is the fix F1 teams need – but won't get » (3 mars 2022)
      url: https://www.the-race.com/formula-1/active-suspension-is-the-fix-f1-teams-need-but-wont-get/
    - titre: 'Motor Sport, Mark Hughes, « MPH: push-to-pass and active suspension, the talk around F1''s next-gen car » (5 avril 2024)'
      url: https://www.motorsportmagazine.com/articles/single-seaters/f1/mph-push-to-pass-and-active-suspension-the-talk-around-f1s-next-gen-car/
