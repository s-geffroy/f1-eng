- id: boite-semi-automatique
  nom: Boîte semi-automatique
  nom_en: Semi-automatic gearbox
  jalon: ferrari-640
  defaut:
  - de: 1950
    a: 1988
    valeur: non
    pourquoi: 'La Ferrari 640 de 1989 est la pionnière de la boîte semi-automatique commandée par palettes au volant (Motor Sport, Goodwood) ; en gagnant au Brésil en mars 1989, Mansell devient « the first driver to win a grand prix in a car with a semi-automatic gearbox » : avant elle, aucun gagnant ne l''avait.'
    sources:
    - titre: 'Motor Sport, Rob Widdows, « The Motor Sport Interview: John Barnard » (février 2025)'
      url: https://www.motorsportmagazine.com/archive/article/february-2025/115/the-motor-sport-interview-john-barnard/
    - titre: Motor Sport, « X-ray spec – Ferrari 640 » (juin 2005)
      url: https://www.motorsportmagazine.com/archive/article/june-2005/70/ferrari-640/
    - titre: Goodwood, « Gerhard Berger on the flawed genius of his 1989 Ferrari 640 » (avril 2024)
      url: https://www.goodwood.com/grr/event-coverage/members-meeting/gerhard-berger-on-the-flawed-genius-of-his-1989-ferrari-640/
  - de: 1996
    a: 2025
    valeur: oui
    pourquoi: « Six ans plus tard [après 1989], plus une seule équipe ne garde de boîte manuelle » ; même le vainqueur surprise de 1996, la Ligier JS43 (Monaco), a une boîte semi-automatique, et les règlements de 2014 associent le V6 turbo à une boîte semi-automatique à 8 rapports.
    sources:
    - titre: Goodwood, « Gerhard Berger on the flawed genius of his 1989 Ferrari 640 »
      url: https://www.goodwood.com/grr/event-coverage/members-meeting/gerhard-berger-on-the-flawed-genius-of-his-1989-ferrari-640/
    - titre: Wikipedia, « Ligier JS43 »
      url: https://en.wikipedia.org/wiki/Ligier_JS43
    - titre: Wikipedia, « Formula One car »
      url: https://en.wikipedia.org/wiki/Formula_One_car
    - titre: Wikipedia, « 2014 Formula One World Championship »
      url: https://en.wikipedia.org/wiki/2014_Formula_One_World_Championship
