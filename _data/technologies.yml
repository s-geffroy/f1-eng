  - de: 2014
    a: 2025
    valeur: oui
    pourquoi: 'Depuis 2014, le règlement impose un V6 turbo de 1,6 l intégrant un système de récupération d''énergie (MGU-K au freinage, ex-KERS, et MGU-H à l''échappement) : tout gagnant en est équipé.'
    sources:
    - titre: Wikipedia, « 2014 Formula One World Championship »
      url: https://en.wikipedia.org/wiki/2014_Formula_One_World_Championship
