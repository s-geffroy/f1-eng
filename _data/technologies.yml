    valeur: non
    pourquoi: La MP4/4 a des doubles triangles avec ressorts et amortisseurs actionnés par tirants/poussoirs et culbuteurs, montage passif ; en 1988 seule Williams court (sans gagner) avec une suspension réactive, abandonnée à Silverstone.
