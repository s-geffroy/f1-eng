- id: turbo
  nom: Turbo
  nom_en: Turbo
  jalon: turbo-victoire
  defaut:
  - de: 1950
    a: 1976
    valeur: non
    pourquoi: Matt Bishop rappelle dans Motor Sport qu'aucune F1 n'avait utilisé de moteur turbo avant la Renault RS01, apparue à Silverstone en 1977, et que la victoire de Jabouille à Dijon en 1979 est la première d'une F1 turbo. Les compresseurs volumétriques des années 1950 (Alfa Romeo 158/159) ne sont pas des turbos. Les 500 miles d'Indianapolis 1950-1960 n'ont pas été vérifiés individuellement.
    sources:
    - titre: Motor Sport, Matt Bishop, « F1 designer & GP winner — but Jean-Pierre Jabouille could have achieved so much more » (janvier 2024)
      url: https://www.motorsportmagazine.com/articles/single-seaters/f1/f1-designer-gp-winner-but-jean-pierre-jabouille-could-have-achieved-so-much-more/
  - de: 1989
    a: 2013
    valeur: non
    pourquoi: Les moteurs turbo sont interdits à partir de 1989, remplacés par des atmosphériques de 3,5 litres (Honda) ; la suralimentation ne revient qu'en 2014, avec le V6 turbo hybride de 1,6 litre (Autosport, FIA).
    sources:
    - titre: Honda, « 1989 McLaren Honda MP4/5 » (site du constructeur, non daté)
      url: https://global.honda/en/F1/machine/1989_McLarenHondaMP45/
    - titre: Autosport, Craig Scarborough, « F1's 2014 turbo engines explained » (janvier 2014)
      url: https://www.autosport.com/f1/news/f1s-2014-turbo-engines-explained-5102962/5102962/
    - titre: FIA, « 2014 F1 Power Unit Guide »
      url: https://www.fia.com/news/2014-f1-power-unit-guide
  - de: 2014
    a: 2025
    valeur: oui
    pourquoi: Le règlement 2014 impose un V6 de 1,6 litre suralimenté par turbocompresseur (F1Technical) ; le turbo revient alors en F1 pour la première fois depuis son interdiction fin 1988 (Autosport), et les moteurs de cette génération restent des V6 turbo jusqu'au changement de règlement de 2026 (Motor Sport).
    sources:
