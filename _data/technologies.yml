  - de: 2022
    a: 2025
    valeur: oui
    pourquoi: '« After a forty-year ban, ground effect returned to Formula 1 in 2022 » : toutes les voitures du règlement 2022 génèrent leur appui par des tunnels sous le fond.'
    sources:
    - *id003
