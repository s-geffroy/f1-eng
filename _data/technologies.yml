- id: ailerons
  nom: Ailerons
  nom_en: Wings
  jalon: ailerons
  defaut:
  - de: 1950
    a: 1967
    valeur: non
    pourquoi: 'Les ailerons arrivent en F1 en 1968, après les prototypes de sport comme la Chaparral 2F : Chapman monte de modestes ailerons avant et un becquet sur la Lotus 49B de Hill, puis Brabham et Ferrari vont plus loin au Grand Prix de Belgique 1968.'
    sources:
    - titre: Wikipedia, « History of Formula One »
      url: https://en.wikipedia.org/wiki/History_of_Formula_One
    - titre: Motor Sport, « The car that changed Formula One forever » (juillet 1997)
      url: https://motorsportmagazine.com/archive/article/july-1997/98/the-car-that-changed-formula-one-forever
  - de: 1969
    a: 2025
    valeur: oui
    pourquoi: 'Les ailerons sont apparus en fin de décennie et sont restés ; après les accidents, ils doivent être fixés rigidement au châssis. Réserve : à Monaco 1969, la CSI interdit les ailerons hors carrosserie en cours d''essais, mais les voitures courent avec ailerons de nez et déflecteurs (Hill avec une plaque déflectrice à l''arrière). L''ère tient donc avec la définition large, pas avec la définition stricte.'
    sources:
    - titre: Wikipedia, « Formula One car »
      url: https://en.wikipedia.org/wiki/Formula_One_car
    - titre: Wikipedia, « History of Formula One »
      url: https://en.wikipedia.org/wiki/History_of_Formula_One
    - titre: Motor Sport, « The Monaco Grand Prix » (juin 1969)
      url: https://www.motorsportmagazine.com/archive/article/june-1969/26/the-monaco-grand-prix-4/
  cas:
  - annee: 1968
    ecurie: ferrari
    equipe: Ferrari
    voiture: Ferrari 312 (312/68)
    valeur: oui
    pourquoi: Ferrari monte un aileron arrière sur supports au-dessus de la boîte dès Spa (avec déflecteurs de nez) ; à Rouen, où Ickx gagne, l'aileron de la 312/68 a été avancé au-dessus du moteur.
    sources:
    - titre: OldRacingCars, « French Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/france/
    - titre: Motor Sport, « XXVII Belgian Grand Prix » (juillet 1968)
      url: https://www.motorsportmagazine.com/archive/article/july-1968/14/xxvii-belgian-grand-prix/
  - annee: 1968
    ecurie: matra
    equipe: Matra Ford
    voiture: Matra MS10
    valeur: oui
    pourquoi: À Zandvoort, la Matra de Stewart porte de petits déflecteurs (fines ailettes) sur le nez, aileron arrière bas en Allemagne, aileron haut sur supports aux États-Unis. En lecture stricte (aileron arrière), l'adoption daterait du Grand Prix d'Allemagne.
    sources:
    - titre: OldRacingCars, « Dutch Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/netherlands/
    - titre: MRO F1 Engineering, « A Tale of Two F1 Matras, Part Two (Matra MS10) »
      url: https://www.mrof1engineering.co.uk/pdfs/Matra%20MS10.pdf
    - titre: Wikipedia, « Matra MS10 »
      url: https://en.wikipedia.org/wiki/Matra_MS10
  - annee: 1968
    ecurie: mclaren
    equipe: McLaren Ford
    voiture: McLaren M7A
    valeur: oui
    pourquoi: À Spa, où McLaren gagne, les M7A ont de petits becquets sur le nez et un autre en travers de la poupe ; le véritable aileron arrière arrive au Grand Prix de France. En lecture stricte, l'adoption daterait du Grand Prix d'Italie (victoire de Hulme).
    sources:
    - titre: Motor Sport, « XXVII Belgian Grand Prix » (juillet 1968)
      url: https://www.motorsportmagazine.com/archive/article/july-1968/14/xxvii-belgian-grand-prix/
    - titre: Wikipedia, « McLaren M7A »
      url: https://en.wikipedia.org/wiki/McLaren_M7A
  - annee: 1968
    ecurie: team-lotus
    equipe: Lotus Ford
    voiture: Lotus 49 (Afrique du Sud, Espagne), Lotus 49B (à partir de Monaco)
    valeur: oui
    des: Monaco
    pourquoi: Clark (Afrique du Sud) et Hill (Espagne, sur la 49 R1) gagnent sans appendice aérodynamique ; la 49B, dévoilée à Monaco, porte des ailerons de nez et une poupe en coin conçue pour l'appui, puis un grand aileron sur supports (Siffert en Grande-Bretagne, Hill au Mexique). En lecture stricte (aileron arrière), l'adoption daterait du Grand Prix de Grande-Bretagne.
    sources:
    - titre: Motor Sport, « The car that changed Formula One forever » (juillet 1997)
      url: https://motorsportmagazine.com/archive/article/july-1997/98/the-car-that-changed-formula-one-forever
    - titre: Motor Sport, « Spanish Grand Prix » (juin 1968)
      url: https://www.motorsportmagazine.com/archive/article/june-1968/13/spanish-grand-prix-6/
    - titre: OldRacingCars, « Spanish Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/spain/
    - titre: OldRacingCars, « Monaco Grand Prix 1968 »
      url: https://oldracingcars.com/f1/results/1968/monaco/
  regle: 'Définition large : ailerons sur supports, ailerons fixés à la carrosserie et ailettes de nez générant de l''appui. Les ailerons sur supports sont interdits à Monaco en 1969 ; les ailerons fixés restent la règle ensuite.'
- id: effet-de-sol
  nom: Effet de sol
  nom_en: Ground effect
  jalon: lotus-78
  defaut:
  - de: 1950
    a: 1976
    valeur: non
    pourquoi: La Lotus 78 de 1977 est la première voiture à effet de sol de la F1 ; les essais antérieurs (BRM, March, Brabham BT44) n'avaient pas de pontons assez proches du sol pour un effet de sol significatif.
    sources:
    - &id004
      titre: Wikipédia, « Lotus 78 »
      url: https://en.wikipedia.org/wiki/Lotus_78
    - &id001
      titre: Wikipédia, « Ground effect (cars) »
      url: https://en.wikipedia.org/wiki/Ground_effect_(cars)
  - de: 1980
    a: 1982
    valeur: oui
    pourquoi: Après le succès de Lotus, « a swathe of ground effect cars appeared » ; en 1981 les « ground-effect wing cars of the time » perdent leurs jupes coulissantes mais toutes adoptent des suspensions abaissant la voiture en piste, et les jupes reviennent en 1982. Les voitures gagnantes vérifiées (FW07, RE20, BT49, JS11/15, RE30, 126CK/126C2, Lotus 91, Tyrrell 011, FW08, MP4/1) sont toutes des voitures à effet de sol ; pour la Ligier JS17 et la Brabham BT50, les pages consultées ne le disent pas explicitement.
    sources:
    - &id002
      titre: 'Formula1.com, « Re-writing the F1 rule book – Part 1: from wing cars to flat bottoms »'
      url: https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU
    - titre: Wikipédia, « 1981 Formula One World Championship »
      url: https://en.wikipedia.org/wiki/1981_Formula_One_World_Championship
    - &id012
      titre: Wikipédia, « Brabham BT49 »
      url: https://en.wikipedia.org/wiki/Brabham_BT49
    - &id013
      titre: Wikipédia, « Renault RE20 »
      url: https://en.wikipedia.org/wiki/Renault_RE20
    - &id016
      titre: Wikipédia, « Renault RE30 »
      url: https://en.wikipedia.org/wiki/Renault_RE30
    - &id014
      titre: Wikipédia, « Ferrari 126C »
      url: https://en.wikipedia.org/wiki/Ferrari_126C
    - &id018
      titre: Wikipédia, « Lotus 91 »
      url: https://en.wikipedia.org/wiki/Lotus_91
    - &id019
      titre: Wikipédia, « Tyrrell 011 »
      url: https://en.wikipedia.org/wiki/Tyrrell_011
    - &id003
      titre: Wikipédia, « Williams FW08 »
      url: https://en.wikipedia.org/wiki/Williams_FW08
    - &id015
      titre: Motor Sport, « John Barnard remembers his McLaren MP4/1 eureka moment »
      url: https://motorsportmagazine.com/articles/single-seaters/f1/john-barnard-remembers-his-mclaren-mp4-1-eureka-moment
  - de: 1983
    a: 2021
    valeur: non
    pourquoi: 'Le fond plat devient obligatoire en 1983 (« flat undersides became mandatory for 1983 ») : l''effet de sol par pontons-ailes et jupes est interdit jusqu''au règlement de 2022.'
    sources:
    - *id001
    - *id002
    - *id003
  - de: 2022
    a: 2025
    valeur: oui
    pourquoi: '« After a forty-year ban, ground effect returned to Formula 1 in 2022 » : toutes les voitures du règlement 2022 génèrent leur appui par des tunnels sous le fond.'
    sources:
    - *id001
  cas:
  - annee: 1977
    ecurie: ferrari
    equipe: Ferrari
    voiture: Ferrari 312T2
    valeur: non
    pourquoi: 'La Lotus 78, introduite à la première course de 1977, est « the first ground effect car in Formula One » : la 312T2 n''en est pas une ; Ferrari ne conçoit sa première voiture à effet de sol que pour 1979 (312T4).'
    sources:
    - *id004
    - &id005
      titre: Wikipédia, « Ferrari 312T3 »
      url: https://en.wikipedia.org/wiki/Ferrari_312T3
