- id: suspension-active
  nom: Suspension active
  nom_en: Active suspension
  jalon: active-gagne
  defaut:
  - de: 1950
    a: 1986
    valeur: non
    pourquoi: 'Avant 1987, la seule suspension active engagée en course est celle de la Lotus 92 en 1983 (deux 12es places à Rio et Long Beach, puis retour au conventionnel) : aucune voiture gagnante ne l''a eue. La Lotus 99T de 1987 la réintroduit et donne ses deux premières victoires (Monaco, Detroit).'
    sources:
    - titre: Motor Sport Magazine, « Active suspension » (décembre 2001)
      url: https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension
    - titre: Wikipedia, « Lotus 99T »
      url: https://en.wikipedia.org/wiki/Lotus_99T
  - de: 1994
    a: 2025
    valeur: non
    pourquoi: La suspension active est interdite pour 1994 avec les autres aides électroniques ; l'interdiction n'a pas été levée depuis (en 2022 The Race la juge « inconcevable » à réintroduire, en 2024 Motor Sport en discute encore le « retour »). Aucun gagnant de 1994 à 2025 ne l'a donc.
    sources:
    - titre: Motor Sport Magazine, « Grand designs 1994 » (janvier 2006)
      url: https://www.motorsportmagazine.com/archive/article/january-2006/62/grand-designs-1994/
    - titre: Wikipedia, « Williams FW16 »
      url: https://en.wikipedia.org/wiki/Williams_FW16
    - titre: The Race, « Active suspension is the fix F1 teams need – but won't get » (3 mars 2022)
      url: https://the-race.com/formula-1/active-suspension-is-the-fix-f1-teams-need-but-wont-get/
    - titre: 'Motor Sport Magazine, « MPH: push-to-pass and active suspension, the talk around F1''s next-gen car » (5 avril 2024)'
      url: https://motorsportmagazine.com/articles/single-seaters/f1/mph-push-to-pass-and-active-suspension-the-talk-around-f1s-next-gen-car
  cas:
  - annee: 1987
    ecurie: ferrari
    equipe: Ferrari
    voiture: Ferrari F1/87
    valeur: non
    pourquoi: La F1/87 a une suspension classique à doubles triangles et ressorts hélicoïdaux actionnés par tirants ; l'article ne mentionne aucune suspension active.
    sources:
    - titre: Wikipedia, « Ferrari F1/87 »
      url: https://en.wikipedia.org/wiki/Ferrari_F1/87
  - annee: 1987
    ecurie: mclaren
    equipe: McLaren TAG
    voiture: McLaren MP4/3
    valeur: non
    pourquoi: 'La MP4/3 a des doubles triangles avec combinés ressort-amortisseur Bilstein actionnés par poussoirs, sans vérin : suspension passive ; seules Lotus et Williams courent en actif cette année-là.'
    sources:
    - titre: Wikipedia, « McLaren MP4/3 »
      url: https://en.wikipedia.org/wiki/McLaren_MP4/3
    - titre: Motor Sport Magazine, « Active suspension » (décembre 2001)
      url: https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension
  - annee: 1987
    ecurie: team-lotus
    equipe: Lotus Honda
    voiture: Lotus 99T
    valeur: oui
    pourquoi: La 99T court toute la saison avec sa suspension active pilotée par ordinateur, à la demande de Senna ; ses deux victoires (Monaco, Detroit) sont acquises avec.
    sources:
    - titre: Wikipedia, « Lotus 99T »
      url: https://en.wikipedia.org/wiki/Lotus_99T
    - titre: Motor Sport Magazine, « Active suspension » (décembre 2001)
      url: https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension
  - annee: 1987
    ecurie: williams
    equipe: Williams Honda
    voiture: Williams FW11B
    valeur: oui
    des: Italy
    victoires_sans:
    - San Marino
    - France
    - Great Britain
    - Germany
    - Hungary
    - Austria
    pourquoi: La « Williams Reactive Ride » (suspension active rebaptisée) court pour la première fois à Monza, où Piquet gagne ; Motor Sport précise que trois des neuf victoires de la FW11B sont acquises en version active, soit Italie, Espagne et Mexique, les trois dernières de la saison. Les six victoires antérieures sont en passif.
    sources:
    - titre: Wikipedia, « Williams FW11 »
      url: https://en.wikipedia.org/wiki/Williams_FW11
    - titre: Motor Sport Magazine, « Active suspension » (décembre 2001)
      url: https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension
    - titre: Honda, « 1987 Williams Honda FW11B »
      url: https://global.honda/en/F1/machine/1987_WilliamsHondaFW11B/
