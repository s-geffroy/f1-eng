# Technologies et voitures gagnantes, saisies à la main, chaque fait sourcé (recherche du 30 octobre 2026).
# Lu par outils/domination.py. defaut = ères où tous les gagnants l'ont (oui) ou aucun (non) ;
# cas = classement explicite de chaque écurie gagnante pendant la fenêtre de transition :
#   des = premier GP gagné avec la technologie (adoption en cours de saison),
#   victoires_sans = GP gagnés sans elle. Une victoire non classée arrête le script.
technologies:
- id: moteur-arriere
  nom: Moteur arrière
  nom_en: Rear engine
  jalon: cooper-argentine
  defaut:
  - de: 1950
    a: 1957
    valeur: non
    pourquoi: Motor Sport présente la victoire de Moss sur Cooper en Argentine 1958 comme le premier succès en championnat du monde d'une voiture de Grand Prix à moteur arrière ; l'IMS rappelle qu'aux 500 miles d'Indianapolis (comptés jusqu'en 1960), les roadsters à moteur avant ont gagné toutes les éditions de 1950 à 1963.
    sources:
    - titre: Motor Sport, Simon Arron, « Moss' landmark 1958 Argentine GP victory » (avril 2018)
      url: https://www.motorsportmagazine.com/articles/single-seaters/f1/moss-landmark-1958-argentine-gp-victory/
    - titre: 'Indianapolis Motor Speedway, Paul Kelly, « Memory Lane: A.J. Foyt, 1964 » (mai 2018)'
      url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2018/05/04/memory-lane-aj-foyt-1964-2018
  - de: 1962
    a: 2025
    valeur: oui
    pourquoi: Doug Nye présente la Ferrari Dino 246, victorieuse à Monza en 1960, comme la dernière voiture à moteur avant à avoir gagné un Grand Prix ; Indianapolis ne compte plus au championnat après 1960 (Motor Sport), et l'IMS montre que les roadsters à moteur avant y gagnent encore, hors championnat, jusqu'en 1964.
    sources:
    - titre: Motor Sport, Doug Nye, « Front to back » (novembre 2007)
      url: https://www.motorsportmagazine.com/archive/article/november-2007/64/front-to-back/
    - titre: Motor Sport, Paul Fearnley, « Formula 1 and the Indianapolis 500's separate worlds » (avril 2019)
      url: https://motorsportmagazine.com/articles/single-seaters/f1/f1-and-indy-500s-separate-worlds
    - titre: 'Indianapolis Motor Speedway, « Memory Lane: A.J. Foyt, 1964 » (mai 2018)'
      url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2018/05/04/memory-lane-aj-foyt-1964-2018
    - titre: Indianapolis Motor Speedway, « Clark's rear-engine victory in 1965 was evolution of revolution at Indy » (février 2020)
      url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2020/02/28/clarks-rear-engine-victory-in-1965-was-evolution-of-revolution-at-indy-2020
