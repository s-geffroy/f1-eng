- id: recuperation-energie
  nom: Récupération d'énergie
  nom_en: Energy recovery
  jalon: kers
  defaut:
  - de: 1950
    a: 2008
    valeur: non
    pourquoi: Le système de récupération d'énergie cinétique (KERS) apparaît en 2009 ; selon RaceFans, la victoire de Hamilton en Hongrie cette année-là est la première d'une voiture équipée du KERS.
    sources:
    - titre: RaceFans, Keith Collantine, « 2009 Hungarian Grand Prix facts and stats » (juillet 2009)
      url: https://www.racefans.net/2009/07/27/hungarian-grand-prix-facts-and-stats/
  - de: 2014
    a: 2025
    valeur: oui
    pourquoi: 'Depuis 2014, le règlement impose un V6 turbo de 1,6 l intégrant un système de récupération d''énergie (MGU-K au freinage, ex-KERS, et MGU-H à l''échappement) : tout gagnant en est équipé.'
    sources:
    - titre: Wikipedia, « 2014 Formula One World Championship »
      url: https://en.wikipedia.org/wiki/2014_Formula_One_World_Championship
    - titre: Wikipedia, « Mercedes F1 W05 Hybrid »
      url: https://en.wikipedia.org/wiki/Mercedes_F1_W05_Hybrid
