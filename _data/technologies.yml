- id: monocoque
  nom: Monocoque
  nom_en: Monocoque
  jalon: lotus-25
  regle: 'Un « semi-monocoque » (treillis tubulaire habillé de panneaux d''aluminium rivetés et travaillants) est classé « oui » : la peau participe à la rigidité, la caisse n''est plus un simple treillis, et plusieurs références (fiches techniques Wikipedia, F1technical) le décrivent comme une monocoque. Les cas concernés sont signalés. Avec la règle inverse (semi-monocoque = non), Ferrari 1964, 1966, 1968, 1970-1972 et 1975 basculent à « non », BRM 1971-1972 resterait discutable, et la fenêtre devrait s''étendre jusqu''en 1981 (voir defaut).'
  defaut:
  - de: 1950
    a: 1961
    valeur: non
    pourquoi: Goodwood présente la Lotus 25 de 1962 comme la voiture qui introduit le châssis monocoque en F1, à la place du châssis tubulaire habituel. Les gagnants des saisons 1950-1961 sont donc tous à châssis tubulaire (y compris les voitures d'Indianapolis, que nos sources ne décrivent toutefois pas en détail).
    sources:
    - titre: 'Goodwood, « The Lotus 25: A pioneering design to change F1 forever » (juin 2025)'
      url: https://www.goodwood.com/grr/f1/the-lotus-25-a-pioneering-design-to-change-f1-forever/
  - de: 1976
    a: 2025
    valeur: oui
    pourquoi: 'Brabham est le dernier constructeur à aligner un châssis tubulaire (BT26, 1968-1969) : les règles de 1970 sur les réservoirs souples imposent la monocoque, et Tauranac dessine alors sa première, la BT33. La monocoque devient la norme, puis la monocoque en carbone de la McLaren MP4/1 (1981) s''impose sur toute la grille. Réserve : selon Doug Nye, la 312T de 1975 reprend la construction hybride habituelle de Ferrari, une peau travaillante renforcée de l''intérieur par une ossature d''acier ; selon Alan Henry, la 126CK de 1981 suit encore « les lignes typiques de Maranello », un treillis multitubulaire habillé de tôles d''aluminium travaillantes. Ces voitures sont donc des semi-monocoques selon certaines descriptions ; Motor Sport parle pourtant de monocoques en aluminium, et c''est la 126C2 de 1982, en nid d''abeille collé, qui remplace le châssis dérivé de la T5. Vrai avec la règle retenue ; faux si le semi-monocoque est classé « non » (il faudrait alors élargir la fenêtre
      à 1981 : Ferrari 1976, 1977, 1978, 1979 et 1981).'
    sources:
    - titre: Motorsport Retro, « The fastest thing about the monocoque Lotus is Jimmy Clark - Ron Tauranac » (décembre 2012)
      url: https://www.motorsportretro.com/2012/12/the-fastest-thing-about-the-monocoque-lotus-is-jimmy-clark-ron-tauranac/
    - titre: OldRacingCars, « Brabham BT26 car-by-car histories »
      url: https://www.oldracingcars.com/brabham/bt26/
    - titre: OldRacingCars, « Brabham BT33 car-by-car histories »
      url: https://www.oldracingcars.com/brabham/bt33/
    - titre: Motor Sport, James Elson, « John Barnard remembers his McLaren MP4/1 eureka moment » (septembre 2021)
      url: https://motorsportmagazine.com/articles/single-seaters/f1/john-barnard-remembers-his-mclaren-mp4-1-eureka-moment
    - titre: 'Motor Sport, Doug Nye, « Lauda''s Ferrari 312T: Maranello''s lost masterpiece » (août 2020)'
      url: https://www.motorsportmagazine.com/archive/article/august-2020/58/laudas-ferrari-312t-maranellos-lost-masterpiece/
    - titre: 'Motor Sport, Alan Henry, « Profile: Ferrari 126CK » (juin 2007)'
      url: https://www.motorsportmagazine.com/archive/article/june-2007/59/profile-ferrari-126ck/
    - titre: Motor Sport, Denis Jenkinson, « Ferrari - World Champion Constructors » (décembre 1982)
