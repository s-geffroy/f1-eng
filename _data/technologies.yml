- id: turbo
  nom: Turbo
  nom_en: Turbo
  jalon: turbo-victoire
  defaut:
  - de: 1950
    a: 1976
    valeur: non
    pourquoi: Matt Bishop rappelle dans Motor Sport qu'aucune F1 n'avait utilisé de moteur turbo avant la Renault RS01, apparue à Silverstone en 1977, et que la victoire de Jabouille à Dijon en 1979 est la première d'une F1 turbo. Les compresseurs volumétriques des années 1950 (Alfa Romeo 158/159) ne sont pas des turbos. Les 500 miles d'Indianapolis 1950-1960 n'ont pas été vérifiés individuellement.
    sources:
    - titre: Motor Sport, Matt Bishop, « F1 designer & GP winner — but Jean-Pierre Jabouille could have achieved so much more » (janvier 2024)
      url: https://www.motorsportmagazine.com/articles/single-seaters/f1/f1-designer-gp-winner-but-jean-pierre-jabouille-could-have-achieved-so-much-more/
  - de: 1989
    a: 2013
    valeur: non
    pourquoi: « Turbochargers were banned from the 1989 Formula One season, leaving only a naturally aspirated 3.5 L formula » ; la suralimentation ne revient qu'en 2014.
    sources:
    - &id002
      titre: Wikipédia, « Formula One engines »
      url: https://en.wikipedia.org/wiki/Formula_One_engines
    - &id008
      titre: Wikipédia, « McLaren MP4/4 »
      url: https://en.wikipedia.org/wiki/McLaren_MP4/4
  - de: 2014
    a: 2025
    valeur: oui
    pourquoi: Le règlement 2014 impose des groupes propulseurs V6 1,6 litre hybrides ; la suralimentation revient et tous les motoristes choisissent le turbocompresseur (ère « turbo-hybrid », 2014-2025).
    sources:
    - *id002
