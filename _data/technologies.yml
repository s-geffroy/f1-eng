# Technologies et voitures gagnantes, saisies à la main, chaque fait sourcé (recherche du 30 octobre 2026).
# Lu par outils/domination.py. defaut = ères où tous les gagnants l'ont (oui) ou aucun (non) ;
# cas = classement explicite de chaque écurie gagnante pendant la fenêtre de transition :
#   des = premier GP gagné avec la technologie (adoption en cours de saison),
#   victoires_sans = GP gagnés sans elle. Une victoire non classée arrête le script.
technologies:
- id: moteur-arriere
  nom: Moteur arrière
  nom_en: Rear engine
  jalon: cooper-argentine
  defaut:
  - de: 1950
    a: 1957
    valeur: non
    pourquoi: La victoire de Moss sur Cooper T43 en Argentine 1958 est la première d'une voiture à moteur central-arrière en championnat du monde ; aux 500 miles d'Indianapolis (comptés jusqu'en 1960), les roadsters à moteur avant ont gagné toutes les éditions de 1950 à 1963.
    sources:
    - titre: Wikipedia, « Cooper T43 »
      url: https://en.wikipedia.org/wiki/Cooper_T43
    - titre: Wikipedia, « History of Formula One »
      url: https://en.wikipedia.org/wiki/History_of_Formula_One
    - titre: 'Indianapolis Motor Speedway, « Memory Lane: A.J. Foyt, 1964 »'
      url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2018/05/04/memory-lane-aj-foyt-1964-2018
  - de: 1962
    a: 2025
    valeur: oui
    pourquoi: La Ferrari 246 F1, victorieuse au Grand Prix d'Italie 1960, est la dernière voiture à moteur avant à avoir gagné un Grand Prix de F1 ; Indianapolis ne compte plus au championnat après 1960 (et y voit encore des vainqueurs à moteur avant jusqu'en 1964, hors championnat).
    sources:
    - titre: Wikipedia, « Ferrari 246 F1 »
      url: https://en.wikipedia.org/wiki/Ferrari_246_F1
    - titre: Indianapolis Motor Speedway, « Clark's rear-engine victory in 1965 was evolution of revolution at Indy »
      url: https://www.indianapolismotorspeedway.com/news-multimedia/news/2020/02/28/clarks-rear-engine-victory-in-1965-was-evolution-of-revolution-at-indy-2020
