- id: monocoque
  nom: Monocoque
  nom_en: Monocoque
  jalon: lotus-25
  regle: 'Un « semi-monocoque » (treillis tubulaire habillé de panneaux d''aluminium rivetés et travaillants) est classé « oui » : la peau participe à la rigidité, la caisse n''est plus un simple treillis, et plusieurs références (fiches techniques Wikipedia, F1technical) le décrivent comme une monocoque. Les cas concernés sont signalés. Avec la règle inverse (semi-monocoque = non), Ferrari 1964, 1966, 1968, 1970-1972 et 1975 basculent à « non », BRM 1971-1972 resterait discutable, et la fenêtre devrait s''étendre jusqu''en 1981 (voir defaut).'
  defaut:
  - de: 1950
    a: 1961
    valeur: non
    pourquoi: Goodwood présente la Lotus 25 de 1962 comme la voiture qui introduit le châssis monocoque en F1, à la place du châssis tubulaire habituel. Les gagnants des saisons 1950-1961 sont donc tous à châssis tubulaire (y compris les roadsters d'Indianapolis, que nos sources ne décrivent toutefois pas en détail).
    sources:
    - titre: 'Goodwood, « The Lotus 25: A pioneering design to change F1 forever » (juin 2025)'
      url: https://www.goodwood.com/grr/f1/the-lotus-25-a-pioneering-design-to-change-f1-forever/
  - de: 1976
    a: 2025
    valeur: oui
    pourquoi: 'Dès 1969, Brabham est le dernier constructeur à aligner un châssis tubulaire (BT26) ; la monocoque devient la norme et les F1 modernes sont des monocoques en carbone (McLaren MP4/1, 1981). Réserve : les Ferrari 312T à 312T5 (1975-1980) et 126CK (1981) restent des semi-monocoques ; la 126C2 de 1982 est la première « vraie » monocoque Ferrari. Vrai avec la règle retenue ; faux si le semi-monocoque est classé « non » (alors élargir la fenêtre à 1981 : Ferrari 1976, 1977, 1978, 1979 et 1981).'
    sources:
    - titre: Motorsport Retro, « The fastest thing about the monocoque Lotus is Jimmy Clark - Ron Tauranac »
      url: https://www.motorsportretro.com/2012/12/the-fastest-thing-about-the-monocoque-lotus-is-jimmy-clark-ron-tauranac/
    - titre: Wikipedia, « Monocoque »
      url: https://en.wikipedia.org/wiki/Monocoque
    - titre: Wikipedia, « Formula One car »
      url: https://en.wikipedia.org/wiki/Formula_One_car
    - titre: Wikipedia, « Ferrari 312T »
      url: https://en.wikipedia.org/wiki/Ferrari_312T
    - titre: Wikipedia, « Ferrari 126C »
      url: https://en.wikipedia.org/wiki/Ferrari_126C
