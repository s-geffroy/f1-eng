  cas:
  - annee: 1989
    ecurie: benetton
    equipe: Benetton Ford
    voiture: Benetton B189
    valeur: non
    pourquoi: 'En 1989, la boîte semi-automatique est l''innovation propre à la Ferrari 640 : Mansell est le premier à gagner un Grand Prix avec une telle boîte, et toute l''allée des stands comprend alors qu''il faudra la copier ; la McLaren-Honda MP4/5 elle-même garde une boîte manuelle à 6 rapports. La Benetton B189 débute au Grand Prix de France 1989 avec Nannini. Au Grand Prix de Hongrie 1989, ses sélecteurs cassent alors qu''il remonte dans le peloton, et Nannini raconte lui-même que c''est son levier de vitesses qui a cédé : la B189 a donc bien une boîte manuelle à levier. Les voitures de Benetton restent en boîte manuelle les saisons suivantes : la B190 de 1990 a une boîte manuelle à 6 rapports, et la B191, conçue pour recevoir une boîte semi-automatique, court toute la saison 1991 avec une boîte manuelle à 6 rapports. Au début de 1993, Patrese peine encore chez Benetton avec une boîte manuelle.'
    sources:
    - titre: 'Motor Sport, Rob Widdows, « Alessandro Nannini: The caffeine racer » (janvier 2015)'
      url: https://www.motorsportmagazine.com/archive/article/january-2015/100/caffeine-racer/
