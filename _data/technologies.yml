- id: ailerons
  nom: Ailerons
  nom_en: Wings
  jalon: ailerons
  defaut:
  - de: 1950
    a: 1967
    valeur: non
    pourquoi: 'Les ailerons arrivent en F1 en 1968, inspirés des Chaparral de Jim Hall : la Lotus 49B apparaît à Monaco avec de modestes ailerons avant et une queue en coin, puis Ferrari et Brabham montent de vrais ailerons au Grand Prix de Belgique 1968, à Spa, où selon Nigel Roebuck une voiture de Grand Prix court pour la première fois avec un aileron.'
    sources:
    - titre: 'Motor Sport, Nigel Roebuck, « 1968 Belgian Grand Prix: Nigel Roebuck''s F1 Legends » (octobre 1998)'
      url: https://www.motorsportmagazine.com/archive/article/october-1998/18/legends-11/
    - titre: Motor Sport, Jack Phillips, « F1 sprouts wings » (juin 2018)
      url: https://www.motorsportmagazine.com/articles/single-seaters/f1/f1-sprouts-wings/
    - titre: Motor Sport, Shaun Campbell, « John Miles drives the Lotus 49 – the car that changed F1 forever » (juillet 1997)
      url: https://motorsportmagazine.com/archive/article/july-1997/98/the-car-that-changed-formula-one-forever
  - de: 1969
    a: 2025
    valeur: oui
    pourquoi: 'Les ailerons se généralisent à partir de Spa 1968 et sont restés ; après les accidents de Montjuïc, la CSI interdit les ailerons hauts mais autorise ceux qui sont montés sur la structure même du châssis. Réserve : à Monaco 1969, la CSI interdit en cours d''essais les ailerons qui ne font pas partie de la carrosserie, et les voitures courent avec déflecteurs et becquets intégrés (Hill avec une plaque déflectrice à l''arrière). L''ère tient donc avec la définition large, pas avec la définition stricte.'
    sources:
    - titre: 8W, Mattijs Diepraam et Felix Muelas, « Adios aerofoils, enter aerodynamics » (mars 1999)
      url: https://forix.com/8w/e69.html
    - titre: Motor Sport, Denis Jenkinson, « The Monaco Grand Prix » (juin 1969)
      url: https://www.motorsportmagazine.com/archive/article/june-1969/26/the-monaco-grand-prix-4/
    - titre: Autosport, Nigel Roebuck, « When F1 forced an incredible last-minute rule change » (octobre 2017)
      url: https://www.autosport.com/f1/feature/7768/when-f1-forced-an-incredible-lastminute-rule-change
  cas:
  - annee: 1968
    ecurie: ferrari
    equipe: Ferrari
    voiture: Ferrari 312 (312/68)
    valeur: oui
    pourquoi: Ferrari monte un aileron arrière sur supports au-dessus de la boîte dès Spa (avec déflecteurs de nez) ; à Rouen, où Ickx gagne, l'aileron de la 312/68 a été avancé au-dessus du moteur.
    sources:
    - titre: OldRacingCars, « French Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/france/
    - titre: Motor Sport, « XXVII Belgian Grand Prix » (juillet 1968)
      url: https://www.motorsportmagazine.com/archive/article/july-1968/14/xxvii-belgian-grand-prix/
  - annee: 1968
    ecurie: matra
    equipe: Matra Ford
    voiture: Matra MS10
    valeur: oui
    pourquoi: À Zandvoort, la Matra de Stewart porte de petits déflecteurs sur le nez (fines ailettes logées dans des fentes du capot) ; au Nürburgring, elle a reçu aux essais des supports tubulaires d'aileron ; aileron haut sur supports aux États-Unis. En lecture stricte (aileron arrière), l'adoption daterait du Grand Prix d'Allemagne.
    sources:
    - titre: OldRacingCars, « Dutch Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/netherlands/
    - titre: MRO F1 Engineering, « A Tale of Two F1 Matras, Part Two (Matra MS10) »
      url: https://www.mrof1engineering.co.uk/pdfs/Matra%20MS10.pdf
    - titre: 'Motor Sport, Denis Jenkinson, « 1968 German Grand Prix race report: Stewart finds no equal » (septembre 1968)'
      url: https://www.motorsportmagazine.com/archive/article/september-1968/46/the-german-grand-prix-11/
    - titre: Wikipedia, « Matra MS10 »
      url: https://en.wikipedia.org/wiki/Matra_MS10
  - annee: 1968
    ecurie: mclaren
    equipe: McLaren Ford
    voiture: McLaren M7A
    valeur: oui
    pourquoi: À Spa, où McLaren gagne, les M7A ont de petits becquets sur le nez et un autre en travers de la poupe ; le véritable aileron arrière arrive au Grand Prix de France, et au Nürburgring la voiture de Bruce McLaren porte un aileron au-dessus du moteur. À Monza, l'équipe essaie avec et sans ailerons. En lecture stricte, l'adoption daterait du Grand Prix d'Italie (victoire de Hulme).
    sources:
    - titre: Motor Sport, « XXVII Belgian Grand Prix » (juillet 1968)
      url: https://www.motorsportmagazine.com/archive/article/july-1968/14/xxvii-belgian-grand-prix/
    - titre: 'Motor Sport, Denis Jenkinson, « 1968 German Grand Prix race report: Stewart finds no equal » (septembre 1968)'
      url: https://www.motorsportmagazine.com/archive/article/september-1968/46/the-german-grand-prix-11/
    - titre: 'Motor Sport, Denis Jenkinson, « 1968 Italian Grand Prix race report: Kiwis'' sweet victory » (octobre 1968)'
      url: https://www.motorsportmagazine.com/archive/article/october-1968/15/the-39th-italian-grand-prix/
    - titre: Wikipedia, « McLaren M7A »
      url: https://en.wikipedia.org/wiki/McLaren_M7A
  - annee: 1968
    ecurie: team-lotus
    equipe: Lotus Ford
    voiture: Lotus 49 (Afrique du Sud, Espagne), Lotus 49B (à partir de Monaco)
    valeur: oui
    des: Monaco
    pourquoi: Clark (Afrique du Sud) et Hill (Espagne, sur la 49 R1) gagnent sans appendice aérodynamique ; la 49B, dévoilée à Monaco, porte des ailerons de nez et une poupe en coin conçue pour l'appui, puis un grand aileron sur supports (Siffert en Grande-Bretagne, Hill au Mexique). En lecture stricte (aileron arrière), l'adoption daterait du Grand Prix de Grande-Bretagne.
    sources:
    - titre: Motor Sport, « The car that changed Formula One forever » (juillet 1997)
      url: https://motorsportmagazine.com/archive/article/july-1997/98/the-car-that-changed-formula-one-forever
    - titre: Motor Sport, « Spanish Grand Prix » (juin 1968)
      url: https://www.motorsportmagazine.com/archive/article/june-1968/13/spanish-grand-prix-6/
    - titre: OldRacingCars, « Spanish Grand Prix 1968 »
      url: https://www.oldracingcars.com/f1/results/1968/spain/
    - titre: OldRacingCars, « Monaco Grand Prix 1968 »
      url: https://oldracingcars.com/f1/results/1968/monaco/
  regle: 'Définition large : ailerons sur supports, ailerons fixés à la carrosserie et ailettes de nez générant de l''appui. Les ailerons sur supports sont interdits à Monaco en 1969 ; les ailerons fixés restent la règle ensuite.'
- id: effet-de-sol
  nom: Effet de sol
  nom_en: Ground effect
  jalon: lotus-78
  defaut:
  - de: 1950
    a: 1976
    valeur: non
    pourquoi: 'Motor Sport présente la Lotus 78 de 1977, la « wing car », comme la voiture qui lance l''effet de sol en F1 : avant elle, aucun gagnant n''en tirait parti.'
    sources:
    - titre: 'Motor Sport, Keith Howard, « Lotus 78: the car that started F1''s ground-effect revolution » (août 2007)'
      url: https://www.motorsportmagazine.com/archive/article/august-2007/72/ground-force/
  - de: 1980
    a: 1982
    valeur: oui
    pourquoi: Après le succès de Lotus, « a swathe of ground effect cars appeared » ; en 1981 les « ground-effect wing cars of the time » perdent leurs jupes coulissantes mais toutes adoptent des suspensions abaissant la voiture en piste, et les jupes reviennent en 1982. Les voitures gagnantes vérifiées (FW07, RE20, BT49, JS11/15, RE30, 126CK/126C2, Lotus 91, Tyrrell 011, FW08, MP4/1) sont toutes des voitures à effet de sol ; pour la Ligier JS17 et la Brabham BT50, les pages consultées ne le disent pas explicitement.
    sources:
    - &id001
      titre: 'Formula1.com, « Re-writing the F1 rule book – Part 1: from wing cars to flat bottoms »'
      url: https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU
    - titre: Wikipédia, « 1981 Formula One World Championship »
      url: https://en.wikipedia.org/wiki/1981_Formula_One_World_Championship
