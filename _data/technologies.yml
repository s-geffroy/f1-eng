  defaut:
  - de: 1950
    a: 2008
    valeur: non
    pourquoi: Le système de récupération d'énergie cinétique (KERS) apparaît en 2009 ; selon RaceFans, la victoire de Hamilton en Hongrie cette année-là est la première d'une voiture équipée du KERS.
    sources:
    - titre: RaceFans, Keith Collantine, « 2009 Hungarian Grand Prix facts and stats » (juillet 2009)
      url: https://www.racefans.net/2009/07/27/hungarian-grand-prix-facts-and-stats/
  - de: 2014
    a: 2025
    valeur: oui
    pourquoi: 'Depuis 2014, le V6 turbo de 1,6 l est associé à un système de récupération d''énergie au freinage plus puissant (MGU-K) et à un moteur-générateur relié au turbo (MGU-H) : c''est l''ère turbo-hybride (Autosport, F1Technical). Le MGU-H n''est supprimé qu''avec le règlement de 2026 (Motor Sport), si bien que tout gagnant de 2014 à 2025 en est équipé.'
    sources:
    - titre: Autosport, Jake Boxall-Legge, « Why F1's hard-to-love turbo-hybrid decade has been so important » (septembre 2023)
      url: https://www.autosport.com/f1/news/why-f1s-hard-to-love-turbo-hybrid-decade-has-been-so-important/10519122/
