    equipe: Ligier Matra
    voiture: Ligier JS7
    valeur: non
    pourquoi: 'La Lotus 78, introduite à la première course de 1977, est « the first ground effect car in Formula One » : aucune autre voiture de 1977, dont la JS7, n''utilise l''effet de sol.'
    sources:
