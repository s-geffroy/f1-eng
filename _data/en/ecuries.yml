- id: enstone
  nom: 'Enstone: from Toleman to Alpine'
  actuelle: true
  segments:
  - ecurie: toleman
    de: 1981
    a: 1985
  - ecurie: benetton
    de: 1986
    a: 2001
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Toleman's sponsor in 1985, the Benetton family bought the struggling team and renamed it Benetton Formula, officially launched in February 1986 (GrandPrix.com; The Race).
      sources:
      - titre: GrandPrix.com, “Benetton Formula Ltd.”
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
      - titre: The Race, Edd Straw, “Ranking Renault/Alpine's five previous F1 identities” (September 2020)
        url: https://www.the-race.com/formula-1/ranking-renault-alpines-five-previous-f1-identities/
  - ecurie: renault
    de: 2002
    a: 2011
    lien:
      type: usine-motoriste
      preuve: etabli
      pourquoi: Renault bought the Benetton team in early 2000 for $120m; it still raced as Benetton in 2000 and 2001, the engine being rebadged Renault in 2001, before becoming the Renault works team in 2002 (Motor Sport; GrandPrix.com).
      sources:
      - titre: 'Motor Sport Magazine, James Elson, “Teapots, turbos and titles: Renault''s wild F1 ride” (December 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
      - titre: GrandPrix.com, “Benetton Formula Ltd.”
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
  - ecurie: lotus-f1
    de: 2012
    a: 2015
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Renault sold 75% of its team to Gérard Lopez's Genii Capital over the 2009-10 winter, but it kept the Renault name; with Lotus as title sponsor, Genii had it renamed Lotus for 2012, with the backing of Renault, which stayed on as engine supplier (Autosport).
      sources:
      - titre: 'Autosport, Jonathan Noble, “Renault: No regrets about selling stake” (October 2010)'
        url: https://www.autosport.com/f1/news/renault-no-regrets-about-selling-stake-4441218/4441218/
      - titre: Autosport, Jonathan Noble, “Renault backs Formula 1 team name change to Lotus” (October 2011)
        url: https://www.autosport.com/f1/news/renault-backs-formula-1-team-name-change-to-lotus-4450345/4450345/
      - titre: Formula 1, “Alpine - Year by Year”
        url: https://www.formula1.com/en/information/alpine-year-by-year.26lcAj4zKxSs1w959B6yV
  - ecurie: renault
    de: 2016
    a: 2020
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: On 18 December 2015 Groupe Renault, the team's engine supplier, completed the acquisition of a controlling shareholding in Lotus F1 Team from a Genii Capital affiliate, returning to F1 as a works entrant; the team raced as Renault from 2016 (formula1.com; Motor Sport).
      sources:
      - titre: Formula 1, “Renault formally complete Lotus takeover” (December 2015)
        url: https://www.formula1.com/en/latest/article/renault-formally-complete-lotus-takeover.5aFbvhNiNzoO5DxGIZ5iQr
      - titre: 'Motor Sport Magazine, James Elson, “Teapots, turbos and titles: Renault''s wild F1 ride” (December 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
  - ecurie: alpine
    de: 2021
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: On 6 September 2020 Renault announced that its team would be called Alpine F1 Team from 2021, after its sports car brand, as part of Luca de Meo's reorganisation of the group; the engines remained Renaults built at Viry-Châtillon (Motor Sport; formula1.com).
      sources:
      - titre: Motor Sport Magazine, Jake Williams-Smith, “Renault to become Alpine F1 Team from 2021 season” (September 2020)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/renault-to-become-alpine-f1-team-from-2021-season/
      - titre: Formula 1, “Renault to rebrand as Alpine F1 Team in 2021” (September 2020)
        url: https://www.formula1.com/en/latest/article/renault-alpine-f1-team-2021.7eY84dCU9MythQjcYG8T45
- id: faenza
  nom: 'Faenza: from Minardi to Racing Bulls'
  actuelle: true
  segments:
  - ecurie: minardi
    de: 1985
    a: 2005
  - ecurie: toro-rosso
    de: 2006
    a: 2019
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Red Bull bought Minardi from Paul Stoddart at the 2005 Belgian Grand Prix, reportedly for around $35m; the Faenza team made its debut in 2006 as Scuderia Toro Rosso (GrandPrix.com; formula1.com).
      sources:
      - titre: GrandPrix.com, “Red Bull acquires Minardi!” (September 2005)
        url: https://www.grandprix.com/news/red-bull-acquires-minardi.html
      - titre: Formula 1, “Toro Rosso from A-Z” (March 2015)
        url: https://www.formula1.com/en/latest/article/toro-rosso-from-a-z.94qRWgpnalObzkOr0UNGX
  - ecurie: alphatauri
    de: 2020
    a: 2023
    lien:
      type: renommage
      preuve: atteste
      pourquoi: The FIA's provisional 2020 entry list confirmed that Scuderia Toro Rosso would become Scuderia AlphaTauri, named after Red Bull's clothing brand, Red Bull remaining the owner (formula1.com).
      sources:
      - titre: Formula 1, “Toro Rosso's name change to AlphaTauri confirmed in provisional 2020 entry list” (November 2019)
        url: https://www.formula1.com/en/latest/article/toro-rossos-name-change-to-alpha-tauri-confirmed-in-provisional-2020-entry.5tIxtPAMsY8MACQAyvg41j
  - ecurie: rb
    de: 2024
    a: 2024
    lien:
      type: renommage
      preuve: atteste
      pourquoi: In January 2024 Red Bull's sister team announced that it would henceforth be known as RB, in full the Visa Cash App RB Formula One Team (formula1.com).
      sources:
      - titre: Formula 1, “AlphaTauri rebrand confirmed for 2024 season as new team name revealed” (January 2024)
        url: https://www.formula1.com/en/latest/article/alphatauri-rebrand-confirmed-for-2024-season-as-new-team-name-revealed.4xAWHWI66d5L9mFELLGb6J
  - ecurie: racing-bulls
    de: 2025
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'For 2025 Visa Cash App RB became Visa Cash App Racing Bulls: according to CEO Peter Bayer, the rushed RB abbreviation confused fans, and Racing Bulls is the company''s name (The Race).'
      sources:
      - titre: The Race, Josh Suttill and Scott Mitchell-Malm, “Why Red Bull's second F1 squad is fixing its 'rushed' team name” (December 2024)
        url: https://www.the-race.com/formula-1/why-red-bulls-second-f1-team-is-fixing-its-rushed-team-name/
- id: silverstone
  nom: 'Silverstone: from Jordan to Aston Martin'
  actuelle: true
  segments:
  - ecurie: jordan
    de: 1991
    a: 2005
  - ecurie: midland
    de: 2006
    a: 2006
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Alex Shnaider's Midland Group announced on 24 January 2005 that it had signed a contract to take over Jordan; the team raced as Jordan throughout 2005 and only appeared under its new name, Midland F1 Racing, in 2006 (Matt Bishop, Motor Sport).
      sources:
      - titre: Motor Sport Magazine, Matt Bishop, "The billionaire Trump associate who bought Jordan F1 team — and turned a quick profit" (January 2025)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/the-billionaire-trump-associate-who-bought-jordan-f1-team-and-turned-a-quick-profit/
      - titre: 'Formula 1, Samarth Kanal, "Team guide: Aston Martin''s complex F1 roots" (January 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: spyker
    de: 2007
    a: 2007
    lien:
      type: rachat
      preuve: atteste
      pourquoi: On 9 September 2006 at Monza, the Midland Group announced the sale of 100% of its shares in Midland F1 Limited to Dutch carmaker Spyker Cars (Autosport, quoting the official statement).
      sources:
      - titre: Autosport, "Midland sale to Spyker now complete" (September 2006)
        url: https://www.autosport.com/f1/news/midland-sale-to-spyker-now-complete-4405729/4405729/
  - ecurie: force-india
    de: 2008
    a: 2018
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Indian businessman Vijay Mallya bought Spyker in 2007 together with Dutchman Michiel Mol, for £61 million (Motor Sport); the team was renamed Force India in 2008 (formula1.com).
      sources:
      - titre: Motor Sport Magazine, Samarth Kanal, "Force India's F1 decade" (July 2018)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/force-indias-f1-decade/
      - titre: 'Formula 1, Samarth Kanal, "Team guide: Aston Martin''s complex F1 roots" (January 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: racing-point
    de: 2019
    a: 2020
    lien:
      type: rachat
      preuve: atteste
      pourquoi: With Force India in administration, the administrators sold the business and its assets in August 2018 to the consortium led by Lawrence Stroll (Racing Point UK Limited); the FIA granted a new entry, and "Racing Point Force India" restarted on zero points from the Belgian Grand Prix (formula1.com). The Force India name was dropped in 2019.
      sources:
      - titre: Formula 1, "FIA approve Racing Point Force India F1 entry" (August 2018)
        url: https://www.formula1.com/en/latest/article/fia-approve-racing-point-force-india-f1-entry.3BsgxEhqbYeUqec40OaSEw
      - titre: 'Formula 1, Samarth Kanal, "Team guide: Aston Martin''s complex F1 roots" (January 2023)'
        url: https://www.formula1.com/en/latest/article/team-guide-aston-martins-complex-f1-roots-and-how-theyre-aiming-to-fulfil.465QgZKQ9XcBDcD54VT4xR
  - ecurie: aston-martin
    de: 2021
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Lawrence Stroll''s consortium, already Racing Point''s owner, took a 16.7% stake in Aston Martin for £182 million in January 2020; the team announced it would become the Aston Martin works team from 2021 and carry that name for at least ten years (formula1.com; Dominic Tobin, Motor Sport). Same owner, same factory: it is a change of name.'
      sources:
      - titre: Formula 1, "Racing Point set to become Aston Martin works team for 2021" (January 2020)
        url: https://www.formula1.com/en/latest/article/racing-point-set-to-become-aston-martin-racing-for-2021.2YwShWhMbZr2NK1M4Q1nMn
      - titre: Motor Sport Magazine, Dominic Tobin, "Racing Point to become Aston Martin F1 in 2021" (January 2020)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/racing-point-to-become-aston-martin-in-2021/
- id: hinwil
  nom: 'Hinwil: from Sauber to Audi'
  actuelle: true
  segments:
  - ecurie: sauber
    de: 1993
    a: 2005
  - ecurie: bmw-sauber
    de: 2006
    a: 2009
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: On 22 June 2005 BMW announced that, having acquired a majority shareholding in the Swiss Sauber team, a BMW-managed team would contest the championship from 2006 (BMW press release); Peter Sauber kept 20% (Edd Straw, The Race).
      sources:
      - titre: BMW Group, "BMW managed team from 2006" (June 2005)
        url: https://www.press.bmwgroup.com/latin-america-caribbean/article/detail/T0050556EN/bmw-managed-team-from-2006?language=en
      - titre: The Race, Edd Straw, "The 10 key moments in Sauber's F1 history ahead of Audi deal" (October 2022)
        url: https://www.the-race.com/formula-1/the-10-key-moments-in-saubers-f1-history-ahead-of-audi-deal/
  - ecurie: sauber
    de: 2010
    a: 2018
    lien:
      type: rachat
      preuve: atteste
      pourquoi: BMW announced its withdrawal from F1 at the end of 2009; Peter Sauber reached agreement with the manufacturer and bought the team back (Crash.net). Autosport notes that in November 2009 BMW opted to sell the team back to its founder.
      sources:
      - titre: Crash.net, "40 Years of Sauber Motorsport - A Tale of the Unexpected" (July 2010)
        url: https://www.crash.net/f1/news/161819/1/the-sauber-story-at-40-a-tale-of-the-unexpected
      - titre: Autosport, Jonathan Noble, "BMW Sauber name to remain for now" (January 2010)
        url: https://www.autosport.com/f1/news/bmw-sauber-name-to-remain-for-now-4435180/4435180/
  - ecurie: alfa-romeo
    de: 2019
    a: 2023
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'After a year of title partnership (2018), the team became Alfa Romeo Racing in 2019; the Sauber name left the grid after 26 years, but ownership (Longbow Finance since 2016) and management stayed the same: the team "will remain Sauber in all but name" (Lawrence Barretto, formula1.com).'
      sources:
      - titre: Formula 1, Lawrence Barretto, "What dropping Sauber name means for Alfa Romeo Racing" (February 2019)
        url: https://www.formula1.com/en/latest/article/what-dropping-sauber-name-means-for-alfa-romeo-racing.5mXcTEz3dv63T9SLuAInDl
  - ecurie: kick-sauber
    de: 2024
    a: 2025
    lien:
      type: renommage
      preuve: atteste
      pourquoi: 'Alfa Romeo announced in August 2022 that it would end its title sponsorship of Sauber when the deal expired at the end of 2023 (formula1.com); the team entered 2024 as "Stake F1 Team Kick Sauber", with its chassis designated the Kick Sauber C44 (The Race). The Hinwil team did not change hands: only the title sponsor changed.'
      sources:
      - titre: Formula 1, "Alfa Romeo to end Sauber partnership at end of 2023 season" (August 2022)
        url: https://www.formula1.com/en/latest/article/alfa-romeo-to-end-sauber-partnership-at-end-of-2023-season.4bKd4sn2aDCTbpbCAQWeGQ
      - titre: The Race, "Sauber relaunches under new Stake F1 team identity" (January 2024)
        url: https://www.the-race.com/formula-1/stake-f1-team-sauber-relaunch/
  - ecurie: audi
    de: 2026
    a: 2026
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: In 2022 Audi selected the Sauber Group as the partner for its F1 entry, using a power unit developed by Audi (FIA); in March 2024 the manufacturer chose to take a 100% stake in Sauber ahead of its 2026 debut (formula1.com).
      sources:
      - titre: FIA, "FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry" (October 2022)
        url: https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry
      - titre: Formula 1, "Audi expands commitment to Formula 1 with 100% takeover of Sauber" (March 2024)
        url: https://www.formula1.com/en/latest/article/audi-expands-commitment-to-formula-1-with-100-takeover-of-sauber.4g5fNv9jl03sw5btt4LuSw
- id: milton-keynes
  nom: 'Milton Keynes: from Stewart to Red Bull'
  actuelle: true
  segments:
  - ecurie: stewart
    de: 1997
    a: 1999
  - ecurie: jaguar
    de: 2000
    a: 2004
    lien:
      type: usine-motoriste
      preuve: etabli
      pourquoi: Ford, which had supplied Stewart's engines since its creation, bought the team in June 1999; in September it announced that it would become Jaguar Racing in 2000, after its own brand, with Eddie Irvine and Johnny Herbert (GrandPrix.com).
      sources:
      - titre: GrandPrix.com, “Stewart Grand Prix”
        url: https://www.grandprix.com/constructors/stewart-grand-prix.html
      - titre: The Race, Gary Anderson, “F1's last entry by US car giant was a masterclass in failure” (January 2023)
        url: https://www.the-race.com/formula-1/ford-jaguar-failed-team-us-manufacturer/
  - ecurie: red-bull
    de: 2005
    a: 2026
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Ford, leaving F1, announced on 15 November 2004 the sale of Jaguar Racing to Red Bull for a nominal fee, against a commitment to invest more than £200m over three years; Dietrich Mateschitz called it the “logical and final step” of his junior driver programme (Autosport; Motor Sport).
      sources:
      - titre: Autosport, “Red Bull buys Jaguar Racing” (November 2004)
        url: https://www.autosport.com/f1/news/red-bull-buys-jaguar-racing-5000774/5000774/
      - titre: 'Motor Sport Magazine, James Elson, “20 years of Red Bull: The ''unplanned'' team that took over F1” (January 2026)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/20-years-of-red-bull-the-unplanned-team-that-took-over-f1/
