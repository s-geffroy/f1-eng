        url: https://www.the-race.com/formula-1/the-10-key-moments-in-saubers-f1-history-ahead-of-audi-deal/
  - ecurie: sauber
    de: 2010
    a: 2018
    lien:
      type: rachat
      preuve: atteste
      pourquoi: BMW announced its withdrawal from F1 at the end of 2009; Peter Sauber reached agreement with the manufacturer and bought the team back (Crash.net). Autosport notes that in November 2009 BMW opted to sell the team back to its founder.
      sources:
      - titre: Crash.net, "40 Years of Sauber Motorsport - A Tale of the Unexpected" (July 2010)
        url: https://www.crash.net/f1/news/161819/1/the-sauber-story-at-40-a-tale-of-the-unexpected
