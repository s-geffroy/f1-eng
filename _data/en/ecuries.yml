        url: https://www.motorsportmagazine.com/database/teams/caterham/
      - titre: Autosport, Jonathan Noble, “Team Lotus closing on name change to Caterham” (September 2011)
        url: https://www.autosport.com/f1/news/team-lotus-closing-on-name-change-to-caterham-4450773/4450773/
- id: manor
  nom: Virgin, Marussia and Manor
  segments:
  - ecurie: virgin
    de: 2010
    a: 2011
  - ecurie: marussia
    de: 2012
    a: 2015
    lien:
      type: rachat
      preuve: atteste
      pourquoi: In late 2010 Russian car maker Marussia Motors became a significant shareholder in Virgin Racing, introduced as such by chief executive Graeme Lowdon (Crash.net); the team, which entered in 2010 as Virgin, was taken over by Marussia and its cars were officially renamed from 2012 (Formula1.com, Motor Sport).
      sources:
      - titre: Crash.net, Craig Llewellyn, “Marussia ups stake in Virgin” (2010)
        url: https://www.crash.net/f1/news/164951/1/virgin-looks-to-future-after-russian-buy-in
      - titre: Formula1.com, “Marussia reach the end of the road” (November 2014)
        url: https://www.formula1.com/en/latest/article/marussia-reach-the-end-of-the-road.3hOQBfrcgFA1oqsVSigpbn
      - titre: Motor Sport Magazine, database, “Manor Grand Prix”
        url: https://www.motorsportmagazine.com/database/teams/manor-grand-prix/
  - ecurie: manor
    de: 2016
    a: 2016
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Rescued from administration in early 2015 with Stephen Fitzpatrick's backing (Autosport), the team ran in 2015 as Manor Marussia, then confirmed it would race as Manor Racing in 2016 (ESPN).
      sources:
      - titre: ESPN, Nate Saunders, “Manor reveals new name and logo” (January 2016)
        url: https://www.espn.com/f1/story/_/id/14608552/manor-reveals-new-name-logo
      - titre: Autosport, Jonathan Noble and Matt Beer, “Manor worth saving, says new investor Stephen Fitzpatrick” (March 2015)
        url: https://www.autosport.com/f1/news/manor-worth-saving-says-new-investor-stephen-fitzpatrick-5016692/5016692/
