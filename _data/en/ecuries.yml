- id: caterham
  nom: Lotus (2010–2011) and Caterham
  segments:
  - ecurie: lotus-racing
    de: 2010
    a: 2011
  - ecurie: caterham
    de: 2012
    a: 2014
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Tony Fernandes, who had raced under a Lotus name licensed from Proton, bought Caterham Cars and renamed his team Caterham F1 Team for 2012 (Motor Sport); “we will call ourselves the Caterham F1 Team, with the same people”, he said (Autosport). The Lotus name then went to the Enstone outfit, a different team.
      sources:
      - titre: Autosport, Jamie O'Leary and Jonathan Noble, “Team Lotus to stay green and yellow under Caterham name in 2012” (November 2011)
        url: https://www.autosport.com/f1/news/team-lotus-to-stay-green-and-yellow-under-caterham-name-in-2012-4451091/4451091/
