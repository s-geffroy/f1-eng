- id: march
  nom: 'March: March and Leyton House'
  segments:
  - ecurie: march
    de: 1970
    a: 1989
  - ecurie: leyton-house
    de: 1990
    a: 1991
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'A March sponsor since 1987, Akira Akagi bought March''s F1 team in May 1989; it kept the March name that season, then was renamed Leyton House for 1990, with no March designation (Marcus Simmons, Motor Sport; Russell Campbell, Goodwood). The purchase came first: the name change itself was a rename by the same owner.'
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, "Marching to civil war" (June 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, "A bolt from the blue: the rise and fall of Leyton House Racing" (June 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
  - ecurie: march
    de: 1992
    a: 1992
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Akagi was arrested in September 1991 over a financial scandal and his associate Ken Marrable took control of the team (Goodwood); for 1992 it was bought out by a consortium including Marrable, and the car was renamed a March (Marcus Simmons, Motor Sport).
      sources:
      - titre: Motor Sport Magazine, Marcus Simmons, "Marching to civil war" (June 2005)
        url: https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war/
      - titre: 'Goodwood, Russell Campbell, "A bolt from the blue: the rise and fall of Leyton House Racing" (June 2025)'
        url: https://www.goodwood.com/grr/f1/a-bolt-from-the-blue-the-rise-and-fall-of-leyton-house-racing/
