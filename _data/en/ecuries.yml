    de: 1972
    a: 1972
  - ecurie: iso-marlboro
    de: 1973
    a: 1974
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'Same team, Frank Williams'', new sponsors: with Politoys gone, the FX3s became Iso-Marlboro FX3Bs in 1973, and John Clarke''s new cars also carried the Iso-Marlboro name (Allen Brown, OldRacingCars.com).'
      sources:
      - titre: OldRacingCars.com, Allen Brown, “Williams FX3 car-by-car histories”
        url: https://www.oldracingcars.com/williams/fx3/
      - titre: OldRacingCars.com, Allen Brown, “Williams IR/FW car-by-car histories”
        url: https://www.oldracingcars.com/williams/ir/fw/
  - ecurie: frank-williams-racing-cars
    de: 1975
    a: 1975
    lien:
      type: renommage
      preuve: etabli
      pourquoi: 'The IR/FW series cars, called Iso-Marlboro in 1973 and 1974, were renamed Williams in 1975: same cars, same drivers (Merzario, Laffite) (Allen Brown, OldRacingCars.com).'
      sources:
      - titre: OldRacingCars.com, Allen Brown, “Williams IR/FW car-by-car histories”
        url: https://www.oldracingcars.com/williams/ir/fw/
  - ecurie: wolf-williams
    de: 1976
    a: 1976
    lien:
      type: rachat
      preuve: etabli
      pourquoi: 'At the end of 1975 Walter Wolf took 60% of Frank Williams (Racing Cars) Ltd by taking on its debts, bought Hesketh''s assets — the 308C became the FW05 — and kept Williams on as manager: the Wolf-Williams team was born (GrandPrix.com; Allen Brown, OldRacingCars.com).'
      sources:
      - titre: GrandPrix.com, “Walter Wolf Racing”
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: OldRacingCars.com, Allen Brown, “Williams FW05 car-by-car histories”
        url: https://www.oldracingcars.com/williams/fw05/
  - ecurie: wolf
    de: 1977
    a: 1979
    lien:
      type: rachat
      preuve: atteste
      pourquoi: 'After a disastrous 1976 season, Wolf removed Frank Williams from management and restructured the team, which became Walter Wolf Racing; Williams left to found Williams Grand Prix Engineering with Patrick Head (GrandPrix.com). In Wolf''s own words: “I bought the assets from Frank Williams and started Walter Wolf Racing” (René Fagnan, Motorsport.com).'
      sources:
      - titre: GrandPrix.com, “Walter Wolf Racing”
        url: https://www.grandprix.com/constructors/walter-wolf-racing.html
      - titre: Motorsport.com, René Fagnan, “The story of Formula 1's first winning Wolf” (December 2015)
        url: https://www.motorsport.com/f1/news/the-story-of-formula-1-s-first-winning-wolf/662835/
- id: ensign
  nom: 'Ensign: from Ensign to Theodore'
  segments:
  - ecurie: ensign
    de: 1973
    a: 1982
  - ecurie: theodore
    de: 1983
    a: 1983
    lien:
      type: rachat
      preuve: discute
      pourquoi: 'For 1983 Teddy Yip combined Theodore and Ensign: the team kept the Theodore name but raced Nigel Bennett''s Ensign N183, and closed at the end of the year. GrandPrix.com calls it a merger, Allen Brown (OldRacingCars.com) a purchase of Mo Nunn''s team by Yip; the continuity of the cars is not in doubt — Ensign''s 1982 chassis MN16 was rebuilt as an N183.'
      sources:
      - titre: GrandPrix.com, “Theodore Racing”
        url: https://www.grandprix.com/constructors/theodore-racing.html
      - titre: OldRacingCars.com, Allen Brown, “Theodore TY02 car-by-car histories”
        url: https://www.oldracingcars.com/theodore/ty02/
      - titre: OldRacingCars.com, Allen Brown, “Ensign N181 history”
        url: https://www.oldracingcars.com/ensign/n181/
- id: ligier
  nom: 'Ligier: from Ligier to Prost'
  segments:
  - ecurie: ligier
    de: 1976
    a: 1996
  - ecurie: prost
    de: 1997
    a: 2001
    lien:
      type: rachat
      preuve: atteste
      pourquoi: In February 1997 Alain Prost signed, in Geneva, the purchase of the Ligier team from Flavio Briatore after eighteen months of negotiation; the FIA immediately allowed the Ligier chassis to be renamed Prost, and Prost said he was the sole owner, using his own money (GrandPrix.com, February 1997).
      sources:
      - titre: GrandPrix.com, “Prost takes over Ligier...” (February 1997)
        url: https://www.grandprix.com/news/prost-takes-over-ligier.html
- id: arrows
  nom: 'Arrows: Arrows and Footwork'
  segments:
  - ecurie: arrows
    de: 1978
    a: 1990
  - ecurie: footwork
    de: 1991
    a: 1996
    lien:
      type: rachat
      preuve: atteste
      pourquoi: In the late 1980s Wataru Ohashi, head of the Japanese transport company Footwork, bought the team outright; in 1991 it became Footwork Grand Prix International and its cars Footworks, with Jackie Oliver still running it (Adam Cooper, Motor Sport, quoting Oliver).
      sources:
      - titre: 'Motor Sport Magazine, Adam Cooper, “Jackie Oliver''s army: the story of the Arrows F1 team” (September 1998)'
        url: https://www.motorsportmagazine.com/archive/article/september-1998/58/olivers-army/
  - ecurie: arrows
    de: 1997
    a: 2002
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Oliver, who had bought the team back from Ohashi in 1995, joined forces in early 1996 with Tom Walkinshaw, who took 40% and full control (Oliver, quoted by Adam Cooper); TWR completed the takeover in July 1996, with Walkinshaw as chairman and chief executive (GrandPrix.com). The Arrows name returned in 1997, the first full season under his control.
      sources:
      - titre: 'Motor Sport Magazine, Adam Cooper, “Jackie Oliver''s army: the story of the Arrows F1 team” (September 1998)'
        url: https://www.motorsportmagazine.com/archive/article/september-1998/58/olivers-army/
      - titre: GrandPrix.com, “TWR completes Arrows takeover” (July 1996)
        url: https://www.grandprix.com/news/twr-completes-arrows-takeover.html
- id: osella
  nom: 'Osella: from Osella to Fondmetal'
  segments:
  - ecurie: osella
    de: 1980
    a: 1990
  - ecurie: fondmetal
    de: 1991
    a: 1992
    lien:
      type: rachat
      preuve: atteste
      pourquoi: Gabriele Rumi, whose Fondmetal company sponsored Osella, took a large stake in 1990 and the whole team for 1991, which then raced as Fondmetal (Fondmetal). Enzo Osella left and the team moved to Palosco, near Bergamo (GrandPrix.com, Joe Saward).
      sources:
      - titre: Fondmetal, “Fondmetal F1 History” (official site)
        url: https://fondmetal.com/en/fondmetal-f1-history
      - titre: 'GrandPrix.com, Joe Saward, “News Feature: The Fondmetal F1 team” (March 1991)'
        url: https://www.grandprix.com/features/joe-saward/news-feature-the-fondmetal-f1-team.html
      - titre: GrandPrix.com, constructor profile “Fondmetal F1 SpA”
        url: https://www.grandprix.com/constructors/fondmetal-f1-spa.html
- id: coloni
  nom: 'Coloni: from Coloni to Andrea Moda'
  segments:
  - ecurie: coloni
    de: 1987
    a: 1991
  - ecurie: andrea-moda
    de: 1992
    a: 1992
    lien:
      type: reprise-partielle
      preuve: etabli
      pourquoi: 'In September 1991 Enzo Coloni sold his team to shoe maker Andrea Sassetti, who ran it in 1992 under the name of his brand, Andrea Moda (GrandPrix.com). FISA, however, held that he had bought only Coloni''s equipment, not its entry: the team was treated as a newcomer and excluded from the South African Grand Prix for not paying the $100,000 deposit (RaceFans, Motor Sport).'
      sources:
      - titre: GrandPrix.com, constructor profile “Andrea Moda Formula”
        url: https://www.grandprix.com/constructors/andrea-moda-formula.html
      - titre: 'RaceFans, Ben Evans, “Lapped Legends: Andrea Moda” (December 2007)'
        url: https://www.racefans.net/2007/12/20/lapped-legends-andrea-moda/
      - titre: Motor Sport Magazine, “The month in Motor Sport” (April 1992)
        url: https://www.motorsportmagazine.com/archive/article/april-1992/4/month-motor-sport/
