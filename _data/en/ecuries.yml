- id: brackley
  nom: 'Brackley: from Tyrrell to Mercedes'
  actuelle: true
  segments:
  - ecurie: tyrrell
    de: 1970
    a: 1998
  - ecurie: bar
    de: 1999
    a: 2005
    lien:
      type: rachat
      preuve: etabli
      pourquoi: On 28 November 1997 Ken Tyrrell sold his team to British American Tobacco, for a rumoured £30m, with a view to creating British American Racing; it raced on as Tyrrell in 1998 before becoming BAR in 1999 (Autosport; Motor Sport).
      sources:
      - titre: Autosport, Maurice Hamilton, “How Tyrrell became a racing Rubik's cube as it faded out of F1” (February 2023)
        url: https://www.autosport.com/f1/news/how-tyrrell-became-a-racing-rubiks-cube-as-it-faded-out-of-f1/10427616/
      - titre: 'Motor Sport Magazine, Pablo Elizalde, “From Tyrrell shed via Brawn fairytale: the evolution of Mercedes'' F1 team” (September 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/from-tyrrell-shed-via-brawn-fairytale-the-evolution-of-mercedes-f1-team/
  - ecurie: honda
    de: 2006
    a: 2008
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Honda, BAR's engine supplier and already a 45% shareholder, announced on 4 October 2005 that it was buying all the shares in BARH Ltd., including British American Tobacco's 55%, to field its own team from 2006; it was renamed Lucky Strike Honda Racing F1 Team (Honda).
      sources:
      - titre: Honda, “Honda acquires all shares in BARH Ltd.” (October 2005)
        url: https://global.honda/en/newsroom/news/2005/c051004-eng.html
      - titre: Honda, “2006 | F1”
        url: https://global.honda/en/F1/2006/
  - ecurie: brawn
    de: 2009
    a: 2009
    lien:
      type: rachat
      preuve: atteste
      pourquoi: After Honda announced its withdrawal at the end of 2008, on 6 March 2009 it sold all the shares in its team to Ross Brawn, its team principal; this management buyout, with Mercedes engines, created the Brawn GP Formula One Team (Honda; Motor Sport).
      sources:
      - titre: Honda, “Honda Announces Sale of the Honda Racing F1 Team” (March 2009)
        url: https://global.honda/en/newsroom/news/2009/c090306eng.html
      - titre: Motor Sport Magazine, Ed Foster, “Brawn GP gets the green light” (March 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/brawn-gp-gets-green-light/
  - ecurie: mercedes
    de: 2010
    a: 2026
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: On 16 November 2009 Mercedes-Benz, Brawn's engine supplier, bought 75.1% of the team (45.1% Daimler, 30% Aabar Investments) and renamed it Mercedes Grand Prix; Dieter Zetsche announced a factory team from 2010 (Autosport; Motor Sport).
      sources:
      - titre: Autosport, Edd Straw, “Mercedes takes over Brawn” (November 2009)
        url: https://www.autosport.com/f1/news/mercedes-takes-over-brawn-4433692/4433692/
      - titre: Motor Sport Magazine, Ed Foster, “Mercedes buys out Brawn GP” (November 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/mercedes-buys-out-brawn-gp/
  rangee: 3
- id: williams
  nom: Williams
  texte: Williams Grand Prix Engineering made its debut at the 1977 Spanish Grand Prix with a March 761 driven by Patrick Neve; the team's first own car, Patrick Head's FW06, arrived in 1978 (Formula 1). The chart follows the constructor's name, hence the 1978 start.
  texte_sources:
  - titre: Formula 1, “Williams at 40 - the essential facts, stats and stand-out moments” (May 2017)
    url: https://www.formula1.com/en/latest/article/f1-williams-40-anniversary-facts-stats-video-moments.4gCUxY8VnOgkAGqe8A8646
  actuelle: true
  segments:
  - ecurie: williams
    de: 1978
    a: 2026
  rangee: 4
- id: enstone
  nom: 'Enstone: from Toleman to Alpine'
  texte: 'Sources disagree on when Toleman was sold to the Benetton family: May 1985 according to GrandPrix.com, “ahead of 1986” according to The Race. The team raced as Benetton from 1986.'
  texte_sources:
  - titre: GrandPrix.com, “Benetton Formula Ltd”
    url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
  - titre: The Race, “Ranking Renault/Alpine's five previous F1 identities”
    url: https://www.the-race.com/formula-1/ranking-renault-alpines-five-previous-f1-identities/
  actuelle: true
  segments:
  - ecurie: toleman
    de: 1981
    a: 1985
  - ecurie: benetton
    de: 1986
    a: 2001
    lien:
      type: rachat
      preuve: etabli
      pourquoi: Toleman's sponsor in 1985, the Benetton family bought the struggling team and renamed it Benetton Formula, officially launched in February 1986 (GrandPrix.com; The Race).
      sources:
      - titre: GrandPrix.com, “Benetton Formula Ltd.”
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
      - titre: The Race, Edd Straw, “Ranking Renault/Alpine's five previous F1 identities” (September 2020)
        url: https://www.the-race.com/formula-1/ranking-renault-alpines-five-previous-f1-identities/
  - ecurie: renault
    de: 2002
    a: 2011
    lien:
      type: usine-motoriste
      preuve: etabli
      pourquoi: Renault bought the Benetton team in early 2000 for $120m; it still raced as Benetton in 2000 and 2001, the engine being rebadged Renault in 2001, before becoming the Renault works team in 2002 (Motor Sport; GrandPrix.com).
      sources:
      - titre: 'Motor Sport Magazine, James Elson, “Teapots, turbos and titles: Renault''s wild F1 ride” (December 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
      - titre: GrandPrix.com, “Benetton Formula Ltd.”
        url: https://www.grandprix.com/constructors/benetton-formula-ltd.html
  - ecurie: lotus-f1
    de: 2012
    a: 2015
    lien:
      type: renommage
      preuve: atteste
      pourquoi: Renault sold 75% of its team to Gérard Lopez's Genii Capital over the 2009-10 winter, but it kept the Renault name; with Lotus as title sponsor, Genii had it renamed Lotus for 2012, with the backing of Renault, which stayed on as engine supplier (Autosport).
      sources:
      - titre: 'Autosport, Jonathan Noble, “Renault: No regrets about selling stake” (October 2010)'
        url: https://www.autosport.com/f1/news/renault-no-regrets-about-selling-stake-4441218/4441218/
      - titre: Autosport, Jonathan Noble, “Renault backs Formula 1 team name change to Lotus” (October 2011)
        url: https://www.autosport.com/f1/news/renault-backs-formula-1-team-name-change-to-lotus-4450345/4450345/
      - titre: Formula 1, “Alpine - Year by Year”
        url: https://www.formula1.com/en/information/alpine-year-by-year.26lcAj4zKxSs1w959B6yV
  - ecurie: renault
    de: 2016
    a: 2020
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: On 18 December 2015 Groupe Renault, the team's engine supplier, completed the acquisition of a controlling shareholding in Lotus F1 Team from a Genii Capital affiliate, returning to F1 as a works entrant; the team raced as Renault from 2016 (formula1.com; Motor Sport).
      sources:
      - titre: Formula 1, “Renault formally complete Lotus takeover” (December 2015)
        url: https://www.formula1.com/en/latest/article/renault-formally-complete-lotus-takeover.5aFbvhNiNzoO5DxGIZ5iQr
      - titre: 'Motor Sport Magazine, James Elson, “Teapots, turbos and titles: Renault''s wild F1 ride” (December 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/
  - ecurie: alpine
    de: 2021
    a: 2026
    lien:
      type: renommage
      preuve: atteste
      pourquoi: On 6 September 2020 Renault announced that its team would be called Alpine F1 Team from 2021, after its sports car brand, as part of Luca de Meo's reorganisation of the group; the engines remained Renaults built at Viry-Châtillon (Motor Sport; formula1.com).
      sources:
      - titre: Motor Sport Magazine, Jake Williams-Smith, “Renault to become Alpine F1 Team from 2021 season” (September 2020)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/renault-to-become-alpine-f1-team-from-2021-season/
      - titre: Formula 1, “Renault to rebrand as Alpine F1 Team in 2021” (September 2020)
        url: https://www.formula1.com/en/latest/article/renault-alpine-f1-team-2021.7eY84dCU9MythQjcYG8T45
  rangee: 5
