    a: 2008
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Honda, BAR's engine supplier and already a 45% shareholder, announced on 4 October 2005 that it was buying all the shares in BARH Ltd., including British American Tobacco's 55%, to field its own team from 2006; it was renamed Lucky Strike Honda Racing F1 Team (Honda).
      sources:
      - titre: Honda, “Honda acquires all shares in BARH Ltd.” (October 2005)
