- id: brackley
  nom: 'Brackley: from Tyrrell to Mercedes'
  actuelle: true
  segments:
  - ecurie: tyrrell
    de: 1970
    a: 1998
  - ecurie: bar
    de: 1999
    a: 2005
    lien:
      type: rachat
      preuve: etabli
      pourquoi: On 28 November 1997 Ken Tyrrell sold his team to British American Tobacco, for a rumoured £30m, with a view to creating British American Racing; it raced on as Tyrrell in 1998 before becoming BAR in 1999 (Autosport; Motor Sport).
      sources:
      - titre: Autosport, Maurice Hamilton, “How Tyrrell became a racing Rubik's cube as it faded out of F1” (February 2023)
        url: https://www.autosport.com/f1/news/how-tyrrell-became-a-racing-rubiks-cube-as-it-faded-out-of-f1/10427616/
      - titre: 'Motor Sport Magazine, Pablo Elizalde, “From Tyrrell shed via Brawn fairytale: the evolution of Mercedes'' F1 team” (September 2025)'
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/from-tyrrell-shed-via-brawn-fairytale-the-evolution-of-mercedes-f1-team/
  - ecurie: honda
    de: 2006
    a: 2008
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: Honda, BAR's engine supplier and already a 45% shareholder, announced on 4 October 2005 that it was buying all the shares in BARH Ltd., including British American Tobacco's 55%, to field its own team from 2006; it was renamed Lucky Strike Honda Racing F1 Team (Honda).
      sources:
      - titre: Honda, “Honda acquires all shares in BARH Ltd.” (October 2005)
        url: https://global.honda/en/newsroom/news/2005/c051004-eng.html
      - titre: Honda, “2006 | F1”
        url: https://global.honda/en/F1/2006/
  - ecurie: brawn
    de: 2009
    a: 2009
    lien:
      type: rachat
      preuve: atteste
      pourquoi: After Honda announced its withdrawal at the end of 2008, on 6 March 2009 it sold all the shares in its team to Ross Brawn, its team principal; this management buyout, with Mercedes engines, created the Brawn GP Formula One Team (Honda; Motor Sport).
      sources:
      - titre: Honda, “Honda Announces Sale of the Honda Racing F1 Team” (March 2009)
        url: https://global.honda/en/newsroom/news/2009/c090306eng.html
      - titre: Motor Sport Magazine, Ed Foster, “Brawn GP gets the green light” (March 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/brawn-gp-gets-green-light/
  - ecurie: mercedes
    de: 2010
    a: 2026
    lien:
      type: usine-motoriste
      preuve: atteste
      pourquoi: On 16 November 2009 Mercedes-Benz, Brawn's engine supplier, bought 75.1% of the team (45.1% Daimler, 30% Aabar Investments) and renamed it Mercedes Grand Prix; Dieter Zetsche announced a factory team from 2010 (Autosport; Motor Sport).
      sources:
      - titre: Autosport, Edd Straw, “Mercedes takes over Brawn” (November 2009)
        url: https://www.autosport.com/f1/news/mercedes-takes-over-brawn-4433692/4433692/
      - titre: Motor Sport Magazine, Ed Foster, “Mercedes buys out Brawn GP” (November 2009)
        url: https://www.motorsportmagazine.com/articles/single-seaters/f1/mercedes-buys-out-brawn-gp/
