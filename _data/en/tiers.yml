# The four tiers of the ranking (spec, section 2). Read by the entry card and the Tiers page.
- id: "A"
  nom: "Paradigm revolutionaries"
  definition: "They lastingly changed the technical grammar of F1. Their innovation creates a “before / after”, spreads to the whole grid and goes beyond a single car or a single regulatory period."
- id: "B"
  nom: "Major systemic transformers"
  definition: "They lastingly transformed a central field of F1, with at least one limit compared with Tier A — a more collective attribution, a more specialised reach, a shorter duration or a dependence on a particular regulatory period."
- id: "C"
  nom: "Structuring innovators"
  definition: "A major and lasting contribution to one or more fields, without a complete redefinition of the discipline that can be demonstrated at the same level."
- id: "D"
  nom: "Technical giants with a more localised or more shared impact"
  definition: "A major place in technical history, with less exclusive causation, less general diffusion or an impact more incremental than paradigmatic."
