- id: "nez-releve"
  terme: "Raised nose"
  motifs:
  - "raised nose"
  definition: "The nose is raised and the front wing hung beneath it, to send more air under the floor and towards the diffuser. It became the norm in the 1990s."
  premiere: "Tyrrell 019, 1990 San Marino Grand Prix; the Leyton House CG901 did the same that year."
  entrees:
  - "jean-claude-migeot"
  - "harvey-postlethwaite"
  - "adrian-newey"
  sources:
