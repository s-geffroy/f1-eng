- id: inerter
  terme: Inerter
  motifs:
  - inerter
  definition: A suspension element in which a plunger turns a flywheel, and the force transmitted is proportional to the relative acceleration of its two ends; combined with springs and dampers, it reduces oscillations. Conceived in 1997 by Malcolm Smith at Cambridge, it first raced at McLaren as the "J-damper", then became standard equipment until it was banned in 2022.
  premiere: McLaren, 2005.
