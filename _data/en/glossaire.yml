- id: "aileron"
  terme: "Wing"
  motifs:
  - "wings"
  - "wing"
  definition: "An aircraft wing mounted upside down, at the front or the rear: instead of lifting the car, it presses it onto the ground, at the cost of increased drag. In 1968-1969, wings were mounted on tall struts, banned after accidents in 1969."
  premiere: "Disputed: Ferrari and Brabham tried wings on struts at Spa in 1968, but others had preceded them."
  entrees:
  - "mauro-forghieri"
  - "tony-rudd"
  - "jean-claude-migeot"
