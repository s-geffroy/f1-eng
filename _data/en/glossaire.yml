- id: "ravitaillement"
  terme: "Refuelling and tactical pit stop"
  motifs:
  - "refuelling"
  definition: "The car starts light and stops during the race to refuel and change wheels, which makes it faster in each stint. Refuelling was banned from 1984 to 1993, allowed from 1994 to 2009, then banned since 2010; the stop now serves only to change tyres."
