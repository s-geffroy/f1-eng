- id: "voiture-a-ventilateur"
  terme: "Fan car"
  motifs:
  - "fan car"
  - "fan"
  definition: "A fan sucks air from under the car, whose sides are sealed by skirts, creating a depression that presses it onto the ground whatever the speed. On the Brabham BT46B, it was driven by the gearbox and presented as a cooling device."
  premiere: "Brabham BT46B, 1978 Swedish Grand Prix, its only race."
