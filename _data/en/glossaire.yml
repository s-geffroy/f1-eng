    url: "https://www.motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
- id: "monocoque"
  terme: "Monocoque"
  motifs:
  - "monocoque"
  definition: "\"Single shell\": instead of hanging the mechanical components on a frame of tubes, a closed shell is made to carry the loads, first in riveted sheet metal as in aviation, then in composites. The structure gains stiffness for less weight. Today the monocoque is the driver's survival cell."
  premiere: "Lotus 25, 1962 (Colin Chapman spoke rather of a \"bathtub\")."
  entrees:
  - "colin-chapman"
  - "john-barnard"
  - "alan-jenkins"
  - "martin-ogilvie"
  - "tony-rudd"
  sources:
  - titre: "Lotus, “Lotus Type 25 — The Revolutionary Monocoque”"
    url: "https://www.lotuscars.com/en/lotus-story/race-cars/type-25"
