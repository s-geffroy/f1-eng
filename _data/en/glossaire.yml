- id: kers
  terme: KERS
  motifs:
  - KERS
  definition: 'Kinetic energy recovery system: under braking, a motor-generator converts part of the energy into electricity, which is stored and given back to the driver as extra power. Allowed in 2009, then limited to 60kW for 6.6 seconds a lap, it preceded the 2014 hybrid power unit.'
  premiere: '2009.'
