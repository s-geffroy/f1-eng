    url: "https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2"
- id: "moteur-porteur"
  terme: "Stressed engine"
  motifs:
  - "stressed engine"
  - "stressed member"
  - "structural member"
  - "structural component"
  definition: "The very rigid engine block itself forms part of the chassis: the tub is bolted to it at the front, and the rear suspension and gearbox at the back. The rear frame is eliminated, which makes the car lighter and shorter."
  premiere: "Generalised with the Lotus 49 and the DFV in 1967; the Lancia D50 used it as early as 1954."
  entrees:
  - "colin-chapman"
  - "keith-duckworth"
  - "vittorio-jano"
  - "ettore-zaccone-mina"
  sources:
  - titre: "Motor Sport Magazine, “The Lotus 49” (July 1967)"
    url: "https://www.motorsportmagazine.com/archive/article/july-1967/26/the-lotus-49/"
  - titre: "Motor Sport Magazine, “Lancia D50 re-creations nearing completion” (October 1999)"
    url: "https://motorsportmagazine.com/archive/article/october-1999/5/lancia-d50-re-creations-nearing-completion"
- id: "moteur-central-arriere"
  terme: "Mid-engine layout"
  motifs:
  - "mid-engine"
  - "mid-engined"
  - "rear-engine"
  - "rear engine"
  definition: "The engine is placed behind the driver, ahead of the rear axle. There is no longer a propshaft running along the car: frontal area and centre of gravity are lowered, weight moves towards the driven wheels and the polar moment of inertia decreases. Since 1959, every F1 world champion has driven with the engine behind him."
  premiere: "First championship win: Cooper, Argentina 1958; first title in 1959."
  entrees:
  - "john-cooper"
  - "owen-maddock"
  - "john-crosthwaite"
  sources:
  - titre: "Motor Sport Magazine, “Back to the future” (November 2017)"
    url: "https://www.motorsportmagazine.com/archive/article/november-2017/103/back-future/"
  - titre: "Motor Sport Magazine, “Cooper T51: the revolutionary car that changed F1 forever”"
    url: "https://www.motorsportmagazine.com/archive/article/june-2019/122/cooper-t51/"
  - titre: "Formula 1, “VOTE NOW: Who is the most influential technical innovator in F1 history?”"
    url: "https://www.formula1.com/en/latest/article/vote-now-who-is-the-most-influential-technical-innovator-in-f1-history.dUby3oyTgDmCPqkvkYttX"
- id: "moment-polaire"
  terme: "Polar moment of inertia"
  motifs:
  - "polar moment"
  definition: "A car's resistance to rotating about its vertical axis. The further the masses are from the centre, the higher it is. A low polar moment makes the car quicker to turn in, but also more nervous."
  entrees:
  - "john-cooper"
  sources:
  - titre: "Motor Sport Magazine, “Back to the future” (November 2017)"
    url: "https://www.motorsportmagazine.com/archive/article/november-2017/103/back-future/"
  - titre: "Motor Sport Magazine, “Little Belter: the Cooper F1 team” (June 2000)"
    url: "https://www.motorsportmagazine.com/archive/article/june-2000/88/cooper-t5153/"
- id: "centralisation-des-masses"
  terme: "Mass centralisation"
  motifs:
  - "mass centralisation"
  - "centralise the masses"
  definition: "Grouping the heavy components — fuel, radiators, gearbox, driver — close to the centre of gravity, between the axles, to lower the polar moment of inertia and make the car quicker to change direction."
  entrees:
  - "mauro-forghieri"
  sources:
  - titre: "Formula 1, “TECH TUESDAY: Under the bodywork of Mauro Forghieri's masterpiece, the Ferrari 312T”"
    url: "https://www.formula1.com/en/latest/article/tech-tuesday-under-the-bodywork-of-mauro-forghieris-masterpiece-the-ferrari.kftnvmyfKpzrrB5NdO1xz"
- id: "boite-transversale"
  terme: "Transverse gearbox"
  motifs:
  - "transverse gearbox"
  definition: "The gearbox shafts are placed across the car rather than in line behind the engine. The gearbox sits ahead of the rear axle, which brings the weight closer to the centre and improves directional response."
  premiere: "Ferrari 312T, 1975, according to formula1.com; Motor Sport points to a path opened in 1972 by Tyrrell and March."
  entrees:
  - "mauro-forghieri"
  sources:
  - titre: "Formula 1, “TECH TUESDAY: Under the bodywork of Mauro Forghieri's masterpiece, the Ferrari 312T”"
    url: "https://www.formula1.com/en/latest/article/tech-tuesday-under-the-bodywork-of-mauro-forghieris-masterpiece-the-ferrari.kftnvmyfKpzrrB5NdO1xz"
  - titre: "Formula 1, “VOTE NOW: Who is the most influential technical innovator in F1 history?”"
    url: "https://www.formula1.com/en/latest/article/vote-now-who-is-the-most-influential-technical-innovator-in-f1-history.dUby3oyTgDmCPqkvkYttX"
- id: "boite-semi-automatique"
  terme: "Semi-automatic paddle-shift gearbox"
  motifs:
  - "semi-automatic gearbox"
  definition: "The driver changes gear with two paddles behind the steering wheel, with no gear lever or clutch pedal; an electro-hydraulic control carries out the change. Hands on the wheel, fewer errors, a narrower tub: every current F1 car is fitted with one."
  premiere: "Ferrari 640, 1989 (originally planned for the 639, which did not race)."
  entrees:
  - "john-barnard"
  sources:
  - titre: "Formula 1, glossary F-J"
    url: "https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX"
