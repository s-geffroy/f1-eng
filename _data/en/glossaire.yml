    url: "https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/"
- id: "chassis-tubulaire"
  terme: "Spaceframe chassis"
  motifs:
  - "spaceframe"
  - "curved tubes"
  - "curved-tube"
  definition: "A three-dimensional frame made of welded steel or aluminium tubes arranged in triangles. It carries the engine, the suspension and the driver; the bodywork plays no structural role. It was the standard architecture of F1 cars until the early 1960s."
  entrees:
  - "colin-chapman"
  - "owen-maddock"
  sources:
  - titre: "Motor Sport Magazine, “A new frame of reference” (May 2002)"
    url: "https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/"
  - titre: "Motor Sport Magazine, “Classified spotlight: Cooper T51”"
    url: "https://motorsportmagazine.com/articles/single-seaters/f1/classified-spotlight-cooper-t51"
- id: "nid-d-abeille"
  terme: "Honeycomb"
  motifs:
  - "honeycomb"
  definition: "Sandwich panel: two thin skins bonded on either side of a cellular aluminium core. Very light and stiff, it formed F1 tubs in the 1970s and early 1980s, often folded rather than riveted, before serving as the core of composites."
  entrees:
  - "harvey-postlethwaite"
  - "martin-ogilvie"
  - "ralph-bellamy"
  sources:
  - titre: "Peter Wright, GrandPrix.com, “Dr Harvey Postlethwaite, an appreciation”"
    url: "https://www.grandprix.com/features/peter-wright/technical-dr-harvey-postlethwaite-an-appreciation.html"
- id: "composite-carbone"
  terme: "Carbon composite"
  motifs:
  - "carbon composite"
  - "carbon composites"
  - "carbon fibre"
  definition: "Carbon fibres embedded in a resin, stacked in layers oriented according to the loads, then cured. The material is very stiff and very strong for minimal weight; its stiffness-to-weight ratio and its impact resistance have made it the basis of modern safety."
  premiere: "Complete chassis to race in a Grand Prix: McLaren MP4/1, 1981."
  entrees:
  - "john-barnard"
  - "alan-jenkins"
  - "steve-nichols"
  - "harvey-postlethwaite"
  sources:
  - titre: "McLaren, “MP4/1”"
    url: "https://www.mclaren.com/racing/heritage/formula-1/cars/1981-formula-1-mclaren-mp4-1/"
