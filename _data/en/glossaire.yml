  - DRS
  definition: 'Drag reduction system: the driver opens a flap in the rear wing in a set zone, when behind another car, to gain speed on the straight. Introduced in 2011 in place of the F-duct, it was seen from the start as a stopgap for cars'' difficulty in following each other.'
