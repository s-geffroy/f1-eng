- id: "suspension-active"
  terme: "Active suspension"
  motifs:
  - "active suspension"
  definition: "Computer-controlled hydraulic actuators replace or supplement springs and dampers. Sensors measure the car's movements, and the control unit maintains the desired ride height and attitude. Banned after 1993."
  premiere: "Lotus 92, 1983 (the idea came from Cranfield, not from Lotus)."
  entrees:
