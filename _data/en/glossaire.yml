- id: "turbocompresseur"
  terme: "Turbocharger"
  motifs:
  - "turbocharger"
  - "turbocharging"
  definition: "A turbine driven by the exhaust gases spins a compressor, which forces more air into the cylinders: a small engine produces as much as a large one, or more. The 1966-1986 regulations balanced 1.5 litres turbocharged against 3 litres naturally aspirated; the turbo returned in 2014 in the hybrid power unit."
  premiere: "Renault RS01, 1977 British Grand Prix."
  entrees:
  - "bernard-dudot"
  - "francois-castaing"
  - "jean-terramorsi"
  - "gordon-murray"
  - "andy-cowell"
