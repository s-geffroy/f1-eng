    url: "https://www.motorsportmagazine.com/database/championships/f1/1981-f1-world-championship"
- id: "fond-plat"
  terme: "Flat bottom"
  motifs:
  - "flat bottom"
  definition: "A regulatory requirement, from 1983 onwards, for a flat underside of the car between the wheels. It does away with the wing profiles under the sidepods and with the skirts, and therefore with tunnel ground effect; the rear diffuser remains permitted."
  premiere: "1983, decision announced on 3 November 1982."
  entrees:
  - "gordon-murray"
  sources:
  - titre: "Motor Sport Magazine, “F1's race to the flat bottom” (May 2013)"
    url: "https://www.motorsportmagazine.com/archive/article/may-2013/82/flat-race/"
  - titre: "Formula 1, “TECH TUESDAY: France flashback – how F1 looked in 1990”"
    url: "https://www.formula1.com/en/latest/article/tech-tuesday-france-flashback-how-f1-looked-in-1990.1ysdfhQzeImE2IeqokCeQG"
- id: "voiture-aile"
  terme: "Wing car"
  motifs:
  - "wing car"
  definition: "A car whose entire bodywork, and above all its sidepods, is shaped like an inverted wing to produce downforce without add-on wings. It is the conceptual step that leads to ground effect."
  premiere: "An unrealised BRM project in 1969, then the Lotus 78 in 1977."
  entrees:
  - "peter-wright"
  - "tony-rudd"
  - "tony-southgate"
  - "ralph-bellamy"
  sources:
