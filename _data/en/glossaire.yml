# Technical glossary (page /en/glossary/). Sourced definitions. motifs: expressions
# linked at their first mention in the text of the entries (linking script).
- id: "appui"
  terme: "Downforce"
  motifs:
  - "downforce"
  definition: "Vertical force produced by the air, which presses the car onto the track. It comes from the wings or from the underside of the car, and increases cornering grip at the cost of drag on the straights."
  entrees:
  - "peter-wright"
  - "tony-rudd"
  - "tony-southgate"
  - "rory-byrne"
  sources:
  - titre: "Formula 1, glossary A-E"
    url: "https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2"
  - titre: "Motor Sport Magazine, “Something in the air” (July 2014)"
    url: "https://www.motorsportmagazine.com/archive/article/july-2014/149/something-air/"
- id: "effet-de-sol"
  terme: "Ground effect"
  motifs:
  - "ground effect"
  definition: "Downforce no longer comes only from the wings but from the underside of the car: an air passage is formed there that narrows then widens, where the air accelerates and its pressure drops, sucking the car towards the track. The process is only effective if the sides are sealed by skirts. It was banned progressively between 1981 and 1983, returned in 2022 in the form of tunnels, then was toned down by the flatter floors of 2026."
  premiere: "Lotus 78, 1977, according to Motor Sport."
  entrees:
  - "colin-chapman"
  - "peter-wright"
  - "tony-rudd"
  - "ralph-bellamy"
  - "martin-ogilvie"
  - "tony-southgate"
  sources:
  - titre: "Formula 1, “TECH TUESDAY: The Lotus 79, F1's ground effect marvel”"
    url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw"
  - titre: "Formula 1, glossary F-J"
    url: "https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX"
  - titre: "Motor Sport Magazine, “Something in the air” (July 2014)"
    url: "https://www.motorsportmagazine.com/archive/article/july-2014/149/something-air/"
- id: "venturi"
  terme: "Venturi"
  motifs:
  - "venturi"
  definition: "A duct that narrows then flares out: according to Bernoulli's principle, the air accelerates in it and its pressure falls. In F1, these are the channels formed under the sidepods or under the floor, which open at the rear into the diffuser. It is the physical engine of ground effect."
  entrees:
  - "rory-byrne"
  sources:
  - titre: "Formula 1, “TECH TUESDAY: The Lotus 79, F1's ground effect marvel”"
    url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw"
  - titre: "Formula 1, glossary F-J"
    url: "https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX"
- id: "jupes"
  terme: "Skirts"
  motifs:
  - "skirts"
  definition: "Panels that extend from the sides of the sidepods down to the ground, to stop outside air from filling the low-pressure zone under the car. They had to slide vertically to follow the bumps. Sliding skirts were banned in 1981."
  entrees:
  - "ralph-bellamy"
  - "colin-chapman"
  sources:
  - titre: "Motor Sport Magazine, “Lotus 78: F1's first true ground effect car” (February 2020)"
    url: "https://www.motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
