- id: "rappel-pneumatique"
  terme: "Pneumatic valve springs"
  motifs:
  - "pneumatic valve"
  definition: "The metal spring that closes each valve is replaced by a small volume of compressed gas. At very high revs, steel springs can no longer close the valves in time; gas, lighter and more responsive, allows the engine to rev much higher."
  premiere: "Renault EF15 B engine, 1986."
  entrees:
  - "bernard-dudot"
  sources:
  - titre: "Renault, “30 ans de Formule 1”"
    url: "https://cdn.group.renault.com/ren/master/renault-classic/tools-and-services/30AnsDeFormule1.pdf"
- id: "flat-12"
  terme: "Flat-12"
  motifs:
  - "flat-12"
  definition: "A twelve-cylinder engine whose two banks lie flat, facing each other (a 180° V). Very low, it lowers the centre of gravity and clears the airflow towards the rear wing, but it is wide and gets in the way of ground effect tunnels."
  entrees:
  - "mauro-forghieri"
  - "franco-rocchi"
  - "gordon-murray"
  sources:
