- id: "diffuseur"
  terme: "Diffuser and double diffuser"
  motifs:
  - "double diffuser"
  - "diffuser"
  definition: "The diffuser is the upswept rear section of the floor: it slows down and evacuates the air that has passed under the car, which lowers the pressure underneath and creates downforce. The 2009 double diffuser exploited an ambiguity in the regulations to feed a second deck; it was banned from 2011."
  premiere: "Double diffuser: 2009, at Brawn, Toyota and Williams."
  entrees:
  - "ross-brawn"
  - "adrian-newey"
  sources:
