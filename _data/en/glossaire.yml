- id: "groupe-propulseur-hybride"
  terme: "Hybrid power unit"
  motifs:
  - "hybrid power unit"
  definition: "Since 2014, a 1.6-litre turbo V6 combined with electrical energy recovery stored in a battery. The MGU-K recovers energy under braking; the MGU-H, dropped in 2026, recovered it from the heat of the exhaust gases. Mercedes' split turbo places the turbine and the compressor at the two ends of the engine."
  premiere: "2014."
  entrees:
