- id: "suspension-progressive"
  terme: "Rising-rate suspension"
  motifs:
  - "rising-rate"
  definition: "Through an arrangement of links and rockers, the spring and damper are compressed more and more as the wheel rises: the suspension stays soft at first and stiffens under load. Sources disagree on the first F1 car to use it."
  entrees:
  - "ralph-bellamy"
  sources:
  - titre: "Keith Howard, Motor Sport Magazine, “X-ray spec : McLaren M19” (January 2005)"
    url: "https://www.motorsportmagazine.com/archive/article/january-2005/64/x-ray-spec-mclaren-m19/"
