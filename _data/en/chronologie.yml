# Timeline of innovations (page /en/timeline/).
# Each milestone restates a fact already checked and sourced in the entries cited
# (the sources are in those entries). Fields:
#   id       : anchor (#j-<id>)
#   annee    : position on the timeline
#   voie     : architecture | aero | moteur | transmission | methode
#   titre    : short title
#   texte    : one or two sentences
#   entrees  : entry identifiers (_engineers/<id>.md)
#   sources  : list of { titre, url }, when the facts are not already sourced
#              in an entry (optional; entries or sources are required)
#   termes   : glossary identifiers (_data/en/glossaire.yml), optional

voies:
  - id: "architecture"
    nom: "Architecture and structure"
  - id: "aero"
    nom: "Aerodynamics"
  - id: "moteur"
    nom: "Engine"
  - id: "transmission"
    nom: "Transmission and electronics"
  - id: "methode"
    nom: "Method and racing"

# Context events (below the axis, shown on request): not innovations, but what
# explains them. Each event has its own sources.
#   categorie : reglement | securite | economie | technologie
#               world context: geopolitique | economie-mondiale | autres-sports | societe
#   liens     : cause-and-effect links with milestones (optional), each:
#                 jalon     : milestone identifier, or
#                 evenement : identifier of another context event (mechanism: declenche), or
#                 ecurie    : team identifier (_data/ecuries.yml)
#                 mecanisme : ouvre | ferme | contourne | transfert | provoque | declenche
#                 preuve    : atteste | etabli | discute | chronologique
#                 pourquoi  : one sentence, what connects the two and per which source
#               Method: _features/causalite.md.
#   sources   : list of { titre, url }
categories:
  - id: "reglement"
    nom: "Regulations"
  - id: "securite"
    nom: "Safety"
  - id: "economie"
    nom: "Economics"
  - id: "technologie"
    nom: "Technology"
  # World context (group "monde"): outside F1, what frames it.
  - id: "geopolitique"
    nom: "Geopolitics"
    groupe: "monde"
  - id: "economie-mondiale"
    nom: "World economy"
    groupe: "monde"
  - id: "autres-sports"
    nom: "Other sports"
    groupe: "monde"
  - id: "societe"
    nom: "Society"
    groupe: "monde"

# Mechanisms and levels of evidence of the links (see _features/causalite.md).
mecanismes:
  - id: "ouvre"
    nom: "Opens"
    cote_contexte: "opens the way to"
    cote_jalon: "made possible by"
  - id: "ferme"
    nom: "Closes"
    cote_contexte: "ends"
    cote_jalon: "ended by"
  - id: "contourne"
    nom: "Circumvents"
    cote_contexte: "circumvented by"
    cote_jalon: "circumvents"
  - id: "transfert"
    nom: "Transfers"
    cote_contexte: "inspires"
    cote_jalon: "borrows from"
  - id: "provoque"
    nom: "Provokes"
    cote_contexte: "provoked by"
    cote_jalon: "provokes"
  - id: "declenche"
    nom: "Triggers"
    cote_contexte: "triggers"
    cote_jalon: "triggered by"
preuves:
  - id: "atteste"
    nom: "attested"
    definition: "the designer or a direct witness states the link, and no source contradicts it"
  - id: "etabli"
    nom: "established"
    definition: "a regulation or a serious historical source asserts it"
  - id: "discute"
    nom: "disputed"
    definition: "the sources disagree, or the link is indirect"
  - id: "chronologique"
    nom: "chronological"
    definition: "only precedence is established"

jalons:
  - id: "lancia-d50"
    annee: 1954
    voie: "architecture"
    titre: "The stressed engine of the Lancia D50"
    texte: "The D50's V8 serves as a structural member of the chassis, mounted at an angle so that the transmission passes to the left of the driver. A Lancia team led by Vittorio Jano defines its principles."
    entrees: ["vittorio-jano", "ettore-zaccone-mina"]
    termes: ["moteur-porteur"]

  - id: "cooper-argentine"
    annee: 1958
    voie: "architecture"
    titre: "First win for a mid-engined car"
    texte: "Stirling Moss wins in Argentina in a Cooper with a curved-tube chassis. It is the first world championship Grand Prix win for a mid-engined car."
    entrees: ["owen-maddock", "john-cooper"]
    termes: ["moteur-central-arriere", "chassis-tubulaire"]

  - id: "cooper-titres"
    annee: 1959
    voie: "architecture"
    titre: "The rear engine takes over"
    texte: "Cooper's titles in 1959 and 1960 quickly make the front-engine layout obsolete. Owen Maddock is the team's chief designer."
    entrees: ["john-cooper", "owen-maddock"]
    termes: ["moteur-central-arriere"]

  - id: "lotus-25"
    annee: 1962
    voie: "architecture"
    titre: "The aluminium monocoque of the Lotus 25"
    texte: "Under Colin Chapman's direction, Lotus establishes the aluminium monocoque in F1, which would replace the spaceframe chassis as the reference architecture."
    entrees: ["colin-chapman", "mike-costin", "alan-styman"]
    termes: ["monocoque", "chassis-tubulaire"]

  - id: "dfv"
    annee: 1967
    voie: "moteur"
    titre: "The Cosworth DFV and the Lotus 49"
    texte: "The compact, stressed DFV forms the rear part of the Lotus 49. Available to many teams, it wins 155 Grands Prix, derivative versions included (154 according to GrandPrix.com)."
    entrees: ["keith-duckworth", "mike-costin", "colin-chapman"]
    termes: ["moteur-porteur"]

  - id: "ailerons"
    annee: 1968
    voie: "aero"
    titre: "Wings on struts"
    texte: "At the Belgian Grand Prix, Mauro Forghieri has wings on struts fitted to Chris Amon's Ferrari; Amon takes pole. Others had used them before him."
    entrees: ["mauro-forghieri"]
    termes: ["aileron"]

  - id: "ferrari-312t"
    annee: 1975
    voie: "transmission"
    titre: "The transverse gearbox of the Ferrari 312T"
    texte: "According to formula1.com, F1's first transverse gearbox, serving mass centralisation, subsequently adopted by the whole grid; Motor Sport points out that Tyrrell and March had opened the way in 1972."
    entrees: ["mauro-forghieri", "franco-rocchi"]
    termes: ["boite-transversale", "centralisation-des-masses"]

  - id: "lotus-78"
    annee: 1977
    voie: "aero"
    titre: "The ground effect of the Lotus 78"
    texte: "Born of research by Peter Wright and Tony Rudd, the first ground effect F1 car, according to Motor Sport, is designed by Ralph Bellamy, with Martin Ogilvie on suspension, in a programme led by Colin Chapman."
    entrees: ["peter-wright", "tony-rudd", "ralph-bellamy", "martin-ogilvie", "colin-chapman", "tony-southgate"]
    termes: ["effet-de-sol", "venturi", "jupes"]

  - id: "bt46b"
    annee: 1978
    voie: "aero"
    titre: "The fan car"
    texte: "The Brabham BT46B, designed under Gordon Murray's direction, wins the Swedish Grand Prix, its only race. Sources disagree on what followed: voluntary withdrawal by Brabham, or a ban by the sporting authority."
    entrees: ["gordon-murray", "david-north"]
    termes: ["voiture-a-ventilateur"]

  - id: "turbo-victoire"
    annee: 1979
    voie: "moteur"
    titre: "First win for a turbo engine"
    texte: "Renault wins the French Grand Prix. The engine derives from the V6 designed by François Castaing and Jean-Pierre Boudy; Bernard Dudot leads the engine programme."
    entrees: [francois-castaing, bernard-dudot, jean-terramorsi, jean-pierre-boudy]
    termes: ["turbocompresseur"]

  - id: "mp4-1"
    annee: 1981
    voie: "architecture"
    titre: "The carbon monocoque of the McLaren MP4/1"
    texte: "The first F1 car with a full carbon composite monocoque to race in a Grand Prix, designed by John Barnard with a team that included Steve Nichols and Alan Jenkins."
    entrees: ["john-barnard", "steve-nichols", "alan-jenkins"]
    termes: ["composite-carbone", "monocoque"]

  - id: "ravitaillement"
    annee: 1982
    voie: "methode"
    titre: "Tactical refuelling"
    texte: "Brabham and Gordon Murray reintroduce refuelling as a racing weapon. Riccardo Patrese takes on four tyres and 24 gallons in 15.6 seconds."
    entrees: ["gordon-murray"]
    termes: ["ravitaillement"]

  - id: "bt52"
    annee: 1983
    voie: "moteur"
    titre: "First world champion with a turbo engine"
    texte: "Designed in six weeks according to Mark Hughes, in three months according to Gordon Murray, after the compulsory flat bottom was announced, banning ground effect underbodies and skirts, the Brabham BT52 takes Nelson Piquet to the title."
    entrees: [gordon-murray, paul-rosche]
    termes: ["turbocompresseur"]
    sources:
      - titre: "Motor Sport, Keith Howard, “Harnessing the power” (January 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/january-2001/40/harnessing-the-power/"
      - titre: "Formula1.com, Mark Hughes, “TECH TUESDAY: The ground-breaking Brabham BT52” (August 2018)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-ground-breaking-brabham-bt52.64UP95DePCCSQ8cm0oAMUK"

  - id: "lotus-92-active"
    annee: 1983
    voie: "transmission"
    titre: "Active suspension in racing"
    texte: "Lotus's active suspension, developed by Peter Wright from Cranfield's work (David Williams), is used on Nigel Mansell's Lotus 92 in the first two races of the season."
    entrees: ["peter-wright"]
    termes: ["suspension-active"]

  - id: "rappel-pneumatique"
    annee: 1986
    voie: "moteur"
    titre: "Pneumatic valve springs"
    texte: "Introduced on the Renault EF15 B engine, they are, according to Renault, fitted to every F1 engine from the 1990s onwards."
    entrees: [bernard-dudot, jean-pierre-boudy]
    termes: ["rappel-pneumatique"]

  - id: "active-gagne"
    annee: 1987
    voie: "transmission"
    titre: "Active suspension wins"
    texte: "Ayrton Senna's Lotus 99T becomes the first F1 car with active suspension to win a Grand Prix; the Williams system designed by Frank Dernie wins at Monza with Nelson Piquet."
    entrees: ["peter-wright", "frank-dernie"]
    termes: ["suspension-active"]

  - id: "ferrari-640"
    annee: 1989
    voie: "transmission"
    titre: "The semi-automatic gearbox on the steering wheel"
    texte: "On the Ferrari 640, John Barnard introduces the paddle-shift gearbox: no more gear lever, hands on the wheel, a more compact cockpit."
    entrees: ["john-barnard"]
    termes: ["boite-semi-automatique"]

  - id: "v10-renault"
    annee: 1989
    voie: "moteur"
    titre: "The Renault V10"
    texte: "The 67° V10 designed under the direction of Bernard Dudot establishes, according to Renault, the V10 architecture across the whole grid."
    entrees: ["bernard-dudot"]

  - id: "tyrrell-019"
    annee: 1990
    voie: "aero"
    titre: "The raised nose"
    texte: "Harvey Postlethwaite and Jean-Claude Migeot's Tyrrell 019 raises the nose to feed more air under the car; Adrian Newey's Leyton House does the same that year."
    entrees: [jean-claude-migeot, harvey-postlethwaite, adrian-newey, mike-gascoyne]
    termes: ["nez-releve"]

  - id: "fw14b"
    annee: 1992
    voie: "transmission"
    titre: "The active suspension title"
    texte: "The Williams FW14B takes Nigel Mansell to the title, with an active suspension whose software was largely written by Paddy Lowe."
    entrees: ["paddy-lowe", "steve-wise", "patrick-head", "adrian-newey"]
    termes: ["suspension-active"]

  - id: "programme-anticipe"
    annee: 1993
    voie: "methode"
    titre: "The programme started a year ahead"
    texte: "At Benetton, Ross Brawn has design work on the 1994 car begin at the start of 1993, which, by his account, was almost unheard of."
    entrees: ["ross-brawn", "rory-byrne"]

  - id: "double-diffuseur"
    annee: 2009
    voie: "aero"
    titre: "The double diffuser of the Brawn BGP 001"
    texte: "Begun at Honda, the BGP 001 exploits a loophole in the new regulations; the double-deck floor concept came from a Japanese engineer."
    entrees: ["ross-brawn"]
    termes: ["diffuseur"]

  - id: "hybride"
    annee: 2014
    voie: "moteur"
    titre: "The Mercedes hybrid power unit"
    texte: "A split turbo on either side of the engine, integration with the chassis: Mercedes dominates the hybrid era, imposed by the regulations."
    entrees: ["andy-cowell", "aldo-costa", "ross-brawn"]
    termes: ["groupe-propulseur-hybride"]

  - id: "rendement-50"
    annee: 2017
    voie: "moteur"
    titre: "50% thermal efficiency"
    texte: "The Mercedes engine, at 44% efficiency in 2014, passes the 50% mark on the dyno for the first time."
    entrees: ["andy-cowell"]
    termes: ["groupe-propulseur-hybride"]

  - id: "cooper-500"
    annee: 1946
    voie: "architecture"
    titre: "The engine behind the driver, in 500cc racing"
    texte: "The prototype built by John Cooper and Eric Brandon places the engine in the middle, \"for largely practical reasons\". The layout would make its way to F1."
    entrees: ["john-cooper"]
    termes: ["moteur-central-arriere"]

  - id: "dfv-fva"
    annee: 1966
    voie: "moteur"
    titre: "The Cosworth FVA"
    texte: "According to Motor Sport, it is Keith Duckworth's first clean-sheet design, although this Formula 2 four-cylinder is based on the Ford Cortina block; it paves the way for the DFV."
    entrees: ["keith-duckworth", "mike-costin"]

  - id: "lotus-72"
    annee: 1970
    voie: "aero"
    titre: "The Lotus 72 and its side radiators"
    texte: "Credited to Maurice Philippe and Colin Chapman, whose respective shares remain disputed, it places the radiators on the flanks; in its successive versions, it wins five world titles and 20 Grands Prix according to Lotus (22 according to Classic Team Lotus)."
    entrees: ["colin-chapman", "maurice-philippe"]

  - id: "lotus-88"
    annee: 1981
    voie: "aero"
    titre: "The twin-chassis Lotus 88"
    texte: "Two separately sprung bodies: the concept, in which Peter Wright played a key part, is protested and the car never races."
    entrees: ["colin-chapman", "peter-wright"]
    termes: ["effet-de-sol"]

  - id: "mp4-2"
    annee: 1984
    voie: "moteur"
    titre: "The engine built to the chassis' dimensions"
    texte: "For the McLaren MP4/2, John Barnard dictates to Porsche the dimensions of the TAG V6 turbo to suit the aerodynamics; the car wins 12 of the 16 races."
    entrees: ["john-barnard"]
    termes: ["turbocompresseur"]

  - id: "march-881"
    annee: 1988
    voie: "aero"
    titre: "The integrated nose of the March 881"
    texte: "Adrian Newey fully integrates the nose and front wing, hollowed out underneath to feed more air to the floor."
    entrees: ["adrian-newey"]
    termes: ["aileron"]

  - id: "mp4-4"
    annee: 1988
    voie: "architecture"
    titre: "The McLaren MP4/4, fifteen wins out of sixteen"
    texte: "The McLaren MP4/4 wins 15 of the 16 races of 1988. Its authorship is still disputed: Steve Nichols, its chief designer, sees it as an evolution of the MP4/3; Gordon Murray contests that account. Autosport also names Bob Bell, David North and Matthew Jeffreys among its authors."
    entrees: [steve-nichols, gordon-murray, bob-bell, david-north, matthew-jeffreys]
    sources:
      - titre: "Autosport, Gary Watkins, “The origins of McLaren-Honda's greatest racer” (August 2017)"
        url: "https://www.autosport.com/f1/news/the-origins-of-mclaren-hondas-greatest-racer-5102252/5102252/"

  - id: "fw17b"
    annee: 1995
    voie: "aero"
    titre: "The raised diffuser of the Williams FW17B"
    texte: "Introduced at the end of 1995, this diffuser with a raised exit becomes a major asset of the 1996 Williams."
    entrees: ["adrian-newey"]
    termes: ["diffuseur"]

  - id: "rb6"
    annee: 2010
    voie: "aero"
    titre: "The blown diffuser of the Red Bull RB6"
    texte: "According to formula1.com, Adrian Newey \"reinvents\" the exhaust-blown diffuser, with Renault's engine maps."
    entrees: ["adrian-newey"]
    termes: ["diffuseur"]

  - id: "tyrrell-p34"
    annee: 1976
    voie: "aero"
    titre: "The six-wheeled Tyrrell P34"
    texte: "Derek Gardner's P34 is the only six-wheeled car to start a Grand Prix. According to Gardner and Motor Sport, its aim was not to reduce frontal area but to increase downforce: four small front wheels generate less lift than two large ones. At Anderstorp, nobody beat it."
    entrees: [derek-gardner]
    termes: [appui]
    sources:
      - titre: "Motor Sport, Andrew Frankel, “Two too many” (February 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2001/42/two-too-many"
      - titre: "Motor Sport, Nigel Roebuck, “When six worked better than four” (February 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"

  - id: "donnees-tyrrell"
    annee: 1978
    voie: "methode"
    titre: "Data enters car set-up"
    texte: "From Goodyear's racing division, Karl Kempf fitted the Tyrrells with sensors whose readings, recorded on cassette, were used for set-up. He does not claim to have been the first to measure: with Tyrrell and Ferrari, \"we're the first to actually use the measurements on a regular basis\"; the date varies between sources."
    entrees: []
    termes: [acquisition-de-donnees]
    sources:
      - titre: "Racer, Mark Glendenning, “Tales of the tape: Early adventures in F1 data logging” (April 2024)"
        url: "https://racer.com/2024/04/04/tales-of-the-tape-early-adventures-in-f1-data-logging/"
      - titre: "Jalopnik, Elizabeth Blackstock, “Formula One Telemetry: Explained” (December 2020)"
        url: "https://jalopnik.com/formula-one-telemetry-explained-1845819678/"

  - id: "telemetrie-course"
    annee: 1986
    voie: "methode"
    titre: "Telemetry in the race"
    texte: "At Williams-Honda, engineers followed the instrument readings from the pits during the race. Derived from a data logger developed from mid-1985 by Honda's electronics team, the system was soon copied by the other teams and became standard equipment; Honda presents Williams-Honda as the first F1 team to use it, while McLaren traces its own telemetry back to 1975, in IndyCar."
    entrees: []
    termes: [acquisition-de-donnees]
    sources:
      - titre: "Motor Sport, “Williams FW11 – Honda RA163FV6” (January 1987)"
        url: "https://www.motorsportmagazine.com/archive/article/january-1987/49/williams-fw11-honda-ra163fv6"
      - titre: "Honda, “What Telemetry Said About Nigel Mansell” (manufacturer's site, undated)"
        url: "https://global.honda/en/mansell/Telemetry/"
      - titre: "Honda, “1986 RA166E” (manufacturer's site, undated)"
        url: "https://global.honda/en/POWEREDbyHONDA/1986_ra166e/"
      - titre: "McLaren, Chris Alexander, “A brief history of computing in F1” (January 2016)"
        url: "https://www.mclaren.com/racing/team/a-brief-history-of-computing-in-f1-1052199/"

  - id: "cfd-benetton"
    annee: 1993
    voie: "methode"
    titre: "Computational fluid dynamics"
    texte: "At Benetton, aerodynamics stopped being purely empirical: from the late 1980s, a simplified calculation on a workstation studied pressure distribution on the rear wings. Who first used CFD in F1 is disputed: GrandPrix.com names Geoff Willis, at Leyton House in 1990; formula1.com describes it as only a research project at the time. In 1993 Benetton teamed up with Fluent, a CFD software company, as commercial codes improved."
    entrees: [geoff-willis]
    termes: [cao]
    sources:
      - titre: "Autosport, Pat Symonds, “How a dynamic design tool has grown in F1 importance” (March 2023)"
        url: "https://autosport.com/all/news/how-a-dynamic-design-tool-has-grown-in-f1-importance/10441847/"
      - titre: "Racecar Engineering, “Renault F1 extends Fluent relations” (May 2004)"
        url: "https://www.racecar.com/news/6225/motorsport/renault-f1-extends-fluent-relations"
      - titre: "GrandPrix.com, “Geoff Willis” (biographical profile, undated)"
        url: "https://www.grandprix.com/people/geoff-willis.html"
      - titre: "Formula1.com, “Tech Tuesday: France flashback – how F1 looked in 1990” (June 2018)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-france-flashback-how-f1-looked-in-1990.1ysdfhQzeImE2IeqokCeQG"

  - id: "boite-sans-coupure"
    annee: 2005
    voie: "transmission"
    titre: "The seamless-shift gearbox"
    texte: "On the BAR 007, Honda engaged the next gear while the previous one was still transmitting torque, with a one-way clutch for each gear; the average gain was 0.4s a lap. In 2008, every team had a similar system."
    entrees: []
    sources:
      - titre: "Motor Sport, Lawrence Butcher, “Honda's paradigm shifter that flew in the face of convention” (May 2020)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/hondas-paradigm-shifter-that-flew-in-the-face-of-convention"
      - titre: "Honda, “2005 | F1” (manufacturer's site, undated)"
        url: "https://global.honda/en/F1/2005"

  - id: "inerter"
    annee: 2005
    voie: "transmission"
    titre: "McLaren's inerter"
    texte: "Conceived at Cambridge by Malcolm Smith, this flywheel inside the suspension first raced on the McLaren that won in Spain, under the codename \"J-damper\". Formula1.com dates its first use to 1997, the year Smith conceived it according to Cambridge. Opened to every team in 2008, it remained standard equipment until it was banned in 2022."
    entrees: []
    termes: [inerter]
    sources:
      - titre: "University of Cambridge, “Secrets of the inerter revealed” (August 2008)"
        url: "https://www.cam.ac.uk/research/news/secrets-of-the-inerter-revealed"
      - titre: "Formula1.com, Mark Hughes and Giorgio Piola, “Tech Tuesday: How 2022's suspension overhaul could shuffle the competitive order” (February 2022)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-how-2022s-suspension-overhaul-could-shuffle-the-competitive.4PoTMQ9jbaWotbTdd4bp8j"

  - id: "kers"
    annee: 2009
    voie: "moteur"
    titre: "KERS wins in Hungary"
    texte: "Energy recovered under braking gave up to 60kW for 6.6 seconds a lap. Lewis Hamilton won in Hungary in the McLaren fitted with Mercedes' KERS, designed at Brixworth with Zytek: the first win for a car so equipped. According to Autosport, Mercedes made it the foundation of its 2014 power unit; Andy Cowell traces the start of \"serious\" electrification at Mercedes back to the 2007 decision to design its own KERS."
    entrees: [andy-cowell]
    termes: [kers]
    sources:
      - titre: "Formula1.com, “Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks” (February 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Autosport, Scott Mitchell, “The 2007 decision that built Mercedes' hybrid empire” (August 2019)"
        url: "https://www.autosport.com/f1/news/the-2007-decision-that-built-mercedes-hybrid-empire-5112574/5112574/"
      - titre: "Crash.net, Matt Salisbury, “Zytek revealed as McLaren KERS supplier” (2009)"
        url: "https://www.crash.net/f1/news/150836/1/zytek-revealed-as-mclaren-kers-supplier"

  - id: "simulateur"
    annee: 2009
    voie: "methode"
    titre: "The simulator replaces the track"
    texte: "With in-season testing banned, development moved from circuits to factories, where drivers lap in a virtual F1 car. McLaren, which had started its simulator as early as 1996 with Paddy Lowe and Martin Whitmarsh's backing, had a head start; Ferrari admitted in 2012 it had to catch up in virtual testing."
    entrees: [paddy-lowe]
    sources:
      - titre: "GrandPrix.com, Joe Saward, “Formula 1's virtual reality” (January 2009)"
        url: "https://www.grandprix.com/features/joe-saward/insight-formula-1s-virtual-reality.html"
