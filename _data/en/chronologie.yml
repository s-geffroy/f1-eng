  - id: "printemps-arabe-bahrein-2011"
    annee: 2011
    categorie: "geopolitique"
    titre: "The Arab Spring cancels the Bahrain Grand Prix"
    texte: "In February 2011, as protest spread across the Arab world and riots broke out in Manama, Crown Prince Salman bin Hamad Al Khalifa, the main force behind bringing F1 to the Gulf, called off the season-opening race: the country had to focus on “immediate issues of national interest” (Motor Sport, Rob Widdows). The World Motor Sport Council then gave it the October date planned for India, but the teams objected and Bahrain was dropped from the 2011 calendar; the race returned in 2012 despite the unrest (Motor Sport, Katy Fairman)."
    sources:
      - titre: "Motor Sport, Rob Widdows, “Bahrain GP is cancelled” (February 2011)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/bahrain-gp-cancelled/"
      - titre: "Motor Sport, Katy Fairman, “Desert storm: F1's biggest Bahrain Grand Prix controversies” (April 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/desert-storm-f1s-biggest-bahrain-grand-prix-controversies/"
  - id: "le-mans-hybride-2012"
    annee: 2012
    categorie: "autres-sports"
    titre: "First hybrid winner at Le Mans"
    texte: "On 17 June 2012 the Audi R18 e-tron quattro became the first hybrid car to win the Le Mans 24 Hours, ahead of the Toyota TS030 hybrids, which had led for a while (FIA WEC). Its V6 turbodiesel drove the rear wheels, and energy recovered under braking was returned through the front wheels; Audi stored it in a flywheel built by Williams Hybrid Power, Toyota in supercapacitors (Autosport, Gary Watkins). F1 had coined the KERS acronym in 2009; from 2014, energy recovery appears in both the F1 and LMP1 rulebooks (Motor Sport, Gary Watkins)."
    sources:
      - titre: "FIA WEC, “History made by Audi at Le Mans” (June 2012)"
        url: "https://www.fiawec.com/en/news/history-made-by-audi-at-le-mans/309"
      - titre: "Autosport, Gary Watkins, “Audi unveils hybrid R18 e-tron quattro” (February 2012)"
        url: "https://www.autosport.com/wec/news/97739/audi-unveils-hybrid-r18-etron-quattro"
      - titre: "Motor Sport, Gary Watkins, “Le Mans hybrids” (June 2012)"
        url: "https://www.motorsportmagazine.com/archive/article/june-2012/75/le-mans-hybrids/"
  - id: "formule-e-2014"
    annee: 2014
    categorie: "autres-sports"
    titre: "Formula E"
    texte: "On 13 September 2014 Formula E, the FIA's electric single-seater championship, ran its first race in Beijing, on a circuit laid out around the Olympic “Bird's Nest” stadium. Ten two-driver teams raced the same car, the Spark-Renault SRT_01E, built by Spark Racing Technology with a consortium including McLaren, Williams, Renault, Michelin and Dallara (FIA)."
    sources:
      - titre: "FIA, “Formula E 2014 - Beijing ePrix Preview” (September 2014)"
        url: "https://www.fia.com/news/formula-e-2014-beijing-eprix-preview"
  - id: "liberty-media-2017"
    annee: 2017
    categorie: "societe"
    titre: "Liberty Media buys Formula 1"
    texte: "On 23 January 2017 the US media group Liberty Media completed its acquisition of Formula 1, at an enterprise value of $8bn. Chase Carey became chief executive; Bernie Ecclestone, who had built the business over forty years, was named chairman emeritus and adviser to the board (Formula 1)."
    sources:
      - titre: "Formula 1, “Liberty completes F1 acquisition” (January 2017)"
        url: "https://www.formula1.com/en/latest/article/liberty-completes-f1-acquisition.3zzGTfOwC4OkEc8EAKMKKw"
  - id: "drive-to-survive-2019"
    annee: 2019
    categorie: "societe"
    titre: "“Drive to Survive” on Netflix"
    texte: "On 8 March 2019 Netflix released “Formula 1: Drive to Survive”, a ten-part documentary series on the 2018 season, from Melbourne to Abu Dhabi (Formula 1). In 2022 Stefano Domenicali credited it with an “incredible effect”, mainly on new audiences, and Liberty Media chief executive Greg Maffei cited US TV audience growth of 58 per cent in 2021 and a fan base four years younger on average (Autosport, Adam Cooper)."
    sources:
      - titre: "Formula 1, “Formula 1 and Netflix announce ‘Drive to Survive’” (February 2019)"
        url: "https://www.formula1.com/en/latest/article/formula-1-and-netflix-put-drive-to-survive-on-pole-position.7MyqMggwrYJ5qUxjj1igeB"
      - titre: "Autosport, Adam Cooper, “Domenicali: Drive to Survive has to add value for F1 to continue” (March 2022)"
        url: "https://www.autosport.com/f1/news/domenicali-drive-to-survive-has-to-add-value-for-f1-to-continue/8688678/"
  - id: "net-zero-2030"
    annee: 2019
    categorie: "societe"
    titre: "The “Net Zero 2030” pledge"
    texte: "On 12 November 2019 Formula 1 pledged to reach a net-zero carbon footprint by 2030, covering the cars, on-track activity and the rest of its operations; it relied for this on a hybrid power unit combined with advanced sustainable fuels (Formula 1). Its 2019 season had emitted 256,000 tonnes of CO2. In December 2020 the FIA delivered the first barrels of a 100% sustainable fuel to the engine manufacturers and aimed to make it mandatory with the next power unit architecture (FIA); the 2026 engines are to be the first to run on it (Formula 1, Lawrence Barretto)."
    liens:
      - evenement: "reglement-2026"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "Formula1.com (Lawrence Barretto) presents the 2026 sustainable fuels as a step in the Net Zero 2030 plan; the 2026 rules also pursue other aims, including attracting new engine manufacturers."
    sources:
      - titre: "Formula 1, “Formula 1 announces plan to be Net Zero Carbon by 2030” (November 2019)"
        url: "https://www.formula1.com/en/latest/article/formula-1-announces-plan-to-be-net-zero-carbon-by-2030.5IaX2AZHyy7jqxl6wra6CZ"
      - titre: "FIA, “FIA introduces sustainable fuel into Formula 1 and commits to becoming carbon neutral from 2021 and net zero by 2030” (December 2020)"
        url: "https://www.fia.com/news/fia-introduces-sustainable-fuel-formula-1-and-commits-becoming-carbon-neutral-2021-and-net-zero"
      - titre: "Formula 1, Lawrence Barretto, “Net Zero Carbon: How Formula 1 is going to meet this ambitious target by 2030” (September 2022)"
        url: "https://www.formula1.com/en/latest/article/net-zero-carbon-how-formula-1-is-going-to-meet-this-ambitious-target-by-2030.5QsK9NpYbz7pXp7423I3iJ"
  - id: "covid-2020"
    annee: 2020
    categorie: "geopolitique"
    titre: "The Covid-19 pandemic"
    texte: "In spring 2020 the Covid-19 pandemic forced the postponement of the season's first Grands Prix; on 20 March F1 launched a series of virtual Grands Prix on the F1 2019 game, featuring current drivers, starting with Bahrain on 22 March (Formula 1). On 27 May, to shield the championship from the expected impact of the pandemic, the World Motor Sport Council ratified a package by e-vote: the 2021 cost cap cut from $175m to $145m, wind-tunnel time scaled by championship position, and chassis and gearboxes frozen between 2020 and 2021 (Autosport, Luke Smith; Motor Sport, Jake Williams-Smith)."
    liens:
      - evenement: "plafond-budgetaire-2021"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "The cap, already set at $175m, was cut to $145m amid the economic chaos caused by Covid-19, with McLaren among those lobbying for it (Motor Sport, Jake Williams-Smith)."
      - evenement: "essais-aero-echelonnes-2021"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "Autosport (Luke Smith) places the aero-testing sliding scale in the package adopted to shield F1 from the pandemic, without saying that this particular measure answers the pandemic rather than a concern for competitive balance: the link remains indirect."
    sources:
      - titre: "Formula 1, “Formula 1 launches Virtual Grand Prix Series to replace postponed races” (March 2020)"
        url: "https://www.formula1.com/en/latest/article/formula-1-launches-virtual-grand-prix-series-to-replace-postponed-races.1znLAbPzBbCQPj1IDMeiOi"
      - titre: "Autosport, Luke Smith, “F1 News: Rule changes, reduced cost cap for 2021 approved by WMSC” (May 2020)"
        url: "https://www.autosport.com/f1/news/f1-news-rule-changes-reduced-cost-cap-for-2021-approved-by-wmsc-4982338/4982338/"
      - titre: "Motor Sport, Jake Williams-Smith, “$145m cost cap approved for F1 in 2021, with more limits on testing and development” (May 2020)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/145m-cost-cap-approved-for-f1-in-2021-with-more-limits-on-testing-and-development/"
  - id: "ukraine-2022"
    annee: 2022
    categorie: "geopolitique"
    titre: "The invasion of Ukraine and the end of the Russian Grand Prix"
    texte: "After Russia's invasion of Ukraine, Formula 1 judged it “impossible” to race in Russia in 2022, then announced on 3 March that it had terminated the promoter's contract: Russia would no longer have a Grand Prix (Formula 1). On 5 March Haas, “shocked and saddened” by the invasion, ended Nikita Mazepin's contract and Uralkali's title partnership with immediate effect, having already removed the sponsor's branding during the Barcelona test (Autosport, Lewis Duncan)."
    sources:
      - titre: "Formula 1, “Formula 1 terminates contract with Russian Grand Prix promoter” (March 2022)"
        url: "https://www.formula1.com/en/latest/article/formula-1-terminates-contract-with-russian-grand-prix-promoter.5geFNbONEePwRCSQj25Xg3"
      - titre: "Autosport, Lewis Duncan, “Haas F1 team splits with Mazepin, Uralkali after Ukraine invasion” (March 2022)"
        url: "https://www.autosport.com/f1/news/haas-f1-team-splits-with-mazepin-uralkali-after-ukraine-invasion/8717996/"
  - id: "etats-unis-2023"
    annee: 2023
    categorie: "societe"
    titre: "Three Grands Prix in the United States"
    texte: "In 2023 Formula 1 raced three times in the United States, at Austin, Miami and Las Vegas, against a single race in 2019; more than 800,000 spectators attended, against 268,000 at Austin four years earlier. Las Vegas, held for the first time that year, was the only event promoted directly by F1. According to Liberty Media, average race-weekend viewership on ESPN rose from 1.6 million in 2018 to 3.1 million in 2023 (Liberty Media)."
    sources:
      - titre: "Liberty Media, “Annual Report 2023”, letter to shareholders (April 2024)"
        url: "https://www.sec.gov/Archives/edgar/data/1560385/000110465924052088/tm242810d4_ars.pdf"
  - id: "film-f1-2025"
    annee: 2025
    categorie: "societe"
    titre: "“F1”, the Brad Pitt film"
    texte: "Filming began at the 2023 British Grand Prix: a fictional team, APXGP, had a garage between those of Ferrari and Mercedes, and its cars, Formula 2 machines modified by Mercedes, ran between the official sessions (Motor Sport). Directed by Joseph Kosinski, with Brad Pitt as Sonny Hayes and Lewis Hamilton among the producers, the film opened on 27 June 2025; shot during real Grand Prix weekends, it grossed more than $629 million worldwide, a record for a sports film (Apple)."
    sources:
      - titre: "Motor Sport, “Brad Pitt filming F1 movie at the British GP: latest on Silverstone shoot” (July 2023, updated July 2024)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/brad-pitt-filming-f1-movie-at-the-british-grand-prix-latest-on-silverstone-shoot/"
      - titre: "Apple TV Press, “Apple Original Films' blockbuster feature \"F1 The Movie\" […] to make global streaming debut on Friday, December 12, 2025” (October 2025)"
        url: "https://www.apple.com/tv-pr/news/2025/10/apple-original-films-blockbuster-feature-f1-the-movie-from-joseph-kosinski-to-make-global-streaming-debut-on-friday-december-12-2025"
  - id: "guerre-iran-2026"
    annee: 2026
    categorie: "geopolitique"
    titre: "The war on Iran empties the Gulf calendar"
    texte: "On 28 February 2026 the United States and Israel launched a military operation against Iran, whose missiles and drones then struck Bahrain, Saudi Arabia, Qatar and the UAE (Motor Sport, Dominic Tobin). On 14 March F1 announced that the Bahrain and Saudi Arabian Grands Prix would not take place in April, with no replacement races (Formula 1). In August Bahrain, the FIA, F1 and Malaysia agreed to stage the Bahrain Grand Prix at Sepang on 2–4 October, F1's first return to Malaysia since 2017 (Autosport, Ben Vinel). The race took place at Sepang on 2–4 October as the Bahrain Grand Prix in Malaysia (official F1 results)."
    sources:
