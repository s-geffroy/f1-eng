contexte:
  - id: "mosquito-radiateurs"
    annee: 1940
    categorie: "technologie"
    titre: "The Mosquito's wing-mounted radiators"
    texte: "The de Havilland Mosquito twin-engined aircraft first flew on 25 November 1940; its radiators were housed in the leading edges of the wings, between the fuselage and the engines, on an aircraft designed for the smallest possible frontal area. According to Motor Sport, Tony Rudd, a former Rolls-Royce aero engine man, remembered this installation when Lotus was looking for where to put the radiators of the future Lotus 78: buried in ducts, with the air exiting further back. The team wondered whether similar sidepods would produce downforce: a model section was tested upside down in the wind tunnel, and Imperial College sent word at Christmas: \"The Mosquito flies\"."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "atteste"
        pourquoi: "According to Doug Nye, Tony Rudd, a former Rolls-Royce aero engine man, remembered the Mosquito's radiators when Lotus was looking for where to put those of the Lotus 78."
    sources:
      - titre: "Motor Sport, Doug Nye, “Lotus 78: F1’s first true ground effect car” (February 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "de Havilland Aircraft Museum, “de Havilland DH98 Mosquito Prototype” (museum website, undated)"
        url: "https://www.dehavillandmuseum.co.uk/aircraft/de-havilland-dh98-mosquito-prototype/"
  - id: "formule-500"
    annee: 1946
    categorie: "reglement"
    titre: "The 500 Club's 500 cc formula"
    texte: "In December 1945, in Bristol, a group of enthusiasts formed the 500 Club and drew up a formula for small 500cc single-seaters suited to the straitened post-war times. Surrey garage owners Charles and John Cooper entered this formula with a prototype that sat the engine behind the driver, \"for practicality's sake as much as anything\", according to Motor Sport."
    liens:
      - jalon: "cooper-500"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The 500 Club's formula created the class for which the Coopers built their prototype; the source puts the rear engine down partly to practicality, without linking it to the rules (Damien Smith)."
    sources:
      - titre: "Motor Sport, Damien Smith, “One-pot dictator” (July 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/88/one-pot-dictator/"
  - id: "championnat-1950"
    annee: 1950
    categorie: "economie"
    titre: "The first World Championship"
    texte: "On 13 May 1950, the European Grand Prix at Silverstone opened the first world championship. Its rules were those of 1947: 4.5-litre normally aspirated engines, as before the war, or 1.5-litre supercharged engines inherited from the old voiturette class. The favourite car, the Alfa Romeo 158, was then thirteen years old: a pre-war design, born in 1937 as a voiturette, whose supercharged straight-eight produced about 350bhp (Mark Hughes; more than 400 according to David Tremayne). Against ageing Maseratis, ERAs, Talbots and Altas, Farina, Fagioli and Parnell gave Alfa Romeo the top three places."
    sources:
      - titre: "Formula 1, “10 fascinating facts about the very first F1 Grand Prix, held on this day 70 years ago” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/10-fascinating-facts-about-the-very-first-f1-grand-prix-held-on-this-day-70.14iQuQ4N2IbV93EZj4Ruuj"
      - titre: "Formula 1, David Tremayne, “Why is it called Formula 1 – and 12 other questions about the championship’s origins” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/why-is-it-called-formula-1-and-12-other-questions-about-the-championships.1GHeel6u4jga6hMpX2eFs1"
      - titre: "Formula 1, Mark Hughes, “Under the bodywork of the Alfa Romeo ‘Alfetta’ – 70 years after it won the first ever F1 race” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/under-bodywork-of-the-alfa-romeo-alfetta-70-years-after-it-won-the-first.3pnyQUiSHqUdEN3Dk85nnq.html"
  - id: "formule-2-championnat-1952"
    annee: 1952
    categorie: "reglement"
    titre: "The championship run to Formula Two rules"
    texte: "In 1952 and 1953, the world championship was run to Formula Two regulations, with 2-litre engines, except at the Indianapolis 500: the organisers otherwise feared too thin a field, and the choice opened the grid to more competitors. Ferrari dominated with Alberto Ascari, who won six of the seven races he entered in 1952. Formula One returned in 1954, with 2.5-litre engines."
    sources:
      - titre: "Wikipedia, “1952 Formula One season”"
        url: "https://en.wikipedia.org/wiki/1952_Formula_One_season"
      - titre: "Motor Sport Magazine, “1953 F1 World Championship” (database, undated)"
        url: "https://www.motorsportmagazine.com/database/championships/f1/1953-f1-world-championship"
  - id: "formule-2-5-litres"
    annee: 1954
    categorie: "reglement"
    titre: "The 2.5-litre formula"
    texte: "In 1954 a new Formula 1 for 2.5-litre engines came into force. It brought new cars of widely differing designs, including the Lancia D50 and the Mercedes W196, so different that it was hard to believe they met the same rules. The long, streamlined Mercedes combined a spaceframe chassis, fuel injection and desmodromic valves; it won 11 of its 14 races in 1954-55. The short Lancia carried its fuel in pannier tanks between the wheels, which kept the weight distribution steady as the fuel was used up and improved the aerodynamics; its V8, a structural part of the chassis, was offset by eight degrees to lower the driver."
    liens:
      - jalon: "lancia-d50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The D50 was designed for the new 1954 formula, which brought new cars of widely differing designs (Motor Sport, Chris Nixon)."
    sources:
      - titre: "Motor Sport Magazine, Chris Nixon, “Too good for their own good?” (April 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/april-2002/87/too-good-for-their-own-good/"
  - id: "jaguar-d-type-monocoque"
    annee: 1954
    categorie: "technologie"
    titre: "The Jaguar D-Type and the aircraft monocoque"
    texte: "The Jaguar D-Type, a sports car designed to race at the Le Mans 24 Hours from 1954, applied aircraft techniques: its aerodynamicist Malcolm Sayer came from the aircraft industry, at Bristol, and its riveted light-alloy monocoque centre section, elliptical and small in cross-section, combined rigidity with low drag. It won Le Mans in 1955, 1956 and 1957. Doug Nye lists it among the precedents of the Lotus 25 and recalls that the monocoque had been the main structural element in aviation for fifty years; in racing, however, the spaceframe remained the rule until 1962. At Lotus, Mike Costin, who came from the aircraft industry, advised on the riveted construction of the tub."
    liens:
      - jalon: "lotus-25"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "Doug Nye lists the D-Type among the monocoques that predate the Lotus 25, but Chapman said he had never seen one before his own; the aircraft-industry input came through Mike Costin, who advised on the riveted construction."
    sources:
      - titre: "Motor Sport, Doug Nye, “Colin Chapman: chassis pioneer” (March 2022)"
        url: "https://motorsportmagazine.com/archive/article/march-2022/23/colin-chapman-chassis-pioneer"
      - titre: "Motor Sport, John Tipler, “A new frame of reference” (May 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/"
      - titre: "Motor Sport, “How the Jaguar D-Type's wartime roots led to Le Mans dominance” (April 2023)"
        url: "https://motorsportmagazine.com/special-article/twice-around-the-clock/30/how-the-jaguar-d-types-wartime-roots-led-to-le-mans-dominance"
      - titre: "Motor Sport, Paul Fearnley, “Sarthe specific” (June 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/june-2004/38/sarthe-specific/"
  - id: "formule-2-1957"
    annee: 1957
    categorie: "reglement"
    titre: "The 1.5-litre Formula 2"
    texte: "From 1957 to 1960, a new Formula 2 limited engines to 1500cc. According to Motor Sport, it was \"a gift\" for the new mid-engined Cooper-Climax. Designed for this class, the Coopers became increasingly competitive in F1 as their engine approached the 2.5 litres allowed: with 2495cc, they were at least on a par with the best traditional designs."
    liens:
      - jalon: "cooper-argentine"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Moss's Cooper was an adapted F2 car, with its engine enlarged to 2 litres and configured for short races without pit stops (Mark Hughes)."
      - jalon: "cooper-titres"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Designed for the 1500cc Formula 2 limit, the Coopers were at least on a par with the best F1 cars once given a 2495cc engine (Motor Sport)."
    sources:
      - titre: "Formula1.com, Mark Hughes, “Argentina '58: Moss bluffs his way to victory – and ushers in new era” (April 2020)"
        url: "https://www.formula1.com/en/latest/article.argentina-58-moss-bluffs-his-way-to-victory-and-ushers-in-new-era.g34lnPj7q41eIAS0HbA9d.html"
      - titre: "Motor Sport, “From the archives – Cooper” (May 1991)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1991/29/from-the-archives-cooper/"
  - id: "carburant-commercial-1958"
    annee: 1958
    categorie: "reglement"
    titre: "Pump fuel made mandatory"
    texte: "In 1958 the rules replaced alcohol-based brews with pump fuel. Vanwall and BRM had not adapted their engines in time for the Argentine Grand Prix; without his Vanwall, Stirling Moss raced Rob Walker's small Cooper. The race was also cut to 80 laps, 313km instead of 400: because of the heat according to Goodwood, under the new FIA rules according to Motor Sport in 1958."
    liens:
      - jalon: "cooper-argentine"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "With no Vanwall engines adapted to the new fuel, Moss was free to drive Rob Walker's Cooper in Argentina (Mark Hughes)."
    sources:
      - titre: "Formula1.com, Mark Hughes, “Argentina '58: Moss bluffs his way to victory – and ushers in new era” (April 2020)"
        url: "https://www.formula1.com/en/latest/article.argentina-58-moss-bluffs-his-way-to-victory-and-ushers-in-new-era.g34lnPj7q41eIAS0HbA9d.html"
      - titre: "Motor Sport, “13. 1958 Argentinian GP: wily Moss wins with only one eye” (March 2025)"
        url: "https://www.motorsportmagazine.com/special-article/the-75-greatest-grands-prix/114/13-1958-argentinian-gp-wily-moss-wins-with-only-one-eye/"
      - titre: "Motor Sport, “The Argentine racing season” (March 1958)"
        url: "https://www.motorsportmagazine.com/archive/article/march-1958/17/the-argentine-racing-season/"
      - titre: "Goodwood, Russell Campbell, “Cooper T43: Formula 1's groundbreaking rear-engined winner” (May 2025)"
        url: "https://www.goodwood.com/grr/f1/cooper-t43-formula-1s-groundbreaking-rear-engined-winner/"
  - id: "formule-1-5-litres-1961"
    annee: 1961
    categorie: "reglement"
    titre: "The 1.5-litre formula"
    texte: "In 1961, only normally aspirated engines of up to 1,500 cc were allowed, with a minimum weight first set at 500 kg and then lowered to 450 kg. The British teams, who had hoped to keep the 1960 rules, struggled to find suitable engines for the start of the season. Ferrari, ready with the V6-engined 156, its first mid-engined single-seater, started as clear favourite and won five of the eight Grands Prix; Phil Hill was champion."
    sources:
      - titre: "Motor Sport Magazine, “1961 F1 World Championship” (database, undated)"
        url: "https://www.motorsportmagazine.com/database/championships/f1/1961-f1-world-championship"
      - titre: "Wikipedia, “1961 Formula One season”"
        url: "https://en.wikipedia.org/wiki/1961_Formula_One_season"
  - id: "carbone-farnborough"
    annee: 1963
    categorie: "technologie"
    titre: "Carbon fibre at the Royal Aircraft Establishment"
    texte: "In 1963, W. Watt, L. N. Phillips and W. Johnson developed at the Royal Aircraft Establishment in Farnborough a process that revealed the strength potential of carbon fibre. Patented by the UK Ministry of Defence and licensed notably to Rolls-Royce, it was then taken up by the aircraft industry. The link with the McLaren MP4/1 remains indirect: John Barnard, in whose mind the idea of a carbon tub was already percolating, says he made up his mind on seeing British Aerospace make the outer cowling of the Rolls-Royce RB211 jet engine as a carbon-fibre and aluminium-honeycomb sandwich. He wanted a narrow tub, to enlarge the ground-effect underbody, without losing stiffness; the MP4/1 won as early as the 1981 British Grand Prix."
    liens:
      - jalon: "mp4-1"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "John Barnard says he settled on carbon on seeing British Aerospace make a jet engine cowling in composite; the Farnborough process leads there only indirectly, through the aircraft industry."
    sources:
      - titre: "Times Higher Education, “Carbon fibre: how we failed to reap rewards” (July 1997)"
        url: "https://www.timeshighereducation.com/node/96469"
      - titre: "Science Museum Group, “William Johnson 1924 - 1986” (collection record, undated)"
        url: "https://collection.sciencemuseumgroup.org.uk/people/cp173043"
      - titre: "Motor Sport, James Elson, “John Barnard remembers his McLaren MP4/1 eureka moment” (September 2021)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/john-barnard-remembers-his-mclaren-mp4-1-eureka-moment"
      - titre: "Motor Sport, Rob Widdows, “Carbon natural” (May 2007)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2007/73/carbon-natural"
  - id: "chaparral-ailerons"
    annee: 1966
    categorie: "technologie"
    titre: "Chaparral's wings"
    texte: "In Can-Am and sports-prototype racing, Jim Hall's Chaparrals carried large strut-mounted wings from 1966, adjustable on the move, and moved the radiators into side pods. Starting from a first Chaparral 2 that suffered from lift, Hall wanted to go \"right on through zero\", towards downforce; a pedal flattened the wing to reduce drag on the straights, and its hub-mounted struts put the load on the wheels rather than the chassis. Chris Amon, driver of the winged Ferrari at Spa in 1968, was surprised that F1 had taken so long when these wings \"obviously worked\"; Goodwood considers that Colin Chapman borrowed Hall's side radiators for the Lotus 72."
    liens:
      - jalon: "ailerons"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "The Chaparrals had carried wings since 1966, as Chris Amon recalls, but no source says Ferrari took its cue from them: only precedence is established."
      - jalon: "lotus-72"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Goodwood considers that Colin Chapman borrowed Jim Hall's sidepod radiators for the Lotus 72, co-designed by Maurice Philippe; no testimony from the designers is cited in support."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, “1968 Belgian Grand Prix: Nigel Roebuck’s F1 Legends” (October 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/october-1998/18/legends-11/"
      - titre: "Goodwood, Damien Smith, “Winging it: When F1 really started to fly” (March 2025)"
        url: "https://www.goodwood.com/grr/f1/winging-it-when-f1-really-started-to-fly/"
      - titre: "Motor Sport, Paul Fearnley, “Chaparral and Jim Hall's techno brilliance: when America took the lead in racing innovation” (November 2003)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2003/38/jim-hall-its-safe-to-say-was-ahead-of-the-techno-game"
  - id: "formule-3-litres"
    annee: 1966
    categorie: "reglement"
    titre: "The \"return to power\": the 3-litre formula"
    texte: "In 1966 the capacity of normally aspirated engines doubled to 3 litres; announced three years earlier, the change nevertheless found many teams ill-prepared. With Coventry Climax having withdrawn at the end of 1965, the British teams lacked an engine sold to all: Cooper fell back on Maserati V12s, Lotus on a 2-litre Climax and then BRM's complex, heavy H16. Jack Brabham became champion with a Repco V8 derived from an Oldsmobile block, less powerful but reliable. The gap would be filled by the Cosworth DFV, funded by Ford to the tune of £100,000 at the initiative of Walter Hayes."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The switch to 3 litres and the withdrawal of Coventry Climax left the British teams without an engine sold to all: the DFV filled that gap (David Tremayne)."
    sources:
      - titre: "Motor Sport Magazine, “1966 F1 World Championship” (database, undated)"
        url: "https://www.motorsportmagazine.com/database/championships/f1/1966-f1-world-championship"
      - titre: "GrandPrix.com, David Tremayne, “The Father of the DFV” (January 2001), reproduced on walterhayes.co.uk"
        url: "https://walterhayes.co.uk/motorsport-article/the-father-of-the-dfv-grandprix-com-january-26th-20001/"
  - id: "stewart-campagne-securite"
    annee: 1966
    categorie: "securite"
    titre: "Jackie Stewart's Spa crash and safety campaign"
    texte: "At the 1966 Belgian Grand Prix, Jackie Stewart was trapped for a long time in his BRM, soaked in fuel, and had to be freed by Graham Hill and Bob Bondurant for lack of marshals. He then campaigned for safety, at first with little support from the circuits and the sporting authority; he called for full-face helmets, mandatory seat belts, medical facilities and, after Jim Clark's death in 1968, Armco barriers to keep cars away from trees. On the car side, he demanded seat belts in his BRM from 1967, when the rudimentary roll hoop, mandatory since 1961, was almost the only requirement."
    sources:
      - titre: "Motor Sport Magazine, “A year of living dangerously” (August 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/august-2010/46/a-year-of-living-dangerously/"
      - titre: "Formula 1, Katy Roberts, “5 crucial milestone moments in F1 safety technology” (May 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "formule-2-1600"
    annee: 1967
    categorie: "reglement"
    titre: "The 1.6-litre Formula 2"
    texte: "On 1 January 1967 a Formula 2 limited to 1600cc came into force, whose cylinder block had to come from a production car of which at least 500 had been built within 22 months. Cosworth answered with the FVA, designed around the Ford Cortina block. The joint project announced with Ford also covered an F1 engine: the DFV, made up of two FVA cylinder heads on a common block."
    liens:
      - jalon: "dfv-fva"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The FVA was designed for the 1600cc limit of the new Formula 2, which required a production block (Mike Doodson, Denis Jenkinson): Cosworth started from the Ford Cortina's (Denis Jenkinson)."
    sources:
      - titre: "Motor Sport, Mike Doodson, “Keith Duckworth” (January 1970)"
        url: "https://www.motorsportmagazine.com/archive/article/january-1970/41/keith-duckworth"
      - titre: "Motor Sport, Denis Jenkinson, “Prospects for Formula Two” (March 1967)"
        url: "https://www.motorsportmagazine.com/archive/article/march-1967/16/prospects-for-formula-two/"
  - id: "dfv-clients-1968"
    annee: 1968
    categorie: "economie"
    titre: "The DFV goes on general sale"
    texte: "For 1968, Lotus lost its exclusive use of the Ford-funded Cosworth DFV; Walter Hayes at Ford judged that the engine would kill the competition if it were not shared. Ken Tyrrell's Matra (a way of keeping Jackie Stewart with Ford) and McLaren were the first customers, and by 1969 two thirds of the cars on the grid used it. Compact, it also served as a stressed member of the chassis. Sold at an affordable price, it opened the so-called \"kit car\" era, in which teams without an engine maker combined their own chassis with a bought-in engine and a Hewland gearbox; it was 1975 before a car without a DFV won the title."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The end of Lotus's exclusivity, pushed for by Walter Hayes at Ford, made the DFV the engine of two thirds of the grid by 1969."
      - jalon: "tyrrell-p34"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "With the whole grid on the same engine, gearbox and tyres, Derek Gardner says Tyrrell needed \"an unfair advantage\": the six-wheeler (Andrew Frankel, Nigel Roebuck)."
    sources:
      - titre: "Motor Sport, “F1 non-championship races – Part two: the ’60s” (September 2008)"
        url: "https://www.motorsportmagazine.com/archive/article/september-2008/92/f1-non-championship-races-part-two-60s/"
      - titre: "Goodwood, “Thank Frankel It's Friday: The greatest engine of all” (October 2016)"
        url: "https://www.goodwood.com/grr/columnists/andrew-frankel/2016/10/thank-frankel-its-friday-the-greatest-engine-of-all/"
      - titre: "The Race, Gary Anderson, “The good, bad and ugly of Ford in F1” (February 2023)"
        url: "https://the-race.com/formula-1/gary-anderson-the-good-bad-and-ugly-of-ford-in-f1/"
      - titre: "Motor Sport, Andrew Frankel, “Two too many” (February 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2001/42/two-too-many"
      - titre: "Motor Sport, Nigel Roebuck, “When six worked better than four” (February 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"
  - id: "sponsors-1968"
    annee: 1968
    categorie: "economie"
    titre: "Advertising beyond the motor trade"
    texte: "F1, now more technical and more expensive, could no longer survive without sponsors. After historic backers such as Esso and BP left, the international rules on sponsorship were relaxed at the end of 1967: it was no longer restricted to motoring products. Team Lotus raced in 1968 in the colours of the Gold Leaf cigarette brand, owned by Imperial Tobacco, which restrictions on television advertising were pushing towards sport; red, white and gold replaced the national green and yellow. A Motor Sport reader, like Sports Car Digest, points out that Team Gunston's Brabhams wore a commercial livery as early as the South African Grand Prix on 1 January 1968. Teams could now raise funding from advertisers outside the motor trade."
    sources:
      - titre: "Sports Car Digest, “Gold Leaf Team Lotus: The Deal and the First Glory” (April 2024)"
        url: "https://sportscardigest.com/gold-leaf-team-lotus-the-deal-and-the-first-glory/"
      - titre: "Motor Sport, “Letters from readers, February 2004” (February 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2004/5/letters-readers-february-2004/"
  - id: "transmission-integrale-1968"
    annee: 1968
    categorie: "technologie"
    titre: "Four-wheel drive, from Indianapolis to F1"
    texte: "In 1968 Lotus raced a four-wheel-drive turbine car at Indianapolis; Derek Gardner, seconded to Lotus, handled its transmission, then worked on Matra's four-wheel-drive F1 car. Drivers struggled with the drivetrain's reactions on and off the throttle. USAC moved to ban turbines and four-wheel drive, and the principle never took hold in F1."
    liens:
      - jalon: "tyrrell-p34"
        mecanisme: "transfert"
        preuve: "atteste"
        pourquoi: "The four-front-wheel idea came in 1968 from four-wheel-drive problems at Indianapolis and Matra; dropped along with four-wheel drive, it was revived at Tyrrell for another purpose, downforce (Derek Gardner, quoted by Andrew Frankel and Nigel Roebuck)."
    sources:
      - titre: "Motor Sport, Andrew Frankel, “Two too many” (February 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2001/42/two-too-many"
      - titre: "Motor Sport, Nigel Roebuck, “When six worked better than four” (February 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"
  - id: "interdiction-ailerons-hauts"
    annee: 1969
    categorie: "reglement"
    titre: "High-mounted wings banned"
    texte: "Since 1968, Lotus had mounted its wings on long struts attached to the rear suspension, to put the downforce straight into the wheels, and every team followed, some adding a wing over the nose. At the 1969 Spanish Grand Prix, both works Lotus 49s crashed heavily after their wings failed. The CSI held an emergency session during the Monaco weekend and immediately banned non-regulation wings, despite teams arguing that their cars had been designed around them. Graham Hill won at Monaco with an improvised wedge-shaped tail; by the Dutch Grand Prix, teams were trying wings integrated into the bodywork."
    liens:
      - jalon: "ailerons"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "The ban followed directly from the wing failures on both works Lotus 49s at the 1969 Spanish Grand Prix."
      - jalon: "ailerons"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The CSI banned non-regulation wings, ending the wings on tall struts."
    sources:
      - titre: "Motor Sport Magazine, “1969 F1 World Championship” (database, undated)"
        url: "https://motorsportmagazine.com/database/championships/1969-f1-world-championship"
      - titre: "Goodwood, Damien Smith, “Winging it: When F1 really started to fly” (March 2025)"
        url: "https://www.goodwood.com/grr/f1/winging-it-when-f1-really-started-to-fly/"
  - id: "chaparral-2j"
    annee: 1970
    categorie: "technologie"
    titre: "The Chaparral 2J \"sucker car\""
    texte: "In Can-Am, the 1970 Chaparral 2J used two fans driven by an auxiliary engine to suck air from under the car. Jim Hall presented it as a response to the ban on hub-mounted wings for 1970; articulated skirts kept a narrow gap to the ground, and according to him the car cornered at almost 2g. Approved at first, it was excluded from the series after protests from rivals, who saw it as a movable aerodynamic device. Sources disagree on its link with the Brabham BT46B: Motor Sport presents it as the inspiration and quotes Gordon Murray (\"the basic concept, yes, it came from there\"), while Goodwood considers the influence uncertain."
    liens:
      - jalon: "bt46b"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Gordon Murray says the basic concept came from the Chaparral 2J (Motor Sport), but Goodwood considers the influence uncertain."
    sources:
      - titre: "Motor Sport, Adam Cooper, “Vacuum clean-up” (May 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1998/65/vacuum-clean"
      - titre: "Goodwood, Russell Campbell, “Too fast for Formula 1: the Brabham BT46B fan car” (May 2025)"
        url: "https://www.goodwood.com/grr/f1/too-fast-for-formula-1-the-brabham-bt46b-fan-car/"
      - titre: "Motor Sport, Paul Fearnley, “Chaparral and Jim Hall's techno brilliance: when America took the lead in racing innovation” (November 2003)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2003/38/jim-hall-its-safe-to-say-was-ahead-of-the-techno-game"
      - titre: "Motor Sport, “Can-Am 1970” (December 1970)"
        url: "https://www.motorsportmagazine.com/archive/article/december-1970/24/can-am-1970/"
      - titre: "Petroleum Museum, “Chaparral 2J” (museum website, undated)"
        url: "https://petroleummuseum.org/chaparral-2j/"
  - id: "imperial-tapis-roulant"
    annee: 1974
    categorie: "technologie"
    titre: "Imperial College's rolling-road wind tunnel"
    texte: "The Imperial College wind tunnel in London had a rolling road designed by John Stollery, a former aerodynamicist for Donald Campbell, which reproduced the ground moving under the model. Aeronautical testing made do with a fixed floor or a suspended model; it was in this tunnel that Peter Wright, in the mid-1970s, carried out the Lotus research that led to the Lotus 78, with some 400 hours of testing on quarter-scale models. The belt lifted under the sidepods, a sign of low pressure. According to Wright, Ferrari tried a copy of the 78 in a tunnel without a moving floor and concluded that the principle did not work."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "The rolling road, which reproduces the ground moving under the car, let Peter Wright carry out the research that led to the Lotus 78 in this tunnel (Gordon Kirby, Doug Nye)."
    sources:
      - titre: "Motor Sport, Gordon Kirby, “Lotus’s ground-effect revolution, part one” (October 2015)"
        url: "https://motorsportmagazine.com/articles/history/lotuss-ground-effect-revolution-part-one"
      - titre: "Motor Sport, Doug Nye, “Lotus 78: F1’s first true ground effect car” (February 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "Motor Sport, Gordon Cruickshank, “Venturi capitalists” (July 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/134/venturi-capitalists/"
  - id: "goodyear-monopole"
    annee: 1975
    categorie: "economie"
    titre: "Goodyear, sole tyre supplier"
    texte: "With Firestone gone, Goodyear supplied the whole F1 field from 1975 until Michelin arrived with Renault's turbo project in 1977, starting an intense tyre war. Tyrrell, contracted to Goodyear, got special 10-inch front tyres for the P34. But only one team used them: according to Derek Gardner, Goodyear focused its development on everyone else's tyres."
    liens:
      - jalon: "tyrrell-p34"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Sole supplier to the grid and under contract to Tyrrell, Goodyear agreed to make the small front tyres, compromising on 10 inches (Nigel Roebuck, Andrew Frankel)."
      - jalon: "tyrrell-p34"
        mecanisme: "ferme"
        preuve: "atteste"
        pourquoi: "As the only team on 10-inch tyres, Tyrrell watched Goodyear develop everyone else's: according to Derek Gardner, the six-wheeler's advantage evaporated, from 1976 according to Andrew Frankel, in 1977 according to Nigel Roebuck."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, “Compound fractures” (April 1997)"
        url: "https://www.motorsportmagazine.com/archive/article/april-1997/30/compound-fractures/"
      - titre: "Motor Sport, Nigel Roebuck, “When six worked better than four” (February 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"
      - titre: "Motor Sport, Andrew Frankel, “Two too many” (February 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2001/42/two-too-many"
  - id: "goodyear-mesure"
    annee: 1976
    categorie: "technologie"
    titre: "Goodyear wants measurements"
    texte: "At a Canadian Grand Prix, by 1977 at the latest, the new head of Goodyear's international racing division hired Karl Kempf, a mathematician who had interned at Goodyear during his PhD, with a mission: to build a data acquisition system for all Goodyear-shod cars, to \"bring some science to the art of motor racing\". The first package measured suspension, steering, throttle, brakes, revs and g-forces. Only Derek Gardner at Tyrrell and Mauro Forghieri at Ferrari really took it up."
    liens:
      - jalon: "donnees-tyrrell"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "Goodyear commissioned Karl Kempf's measurement system for all its teams; Tyrrell was one of the two that truly adopted it (Karl Kempf, quoted by Mark Glendenning)."
    sources:
      - titre: "Racer, Mark Glendenning, “Tales of the tape: Early adventures in F1 data logging” (April 2024)"
        url: "https://racer.com/2024/04/04/tales-of-the-tape-early-adventures-in-f1-data-logging/"
  - id: "renault-1977"
    annee: 1977
    categorie: "economie"
    titre: "Renault arrives with the turbo"
    texte: "Renault, with its oil partner Elf, entered the RS01 at the 1977 British Grand Prix with a 1.5-litre turbocharged six-cylinder, first proven in endurance racing in 2-litre form, against its rivals' 3-litre normally aspirated engines. Failures were frequent at first, thirteen in seventeen races, and its smoke earned the car the nickname \"Teapot\". But the RS10 won at Dijon in 1979, on a circuit whose altitude suited the turbo. In the early 1980s, faced with the power of the turbos, the teams still using the DFV relied on the chassis and ground effect, before adopting turbo engines in their turn."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "By entering the turbo in 1977, Renault and Elf gave themselves the means for the Dijon win two years later, despite the early failures."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, “1980s” (May 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Motor Sport Magazine, “Teapots, turbos and titles: Renault's wild F1 ride” (December 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
      - titre: "Motor Sport Magazine, “Renault blew it! The pioneering F1 turbo that failed Prost in title bid” (December 2024)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2024/38/renault-blew-it-the-pioneering-f1-turbo-that-failed-prost-in-title-bid/"
      - titre: "Goodwood, “Renault's RS01, the first turbocharged Formula 1 car”"
        url: "https://www.goodwood.com/grr/f1/renaults-rs01-turbocharged-formula-1/"
  - id: "ventilateur-ecarte-1978"
    annee: 1978
    categorie: "reglement"
    titre: "The fan car sidelined"
    texte: "In 1978 the rule banning movable aerodynamic devices allowed those whose primary purpose was not aerodynamic. The Brabham BT46B took advantage: its fan was presented as cooling the engine. Rival teams led by Colin Chapman protested even before the race in Sweden, and again after its win. Sources disagree on what followed: according to The Race and Goodwood, the CSI found the car legal and Bernie Ecclestone withdrew it himself, and Motor Sport also wrote of a voluntary withdrawal in 2025; according to Motor Sport in 1998, the CSI banned it \"on safety grounds\". The wording of the rules only changed in 1979."
    liens:
      - jalon: "bt46b"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "The fan exploited the 1978 allowance for movable devices whose primary purpose was not aerodynamic (Edd Straw): it followed the letter of the rules, if not their spirit (Goodwood)."
      - jalon: "bt46b"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "The BT46B drew protests from rival teams, before the Swedish race and again after its win, led by a furious Colin Chapman (Adam Cooper); the wording of the rules was changed for 1979 (The Race)."
      - jalon: "bt46b"
        mecanisme: "ferme"
        preuve: "discute"
        pourquoi: "The car never raced again after Sweden, but sources disagree: voluntary withdrawal by Ecclestone (The Race, Goodwood, Motor Sport in 2025) or a CSI ban \"on safety grounds\" (Motor Sport in 1998)."
    sources:
      - titre: "The Race, Edd Straw, “Nine things you may not know about Brabham's iconic F1 fan car” (December 2022)"
        url: "https://www.the-race.com/formula-1/nine-things-you-may-not-know-about-brabhams-iconic-f1-fan-car/"
      - titre: "Goodwood, Russell Campbell, “Too fast for Formula 1: the Brabham BT46B fan car” (May 2025)"
        url: "https://www.goodwood.com/grr/f1/too-fast-for-formula-1-the-brabham-bt46b-fan-car/"
      - titre: "Motor Sport, Adam Cooper, “Vacuum clean-up” (May 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1998/65/vacuum-clean"
      - titre: "Motor Sport, “The 75 greatest Grands Prix: 1978 Swedish GP” (March 2025)"
        url: "https://www.motorsportmagazine.com/special-article/the-75-greatest-grands-prix/6/75-1978-swedish-gp-brabham-fan-car-wins-its-one-and-only-race/"
  - id: "cranfield-commandes-de-vol"
    annee: 1980
    categorie: "technologie"
    titre: "From fly-by-wire controls to active suspension"
    texte: "A Lotus partner since 1976 for instrumenting cars in testing, the Cranfield Institute of Technology developed synthetic springs for the artificial-feel control column of a fly-by-wire research aircraft. In 1980, Lotus could no longer control the downforce of its ground-effect cars, four times that of the Lotus 79: the \"porpoising\" of the Lotus 80 reminded Professor David Williams of wing flutter in aircraft. He then offered Peter Wright his springs, computer-controlled hydraulic rams that held the ride height: they gave Lotus its active suspension, racing from 1983 on the Lotus 92. The Williams system, for its part, derived from a road system by Automotive Products."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "In 1980, Professor David Williams of Cranfield offered Peter Wright the principle of the synthetic springs designed for a fly-by-wire aircraft (Keith Howard)."
      - jalon: "active-gagne"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "The link holds for the Lotus 99T, on which Team Lotus reinstated its active suspension in 1987 (Keith Howard): for Andrew Frankel, the Lotus 92 project had not been in vain; the Williams suspension derived from a road system by Automotive Products."
    sources:
      - titre: "Motor Sport, Keith Howard, “Active suspension” (December 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension"
      - titre: "Motor Sport, Andrew Frankel, “The Lotus that brought active suspension to F1: Colin Chapman’s last big thing” (March 2012)"
        url: "https://www.motorsportmagazine.com/archive/article/march-2012/80/chapmans-last-big-thing/"
  - id: "chaparral-2k"
    annee: 1980
    categorie: "technologie"
    titre: "The Chaparral 2K wins at Indianapolis"
    texte: "The Chaparral 2K, designed by John Barnard, won the 1980 Indianapolis 500. According to Motor Sport, it was while sorting out this car's gear linkage problems that Barnard found the seed of the steering-wheel-operated gearbox he fitted nine years later to the Ferrari 640. Asked about it, Barnard himself pointed instead to the bulk of the gear lever and its linkage in a cockpit he wanted to be very narrow."
    liens:
      - jalon: "ferrari-640"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Motor Sport traces the seed of the paddle-shift gearbox to the Chaparral 2K's linkage, but John Barnard, when asked, never mentions the Chaparral: he talks about the lever and linkage to be fitted into a very narrow tub, then about the electronic valves of active suspension."
    sources:
      - titre: "Motor Sport, James Elson, “Ferrari's 640: the 1989 flawed masterpiece ‘that's still influencing F1 design’” (June 2022)"
        url: "https://motorsportmagazine.com/archive/article/june-2022/114/ferraris-640-the-1989-flawed-masterpiece-thats-still-influencing-f1-design"
      - titre: "Motor Sport, “The Motor Sport interview: John Barnard” (February 2025)"
        url: "https://motorsportmagazine.com/archive/article/february-2025/115/the-motor-sport-interview-john-barnard"
      - titre: "Motor Sport, Keith Howard, “X-ray spec – Ferrari 640” (June 2005)"
        url: "https://www.motorsportmagazine.com/archive/article/june-2005/70/ferrari-640/"
  - id: "concorde-1981"
    annee: 1981
    categorie: "economie"
    titre: "The FISA-FOCA war and the Concorde Agreement"
    texte: "During the winter of 1980-81, Jean-Marie Balestre's FISA and Bernie Ecclestone's constructors' association (FOCA) clashed, against the background of a dispute over aerodynamic skirts; FOCA went as far as announcing a breakaway championship. The first Concorde Agreement ended the conflict, on a date that varies between sources: signed on 19 January 1981 in Paris according to Dieter Rencken, it followed, according to Mattijs Diepraam, an agreement in principle reached at Maranello in mid-January and was signed only on 11 March; Joe Saward also dates it to March 1981, Nigel Roebuck to April 1981. The FIA kept the rules, FOCA gained the exclusive right to negotiate with race organisers, which set the split between sporting power and commercial revenue; for Nigel Roebuck, that was what the war was really about. The teams also committed to contesting every race of the championship."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, “1980s” (May 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "RaceFans, Dieter Rencken, “The billion-dollar questions over the fate of F1's most important document” (June 2020)"
        url: "https://www.racefans.net/?p=428883"
      - titre: "GrandPrix.com, Joe Saward, “News feature: the political wranglings of 1996” (September 1996)"
        url: "https://www.grandprix.com/features/joe-saward/news-feature-the-political-wranglings-of-1996.html"
      - titre: "8W, Mattijs Diepraam, “Poachers turned gamekeepers: how the FOCA became the new FIA, Part 4: 1981” (January 2008)"
        url: "https://forix.com/8w/fiasco-81.html"
      - titre: "8W, Mattijs Diepraam, “When? - The FISA-FOCA war” (November 2007)"
        url: "http://forix.autosport.com/8w/fiasco-introduction-timeline.html"
  - id: "fin-des-jupes"
    annee: 1981
    categorie: "reglement"
    titre: "The end of sliding skirts"
    texte: "To curb ground effect, whose downforce became unpredictable and vanished when a skirt was dislodged or broke, the 1981 rules banned skirts and imposed a 6cm ground clearance. Balestre cited safety; the FOCA teams, without turbos, lost their main advantage over Ferrari, Renault and Alfa Romeo. Teams immediately set about circumventing the rule: the twin-chassis Lotus 88 was banned before it could race, but the Brabham BT49, which lowered itself on track, was cleared and then copied. Skirts, allowed again in 1982 at the cost of almost rigid suspensions, disappeared for good with the mandatory flat bottom of 1983."
    liens:
      - jalon: "lotus-78"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "According to formula1.com, skirts were banned to limit the gains of the ground effect pioneered by the Lotus 78, as cornering speeds soared."
      - jalon: "lotus-88"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "The twin-chassis Lotus 88 tried to keep ground effect in spite of the skirt ban; it was banned before it ever raced."
      - evenement: "fond-plat"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "The 1983 flat bottom completed what the skirt ban had begun; formula1.com links it to the serious accidents of the 1982 season."
      - evenement: "concorde-1981"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "According to Don Capps, FOCA saw the skirt ban, announced in February 1980, as an arbitrary measure aimed at its teams, which opened the war that the Concorde Agreement settled; Nigel Roebuck, however, sees money, not skirts, as what was really at stake."
    sources:
      - titre: "Formula1.com, “Re-writing the F1 rule book - Part 1: from wing cars to flat bottoms” (February 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU"
      - titre: "Motor Sport, Nigel Roebuck, “1980s” (May 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Formula1.com, Mark Hughes, “TECH TUESDAY: The ground-breaking Brabham BT52” (August 2018)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-ground-breaking-brabham-bt52.64UP95DePCCSQ8cm0oAMUK"
      - titre: "Atlas F1, Don Capps, “A Season of Seasons: The Surreal Season - 1982” (1999)"
        url: "https://atlasf1.autosport.com/99/bel/mirror.html"
  - id: "tag-financement"
    annee: 1981
    categorie: "economie"
    titre: "TAG funds the Porsche engine"
    texte: "As early as October 1981, Porsche agreed to produce a turbo engine to John Barnard's strict dimensional requirements. But according to Barnard, McLaren only had enough money to pay for its design. Ron Dennis then persuaded Techniques d'Avant Garde (TAG), the Ojjeh family's group and already a Williams sponsor, to form a joint venture with McLaren, TAG Turbo Engines, which funded the V6."
    liens:
      - jalon: "mp4-2"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "According to Barnard, McLaren could only pay for the engine's design; TAG's funding allowed Porsche to build it, to the dimensions he set."
    sources:
      - titre: "Autosport, Gary Watkins, “When TAG engines ruled Formula 1” (March 2016)"
        url: "https://www.autosport.com/f1/news/when-tag-engines-ruled-formula-1-5105275/5105275/"
      - titre: "Formula1.com, Mark Hughes, “How Niki Lauda's final title-winning car, the 1984 McLaren MP4/2, changed F1” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/how-niki-laudas-final-title-winning-car-the-1984-mclaren-mp4-2-changed-f1.7vGiQXahtUbaKo70ZJ8OGQ"
  - id: "phoenics-1981"
    annee: 1981
    categorie: "technologie"
    titre: "Phoenics, the first commercial CFD code"
    texte: "Work at Imperial College London in the 1960s and 1970s led in 1981 to the first commercial flow-simulation code, Phoenics. According to Pat Symonds, commercial codes improved in the early 1990s as computing power grew, and F1 teams then adopted these tools. CFD had long been used in the aerospace industry."
    liens:
      - jalon: "cfd-benetton"
        mecanisme: "ouvre"
        preuve: "chronologique"
        pourquoi: "Pat Symonds, then at Benetton, credits early-1990s progress in commercial codes and computers for F1's adoption of CFD; but Benetton used Fluent, and no source links Phoenics to Benetton."
    sources:
      - titre: "Autosport, Pat Symonds, “How a dynamic design tool has grown in F1 importance” (March 2023)"
        url: "https://autosport.com/all/news/how-a-dynamic-design-tool-has-grown-in-f1-importance/10441847/"
      - titre: "GrandPrix.com, David Tremayne, “Blowing in the Wind – CFD v Wind Tunnels” (October 2000)"
        url: "https://www.grandprix.com/features/david-tremayne/technical-blowing-in-the-wind-cfd-v-wind-tunnels.html"
      - titre: "Racecar Engineering, “Renault F1 extends Fluent relations” (May 2004)"
        url: "https://www.racecar.com/news/6225/motorsport/renault-f1-extends-fluent-relations"
  - id: "guerre-des-pneus-1982"
    annee: 1982
    categorie: "economie"
    titre: "The tyre war"
    texte: "In the early 1980s, Goodyear, Michelin and Pirelli fought over F1. According to Doug Nye, a half-tanked car could then run a softer compound for at least half the race without burning it out. For the BMW turbo-engined Brabhams, thirsty and very heavy at the start of a 200-mile Grand Prix, a stop for fuel and tyres became worthwhile."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "According to Doug Nye, the tyre war made the stop worthwhile: a lighter Brabham could run softer tyres instead of starting heavily laden."
    sources:
      - titre: "Motor Sport, Doug Nye, “They stop to conquer” (November 2007)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2007/122/doug-nye"
  - id: "fond-plat"
    annee: 1983
    categorie: "reglement"
    titre: "The compulsory flat bottom"
    texte: "Announced on 3 November 1982, after a season marred by serious accidents, the compulsory flat bottom of 1983 bans ground-effect underbodies and skirts; the rear diffuser remains permitted."
    liens:
      - jalon: "lotus-78"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The flat bottom bans the ground-effect underbodies pioneered by the Lotus 78: according to formula1.com, it ends the era of the wing cars."
      - jalon: "bt52"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The announcement of the flat bottom for 1983 led to the ground-effect BT51 being shelved: the BT52 was conceived and built in six weeks, with its weight shifted onto the rear axle to make up for the loss of downforce (Mark Hughes)."
    sources:
      - titre: "Formula1.com, “Re-writing the F1 rule book - Part 1: from wing cars to flat bottoms” (February 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU"
      - titre: "Formula1.com, Mark Hughes, “TECH TUESDAY: The ground-breaking Brabham BT52” (August 2018)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-ground-breaking-brabham-bt52.64UP95DePCCSQ8cm0oAMUK"
      - titre: "Motor Sport, Paul Fearnley, “F1's race to the flat bottom: how Brabham and McLaren saved their '83 season” (May 2013)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2013/82/flat-race/"
  - id: "quatre-roues-au-plus"
    annee: 1983
    categorie: "reglement"
    titre: "Four wheels at most"
    texte: "F1's technical regulations limit cars to four wheels. The experimental six-wheelers that followed the Tyrrell, the March 2-4-0 and the Williams FW07D and FW08D with four driven rear wheels, never raced. Sources differ on the date: 1983 according to Motor Sport, 1982 according to formula1.com, which ties the ban to the six-wheeled Williams and cites safety and practicality."
    liens:
      - jalon: "tyrrell-p34"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The four-wheel maximum closed off the six-wheel formula for good, though Tyrrell had already dropped it in 1978, for tyre reasons."
    sources:
      - titre: "Motor Sport, Matt Bishop, “The 'practical joke' that won a GP – and the other six-wheeled cars banned by F1” (June 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/the-practical-joke-that-won-a-gp-and-the-other-six-wheeled-cars-that-f1-banned/"
      - titre: "Formula1.com, “From the six wheeled Tyrrell to the dual rear-wing Ferrari – 10 of the weirdest F1 cars ever raced” (undated)"
        url: "https://www.formula1.com/en/latest/article/from-the-six-wheeled-tyrrell-to-the-dual-rear-wing-ferrari-10-of-the.1uvMU2qhHxAphWRhgjxwCj"
      - titre: "Motor Sport, Nigel Roebuck, “When six worked better than four” (February 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"
  - id: "carburant-220-litres-1984"
    annee: 1984
    categorie: "reglement"
    titre: "220 litres and no refuelling"
    texte: "As planned, the race fuel allowance fell to 220 litres in 1984; at short notice, in-race refuelling was also banned on safety grounds. Engine management then became decisive: McLaren-TAG prevailed with powerful, reliable and frugal Porsche V6s, thanks to an all-electronic Bosch system. Refuelling only returned in 1994."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "In-race refuelling, Brabham's tactical weapon since 1982, was banned for 1984 on safety grounds (Doug Nye)."
      - jalon: "mp4-2"
        mecanisme: "ouvre"
        preuve: "chronologique"
        pourquoi: "The rule preceded the MP4/2's success without prompting it: the TAG engine had been ordered as early as October 1981 for its dimensions, not its frugality. With 220 litres for the whole race, its more frugal sequential injection then became a decisive advantage (Mark Hughes)."
    sources:
      - titre: "Motor Sport, Doug Nye, “Doug Nye: ‘McLaren rewrote the history books in 1980s F1 turbo era’” (April 2024)"
        url: "https://motorsportmagazine.com/archive/article/april-2024/25/doug-nye-mclaren-rewrote-the-history-books-in-1980s-f1-turbo-era"
      - titre: "Formula1.com, Mark Hughes, “How Niki Lauda's final title-winning car, the 1984 McLaren MP4/2, changed F1” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/how-niki-laudas-final-title-winning-car-the-1984-mclaren-mp4-2-changed-f1.7vGiQXahtUbaKo70ZJ8OGQ"
      - titre: "Motorsport.com, “Why was refuelling banned in F1? History of refuelling and previous accidents” (January 2024)"
        url: "https://au.motorsport.com/f1/news/why-was-refuelling-banned-in-f1/10555081/"
      - titre: "Formula 1, “Re-writing the F1 rulebook - Part 2: from driver aids to increased safety” (January 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
      - titre: "Autosport, Gary Watkins, “When TAG engines ruled Formula 1” (March 2016)"
        url: "https://www.autosport.com/f1/news/when-tag-engines-ruled-formula-1-5105275/5105275/"
  - id: "crash-test-frontal"
    annee: 1985
    categorie: "securite"
    titre: "First mandatory crash test"
    texte: "In 1985 the FIA introduced a first frontal impact test, still simple: a nose and a small part of the chassis were enough. Around 1998 the test moved to a complete chassis, together with the first static load tests. Tests then multiplied (roll hoops, side and rear structures, anti-intrusion panels), often as a direct response to an accident, and the car's structure now has to pass increasingly demanding tests. For Jo Bauer, the FIA technical delegate, these tests saved Robert Kubica's life at the 2007 Canadian Grand Prix."
    sources:
      - titre: "FIA, “Breaking the barriers of safety” (May 2013)"
        url: "https://fia.com/node/5643"
  - id: "carburant-195-litres-1986"
    annee: 1986
    categorie: "reglement"
    titre: "195 litres of fuel"
    texte: "For 1986 the race fuel allowance fell from 220 to 195 litres to curb the turbo power race, with no limit on fuel composition or boost. Every team had to manage consumption in the race. Honda's development concentrated on fuel consumption and electronic engine management."
    liens:
      - jalon: "telemetrie-course"
        mecanisme: "ouvre"
        preuve: "chronologique"
        pourquoi: "With 195 litres for the whole race, Honda focused on consumption and electronics (Denis Jenkinson); the FW11 sent its data to the pits every lap through rudimentary telemetry, and the driver was guided in his fuel use by displays (Mark Hughes). No source says it was designed for that purpose."
    sources:
      - titre: "Honda, “1986 RA166E” (manufacturer's site, undated)"
        url: "https://global.honda/en/POWEREDbyHONDA/1986_ra166e/"
      - titre: "Motor Sport, Denis Jenkinson, “Champion Constructor” (December 1986)"
        url: "https://www.motorsportmagazine.com/archive/article/december-1986/22/champion-constructor/"
      - titre: "Formula1.com, Mark Hughes, “TECH TUESDAY: Under the bodywork of 1986's best F1 car, the Williams FW11” (March 2020)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-under-the-bodywork-of-1986s-best-f1-car-the-williams-fw11.4vqZ7cKhqMhfYgA6mwXYiu"
  - id: "turbo-bride"
    annee: 1987
    categorie: "reglement"
    titre: "Turbos restricted, normally aspirated engines admitted"
    texte: "In the mid-1980s, 1.5-litre turbos exceeded 1000bhp in qualifying; the FIA wanted to cut power without driving the manufacturers away. From 1987, boost pressure was limited to 4bar, and 3.5-litre normally aspirated engines were admitted alongside the turbos; in 1988 the limit fell to 2.5bar, with 150 litres of fuel instead of 195. Honda answered with a V6 of about 30% thermal efficiency, which won 15 of the 16 races with McLaren."
    liens:
      - jalon: "mp4-4"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "According to Steve Nichols, its chief designer, the fuel allowance cut to 150 litres in 1988 allowed a small, low tank; with a Honda engine lowered thanks to a smaller Tilton carbon clutch, the driver could be laid down within that envelope (Autosport)."
      - jalon: "march-881"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "The phasing-in of normally aspirated engines allowed March to return; facing a huge power deficit to the turbos, Adrian Newey saw no other way than an aerodynamically very efficient car."
    sources:
      - titre: "Motor Sport Magazine, “When F1 had two sets of engine rules, and why that wouldn't work today” (April 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/when-f1-had-two-sets-of-engine-rules-and-why-that-wouldnt-work-today/"
      - titre: "Honda, “RA168E” (manufacturer's site, undated)"
        url: "https://global.honda/en/POWEREDbyHONDA/1988_ra168e/"
      - titre: "Autosport, Simon Strang, “Insight: Steve Nichols on Ayrton Senna and the McLaren MP4/4” (January 2012)"
        url: "https://www.autosport.com/f1/news/insight-steve-nichols-on-ayrton-senna-and-the-mclaren-mp4-4-4452648/4452648/"
      - titre: "Honda, “1988 McLaren Honda MP4/4” (manufacturer's site, undated)"
        url: "https://global.honda/en/F1/machine/1988_McLarenHondaMP44/"
      - titre: "Motor Sport, Mark Hughes, “Adrian Newey: ‘My top six F1 cars’” (September 2014)"
        url: "https://www.motorsportmagazine.com/archive/page/september-2014/36"
      - titre: "Motor Sport, “Marching to civil war” (June 2005)"
        url: "https://www.motorsportmagazine.com/archive/article/june-2005/82/marching-to-civil-war"
  - id: "fin-du-turbo"
    annee: 1989
    categorie: "reglement"
    titre: "Turbos banned"
    texte: "After two transition seasons (1987-1988), only 3.5-litre normally aspirated engines remained allowed in 1989. Renault then returned with a 3.5-litre V10 with pneumatic valve springs, the RS1."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Restricted in 1987 and 1988, turbo engines were banned in 1989: the era opened by the 1979 win came to a close."
      - jalon: "v10-renault"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The 1989 3.5-litre normally aspirated formula is the one for which Renault returned with its RS1 V10."
    sources:
      - titre: "Motor Sport Magazine, “When F1 had two sets of engine rules, and why that wouldn't work today” (April 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/when-f1-had-two-sets-of-engine-rules-and-why-that-wouldnt-work-today/"
      - titre: "Motor Sport Magazine, “Teapots, turbos and titles: Renault's wild F1 ride” (December 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
  - id: "fin-aides-electroniques"
    annee: 1994
    categorie: "reglement"
    titre: "Driver aids banned"
    texte: "Announced by the FIA in mid-1993, the ban aimed to curb spending and to answer criticism that the driver counted for less and less. For 1994, the driver aids that had appeared in the early 1990s were banned: active suspension, traction control and anti-lock brakes; only the semi-automatic gearbox was kept. The title-winning Williams cars of 1992 and 1993 owed much to these technologies. Teams had to start again from a blank sheet and look for grip through aerodynamics and mechanical design, all the more so as in-race refuelling, banned since 1984, returned. For the first time, the FIA checked the cars' software."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Active suspension was banned for 1994 along with the other driver aids."
      - jalon: "active-gagne"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Active suspension was banned for 1994 along with the other driver aids."
      - jalon: "fw14b"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The FW14B's active suspension was banned for 1994 along with the other driver aids."
    sources:
      - titre: "Mercedes-AMG Petronas F1 Team, “The Past Six New F1 Eras: What Changed and What Happened?” (March 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Motor Sport Magazine, “That was 1994” (December 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2004/42/that-was-1994/"
      - titre: "Formula 1, “Re-writing the F1 rulebook - Part 2: from driver aids to increased safety” (January 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
      - titre: "Motor Sport, Keith Howard, “Active suspension” (December 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension"
  - id: "imola-1994"
    annee: 1994
    categorie: "securite"
    titre: "Imola 1994: deaths of Ratzenberger and Senna"
    texte: "Roland Ratzenberger and Ayrton Senna were killed at the 1994 San Marino Grand Prix; two weeks later, Karl Wendlinger was seriously injured at Monaco. The FIA slowed the cars at once: a shortened diffuser and modified front wings from Spain, holes in the airbox to cut power in Canada, then a plank under the floor, with wear limited to 1mm, which forced the whole car to be raised. It also launched a programme of circuit alterations and limited pit-lane speed to 80km/h in practice and 120km/h in races. In 1995 the stepped floor cut underbody downforce by as much as 50% by some estimates and engine capacity fell from 3.5 to 3 litres, while the cockpit was lengthened, its sides raised and the frontal impact test made tougher."
    liens:
      - jalon: "fw17b"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "According to Edd Straw, Adrian Newey saw that the stepped floor imposed in 1995 did not require the bodywork to extend all the way to the rear, which allowed the diffuser exit to be raised."
      - evenement: "protections-laterales-cockpit"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "According to GrandPrix.com, the 1996 rules came from the work of the FIA Advisory Expert Group on safety since the accidents at Imola and Monaco in 1994."
      - evenement: "roues-retenues"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "Pat Symonds lists wheel tethers among the safety measures that followed Imola; the FIA counts them in the drive launched after Senna's death."
      - evenement: "hans"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "In F1, the adoption of the HANS began after the crash in which Ratzenberger died of a basilar skull fracture (Matt Youson); after the deaths of Senna and Ratzenberger, the FIA brought in Mercedes-Benz to improve driver safety (Katy Roberts)."
      - evenement: "halo"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "Pat Symonds places the halo in Imola's legacy, but the concept was born at Mercedes after Jules Bianchi's accident: the link with Imola is indirect, twenty-four years apart."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, “Imola ‘94 and the lasting safety legacy” (May 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
      - titre: "Formula 1, “Re-writing the F1 rulebook - Part 2: from driver aids to increased safety” (2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
      - titre: "Formula1.com, Edd Straw, “An innovator and trendsetter – Adrian Newey's greatest F1 contributions” (May 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
      - titre: "Formula 1, Katy Roberts, “5 crucial milestone moments in F1 safety technology” (May 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
      - titre: "GrandPrix.com, “The new rules for 1996” (March 1996)"
        url: "https://www.grandprix.com/ns/ns00509.html"
  - id: "protections-laterales-cockpit"
    annee: 1996
    categorie: "securite"
    titre: "Higher cockpit sides and side headrests"
    texte: "After cockpit sides already raised in 1995 to cover the shoulders, the FIA imposed in 1996 higher cockpit sides, padded on the inside, and 75mm side headrests, with static load tests on the cockpit rim. These rules came from the work of the FIA Advisory Expert Group on safety since the accidents at Imola and Monaco in 1994; the cockpit was also enlarged so that drivers of all sizes could compete on equal terms. The first data recorders were fitted in the survival cells. The raised sides protected the driver's head far better from the side."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, “Re-writing the F1 rulebook - Part 2: from driver aids to increased safety” (2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
      - titre: "GrandPrix.com, “The new rules for 1996” (March 1996)"
        url: "https://www.grandprix.com/ns/ns00509.html"
  - id: "prius-hybride"
    annee: 1997
    categorie: "technologie"
    titre: "The Toyota Prius, the first mass-produced hybrid"
    texte: "In 1997 Toyota launched the Prius, the first mass-produced hybrid vehicle: a combustion engine and two motor-generators recovered the energy lost under braking, and fuel consumption was halved. The direction of the borrowing with F1 is disputed: when KERS arrived in 2009, limited to 60kW for 6.6 seconds per lap, Toyota called it \"primitive\" and unrelated to its road hybrids, while formula1.com stated in 2014 that progress on F1 KERS had benefited production hybrids. According to that site, a system weighed over 100kg in 2007 and 24kg at the end of 2012."
    liens:
      - jalon: "kers"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "The Prius preceded KERS by twelve years, but no source establishes a borrowing: Toyota called KERS \"primitive\" and unrelated to its road hybrids."
    sources:
      - titre: "IEEE, Engineering and Technology History Wiki, “Milestones: Toyota Prius, the World's First Mass-Produced Hybrid Vehicle, 1997” (February 2025)"
        url: "https://ethw.org/Milestones:Toyota_Prius,_the_World%27s_First_Mass-Produced_Hybrid_Vehicle,_1997"
      - titre: "New Atlas, “Formula One KERS explained” (March 2009)"
        url: "https://newatlas.com/formula-one-kers/11324/"
      - titre: "Formula1.com, “Hybrid update for Mercedes' car name” (May 2014)"
        url: "https://www.formula1.com/en/latest/headlines/2014/5/Hybrid-update-for-Mercedes-car-name.html"
  - id: "inerter-cambridge"
    annee: 1997
    categorie: "technologie"
    titre: "Malcolm Smith's inerter"
    texte: "In 1997 Malcolm Smith, a professor at Cambridge, conceived the inerter: a plunger turns a flywheel, which spins in proportion to the relative displacement of its two attachment points; the device, with springs and dampers, reduces oscillations. The university, which had filed a patent, gave McLaren an exclusive right to exploit it; to keep it secret, the team called it the \"J-damper\". A licence to Penske Racing Shocks then allowed it to be supplied to every team."
    liens:
      - jalon: "inerter"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "According to the University of Cambridge, the device Malcolm Smith conceived in 1997 was licensed exclusively to McLaren, which raced it in 2005."
    sources:
      - titre: "University of Cambridge, “Secrets of the inerter revealed” (August 2008)"
        url: "https://www.cam.ac.uk/research/news/secrets-of-the-inerter-revealed"
      - titre: "Malcolm Smith, “Control for Formula One!”, in T. Samad and A.M. Annaswamy (eds), The Impact of Control Technology, IEEE Control Systems Society (2011)"
        url: "https://IEEECSS.org/sites/ieeecss/files/2019-07/IoCT-Part2-14FormulaOne-LR.pdf"
  - id: "roues-retenues"
    annee: 1999
    categorie: "securite"
    titre: "Wheels held by tethers"
    texte: "In 1999 the FIA required tethers linking the wheels to the car, so that they would not break free in an accident. For Pat Symonds, these tethers were among the safety measures that followed Imola 1994, alongside impact tests made tougher every year and anti-penetration side structures."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, Matt Youson, “Imola ‘94 and the lasting safety legacy” (May 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
  - id: "hans"
    annee: 2003
    categorie: "securite"
    titre: "HANS becomes mandatory"
    texte: "The HANS head and neck restraint, designed by Robert Hubbard and Jim Downing against basilar skull fractures, the injury that killed Roland Ratzenberger in 1994, then adapted to single-seaters with the help of DaimlerChrysler, became mandatory in F1 in 2003. A slimmed-down version was tested from 1996 to 1998 and approved by the FIA in 2001. The FIA acknowledged that it slightly raised the car's centre of gravity and allowed teams to adapt it to their cockpit, subject to its approval; after granting an exemption to Rubens Barrichello in Malaysia, it refused any further exemption, a driver unable to wear it having to be replaced."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "GrandPrix.com, “FIA stands by HANS device” (March 2003)"
        url: "https://www.grandprix.com/news/fia-stands-by-hans-device.html"
      - titre: "Formula 1, “5 crucial milestone moments in F1 safety technology” (May 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
      - titre: "Formula 1, Matt Youson, “Imola ‘94 and the lasting safety legacy” (May 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
  - id: "boites-sans-coupure-autorisees"
    annee: 2005
    categorie: "reglement"
    titre: "Green light for seamless gearboxes"
    texte: "Weeks before the 2005 season, Ferrari asked for BAR's seamless-shift gearbox to be banned as a form of the outlawed continuously variable transmission. The FIA cleared the systems only in mid-February; four teams were by then developing them."
    liens:
      - jalon: "boite-sans-coupure"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Challenged by Ferrari as an outlawed CVT, BAR's gearbox was cleared by the FIA only weeks before the 2005 season (Jonathan Noble)."
    sources:
      - titre: "Autosport, Jonathan Noble, “'Seamless' gearbox not unique” (February 2005)"
        url: "https://www.autosport.com/f1/news/seamless-gearbox-not-unique-4997102/4997102/"
  - id: "honda-brawn-2008"
    annee: 2008
    categorie: "economie"
    titre: "Honda withdraws, Brawn GP is born"
    texte: "At the end of 2008, in the middle of the global economic crisis, Honda left Formula 1; the announcement, on 5 December, surprised a team that had just received a new wind tunnel. Ross Brawn and Nick Fry negotiated a management buyout, with Honda putting in just short of £100m, the equivalent of the cost of a shutdown. The 2009 car, already developed at Honda, which had abandoned development of its 2008 car mid-season to concentrate on it, raced under the Brawn name with its double diffuser and a Mercedes engine. Around 350 staff were made redundant; Jenson Button won six of the first seven races and the title."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The management buyout, funded by Honda, let the car developed at Honda race in 2009 under the Brawn name."
    sources:
      - titre: "The Race, Scott Mitchell-Malm, “The last time Honda withdrew from F1 – by those it left behind” (April 2021)"
        url: "https://the-race.com/formula-1/the-last-time-honda-withdrew-from-f1-by-those-it-left-behind"
      - titre: "Mercedes-AMG Petronas F1 Team, “The Past Six New F1 Eras: What Changed and What Happened?” (March 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "economies-2009"
    annee: 2009
    categorie: "economie"
    titre: "In-season testing ends"
    texte: "In December 2008, a few days after Honda's departure, the World Council and the teams adopted a cost-cutting plan, all fearing that other manufacturers might leave; the FIA expected it to cut spending by as much as 30%. From 2009, no testing was allowed once the season had started, and wind tunnels could no longer take full-size models, 60% becoming the maximum. Each engine had to last three race weekends, with the rev limit cut from 19,000 to 18000rpm, and customer engine prices were halved. Grand Prix Fridays took on a new importance in car development."
    liens:
      - jalon: "simulateur"
        mecanisme: "ouvre"
        preuve: "discute"
        pourquoi: "By scrapping in-season testing, the 2009 cost-cutting plan moved development from circuits to factories, where the simulator took over from the track (Joe Saward); McLaren had started it long before, according to Paddy Lowe."
    sources:
      - titre: "Motor Sport, Adam Cooper, “Formula 1 costs slashed for 2009” (February 2009)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2009/12/formula-1-costs-slashed-for-2009/"
      - titre: "GrandPrix.com, Joe Saward, “Formula 1's virtual reality” (January 2009)"
        url: "https://www.grandprix.com/features/joe-saward/insight-formula-1s-virtual-reality.html"
      - titre: "Autosport, Edd Straw, “Does F1 still need in-season testing?” (April 2012)"
        url: "https://www.autosport.com/f1/news/does-f1-still-need-in-season-testing-5098577/5098577/"
  - id: "refonte-aero-2009"
    annee: 2009
    categorie: "reglement"
    titre: "The 2009 aerodynamic overhaul"
    texte: "By the late 2000s, cars covered in appendages lost a great deal of downforce in another car's wake, and overtaking became rare. Drawing on tests by an Overtaking Working Group that included Paddy Lowe, Pat Symonds and Rory Byrne, the 2009 rules removed deflectors and appendages and aimed for a 50% cut in downforce, with a taller, narrower rear wing, a lower, wider front wing adjustable by the driver, and a redesigned diffuser. Slick tyres returned after eleven years. Williams, Brawn and Toyota exploited a loophole in the wording of the text to create the \"double diffuser\", which protests failed to get banned."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "Williams, Brawn and Toyota each exploited a loophole in the wording of the new aerodynamic rules."
      - jalon: "rb6"
        mecanisme: "ouvre"
        preuve: "discute"
        pourquoi: "The double diffuser born of the 2009 rules created the opportunity to blow its upper part, which Adrian Newey exploited on the RB6; the link runs through the double diffuser and remains indirect (Edd Straw)."
    sources:
      - titre: "Formula1.com, “Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks” (February 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Mercedes-AMG Petronas F1 Team, “The Past Six New F1 Eras: What Changed and What Happened?” (March 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Formula1.com, Edd Straw, “An innovator and trendsetter – Adrian Newey's greatest F1 contributions” (May 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
  - id: "kers-autorise-2009"
    annee: 2009
    categorie: "reglement"
    titre: "KERS allowed"
    texte: "Announced as early as 2007, the 2009 rules allowed an energy recovery system under braking: the energy, stored in batteries or, at Williams, in an electric flywheel, was returned at up to 60kW for 6.6 seconds a lap. Heavy, complex and often unreliable, it was used by only four teams. Still in the rules in 2010, it went unused because the teams agreed to give it up; they called for its return for 2011."
    liens:
      - jalon: "kers"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "According to Andy Cowell, Mercedes decided to design its own KERS as soon as the regulations were published in 2007."
    sources:
      - titre: "Formula1.com, “Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks” (February 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Autosport, Scott Mitchell, “The 2007 decision that built Mercedes' hybrid empire” (August 2019)"
        url: "https://www.autosport.com/f1/news/the-2007-decision-that-built-mercedes-hybrid-empire-5112574/5112574/"
      - titre: "Motor Sport, Adam Cooper, “Teams call for KERS in 2011” (July 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2010/13/teams-call-for-kers-in-2011/"
  - id: "ravitaillement-interdit-2010"
    annee: 2010
    categorie: "reglement"
    titre: "Refuelling banned again"
    texte: "Reintroduced in 1994, in-race refuelling was banned again from 2010. According to Motor Sport, the decision was made largely on safety and cost grounds, after a string of pit-lane fires; Motorsport.com stresses above all the drivers' safety."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "From 2010, in-race refuelling was banned again, ending the era of strategies built around it."
    sources:
      - titre: "Motor Sport, Pablo Elizalde, “F1 in reverse again: V8s and refuelling set to come back from bans?” (July 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/f1-in-reverse-again-v8s-and-refuelling-set-to-come-back-from-bans/"
      - titre: "Motorsport.com, “Why was refuelling banned in F1? History of refuelling and previous accidents” (January 2024)"
        url: "https://au.motorsport.com/f1/news/why-was-refuelling-banned-in-f1/10555081/"
  - id: "double-diffuseur-interdit"
    annee: 2011
    categorie: "reglement"
    titre: "The double diffuser banned"
    texte: "In January 2010, the teams' technical chiefs officially agreed to ban the double diffuser from the following season. Allowed in 2009 despite protests, it had set off a development race across the grid. From 2011, the loophole that had made it possible was closed."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "From 2011, the loophole that had allowed the double diffuser was closed (Autosport)."
    sources:
      - titre: "Autosport, Jonathan Noble, “Double diffusers banned from 2011” (January 2010)"
        url: "https://www.autosport.com/f1/news/double-diffusers-banned-from-2011-4434892/4434892/"
      - titre: "Autosport, Matt Somerfield and Giorgio Piola, “Banned: The double diffuser that triggered an F1 development race” (May 2020)"
        url: "https://www.autosport.com/news/report.php/id/149491"
  - id: "drs-2011"
    annee: 2011
    categorie: "reglement"
    titre: "DRS replaces the F-duct"
    texte: "Voted out on cost and safety grounds at a meeting during the 2010 Spanish Grand Prix, the F-duct gave way in 2011 to DRS, an adjustable rear wing the driver can open in a set zone when behind another car. As early as 2011, Gary Anderson called it \"a bandage\" until rules let cars follow each other."
    liens:
      - jalon: "f-duct"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "The F-duct led the FIA to ban this kind of wing stall and replace it with a regulated device, DRS (Gary Anderson)."
      - jalon: "f-duct"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Voted out on cost and safety grounds at a meeting during the 2010 Spanish Grand Prix, the F-duct was replaced by DRS in 2011 (Matt Somerfield)."
    sources:
      - titre: "Autosport, Gary Anderson, “Drag Reduction System: Did it work?” (December 2011)"
        url: "https://www.autosport.com/f1/news/drag-reduction-system-did-it-work-5098191/5098191/"
      - titre: "Autosport, Matt Somerfield, “Banned: The 2010 Formula 1 season's F-duct” (April 2020)"
        url: "https://www.autosport.com/f1/news/149090/banned-the-f1-2010-season-fduct"
  - id: "echappements-2012"
    annee: 2012
    categorie: "reglement"
    titre: "Exhaust exits restricted"
    texte: "As early as 2011, the FIA changed the rules on exhaust location to discourage diffuser blowing; it then planned a mid-season ban on off-throttle blowing, before postponing it under pressure from the teams, in favour of a rule change for 2012. For 2012, the rules defined a box in which the exhaust outlet had to sit. The blown diffusers of the time disappeared, but teams soon found other ways of using the gases, with increasingly modest returns."
    liens:
      - jalon: "rb6"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "The FIA changed the exhaust rules to discourage the diffuser blowing revived by the RB6 (Matt Somerfield, Giorgio Piola)."
      - jalon: "rb6"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The box imposed in 2012 for the exhaust outlet ended the blown diffusers of the time; Red Bull kept exploiting the gases, with increasingly modest returns (Edd Straw)."
    sources:
      - titre: "Motorsport.com, Matt Somerfield and Giorgio Piola, “Banned: Why exhaust blown diffusers were outlawed” (May 2020)"
        url: "https://au.motorsport.com/f1/news/banned-tech-exhaust-blown-diffusers/4796376/"
      - titre: "Formula1.com, Edd Straw, “An innovator and trendsetter – Adrian Newey's greatest F1 contributions” (May 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
  - id: "bianchi-voiture-securite-virtuelle"
    annee: 2014
    categorie: "securite"
    titre: "Jules Bianchi's crash and the Virtual Safety Car"
    texte: "At the 2014 Japanese Grand Prix, in the rain, Jules Bianchi lost control of his Marussia in a double-yellow-flag zone and, at 126km/h, struck the crane recovering Adrian Sutil's Sauber; the accident would ultimately prove fatal. The FIA accident panel judged it impossible to make such an impact survivable, and recommended instead a speed limit in sectors under double yellow flags. In 2015 the FIA introduced the Virtual Safety Car, which imposes a minimum lap time to slow the drivers. The Zylon anti-intrusion panels of the survival cell were also extended up to the cockpit rim, alongside the driver's head."
    liens:
      - evenement: "halo"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "According to formula1.com, Mercedes came up with the halo concept not long after Jules Bianchi's fatal crash at Suzuka; but the FIA accident panel judged that a closed cockpit would not have changed the outcome of that impact: the link remains disputed."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "FIA, “Accident Panel” (December 2014)"
        url: "https://api.fia.com/news/accident-panel"
      - titre: "Formula 1, Katy Roberts, “5 crucial milestone moments in F1 safety technology” (May 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "groupe-propulseur-2014"
    annee: 2014
    categorie: "reglement"
    titre: "The mandatory hybrid power unit"
    texte: "In 2014 the 2.4-litre normally aspirated V8s gave way to a 1.6-litre turbo V6 combined with two energy recovery systems, under braking and from the exhaust gases; producing around 600bhp, it received some 160bhp of electric power for about 33 seconds per lap. Fuel was limited to 100kg per race, a third less than before, and flow to 100kg/h: efficiency became a central performance criterion. Cooling widened the sidepods, the minimum weight rose from 642 to 690kg, and the single central exhaust ended blown diffusers. Mercedes won 51 of the 59 races of the first three seasons."
    liens:
      - jalon: "hybride"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The 2014 rules imposed the hybrid turbo V6; the Mercedes power unit was the dominant answer to them."
      - jalon: "rendement-50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "By limiting fuel to 100kg and flow to 100kg/h, the rules made efficiency a central performance criterion."
    sources:
      - titre: "Formula1.com, “A racing revolution? Understanding 2014's technical regulations” (January 2014)"
        url: "https://www.formula1.com/en/latest/article/a-racing-revolution-understanding-2014s-technical-regulations.1bTbN3OAEksY00PVE62KvC"
      - titre: "Mercedes-AMG Petronas F1 Team, “The Past Six New F1 Eras: What Changed and What Happened?” (March 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "halo"
    annee: 2018
    categorie: "securite"
    titre: "Introduction of the halo"
    texte: "Conceived by Mercedes shortly after Jules Bianchi's accident, the halo prevailed over two other frontal protections studied by the FIA, including a windscreen. Mandatory from 2018, this three-pronged hoop of aerospace-grade titanium, placed above the driver's head, must withstand a vertical load of 116 kN; it was tested by firing a wheel at it. Criticised at first for its looks, it ended the fully open cockpit and became mandatory on all FIA single-seaters. It protected Lewis Hamilton at Monza in 2021 and Zhou Guanyu at Silverstone in 2022, among others."
    sources:
      - titre: "FIA, “Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing” (May 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, “5 crucial milestone moments in F1 safety technology” (May 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
      - titre: "Formula 1, “The 75 best drivers, cars, innovations, teams and key figures in F1 history”"
        url: "https://www.formula1.com/en/latest/article/the-75-best-drivers-cars-innovations-teams-and-key-figures-in-f1-history.6VcYXd7l9aI6fysNWtxFja"
  - id: "grosjean-bahrein"
    annee: 2020
    categorie: "securite"
    titre: "Romain Grosjean's crash in Bahrain"
    texte: "At the 2020 Bahrain Grand Prix, after contact with Daniil Kvyat's car, Romain Grosjean's Haas hit the barrier at 192km/h, with a peak of 67g, went through it and caught fire; the driver escaped with burns to his hands. The FIA investigation concluded that the survival cell, the headrest, the HANS and the halo had done their job. But the power unit had separated from the cell, and the fuel tank hatch and the supply connection, torn off, had let fuel escape: the FIA launched a review of the front geometry of the survival cell and of the installation of the fuel bladders, their connections and their hatches."
    sources:
      - titre: "FIA, “FIA concludes investigation into Romain Grosjean's accident at 2020 Bahrain Formula 1 Grand Prix and releases 2021 circuit racing safety initiatives” (March 2021)"
        url: "https://api.fia.com/news/fia-concludes-investigation-romain-grosjeans-accident-2020-bahrain-formula-1-grand-prix-and"
  - id: "essais-aero-echelonnes-2021"
    annee: 2021
    categorie: "economie"
    titre: "Sliding scale for aero testing"
    texte: "Long unlimited, to the point that some teams ran their wind tunnels day and night, or even several at once, aerodynamic development was rationed from 2021: each team's wind tunnel and CFD time depends on its position in the previous championship. The default allowance fell from 65 to 40 wind tunnel runs per week. In 2021 the champion was entitled to 90% of this allowance and the tenth-placed team to 112.5%; the gap widened to 70% and 115% from 2022. The scheme aims to cut costs and close up the order, over several seasons rather than one."
    sources:
      - titre: "Formula 1, Lawrence Barretto, “How F1's new sliding scale aero testing rules work – and what impact they will have on racing” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/how-f1s-new-sliding-scale-aero-testing-rules-work-and-what-impact-they-will.pn0sG8N4A0cjbNRbdYx8a"
  - id: "plafond-budgetaire-2021"
    annee: 2021
    categorie: "economie"
    titre: "The cost cap"
    texte: "In 2021, financial regulations joined the sporting and technical regulations for the first time, with equal status. Announced in October 2019 to level the championship and secure the teams' financial stability, they cap annual spending on car performance, excluding marketing, driver salaries and the three highest-paid staff. First set at $175m, the cap was cut to $145m after the pandemic, then to $140m and $135m; the 2020 cars were carried over into 2021. Car development now has to fit within a capped budget."
    sources:
      - titre: "Formula 1, Lawrence Barretto, “The 2021 F1 cost cap explained – what has changed, and why?” (May 2020)"
        url: "https://www.formula1.com/en/latest/article/the-2021-f1-cost-cap-explained-what-has-changed-and-why.5O1Te8udKLmkUl4PyVZtUJ"
  - id: "retour-effet-de-sol"
    annee: 2022
    categorie: "reglement"
    titre: "Ground effect returns"
    texte: "The 2022 rules, first planned for 2021 and delayed by the pandemic, gave the floor of the car the main role in producing downforce again, as in the early 1980s, but without skirts. They aimed to let cars follow each other: according to formula1.com, the cars of the time lost 35% of their downforce 20 metres behind another and 47% at 10 metres, against 4% and 18% targeted for 2022. Shaped tunnels replaced the stepped floor, and downforce no longer depended on the wake-sensitive vortices created by the bargeboards, which disappeared. The wings were redefined and the wheels enlarged, with 18-inch tyres."
    liens:
      - jalon: "inerter"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "The 2022 rules ban inerters, a standard F1 fitment for a couple of decades according to Mark Hughes and Giorgio Piola, who date their first use to 1997 (2005 according to the University of Cambridge)."
      - jalon: "rb18"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "The return of venturi ground-effect cars let Adrian Newey set the tone again, thanks to his experience of such cars (Edd Straw)."
    sources:
      - titre: "Mercedes-AMG Petronas F1 Team, “The Past Six New F1 Eras: What Changed and What Happened?” (March 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Formula 1, Greg Stuart, “10 things you need to know about the all-new 2022 F1 car” (July 2021)"
        url: "https://www.formula1.com/en/latest/article/10-things-you-need-to-know-about-the-all-new-2022-f1-car.4OLg8DrXyzHzdoGrbqp6ye"
      - titre: "Formula1.com, Mark Hughes and Giorgio Piola, “Tech Tuesday: How 2022's suspension overhaul could shuffle the competitive order” (February 2022)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-how-2022s-suspension-overhaul-could-shuffle-the-competitive.4PoTMQ9jbaWotbTdd4bp8j"
      - titre: "Formula1.com, Edd Straw, “An innovator and trendsetter – Adrian Newey's greatest F1 contributions” (May 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
      - titre: "University of Cambridge, “Secrets of the inerter revealed” (August 2008)"
        url: "https://www.cam.ac.uk/research/news/secrets-of-the-inerter-revealed"
  - id: "motoristes-2026"
    annee: 2026
    categorie: "economie"
    titre: "Audi and the new engine makers"
    texte: "The 2026 engine rules were first meant to attract new engine makers: they drop the MGU-H, which manufacturers had not adopted on road cars, for a simpler power unit. Audi, whose entry was confirmed in August 2022 after these rules were adopted, took over Sauber, in F1 since 1993, and became a works team with its own power unit, designed at Neuburg an der Donau. Red Bull partnered with Ford and Honda returned as a full works manufacturer with Aston Martin. The grid thus has five engine makers, alongside Mercedes and Ferrari, while Renault stopped building them and Alpine became a Mercedes customer."
    sources:
      - titre: "FIA, “F1 – FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry” (October 2022)"
        url: "https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry"
      - titre: "Formula 1, “2026 REGULATIONS EXPLAINED: All you need to know about F1’s new power units” (January 2026)"
        url: "https://www.formula1.com/en/latest/article/all-you-need-to-know-about-f1s-new-power-units.14jfv7a36905uDJDdNyfQd"
      - titre: "Motor Sport Magazine, “Teapots, turbos and titles: Renault's wild F1 ride” (December 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
  - id: "reglement-2026"
    annee: 2026
    categorie: "reglement"
    titre: "The 2026 engine and chassis rules"
    texte: "Adopted in August 2022 for the engine and completed in June 2024 for the chassis, the 2026 rules split power equally between combustion engine and electricity, with sustainable fuels: the combustion engine falls from about 550 to 400kW, the electric part rises from 120 to 350kW, and the energy recovered under braking doubles. The chassis is redefined to match these energy requirements. The cars lose 30kg, for a minimum of 768kg, and receive movable front and rear wings: one position for cornering downforce, another for low drag on the straights. The maximum wheelbase loses 200mm and the width 100mm."
    liens:
      - evenement: "motoristes-2026"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "According to Matt Youson, the first goal of the 2026 engine rules was to attract new engine makers; Audi's entry was confirmed at the end of August 2022, right after those rules were approved (FIA)."
    sources:
      - titre: "Formula1.com, “FIA unveils Formula 1 regulations for 2026 and beyond featuring more agile cars and active aerodynamics” (June 2024)"
        url: "https://www.formula1.com/en/latest/article/fia-unveils-formula-1-regulations-for-2026-and-beyond-featuring-more-agile.75qJiYOHXgeJqsVQtDr2UB"
      - titre: "Formula 1, Matt Youson, “2026 REGULATIONS EXPLAINED: All you need to know about F1's new power units” (January 2026)"
        url: "https://www.formula1.com/en/latest/article/all-you-need-to-know-about-f1s-new-power-units.14jfv7a36905uDJDdNyfQd"
      - titre: "FIA, “F1 – FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry” (October 2022)"
        url: "https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry"
  - id: "rationnement-apres-guerre"
    annee: 1946
    categorie: "economie-mondiale"
    titre: "Post-war austerity and rationing"
    texte: "Britain emerged from the war with a crippled economy and continued rationing (Damien Smith); according to Doug Nye, it was even stricter than at any time during the war itself. Petrol rationing was only lifted in 1950, food rationing in 1954. It was against this background that the 500 Club devised a cheap racing formula open to all."
    liens:
      - evenement: "formule-500"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "According to Damien Smith, the 500 Club formula was shaped for a Britain with a crippled economy and continued rationing, to attract all comers to cheap racing."
    sources:
      - titre: "Motor Sport, Doug Nye, “1950s” (May 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/42/1950s"
      - titre: "Motor Sport, Damien Smith, “One-pot dictator” (July 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/88/one-pot-dictator/"
  - id: "allemagne-exclue-1950"
    annee: 1946
    categorie: "geopolitique"
    titre: "Germany barred from international racing"
    texte: "At the end of the war, German factories lay in rubble, and the French-dominated FIA banned Germans from racing internationally until 1950 (Doug Nye). The manufacturers that had dominated 1930s Grand Prix racing were absent from the restart; the first world championship, in 1950, was contested without them."
    sources:
      - titre: "Motor Sport, Doug Nye, “1950s” (May 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/42/1950s"
  - id: "silverstone-aerodrome-1948"
    annee: 1948
    categorie: "geopolitique"
    titre: "Silverstone, an RAF airfield"
    texte: "On 2 October 1948 the RAC held its International Grand Prix on Silverstone airfield, where the RAF's No. 17 Operational Training Unit had trained crews to fly the Vickers Wellington bomber at night during the war. The layout used two of the three runways and part of the perimeter track, under a mere one-year licence; from 1949 it moved to the perimeter alone (Andrew Frankel). Murray Walker recalls about 100,000 spectators, enjoying a “liberation” after the privations of the war."
    sources:
      - titre: "Motor Sport, Andrew Frankel, “When racing met RAF Silverstone: 75 years since its first British GP” (February 2023)"
        url: "https://www.motorsportmagazine.com/articles/history/when-racing-met-raf-silverstone-75-years-since-its-first-british-grand-prix"
      - titre: "Motor Sport, Simon Arron, “Silverstone's first race: the 1948 British Grand Prix” (August 2018)"
        url: "https://www.motorsportmagazine.com/archive/article/august-2018/58/silverstone-70-1940s"
  - id: "indianapolis-championnat"
    annee: 1950
    categorie: "autres-sports"
    titre: "The Indianapolis 500 in the world championship"
    texte: "From 1950 to 1960 the Indianapolis 500 counted towards the drivers' world championship, although it was run to American rules. The two worlds rarely met: in 1952 Alberto Ascari skipped the Swiss Grand Prix to contest “the world's richest race” in a 4.5-litre Ferrari 375, qualified 19th and retired with a collapsed wire wheel (Paul Fearnley). The race left the championship in 1961, when F1 moved to 1.5-litre naturally aspirated engines."
    sources:
      - titre: "Motor Sport, Paul Fearnley, “F1 and the Indy 500's separate worlds” (April 2019)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/f1-and-indy-500s-separate-worlds"
  - id: "television-1953"
    annee: 1953
    categorie: "societe"
    titre: "The first Grands Prix on television"
    texte: "Grand Prix racing is believed to have made its first live appearance on 13 September 1953, on Italy's national channel Programma Nazionale, with three visits to Monza interspersed with other programming. That same year the BBC showed only excerpts and telerecordings of the British Grand Prix, alongside horse racing from Ascot (Stuart Codling). Satellite relays only became possible after the launch of Telstar 1 in 1962."
    sources:
      - titre: "Autosport, Stuart Codling, “Going live: how F1 TV became a billion-dollar business” (updated October 2025)"
        url: "https://www.autosport.com/f1/news/going-live-how-f1-tv-became-a-billion-dollar-business-/10768815/"
  - id: "le-mans-1955"
    annee: 1955
    categorie: "autres-sports"
    titre: "The Le Mans disaster"
    texte: "In June 1955, at the Le Mans 24 Hours, Pierre Levegh's Mercedes was launched into the crowd: at least 82 dead and more than 120 injured according to Motor Sport. The backlash against motor sport that followed led to the cancellation of the French, German, Spanish and Swiss Grands Prix (Adam Cooper); Switzerland banned circuit racing for decades. Mercedes withdrew from competition at the end of the season, for practical reasons according to the company, though the crash weighed on the decision (Damien Smith)."
    sources:
      - titre: "Motor Sport, Damien Smith, “The long shadow of Le Mans 1955” (October 2024)"
        url: "https://motorsportmagazine.com/special-article/german-legends/94/the-long-shadow-of-le-mans-1955"
      - titre: "Motor Sport, Pablo Elizalde, “The day racing lost its innocence: the 1955 Le Mans tragedy” (June 2026)"
        url: "https://www.motorsportmagazine.com/articles/sports-cars/le-mans/the-day-racing-lost-its-innocence-the-1955-le-mans-tragedy/"
      - titre: "Autosport, Adam Cooper, “The potted history of F1's calendar cancellations” (February 2020)"
        url: "https://www.autosport.com/f1/news/the-potted-history-of-f1s-calendar-cancellations-5113387/5113387/"
  - id: "crise-de-suez"
    annee: 1957
    categorie: "geopolitique"
    titre: "The Suez Crisis and its cancelled Grands Prix"
    texte: "The Suez Crisis brought petrol rationing and economic difficulties (Dominic Tobin). In 1957 the BRDC postponed its International Trophy at Silverstone; the organisers of the Belgian and Dutch Grands Prix asked teams to accept reduced starting money, were turned down twice, and both races were cancelled at the eleventh hour. To fill the calendar, the governing body took on the Pescara Grand Prix."
    sources:
      - titre: "Motor Sport, Dominic Tobin, “The races that never happened: F1's cancelled grands prix” (March 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/the-races-that-never-happened-f1s-cancelled-grands-prix/"
      - titre: "Motor Sport, “42. 1957 Pescara GP: Moss supreme on perilous street track” (March 2025)"
        url: "https://www.motorsportmagazine.com/special-article/the-75-greatest-grands-prix/57/42-1957-pescara-gp-moss-supreme-on-perilous-street-track"
      - titre: "Goodwood, Paul Fearnley, “The seeds of a British F1 empire were sown 60 years ago” (April 2017)"
        url: "https://www.goodwood.com/grr/f1/the-seeds-of-a-british-f1-empire-were-sown-60-years-ago/"
  - id: "fangio-enleve-cuba"
    annee: 1958
    categorie: "geopolitique"
    titre: "Fangio kidnapped in Cuba"
    texte: "On 23 February 1958, the eve of the Cuban Grand Prix, five-time world champion Juan Manuel Fangio was abducted from Havana's Hotel Lincoln by members of the 26th of July Movement, fighting the Batista dictatorship, which had created the race to draw tourists. He was released to the Argentinian embassy. The race returned under Castro in 1960, then vanished when the United States isolated the island (Joe Dunn)."
    sources:
      - titre: "Motor Sport, Joe Dunn, “When Fangio was kidnapped in Cuba” (March 2023)"
        url: "https://motorsportmagazine.com/archive/article/march-2023/7/when-fangio-was-kidnapped-in-cuba"
  - id: "tabac-television-1965"
    annee: 1965
    categorie: "economie-mondiale"
    titre: "Cigarettes banned from British television"
    texte: "In the early 1960s the Royal College of Physicians campaigned for restrictions on tobacco publicity; from August 1965 cigarette advertising was banned from British television, while cigars stayed on screen until 1991 (Simon Arron). According to Simon Arron, the tobacco industry was quick to seek alternative promotional streams. Italy had banned all tobacco advertising as early as 1962, a law largely ignored (GrandPrix.com)."
    liens:
      - evenement: "sponsors-1968"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "Sports Car Digest says Imperial Tobacco found in sport the answer to advertising restrictions; but Simon Arron attributes Gold Leaf's arrival in F1 to a rumoured ban on coupon cigarettes, not to the television ban."
    sources:
      - titre: "Motor Sport, Simon Arron, “How F1 picked up the habit” (July 2015)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2015/136/how-f1-picked-habit"
      - titre: "GrandPrix.com, “The history of anti-tobacco legislation” (May 2005)"
        url: "https://www.grandprix.com/features/feature-the-history-of-anti-tobacco-legislation.html"
      - titre: "Sports Car Digest, Lorenzo Baer, “Gold Leaf Team Lotus: The Deal and the First Glory” (April 2024)"
        url: "https://sportscardigest.com/gold-leaf-team-lotus-the-deal-and-the-first-glory/"
  - id: "clark-indianapolis-1965"
    annee: 1965
    categorie: "autres-sports"
    titre: "Jim Clark wins at Indianapolis"
    texte: "At his third attempt, Jim Clark won the Indianapolis 500 in the Ford V8-powered Lotus 38, leading 190 of the 200 laps. In three years, Motor Sport wrote, Indianapolis had seen a complete change in car design: the win “established the pattern” of the rear engine, just as the Cooper-Climax had done in Grand Prix racing in 1959. To do so, Colin Chapman and Clark turned their backs on the Monaco Grand Prix and its £700 prize money; at Indianapolis they collected well over £50,000."
    sources:
      - titre: "Motor Sport, “Indianapolis 500-mile race (May 31st)” (July 1965)"
        url: "https://www.motorsportmagazine.com/archive/article/july-1965/35/indianapolis-500-mile-race-may-31st/"
  - id: "film-grand-prix-1966"
    annee: 1966
    categorie: "societe"
    titre: "John Frankenheimer's “Grand Prix”"
    texte: "From May to early October 1966, John Frankenheimer shot “Grand Prix” at real circuits, often during race weekends, with more than twenty active or retired drivers, including Graham Hill, Bruce McLaren and Jochen Rindt. Cameras were mounted on the cars: the drivers' association, which had opposed them in races, dropped its ban once MGM's budget became known. Released in the United States on 21 December 1966, the film won three technical Oscars (Richard Heseltine)."
    sources:
      - titre: "Motor Sport, Richard Heseltine, “50 years on: John Frankenheimer's Journey to Grand Prix” (August 2016)"
        url: "https://www.motorsportmagazine.com/special-article/best-of-racing-at-the-movies/92/50-years-on-john-frankenheimers-journey-to-grand-prix/"
  - id: "choc-petrolier-1973"
    annee: 1973
    categorie: "economie-mondiale"
    titre: "The first oil shock"
    texte: "After the Yom Kippur War, Arab oil producers cut supplies to countries backing Israel; in Britain the three-day week rationed electricity from 1 January 1974, and the economy stuttered into depression (Doug Nye). In South Africa, the government banned all motor sport using pump petrol: the long-threatened Grand Prix was allowed only after being pushed back to the end of March, and petrol sales remained banned from Friday evening to Monday morning (Motor Sport, 1974). F1 rode out the crisis: some thirty entrants raced in 1974 (Doug Nye)."
    sources:
      - titre: "Motor Sport, Doug Nye, “How motor racing thrived during the ‘three-day week’” (March 2024)"
        url: "https://motorsportmagazine.com/archive/article/march-2024/21/doug-nye-how-motor-racing-thrived-during-the-three-day-week"
      - titre: "Motor Sport, “8th South African Grand Prix” (May 1974)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1974/25/8th-south-african-grand-prix/"
      - titre: "Motor Sport, Alan Henry, “South Africa's F1 stars” (March 1982)"
        url: "https://www.motorsportmagazine.com/archive/article/march-1982/72/south-africas-f1-stars/"
  - id: "loi-veil-1976"
    annee: 1976
    categorie: "economie-mondiale"
    titre: "France's Veil law on tobacco advertising"
    texte: "In 1976 France's Veil law banned tobacco advertising on television, radio, billboards and in cinemas, but not in magazines nor at sporting events (GrandPrix.com). In Britain, sports sponsorship had been governed since 1974 by a mere voluntary agreement between the Ministry of Sport and the manufacturers. Sport thus remained one of tobacco's last shop windows."
    sources:
      - titre: "GrandPrix.com, “The history of anti-tobacco legislation” (May 2005)"
        url: "https://www.grandprix.com/features/feature-the-history-of-anti-tobacco-legislation.html"
  - id: "bbc-grand-prix-1978"
    annee: 1978
    categorie: "societe"
    titre: "The BBC shows every Grand Prix"
    texte: "Driven by the interest stirred by James Hunt's 1976 title, the BBC launched “Grand Prix” in 1978, a half-hour Sunday-evening highlights show cut from Eurovision pictures, with Murray Walker commentating from London; the first Grand Prix broadcast live from the circuit was Monaco 1980 (Simon Taylor). In 1976 the Japanese Grand Prix had already been the first round outside Europe broadcast live by satellite (Stuart Codling)."
    sources:
      - titre: "Motor Sport, Simon Taylor, “Lunch with... Murray Walker” (April 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/april-2011/70/lunch-murray-walker/"
      - titre: "Autosport, Stuart Codling, “Going live: how F1 TV became a billion-dollar business” (updated October 2025)"
        url: "https://www.autosport.com/f1/news/going-live-how-f1-tv-became-a-billion-dollar-business-/10768815/"
  - id: "renault-le-mans-1978"
    annee: 1978
    categorie: "autres-sports"
    titre: "Renault wins Le Mans, then commits to F1"
    texte: "Since 1976 Renault had been running an endurance programme alongside the RS01 single-seater, each with its own turbo V6: 2 litres at Le Mans, 1.5 litres in F1 (ACO). In 1978 Didier Pironi and Jean-Pierre Jaussaud won the 24 Hours in the Alpine A442B. According to Paul Fearnley, Le Mans had to be won before F1 could become the priority; Renault-Alpine then withdrew from endurance racing to devote itself fully to Formula 1 (ACO)."
    liens:
      - ecurie: "renault-1977"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "According to Paul Fearnley, Le Mans had to be won before F1 could become Renault's priority; the ACO writes that Renault-Alpine then left endurance racing to devote itself fully to F1."
    sources:
      - titre: "Motor Sport, Paul Fearnley, “Renault revolution: the road to a French victory” (June 2003)"
        url: "https://www.motorsportmagazine.com/special-article/24hr-legends-2025/126/renault-revolution-the-road-to-a-french-victory/"
      - titre: "24 Hours of Le Mans (ACO), Jean-Philippe Doret, “1975-1978: Renault's move from the 24 Hours of Le Mans to Formula One” (December 2015)"
        url: "https://www.24h-lemans.com/en/news/1975-1978-renaults-move-from-the-24-hours-of-le-mans-to-formula-one-22840"
      - titre: "24 Hours of Le Mans (ACO), “Renault-Alpine, harking back to yellow and black” (April 2023)"
        url: "https://www.24h-lemans.com/en/news/renault-alpine-harking-back-to-yellow-and-black-57378"
  - id: "guerre-des-malouines"
    annee: 1982
    categorie: "geopolitique"
    titre: "The Falklands War and the Argentine Grand Prix"
    texte: "In 1982 Argentina invaded the Falkland Islands. According to GrandPrix.com, the Argentine Grand Prix only died after that invasion, and was not revived until 1995; Autosport places the cancellation of the 1982 race in that context, without further detail. Argentine driver Ricardo Zunino saw his sponsorship run dry when his country invaded the islands, which ended his F1 career (Motor Sport)."
    sources:
      - titre: "GrandPrix.com, “Street racing in Buenos Aires” (April 2005)"
        url: "https://www.grandprix.com/news/street-racing-in-buenos-aires.html"
      - titre: "Autosport, Adam Cooper, “The potted history of F1's calendar cancellations” (February 2020)"
        url: "https://www.autosport.com/f1/news/the-potted-history-of-f1s-calendar-cancellations-5113387/5113387/"
      - titre: "Motor Sport, “Ricardo Zunino” (database, undated)"
        url: "https://www.motorsportmagazine.com/database/drivers/ricardo-zunino"
  - id: "apartheid-kyalami-1985"
    annee: 1985
    categorie: "geopolitique"
    titre: "Apartheid and the last South African Grand Prix"
    texte: "With South Africa largely ostracised, Renault and Ligier missed the 1985 Grand Prix after the French government intervened, cutting across FISA's view that sport and politics should not mix (Alan Henry); many European broadcasters boycotted the coverage, though not the BBC. After the race, Jean-Marie Balestre confirmed F1 would stop visiting until apartheid ended; it returned in 1992 (Ed Hardy)."
    sources:
      - titre: "Motor Sport, Alan Henry, “South African Grand Prix” (December 1985)"
        url: "https://www.motorsportmagazine.com/archive/article/december-1985/21/south-african-grand-prix-3/"
      - titre: "Autosport, Ed Hardy, “Has F1 ever raced in Africa? A look at its history with the series” (August 2024)"
        url: "https://www.autosport.com/f1/news/has-f1-ever-raced-in-africa-a-look-at-its-history-with-the-series/10644856/"
      - titre: "Autosport, Adam Cooper, “The potted history of F1's calendar cancellations” (February 2020)"
        url: "https://www.autosport.com/f1/news/the-potted-history-of-f1s-calendar-cancellations-5113387/5113387/"
  - id: "hongrie-1986"
    annee: 1986
    categorie: "geopolitique"
    titre: "A Grand Prix behind the Iron Curtain"
    texte: "On 10 August 1986 communist Hungary hosted the first Formula 1 Grand Prix held behind the Iron Curtain, in front of some 200,000 spectators. Bernie Ecclestone had first aimed at Moscow, but Soviet bureaucracy made the plan all but impossible; promoter Tamas Rohonyi suggested Budapest to him in 1983. The Hungarian government, then opening to the West, saw the race as a showcase: the Hungaroring was built in under eight months east of the capital, and the teams crossed the Austrian border without visas (Reuters)."
    sources:
      - titre: "SBS News (Reuters), “F1 helped Hungary tear hole in Iron Curtain” (July 2015)"
        url: "https://www.sbs.com.au/news/article/f1-helped-hungary-tear-hole-in-iron-curtain/d1cpzh1qb"
  - id: "sauber-mercedes-le-mans-1989"
    annee: 1989
    categorie: "autres-sports"
    titre: "Sauber-Mercedes wins at Le Mans"
    texte: "In endurance racing, Peter Sauber's Swiss team obtained from Mercedes, absent from competition since 1955, a twin-turbo V8 first developed in secret; the manufacturer returned officially in 1988 as Team Sauber Mercedes (Autosport). In 1989 Sauber won the Le Mans 24 Hours and the sportscar world championship, and the title again in 1990. According to Motor Sport, “Formula 1 was next on the horizon”: Sauber made its debut at the 1993 South African Grand Prix."
    liens:
      - ecurie: "sauber"
        mecanisme: "ouvre"
        preuve: "discute"
        pourquoi: "Motor Sport presents the endurance successes with Mercedes as the prelude to Sauber's F1 entry, but does not describe how one led to the other: the link remains indirect."
    sources:
      - titre: "Autosport, Gary Watkins, “The manufacturer tie-up that put Sauber on the map” (June 2020)"
        url: "https://www.autosport.com/wec/news/the-manufacturer-tie-up-that-put-sauber-on-the-map-5113946/5113946/"
      - titre: "Motor Sport, “Sauber” (team database, undated)"
        url: "https://www.motorsportmagazine.com/database/teams/sauber/"
  - id: "loi-evin-grand-prix-de-france"
    annee: 1992
    categorie: "economie-mondiale"
    titre: "The Évin law and the French Grand Prix"
    texte: "Passed on 10 January 1991, the Évin law banned tobacco advertising in France. In 1992, at the request of the national committee against smoking, the courts went after the broadcasting of images of cars in cigarette liveries, and Williams and Renault were fined over the Camel brand; in December the French Grand Prix was suspended from the calendar (Grandprix.com). On 23 December 1992 the government had Parliament pass an amendment allowing the broadcast of races televised from countries where tobacco advertising was permitted, along with a 450-million-franc fund for motor sport; the Magny-Cours race went ahead in 1993 (French National Assembly)."
    sources:
      - titre: "Grandprix.com, “The history of anti-tobacco legislation” (May 2005)"
        url: "https://www.grandprix.com/features/feature-the-history-of-anti-tobacco-legislation.html"
      - titre: "French National Assembly, Patrick Balkany, “Written question no. 65751: motor sport”, and the government's answer (December 1992)"
        url: "https://www.assemblee-nationale.fr/dyn/9/questions/QANR5L9QE65751.pdf"
  - id: "television-numerique-1996"
    annee: 1996
    categorie: "societe"
    titre: "F1 on digital pay television"
    texte: "In the mid-1990s Bernie Ecclestone bet on interactive digital television: a multi-channel feed, tried at Hockenheim in 1995, was sold to digital broadcasters such as Germany's DF1 and Italy's Telepiù, while pay-per-view still reached only a few hundred thousand homes (Joe Saward). Launched in 1996 as F1 Digital+, the service let viewers pick their own cameras; budgeted at about $35m, it reportedly cost Ecclestone some $100m before it was shut down in 2002 (Dieter Rencken)."
    sources:
      - titre: "Grandprix.com, Joe Saward, “The future of Formula 1 television” (March 1996)"
        url: "https://www.grandprix.com/features/joe-saward/financial-the-future-of-formula-1-television.html"
      - titre: "Autosport, Dieter Rencken, “The $150m gamble that spooked F1” (March 2017)"
        url: "https://www.autosport.com/f1/news/the-150m-gamble-that-spooked-f1-5109497/5109497/"
  - id: "exemption-tabac-1997"
    annee: 1997
    categorie: "economie-mondiale"
    titre: "F1, tobacco and the Blair government"
    texte: "Elected in May 1997, Britain's Labour government set out to ban tobacco advertising. In October Max Mosley and Bernie Ecclestone met Tony Blair at Downing Street, and Labour decided to exempt Grand Prix racing; in November the party announced that Ecclestone would get his £1m donation back. In December the European Union rejected the ten-year exclusion London had requested for F1, but gave it until 1 October 2006 (Grandprix.com)."
    sources:
      - titre: "Grandprix.com, “The history of anti-tobacco legislation” (May 2005)"
        url: "https://www.grandprix.com/features/feature-the-history-of-anti-tobacco-legislation.html"
  - id: "malaisie-1999"
    annee: 1999
    categorie: "economie-mondiale"
    titre: "Mahathir's Malaysia bets on F1"
    texte: "In the mid-1990s Malaysian prime minister Mahathir Mohamad set out to make his country a fully industrialised nation by 2020. As part of that policy, the national oil company Petronas sponsored the Sauber team, with F1 meant as a showcase for Malaysian high technology; work on the Hermann Tilke-designed Sepang circuit began in early 1997 (Grandprix.com). In October 1999 it hosted the first Malaysian Grand Prix, won by Eddie Irvine for Ferrari after an appeal against the team's disqualification (Formula 1)."
    sources:
      - titre: "Grandprix.com, “Sepang International” (circuit guide, undated)"
        url: "https://www.grandprix.com/circuits/sepang-international.html"
      - titre: "Formula 1, “The Malaysian Grand Prix - did you know?” (March 2015)"
        url: "https://www.formula1.com/en/latest/article/the-malaysian-grand-prix-did-you-know-.1SsyzCaENkaNRPGJzC0OJG"
  - id: "bahrein-2004"
    annee: 2004
    categorie: "geopolitique"
    titre: "First Grand Prix in the Middle East"
    texte: "In 2004 the Hermann Tilke-designed Sakhir circuit in Bahrain hosted the first Formula 1 Grand Prix held in the Middle East (Motor Sport). China joined the calendar the same season and Turkey followed in 2005: new countries, sometimes less restrictive on tobacco, at a time when the European ban had already pushed some races out of Europe (Autosport, Nick Mulvenney)."
    sources:
      - titre: "Motor Sport, “Sakhir” (circuit database, undated)"
        url: "https://www.motorsportmagazine.com/database/circuits/sakhir/"
      - titre: "Autosport, Nick Mulvenney, “Analysis: F1 forced to try to kick tobacco habit” (January 2005)"
        url: "https://www.autosport.com/f1/news/analysis-f1-forced-to-try-to-kick-tobacco-habit-5067652/5067652/"
  - id: "directive-tabac-2005"
    annee: 2005
    categorie: "economie-mondiale"
    titre: "Europe bans tobacco sponsorship"
    texte: "EU Directive 2003/33/EC of 26 May 2003 banned tobacco sponsorship of events taking place in several member states or otherwise having cross-border effects; it had to be transposed by 31 July 2005 at the latest. A first directive, passed in 1998, had been struck down in 2000 by the Court of Justice for resting on the wrong legal basis (Grandprix.com). In 2004 Ferrari, McLaren, Renault, Jordan and BAR still relied heavily on cigarette brands; in 2002 the FIA put their contribution to motor sport at $350m a year, and Frank Williams reckoned other sponsors paid 25 to 30 per cent less (Autosport, Nick Mulvenney)."
    sources:
      - titre: "legislation.gov.uk, “Directive 2003/33/EC of the European Parliament and of the Council of 26 May 2003” (May 2003)"
        url: "https://www.legislation.gov.uk/eudr/2003/33/data.htm?view=plain"
      - titre: "Autosport, Nick Mulvenney, “Analysis: F1 forced to try to kick tobacco habit” (January 2005)"
        url: "https://www.autosport.com/f1/news/analysis-f1-forced-to-try-to-kick-tobacco-habit-5067652/5067652/"
      - titre: "Grandprix.com, “The history of anti-tobacco legislation” (May 2005)"
        url: "https://www.grandprix.com/features/feature-the-history-of-anti-tobacco-legislation.html"
  - id: "crise-financiere-2008"
    annee: 2008
    categorie: "economie-mondiale"
    titre: "The financial crisis drives out three manufacturers"
    texte: "On 5 December 2008, at the height of the global economic crisis, Honda announced its withdrawal; the company was already cutting jobs in Europe and could no longer justify funding the team (The Race). On 29 July 2009 BMW in turn announced it would leave at the end of the season, citing a “strategic realignment” towards sustainability (BMW Group), while Motor Sport describes it as a victim of the worsening world economy. On 4 November 2009 Toyota, which had posted its first ever operating loss in March, withdrew, citing “the current severe economic realities” (Autosport)."
    liens:
      - evenement: "honda-brawn-2008"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "Honda withdrew “at the height of the global economic crisis”, while it was making staff redundant across Europe (The Race, Scott Mitchell-Malm)."
      - ecurie: "toyota"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Toyota attributed its withdrawal to “the current severe economic realities”, after its first ever operating loss (Autosport, Matt Beer)."
      - ecurie: "bmw-sauber"
        mecanisme: "ferme"
        preuve: "discute"
        pourquoi: "Motor Sport attributes BMW's exit to the worsening world economy, but BMW itself cited a strategic realignment towards sustainability, without mentioning the crisis."
    sources:
      - titre: "The Race, Scott Mitchell-Malm, “The last time Honda withdrew from F1 – by those it left behind” (April 2021)"
        url: "https://the-race.com/formula-1/the-last-time-honda-withdrew-from-f1-by-those-it-left-behind"
