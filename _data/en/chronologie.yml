  - id: "f-duct"
    annee: 2010
    voie: "aero"
    titre: "McLaren's F-duct"
    texte: "By covering a hole in the cockpit, the driver stalled the rear wing on the straights and cut drag. Developed at McLaren from the end of 2008, according to Paddy Lowe (Tim Goss and Doug McKiernan share the credit with the whole team), it was copied first by Sauber, then by others; banned for 2011, it was replaced by DRS."
    entrees: []
    termes: [aileron, drs]
    sources:
      - titre: "Autosport, Matt Somerfield, “Banned: The 2010 Formula 1 season's F-duct” (April 2020)"
        url: "https://www.autosport.com/f1/news/149090/banned-the-f1-2010-season-fduct"
      - titre: "Autosport, Jonathan Noble, “McLaren upbeat on 2011 car progress” (December 2010)"
        url: "https://www.autosport.com/f1/news/88611/mclaren-upbeat-on-2011-car-progress"
      - titre: "GrandPrix.com, “McLaren: Original thinking” (February 2011)"
        url: "https://www.grandprix.com/features/2010-grand-prix-review-mclaren-original-thinking.html"

  - id: "rb18"
    annee: 2022
    voie: "aero"
    titre: "The 2022 Red Bull"
    texte: "According to formula1.com in 2024, Adrian Newey, drawing on his experience of ground-effect cars, fed key ideas into the Red Bull's concept; in 2022, the same site had limited his direct contribution to the design to the suspension, which he drew himself. The aim was to deliver downforce dependably. In early 2023, several teams adopted the Red Bull's sidepods; Mercedes refused and Ferrari at first kept its own concept, before both adopted sidepods of this type themselves during the 2023 season."
    entrees: [adrian-newey]
    termes: [effet-de-sol]
    sources:
      - titre: "Formula1.com, Edd Straw, “An innovator and trendsetter – Adrian Newey's greatest F1 contributions” (May 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
