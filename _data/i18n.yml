  ecuries:
    titre_page: "Écuries"
    description: "La généalogie des écuries de Formule 1 : chaque structure suivie à travers ses rachats et ses changements de nom, chaque filiation justifiée par ses sources."
    titre: "Généalogie des écuries"
    accroche: "Une écurie de F1 change souvent de nom sans changer d'usine ni d'équipe : Tyrrell est devenue Mercedes, Stewart est devenue Red Bull. Les années se lisent de haut en bas ; chaque colonne suit une usine, et chaque nom y est une carte posée à la hauteur de ses saisons. La fiche de chaque écurie justifie, sources à l'appui, le passage d'un nom au suivant."
    perimetre: "Périmètre : tous les constructeurs qui ont pris le départ d'au moins un Grand Prix du championnat du monde depuis 1958, avec leurs saisons antérieures. N'y figurent pas les engagés des seules 500 miles d'Indianapolis, ni les équipes qui ne se sont jamais qualifiées (Life, Kauhsen, McGuire…). Une saison compte dès qu'une voiture a pris le départ, y compris les Formule 2 admises au Grand Prix d'Allemagne. Un constructeur est suivi sous le nom des résultats officiels ; une même rangée peut accueillir plusieurs écuries qui ne se chevauchent pas."
