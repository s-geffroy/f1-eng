  tiers:
    titre_page: "Tiers"
    description: "Les vingt ingénieurs répartis en quatre tiers, du changement de paradigme à l'impact plus localisé."
    titre: "Les quatre tiers"
    hc: "Les vingt classés ne sont pas les seuls acteurs documentés : d'autres entrées, marquées HC (hors classement), décrivent une contribution sans rang, ni tier, ni score. Elles figurent dans l'index."
    lire: "Comment lire le tier, le score et la confiance"
    accroche: "Cinq ingénieurs ont changé la grammaire de la F1 ; quinze autres ont transformé des sous-systèmes, des méthodes ou des trajectoires techniques majeures. Le classement est une sélection argumentée, pas une liste exhaustive des grands ingénieurs."
  lignees:
    titre_page: "Lignées"
    description: "Cinq lignées techniques de la Formule 1, de Cooper à Newey, chaque filiation justifiée par ses sources."
    titre: "Les lignées techniques"
    accroche: "Ces chaînes montrent des filiations intellectuelles entre les entrées, pas des relations de maître à élève. Sous chaque chaîne, une phrase dit ce qui passe d'une étape à la suivante, avec son niveau de preuve et ses sources : une filiation qui n'est pas justifiée par écrit n'est pas publiée."
    et: "et"
    tiers_titre: "Lignées et tiers"
    tiers_texte: "Une lignée suit un domaine technique et ce qui s'y transmet d'un ingénieur à l'autre ; un tier mesure le degré d'impact d'un ingénieur. Un ingénieur du Tier D peut prolonger une lignée ouverte au Tier A, et un ingénieur peut être très bien classé sans appartenir à aucune lignée."
    absents_avant: "Les lignées ne publient que les filiations documentées par une source. Ces ingénieurs classés n'y figurent pas : aucune filiation documentée ne les place aujourd'hui dans une chaîne, même quand ils ont collaboré avec un autre classé. Leur absence ne retire rien à leur rang :"
  chrono:
    titre_page: "Chronologie"
    description: "La frise des grandes innovations techniques de la Formule 1, de la Cooper 500 de 1946 à la Red Bull de 2022, reliées aux ingénieurs qui les ont portées."
    titre: "Chronologie des innovations"
    accroche: "Quatre-vingts ans de ruptures techniques, au-dessus de l'axe ; en dessous, le contexte qui les explique : règlement, sécurité, économie, technologie venue d'ailleurs, et le monde autour de la F1 : géopolitique, économie mondiale, autres sports, société. Cliquez sur un repère pour ouvrir sa fiche ; les losanges rouges signalent une innovation portée par un ingénieur du Tier A. Sous la frise, une bande suit les écuries à travers leurs noms successifs, avec leurs voitures. La frise retient une sélection de ruptures, pas un inventaire : une innovation ou un lien n'y figure que si une source le justifie."
