- id: suspension-progressive
  terme: Suspension à flexibilité progressive
  motifs:
  - flexibilité progressive
  definition: 'Par un jeu de biellettes et de culbuteurs, le ressort et l''amortisseur sont comprimés de plus en plus fort à mesure que la roue monte : la suspension reste souple au départ et se durcit sous la charge. Les sources divergent sur la première F1 à l''avoir employée.'
