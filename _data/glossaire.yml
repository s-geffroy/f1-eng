    url: https://www.motorsportmagazine.com/archive/article/august-2016/100/lunch-frank-dernie/
- id: cao
  terme: CAO, CAE et CFD
  motifs:
  - CAO
  definition: La CAO sert à dessiner les pièces en numérique ; le calcul assisté (CAE) regroupe les calculs de résistance et de suspension ; la CFD simule l'écoulement de l'air autour de la voiture, en complément de la soufflerie. L'usage de la CFD est aujourd'hui plafonné par le règlement.
  entrees:
  - frank-dernie
  - alan-jenkins
  sources:
  - titre: Formula 1, glossaire A-E
    url: https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2
