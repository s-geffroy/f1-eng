- id: architecture-moteur
  terme: Architecture moteur et cylindrée
  motifs:
  - V10
  - V12
  - V8
  - V6
  definition: 'L''architecture désigne le nombre et la disposition des cylindres : en V, deux rangées forment un angle (V6, V8, V10, V12) ; à plat, à 180°, elles se font face, comme dans le flat-12. La cylindrée est le volume total des cylindres, partagé entre eux : à 3 litres, chaque cylindre fait 250cm³ dans un douze-cylindres et 375cm³ dans un huit-cylindres. Le règlement fixe d''abord la cylindrée des moteurs atmosphériques, 3 litres en 1966, 3,5 litres en 1987 (seuls admis à partir de 1989), 3 litres en 1995, puis l''architecture elle-même : dix cylindres imposés en 2000, V8 de 2,4 litres en 2006, V6 turbo de 1,6 litre en 2014.'
  entrees:
  - keith-duckworth
  - ettore-zaccone-mina
  - francois-castaing
