- id: aileron
  terme: Aileron
  motifs:
  - ailerons
  - aileron
  definition: 'Aile d''avion montée à l''envers, à l''avant ou à l''arrière : au lieu de soulever la voiture, elle la plaque au sol, au prix d''une traînée accrue. En 1968-1969, les ailerons sont montés sur de hauts mâts ; ces montages sont interdits en 1969, après des accidents.'
  premiere: 'Contestée : Ferrari et Brabham essaient des ailerons sur supports à Spa en 1968 ; d''autres les avaient précédés.'
