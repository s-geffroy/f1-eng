- id: diffuseur
  terme: Diffuseur et double diffuseur
  motifs:
  - double diffuseur
  - diffuseur
  definition: 'Le diffuseur est la partie arrière relevée du plancher : il règle la vitesse à laquelle l''air passé sous la voiture en sort ; plus cette sortie est rapide, plus la pression dessous baisse, ce qui crée de l''appui. Le double diffuseur de 2009 exploite une ambiguïté du règlement pour alimenter un second étage ; il est interdit à partir de 2011.'
  premiere: 'Double diffuseur : 2009, chez Brawn, Toyota et Williams.'
  entrees:
  - ross-brawn
  - adrian-newey
