    url: https://www.autosport.com/f1/news/the-2007-decision-that-built-mercedes-hybrid-empire-5112574/5112574/
- id: drs
  terme: DRS
  motifs:
  - DRS
  definition: 'Système de réduction de la traînée : le pilote ouvre un volet de l''aileron arrière dans une zone définie, derrière une autre voiture, pour gagner de la vitesse en ligne droite. Introduit en 2011 à la place du F-duct, il est jugé dès le départ comme un palliatif aux difficultés des voitures à se suivre.'
  premiere: '2011.'
  entrees: []
  sources:
