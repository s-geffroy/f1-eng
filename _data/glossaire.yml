- id: f-duct
  terme: F-duct
  motifs:
  - F-duct
  definition: 'Conduit qui permet au pilote de faire décrocher l''aileron arrière en ligne droite. En obturant un orifice du cockpit, il envoie de l''air vers une fente de l''aileron : l''écoulement se décolle, l''appui et la traînée chutent, et la vitesse de pointe augmente. Son nom vient de la lettre F du logo Vodafone, placé à côté de la prise d''air. Imité par plusieurs équipes dès 2010, il est écarté pour 2011, pour raisons de coût et de sécurité, et remplacé par le DRS.'
  premiere: McLaren MP4-25, 2010.
  entrees: []
