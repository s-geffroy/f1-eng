- id: diffuseur-souffle
  terme: Diffuseur soufflé
  motifs:
  - diffuseur soufflé
  - diffuseurs soufflés
  - échappement soufflé
  definition: 'Les gaz d''échappement sont dirigés vers le diffuseur : ils renforcent la dépression sous le plancher et forment un jet qui en scelle les côtés, ce qui augmente l''appui à l''arrière. L''effet faiblit quand le pilote lâche l''accélérateur, au freinage et en entrée de virage ; des cartographies moteur font alors souffler le moteur pied levé, en coupant l''essence et l''allumage (soufflage « à froid ») ou en retardant l''allumage (« à chaud »). Employé dans les années 1980 et 1990, le procédé revient en 2010, notamment sur la Red Bull RB6 avec les cartographies Renault ; en 2012, une zone imposée pour la sortie d''échappement met fin aux diffuseurs soufflés de l''époque.'
  entrees:
  - adrian-newey
  sources:
