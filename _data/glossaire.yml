- id: voiture-a-ventilateur
  terme: Voiture à ventilateur
  motifs:
  - ventilateur
  definition: Un ventilateur aspire l'air sous la voiture, dont les côtés sont scellés par des jupes, et crée une dépression qui la plaque au sol, quelle que soit la vitesse. Sur la Brabham BT46B, il était entraîné par la boîte et présenté comme un organe de refroidissement.
  premiere: Brabham BT46B, Grand Prix de Suède 1978, sa seule course.
  entrees:
  - gordon-murray
  sources:
  - titre: The Race, « Nine things you may not know about Brabham's iconic F1 fan car »
    url: https://www.the-race.com/formula-1/nine-things-you-may-not-know-about-brabhams-iconic-f1-fan-car
