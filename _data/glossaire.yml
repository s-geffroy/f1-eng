  terme: KERS
  motifs:
  - KERS
  definition: 'Système de récupération de l''énergie cinétique : au freinage, un moteur-générateur convertit une partie de l''énergie en électricité, stockée puis rendue au pilote sous forme de puissance supplémentaire. Autorisé en 2009, limité alors à 60kW pendant 6,6 secondes par tour, il précède le groupe propulseur hybride de 2014.'
