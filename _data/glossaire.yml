  definition: La CAO sert à dessiner les pièces en numérique ; le calcul assisté par ordinateur (CAE) regroupe les calculs d'ingénierie, comme l'analyse des structures par éléments finis ; la CFD simule l'écoulement de l'air autour de la voiture, en complément de la soufflerie. L'usage de la CFD est aujourd'hui plafonné par le règlement.
