    url: https://www.motorsportmagazine.com/archive/article/august-2016/100/lunch-frank-dernie/
- id: soufflerie
  terme: Soufflerie
  motifs:
  - soufflerie
  definition: Un grand ventilateur souffle de l'air sur une maquette réduite, et des balances mesurent l'appui et la traînée. Le tapis roulant, qui défile sous la maquette et fait tourner les roues, est décisif pour mesurer correctement l'effet de sol.
  entrees:
  - peter-wright
  - tony-rudd
  - tony-southgate
  - frank-dernie
  - jean-claude-migeot
  - ross-brawn
