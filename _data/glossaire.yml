    url: https://www.motorsportmagazine.com/archive/article/august-2016/100/lunch-frank-dernie/
- id: ravitaillement
  terme: Ravitaillement et arrêt tactique
  motifs:
  - ravitaillement
  definition: La voiture part allégée et s'arrête en course pour faire le plein et changer de roues, ce qui la rend plus rapide à chaque relais. Le ravitaillement est interdit de 1984 à 1993, autorisé de 1994 à 2009, puis interdit depuis 2010 ; l'arrêt ne sert plus qu'au changement de pneus.
  premiere: 'Arrêt tactique moderne : Brabham, 1982.'
  entrees:
  - gordon-murray
