- id: flat-12
  terme: Flat-12
  motifs:
  - flat-12
  definition: Moteur à douze cylindres dont les deux rangées sont à plat, face à face (V à 180°). Très bas, il abaisse le centre de gravité et dégage l'air vers l'aileron arrière, mais il est large et gêne les tunnels d'effet de sol.
  entrees:
