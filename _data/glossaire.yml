- id: drs
  terme: DRS
  motifs:
  - DRS
  definition: 'Système de réduction de la traînée : le pilote ouvre un volet de l''aileron arrière dans une zone définie, derrière une autre voiture, pour gagner de la vitesse en ligne droite. Introduit en 2011 à la place du F-duct, il est jugé dès la fin de sa première saison, par Gary Anderson (Autosport), comme un pansement en attendant un règlement qui permette aux voitures de se suivre.'
