- id: rappel-pneumatique
  terme: Rappel pneumatique des soupapes
  motifs:
  - rappel pneumatique
  definition: Le ressort métallique qui referme chaque soupape est remplacé par un petit volume de gaz comprimé. À très haut régime, les ressorts d'acier n'arrivent plus à refermer les soupapes à temps ; le rappel pneumatique permet de monter beaucoup plus haut en régime.
  premiere: Moteur Renault EF15 B, 1986.
  entrees:
