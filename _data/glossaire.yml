# Glossaire technique (page /glossaire/). Definitions sourcees. motifs : expressions
# liees a leur premiere mention dans le texte des entrees (script de liaison).
- id: appui
  terme: Appui aérodynamique
  motifs:
  - appui
  definition: Force verticale produite par l'air, qui plaque la voiture sur la piste. Elle vient des ailerons ou du dessous de la voiture, et augmente l'adhérence en virage au prix d'une traînée en ligne droite.
  entrees:
  - peter-wright
  - tony-rudd
  - tony-southgate
  - rory-byrne
  sources:
  - titre: Formula 1, glossaire A-E
    url: https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2
  - titre: Motor Sport Magazine, « Something in the air » (juillet 2014)
    url: https://www.motorsportmagazine.com/archive/article/july-2014/149/something-air/
- id: portance
  terme: Portance
  motifs:
  - portance
  definition: 'Force aérodynamique verticale dirigée vers le haut : le contraire de l''appui. C''est elle qui fait voler un avion ; une F1 monte ses ailerons à l''envers pour produire de l''appui à la place. Une roue exposée au vent engendre elle aussi de la portance : selon son concepteur Derek Gardner, cité par Motor Sport, les quatre petites roues avant de la Tyrrell P34 devaient réduire celle des roues avant classiques et permettre d''alléger l''aérodynamique avant.'
  entrees:
  - derek-gardner
  sources:
  - titre: Formula 1, glossaire F-J
    url: https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX
  - titre: 'Formula 1, « F1 EXPLAINS: Downforce and why F1 cars have wings – with McLaren Aero Specialist Emel Cankaya » (octobre 2024)'
    url: https://www.formula1.com/en/latest/article/f1-explains-downforce-and-why-f1-cars-have-wings-with-mclaren-aero.10xj8CJPz8s7CmwfoyWmCU
  - titre: 'Motor Sport Magazine, Nigel Roebuck, « P34: The real story behind Tyrrell''s incredible six-wheeler F1 car » (février 2011)'
    url: https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four

# --- a inserer apres « voiture-aile » (avant « chassis »)
- id: effet-de-sol
  terme: Effet de sol
  motifs:
  - effet de sol
  definition: 'L''appui ne vient plus seulement des ailerons mais du dessous de la voiture : on y forme un passage d''air qui se rétrécit puis s''élargit, où l''air accélère et sa pression baisse, ce qui aspire la voiture vers la piste. Sur les premières voitures à effet de sol, le procédé n''est efficace que si les côtés sont rendus étanches par des jupes ; on apprendra plus tard à s''en passer. Il est restreint en 1981 par l''interdiction des jupes coulissantes, puis banni par le fond plat obligatoire de 1983 ; il revient en 2022 sous forme de tunnels, puis est atténué par les fonds plus plats de 2026.'
  premiere: Lotus 78, 1977, selon Motor Sport.
  entrees:
  - colin-chapman
  - peter-wright
  - tony-rudd
  - ralph-bellamy
  - martin-ogilvie
  - tony-southgate
  sources:
  - titre: 'Formula 1, « TECH TUESDAY: The Lotus 79, F1''s ground effect marvel »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw
  - titre: Formula 1, glossaire F-J
    url: https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX
  - titre: Motor Sport Magazine, « Something in the air » (juillet 2014)
    url: https://www.motorsportmagazine.com/archive/article/july-2014/149/something-air/
  - titre: "Motor Sport Magazine, championnat du monde de F1 1981"
    url: "https://www.motorsportmagazine.com/database/championships/f1/1981-f1-world-championship"
- id: venturi
  terme: Venturi
  motifs:
  - venturi
  definition: 'Conduit qui se rétrécit puis s''évase : selon le principe de Bernoulli, l''air y accélère et sa pression chute. En F1, ce sont les canaux formés sous les pontons ou sous le plancher, qui débouchent à l''arrière dans le diffuseur. C''est le moteur physique de l''effet de sol.'
  entrees:
  - rory-byrne
  sources:
  - titre: 'Formula 1, « TECH TUESDAY: The Lotus 79, F1''s ground effect marvel »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw
  - titre: Formula 1, glossaire F-J
    url: https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX
- id: jupes
  terme: Jupes
  motifs:
  - jupes
  definition: Cloisons qui descendent des flancs des pontons jusqu'au sol, pour empêcher l'air extérieur de remplir la zone de basse pression sous la voiture. Elles devaient coulisser verticalement pour suivre les bosses. Les jupes coulissantes sont interdites en 1981.
  entrees:
  - ralph-bellamy
  - colin-chapman
  sources:
  - titre: 'Motor Sport Magazine, « Lotus 78: F1''s first true ground effect car » (février 2020)'
    url: https://www.motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2
  - titre: 'Formula 1, « TECH TUESDAY: The Lotus 79, F1''s ground effect marvel »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw
  - titre: Motor Sport Magazine, championnat du monde de F1 1981
    url: https://www.motorsportmagazine.com/database/championships/f1/1981-f1-world-championship
- id: fond-plat
  terme: Fond plat
  motifs:
  - fond plat
  definition: Obligation réglementaire, à partir de 1983, d'un dessous de voiture plat. Elle supprime les profils d'aile sous les pontons et les jupes, donc l'effet de sol à tunnels ; les voitures à fond plat gardent néanmoins un diffuseur arrière.
  premiere: 1983, décision annoncée le 3 novembre 1982.
  entrees:
  - gordon-murray
  sources:
  - titre: Motor Sport Magazine, « F1's race to the flat bottom » (mai 2013)
    url: https://www.motorsportmagazine.com/archive/article/may-2013/82/flat-race/
  - titre: 'Formula 1, « TECH TUESDAY: France flashback – how F1 looked in 1990 »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-france-flashback-how-f1-looked-in-1990.1ysdfhQzeImE2IeqokCeQG
  - titre: "Patrick Head, Motor Sport Magazine, « Mansell's perfect ride » (mars 2012)"
    url: "https://motorsportmagazine.com/archive/article/march-2012/66/mansells-perfect-ride"
- id: voiture-aile
  terme: Voiture-aile
  motifs:
  - voiture-aile
  definition: Voiture dont la carrosserie entière, et surtout les pontons, est profilée comme une aile inversée pour produire l'appui sans ailerons rapportés. Le terme désigne aussi bien le projet BRM de 1969, dont les pontons sont repris sur la March 701, que les Lotus 78 et 79 à effet de sol.
  premiere: Projet BRM de 1969, non abouti, puis Lotus 78 en 1977.
  entrees:
  - peter-wright
  - tony-rudd
  - tony-southgate
  - ralph-bellamy
  sources:
  - titre: Motor Sport Magazine, « Something in the air » (juillet 2014)
    url: https://www.motorsportmagazine.com/archive/article/july-2014/149/something-air/
  - titre: 'Motor Sport Magazine, « Lotus 78: F1''s first true ground effect car » (février 2020)'
    url: https://www.motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2
- id: pontons
  terme: Pontons
  motifs:
  - pontons
  - ponton
  definition: 'Volumes profilés placés de part et d''autre du cockpit. Ils abritent les radiateurs qui refroidissent le moteur et des structures qui protègent le pilote des chocs latéraux, et leur forme guide l''écoulement de l''air. La Lotus 72 de 1970 y loge ses radiateurs, qui quittent le nez ; sur les Lotus 78 et 79, leur forme intérieure dessine le canal en venturi de l''effet de sol, fermé au sol par des jupes.'
  entrees:
  - peter-wright
  - maurice-philippe
  - colin-chapman
  - ralph-bellamy
  sources:
  - titre: Formula 1, glossaire P-T
    url: https://www.formula1.com/en/latest/article/f1-glossary-p-t.GBhLQtpeu9b8LrK5VM0F1
  - titre: Classic Team Lotus, « Lotus 72 50th birthday » (2020)
    url: https://classicteamlotus.co.uk/en/news/posts/2020/lotus-72-50th-birthday/
  - titre: 'Formula 1, « TECH TUESDAY: The Lotus 79, F1''s ground effect marvel »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-the-lotus-79-f1s-ground-effect-marvel.sAD9PXt7mC8iMSwwe6CCw
  - titre: "Gary Watkins, Autosport, « The troubled story of F1's greatest racing car » (octobre 2020)"
    url: "https://www.autosport.com/f1/news/the-troubled-story-of-f1s-greatest-racing-car-5114448/5114448/"

# --- a inserer apres « pontons » (avant « monocoque »)
- id: chassis
  terme: Châssis
  motifs:
  - architecture du châssis
  - conception du châssis
  - intégration du châssis
  definition: 'Structure principale de la voiture, sur laquelle tout le reste est monté ou fixé. Jusqu''au début des années 1960, c''est un cadre de tubes ; dans une F1 moderne, c''est la monocoque en composite carbone, cellule de survie du pilote, surnommée « baignoire ». La carrosserie, elle, regroupe les pièces fixées à l''extérieur, comme le capot moteur, les pontons ou le nez, le plus souvent en composites et dessinées pour l''aérodynamique.'
  entrees:
  - john-cooper
  - john-barnard
  - rory-byrne
  - mike-gascoyne
  - steve-nichols
  sources:
  - titre: Formula 1, glossaire A-E
    url: https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2
  - titre: Formula 1, glossaire K-O
    url: https://www.formula1.com/en/latest/article/f1-glossary-k-o.6g2hrWHA2pyxbXoe8FT9Db
  - titre: Motor Sport Magazine, « A new frame of reference » (mai 2002)
    url: https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/

# --- a inserer apres « rappel-pneumatique » (avant « flat-12 »)
- id: monocoque
  terme: Monocoque
  motifs:
  - monocoque
  definition: '« Coque unique » : au lieu de suspendre la mécanique à un cadre de tubes, on fait travailler une coque fermée, en tôles rivetées comme en aviation, puis en composites. La structure gagne en rigidité pour un poids moindre. Aujourd''hui, la monocoque est la cellule de survie du pilote.'
  premiere: Lotus 25, 1962 (Colin Chapman parlait plutôt de « baignoire »).
  entrees:
  - colin-chapman
  - john-barnard
  - alan-jenkins
  - martin-ogilvie
  - tony-rudd
  sources:
  - titre: Lotus, « Lotus Type 25 — The Revolutionary Monocoque »
    url: https://www.lotuscars.com/en/lotus-story/race-cars/type-25
  - titre: Formula 1, glossaire K-O
    url: https://www.formula1.com/en/latest/article/f1-glossary-k-o.6g2hrWHA2pyxbXoe8FT9Db
  - titre: Motor Sport Magazine, « A new frame of reference » (mai 2002)
    url: https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/
  - titre: "Motor Sport, Doug Nye, « Colin Chapman: chassis pioneer » (mars 2022)"
    url: "https://motorsportmagazine.com/archive/article/march-2022/23/colin-chapman-chassis-pioneer"
- id: chassis-tubulaire
  terme: Châssis tubulaire
  motifs:
  - châssis tubulaire
  - tubes courbes
  definition: Cadre en trois dimensions fait de tubes disposés en triangles. Il relie entre eux les éléments mécaniques (moteur, suspensions, direction). C'était l'architecture standard des F1 jusqu'au début des années 1960.
  entrees:
  - colin-chapman
  - owen-maddock
  sources:
  - titre: Motor Sport Magazine, « A new frame of reference » (mai 2002)
    url: https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/
  - titre: 'Motor Sport Magazine, « Classified spotlight: Cooper T51 »'
    url: https://motorsportmagazine.com/articles/single-seaters/f1/classified-spotlight-cooper-t51
- id: nid-d-abeille
  terme: Nid d'abeille
  motifs:
  - nid d'abeille
  definition: 'Panneau sandwich : deux peaux minces de part et d''autre d''une âme alvéolée, en aluminium ou en Nomex. Très léger et rigide, il forme les coques de F1 dans les années 1970 et au début des années 1980, plié plutôt que riveté par Postlethwaite à partir de la Wolf de 1979, avant de servir d''âme aux composites.'
  entrees:
  - harvey-postlethwaite
  - martin-ogilvie
  - ralph-bellamy
  sources:
  - titre: Peter Wright, GrandPrix.com, « Dr Harvey Postlethwaite, an appreciation »
    url: https://www.grandprix.com/features/peter-wright/technical-dr-harvey-postlethwaite-an-appreciation.html
  - titre: "Motor Sport, Doug Nye, « Lotus 78: F1’s first true ground effect car » (février 2020)"
    url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
  - titre: "McLaren, « Vodafone McLaren Mercedes MP4-24 Press Pack » (2009, copie archivée)"
    url: "https://web.archive.org/web/20090316082117/http://www.mclaren.com/f1season/2009/presspack09/tech-spec.php"
  - titre: "Motor Sport Magazine, « Ferrari – World Champion Constructors » (décembre 1982)"
    url: "https://www.motorsportmagazine.com/archive/article/december-1982/40/ferrari-world-champion-constructors/"
  - titre: "Formula1.com, Mark Hughes, « How Niki Lauda's final title-winning car, the 1984 McLaren MP4/2, changed F1 » (mai 2020)"
    url: "https://www.formula1.com/en/latest/article/how-niki-laudas-final-title-winning-car-the-1984-mclaren-mp4-2-changed-f1.7vGiQXahtUbaKo70ZJ8OGQ"
- id: composite-carbone
  terme: Composite carbone
  motifs:
  - composite carbone
  - composites carbone
  - fibre de carbone
  definition: Fibres de carbone noyées dans une résine, empilées en couches orientées selon les efforts, puis cuites. Le matériau est très rigide et très résistant pour un poids minime ; son rapport rigidité/poids et sa tenue aux chocs en ont fait la base de la sécurité moderne.
  premiere: 'Châssis entier à courir en Grand Prix : McLaren MP4/1, 1981.'
  entrees:
  - john-barnard
  - alan-jenkins
  - steve-nichols
  - harvey-postlethwaite
  sources:
  - titre: McLaren, « MP4/1 »
    url: https://www.mclaren.com/racing/heritage/formula-1/cars/1981-formula-1-mclaren-mp4-1/
  - titre: Formula 1, glossaire A-E
    url: https://www.formula1.com/en/latest/article/f1-glossary-a-e.1MFONigMlQSbSQtpP7YCy2
  - titre: "Motor Sport, Rob Widdows, « Carbon natural » (mai 2007)"
    url: "https://www.motorsportmagazine.com/archive/article/may-2007/73/carbon-natural"
- id: moteur-porteur
  terme: Moteur porteur
  motifs:
  - moteur porteur
  - élément structurel
  - composant structurel
  definition: 'Le bloc moteur, très rigide, fait lui-même partie du châssis : la coque s''y accroche à l''avant, la suspension arrière et la boîte de vitesses à l''arrière. On supprime le cadre arrière, ce qui allège et raccourcit la voiture.'
  premiere: Généralisé avec la Lotus 49 et le DFV en 1967 ; la Lancia D50 l'employait dès 1954.
  entrees:
  - colin-chapman
  - keith-duckworth
  - vittorio-jano
  - ettore-zaccone-mina
  sources:
  - titre: Motor Sport Magazine, « The Lotus 49 » (juillet 1967)
    url: https://www.motorsportmagazine.com/archive/article/july-1967/26/the-lotus-49/
  - titre: Motor Sport Magazine, « Lancia D50 re-creations nearing completion » (octobre 1999)
    url: https://motorsportmagazine.com/archive/article/october-1999/5/lancia-d50-re-creations-nearing-completion
- id: moteur-central-arriere
  terme: Moteur central-arrière
  motifs:
  - moteur central-arrière
  - moteur arrière
  definition: 'Le moteur est placé derrière le pilote. Il n''y a plus d''arbre de transmission le long de la voiture : la surface frontale et le centre de gravité baissent, le poids passe vers les roues motrices et le moment polaire diminue. Après les titres de la Cooper en 1959 et 1960, la disposition devient la norme : le Grand Prix d''Italie 1960 est la dernière victoire d''une F1 à moteur avant.'
  premiere: 'Première victoire en championnat : Cooper, Argentine 1958 ; premier titre en 1959.'
  entrees:
  - john-cooper
  - owen-maddock
  - john-crosthwaite
  sources:
  - titre: Motor Sport Magazine, « Back to the future » (novembre 2017)
    url: https://www.motorsportmagazine.com/archive/article/november-2017/103/back-future/
  - titre: 'Motor Sport Magazine, « Cooper T51: the revolutionary car that changed F1 forever »'
    url: https://www.motorsportmagazine.com/archive/article/june-2019/122/cooper-t51/
  - titre: 'Formula 1, « VOTE NOW: Who is the most influential technical innovator in F1 history? »'
    url: https://www.formula1.com/en/latest/article/vote-now-who-is-the-most-influential-technical-innovator-in-f1-history.dUby3oyTgDmCPqkvkYttX
- id: moment-polaire
  terme: Moment polaire
  motifs:
  - moment polaire
  definition: Résistance d'une voiture à pivoter autour de son axe vertical. Plus les masses sont loin du centre, plus il est élevé. Un moment polaire faible rend la voiture plus vive à mettre en virage, mais aussi plus nerveuse.
  entrees:
  - john-cooper
  sources:
  - titre: Motor Sport Magazine, « Back to the future » (novembre 2017)
    url: https://www.motorsportmagazine.com/archive/article/november-2017/103/back-future/
  - titre: 'Motor Sport Magazine, « Little Belter: the Cooper F1 team » (juin 2000)'
    url: https://www.motorsportmagazine.com/archive/article/june-2000/88/cooper-t5153/
  - titre: "Paul Fearnley, Motor Sport Magazine, « The March 721G F1 car that almost ended Niki Lauda's career » (mars 2009)"
    url: "https://motorsportmagazine.com/archive/article/march-2009/49/g-hits-spot"
- id: centralisation-des-masses
  terme: Centralisation des masses
  motifs:
  - centralisation des masses
  - centraliser les masses
  definition: Regrouper les éléments lourds — chez Forghieri, radiateurs, réservoir d'huile et boîte de vitesses — près du centre de gravité, entre les essieux, pour abaisser le moment polaire et rendre la voiture plus vive à changer de direction.
  entrees:
  - mauro-forghieri
  sources:
  - titre: 'Formula 1, « TECH TUESDAY: Under the bodywork of Mauro Forghieri''s masterpiece, the Ferrari 312T »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-under-the-bodywork-of-mauro-forghieris-masterpiece-the-ferrari.kftnvmyfKpzrrB5NdO1xz
  - titre: "Alan Henry, Motor Sport Magazine, « Victory Ts » (avril 1997)"
    url: "https://www.motorsportmagazine.com/archive/article/april-1997/50/victory-ts/"
- id: boite-transversale
  terme: Boîte de vitesses transversale
  motifs:
  - boîte de vitesses transversale
  - boîte transversale
  definition: Les arbres de la boîte sont placés en travers de la voiture plutôt qu'alignés derrière le moteur. La boîte se loge devant l'essieu arrière, ce qui rapproche le poids du centre et améliore la réponse directionnelle.
  premiere: Ferrari 312T, 1975, selon formula1.com.
  entrees:
  - mauro-forghieri
  sources:
  - titre: 'Formula 1, « TECH TUESDAY: Under the bodywork of Mauro Forghieri''s masterpiece, the Ferrari 312T »'
    url: https://www.formula1.com/en/latest/article/tech-tuesday-under-the-bodywork-of-mauro-forghieris-masterpiece-the-ferrari.kftnvmyfKpzrrB5NdO1xz
  - titre: 'Formula 1, « VOTE NOW: Who is the most influential technical innovator in F1 history? »'
    url: https://www.formula1.com/en/latest/article/vote-now-who-is-the-most-influential-technical-innovator-in-f1-history.dUby3oyTgDmCPqkvkYttX
  - titre: "Alan Henry, Motor Sport Magazine, « Victory Ts » (avril 1997)"
    url: "https://www.motorsportmagazine.com/archive/article/april-1997/50/victory-ts/"
- id: boite-semi-automatique
  terme: Boîte semi-automatique à palettes
  motifs:
  - boîte semi-automatique
  definition: 'Le pilote change de rapport avec deux palettes derrière le volant, sans levier ni pédale d''embrayage ; une commande électro-hydraulique exécute le changement. Mains sur le volant, moins d''erreurs, coque plus étroite : toutes les F1 actuelles en sont équipées.'
  premiere: Ferrari 640, 1989 (d'abord prévue pour la 639, qui n'a pas couru).
  entrees:
  - john-barnard
  sources:
  - titre: Formula 1, glossaire F-J
    url: https://www.formula1.com/en/latest/article/f1-glossary-f-j.2g6grJVxT6dFCDpSmgoCQX
  - titre: 'Motor Sport Magazine, « Ferrari''s 640: the 1989 flawed masterpiece » (juin 2022)'
    url: https://motorsportmagazine.com/archive/article/june-2022/114/ferraris-640-the-1989-flawed-masterpiece-thats-still-influencing-f1-design
  - titre: "Motor Sport Magazine, « X-ray spec: Ferrari 640 » (juin 2005)"
    url: "https://www.motorsportmagazine.com/archive/article/june-2005/70/ferrari-640/"
  - titre: "Motorsport.com, « The troubled car that was a game changer for F1 » (2021)"
    url: "https://us.motorsport.com/f1/news/the-troubled-car-that-was-a-game-changer-for-f1/4801237/"
- id: turbocompresseur
  terme: Turbocompresseur
  motifs:
  - turbocompresseur
  - suralimentation
  definition: 'Une turbine entraînée par les gaz d''échappement fait tourner un compresseur, qui force davantage d''air dans les cylindres : un petit moteur produit autant ou plus qu''un gros. Le règlement 1966-1986 met en balance 1,5 litre suralimenté et 3 litres atmosphérique ; le turbo revient en 2014 dans le groupe propulseur hybride.'
  premiere: Renault RS01, Grand Prix de Grande-Bretagne 1977.
  entrees:
  - bernard-dudot
  - francois-castaing
  - jean-terramorsi
  - gordon-murray
  - andy-cowell
  sources:
  - titre: Formula 1, glossaire P-T
    url: https://www.formula1.com/en/latest/article/f1-glossary-p-t.GBhLQtpeu9b8LrK5VM0F1
  - titre: Goodwood, « Renault's RS01, the first turbocharged Formula 1 car »
    url: https://www.goodwood.com/grr/f1/renaults-rs01-turbocharged-formula-1/
