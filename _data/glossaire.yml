- id: groupe-propulseur-hybride
  terme: Groupe propulseur (hybride depuis 2014)
  motifs:
  - groupe propulseur hybride
  - groupe propulseur
  definition: Ensemble des éléments qui propulsent la voiture, que formula1.com appelle « power unit ». Depuis 2014, c'est un V6 turbo de 1,6 litre associé à une récupération d'énergie électrique stockée dans une batterie. Le MGU-K récupère l'énergie au freinage ; le MGU-H, supprimé en 2026, la récupérait sur la chaleur des gaz d'échappement. Le turbo séparé de Mercedes place la turbine et le compresseur aux deux extrémités du moteur.
  premiere: '2014.'
  entrees:
