    url: https://www.motorsportmagazine.com/archive/page/may-1998/65
- id: antipatinage
  terme: Antipatinage
  motifs:
  - antipatinage
  definition: Le calculateur compare la vitesse des roues motrices à celle de la voiture et réduit la puissance quand elles patinent, indépendamment de l'accélérateur. Interdit en 1994, réautorisé en 2001, de nouveau interdit en 2008 avec un calculateur standard.
  entrees:
  - paddy-lowe
  sources:
  - titre: 'Peter Wright, GrandPrix.com, « Technical: All change »'
    url: https://www.grandprix.com/features/peter-wright/technical-all-change.html
  - titre: RacingNews365, « The slippery history of traction control in F1 »
    url: https://racingnews365.com/traction-control-in-f1-a-short-history
- id: acquisition-de-donnees
  terme: Acquisition de données
  motifs:
  - acquisition de données
  definition: Des capteurs embarqués enregistrent vitesses, débattements, pressions et températures ; les données sont lues au stand ou transmises en direct (télémétrie). Les ingénieurs règlent la voiture sur des mesures plutôt que sur les seules impressions du pilote.
  entrees:
  - frank-dernie
  - steve-wise
  - sam-michael
  sources:
