  definition: La voiture part allégée et s'arrête en course pour faire le plein et changer de roues, ce qui la rend plus rapide à chaque relais. Le ravitaillement est interdit de 1984 à 1993, autorisé de 1994 à 2009, puis de nouveau interdit depuis 2010 ; l'arrêt ne sert plus qu'au changement de pneus.
