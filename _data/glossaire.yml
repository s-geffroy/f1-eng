  terme: Inerter
  motifs:
  - inerter
  definition: Élément de suspension dans lequel un piston fait tourner un volant d'inertie, et la force transmise est proportionnelle à l'accélération relative de ses deux extrémités ; associé aux ressorts et aux amortisseurs, il réduit les oscillations. Imaginé en 1997 par Malcolm Smith à Cambridge, il court d'abord chez McLaren sous le nom de « J-damper », puis devient un équipement standard jusqu'à son interdiction en 2022.
  premiere: McLaren, 2005.
