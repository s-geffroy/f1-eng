# Dominations et confrontations, calculées par outils/domination.py depuis _data/resultats.yml,
# _data/ecuries.yml et _data/chronologie.yml : ne pas modifier à la main, relancer le script.
# part = part des Grands Prix gagnés ; points = part moyenne des points (écuries depuis 1958, pilotes) ;
# degre = saison (1 saison dominante), domination (au moins duo), hegemonie (au moins min, robuste) ;
# longue = au moins min saisons dominantes, robuste ou non : base des confrontations ;
# poles, podiums (part des places), doubles : parts sur les courses dont la grille ou le podium est
# publié ; ecart = part des points moins celle du meilleur des autres ; indice = moyenne des parts de
# victoires, de poles et de places sur le podium ;
# avant / apres = part moyenne des victoires de l'écurie dans les fenêtres de la confrontation.
parametres:
  seuil: 0.4
  min: 3
  duo: 2
  creux: 1
  avant: 2
  apres: 3
  fenetre_jalon: 2
  fenetre_regle: 1
  variantes:
  - seuil: 0.5
    min: 3
    creux: 1
  - seuil: 0.4
    min: 3
    creux: 0
  saisons: 1950–2025
  gp: 1149
