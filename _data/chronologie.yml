  - id: "protections-laterales-cockpit"
    annee: 1996
    categorie: "securite"
    titre: "Flancs de cockpit relevés et appuie-tête latéraux"
    texte: "Après des flancs déjà relevés en 1995 pour couvrir les épaules, la FIA impose en 1996 des flancs de cockpit plus hauts, rembourrés à l'intérieur, et des appuie-tête latéraux de 75 mm, avec des essais de charge statique sur le bord du cockpit. Ces règles sont le fruit des travaux du groupe d'experts de la FIA sur la sécurité depuis les accidents d'Imola et de Monaco en 1994 ; le cockpit est aussi agrandi pour que les pilotes de toutes tailles courent à égalité. Les premiers enregistreurs de données entrent dans les cellules de survie. La tête du pilote, jusque-là largement exposée, est désormais entourée par la structure de la voiture."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, « Re-writing the F1 rulebook - Part 2: from driver aids to increased safety » (2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
      - titre: "GrandPrix.com, « The new rules for 1996 » (mars 1996)"
        url: "https://www.grandprix.com/ns/ns00509.html"
  - id: "prius-hybride"
    annee: 1997
    categorie: "technologie"
    titre: "La Toyota Prius, première hybride de série"
    texte: "En 1997, Toyota lance la Prius, premier véhicule hybride produit en série : un moteur thermique et deux moteurs-générateurs récupèrent l'énergie perdue au freinage, et la consommation est divisée par deux. Le sens de l'emprunt avec la F1 est discuté : à l'arrivée du KERS en 2009, limité à 60 kW pendant 6,6 secondes par tour, Toyota le juge « primitif » et sans rapport avec ses hybrides routiers, tandis que formula1.com affirme en 2014 que les progrès des KERS de F1 ont profité aux hybrides de série. Selon ce site, un système pesait plus de 100 kg en 2007, 24 kg fin 2012."
    liens:
      - jalon: "kers"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "La Prius précède le KERS de douze ans, mais aucune source n'établit d'emprunt : Toyota juge le KERS « primitif » et sans rapport avec ses hybrides routiers."
    sources:
      - titre: "IEEE, Engineering and Technology History Wiki, « Milestones: Toyota Prius, the World's First Mass-Produced Hybrid Vehicle, 1997 » (février 2025)"
        url: "https://ethw.org/Milestones:Toyota_Prius,_the_World%27s_First_Mass-Produced_Hybrid_Vehicle,_1997"
      - titre: "New Atlas, « Formula One KERS explained » (mars 2009)"
        url: "https://newatlas.com/formula-one-kers/11324/"
      - titre: "Formula1.com, « Hybrid update for Mercedes' car name » (mai 2014)"
        url: "https://www.formula1.com/en/latest/headlines/2014/5/Hybrid-update-for-Mercedes-car-name.html"
  - id: "inerter-cambridge"
    annee: 1997
    categorie: "technologie"
    titre: "L'inerter de Malcolm Smith"
    texte: "En 1997, Malcolm Smith, professeur à Cambridge, imagine l'inerter : un piston entraîne un volant d'inertie en proportion du déplacement relatif de ses deux extrémités, ce qui, avec les ressorts et les amortisseurs, réduit les oscillations. L'université détient le brevet et accorde à McLaren l'exclusivité en F1 ; pour garder le secret, l'équipe l'appelle « J-damper ». Une licence à Penske Racing Shocks permet ensuite d'en fournir toutes les équipes."
    liens:
      - jalon: "inerter"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Selon l'université de Cambridge, le dispositif imaginé en 1997 par Malcolm Smith est confié en exclusivité à McLaren, qui le fait courir en 2005."
    sources:
      - titre: "Université de Cambridge, « Secrets of the inerter revealed » (août 2008)"
        url: "https://www.cam.ac.uk/research/news/secrets-of-the-inerter-revealed"
  - id: "roues-retenues"
    annee: 1999
    categorie: "securite"
    titre: "Les roues retenues par des câbles"
    texte: "En 1999, la FIA impose des câbles qui relient les roues à la voiture, pour qu'elles ne se détachent pas lors d'un accident. Pour Pat Symonds, ces câbles font partie des mesures de sécurité qui suivent Imola 1994, avec des essais de choc plus sévères chaque année et des structures latérales anti-pénétration."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, Matt Youson, « Imola ‘94 and the lasting safety legacy » (mai 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
  - id: "hans"
    annee: 2003
    categorie: "securite"
    titre: "Le HANS devient obligatoire"
    texte: "Le système de retenue de la tête et du cou HANS, conçu par Robert Hubbard et Jim Downing contre les fractures de la base du crâne, dont meurt Roland Ratzenberger en 1994, puis adapté aux monoplaces avec le concours de DaimlerChrysler, devient obligatoire en F1 en 2003. Une version amincie est essayée de 1996 à 1998 et approuvée par la FIA en 2001. La FIA reconnaît qu'il relève légèrement le centre de gravité de la voiture et autorise les équipes à l'adapter à leur cockpit, sous réserve de son accord ; elle refuse toute dérogation, un pilote qui ne peut le porter devant être remplacé."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "GrandPrix.com, « FIA stands by HANS device » (mars 2003)"
        url: "https://www.grandprix.com/news/fia-stands-by-hans-device.html"
