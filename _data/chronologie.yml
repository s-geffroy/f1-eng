        url: "https://www.autosport.com/f1/news/does-f1-still-need-in-season-testing-5098577/5098577/"
      - titre: "GrandPrix.com, actualités du 27 janvier 2011"
        url: "https://www.grandprix.com/ns/ns22879.html"

  - id: "f-duct"
    annee: 2010
    voie: "aero"
    titre: "Le F-duct de McLaren"
    texte: "En obturant un orifice du cockpit, le pilote fait décrocher l'aileron arrière en ligne droite et réduit la traînée. Mis au point par toute l'équipe McLaren dès la fin de 2008, il est imité d'abord par Sauber, puis par d'autres ; interdit pour 2011, il est remplacé par le DRS."
    entrees: []
    termes: [aileron, drs]
    sources:
      - titre: "Autosport, Matt Somerfield, « Banned: The 2010 Formula 1 season's F-duct » (avril 2020)"
        url: "https://www.autosport.com/f1/news/149090/banned-the-f1-2010-season-fduct"
      - titre: "Autosport, Jonathan Noble, « McLaren upbeat on 2011 car progress » (décembre 2010)"
        url: "https://www.autosport.com/f1/news/88611/mclaren-upbeat-on-2011-car-progress"
      - titre: "GrandPrix.com, « McLaren: Original thinking » (février 2011)"
        url: "https://www.grandprix.com/features/2010-grand-prix-review-mclaren-original-thinking.html"

  - id: "rb18"
    annee: 2022
    voie: "aero"
    titre: "La Red Bull de 2022"
    texte: "Fort de son expérience des voitures à effet de sol, Adrian Newey apporte des idées clés au concept de la Red Bull et dessine lui-même ses suspensions ; l'enjeu est de délivrer l'appui de façon fiable. Plusieurs équipes reprennent ensuite ses pontons, mais ni Ferrari ni Mercedes."
    entrees: [adrian-newey]
    termes: [effet-de-sol]
    sources:
      - titre: "Formula1.com, Edd Straw, « An innovator and trendsetter – Adrian Newey's greatest F1 contributions » (mai 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
      - titre: "PlanetF1, Michelle Foster, « Lewis Hamilton adamant Mercedes won't 'copy' rivals as more teams unveil Red Bull-inspired cars » (février 2023)"
        url: "https://www.planetf1.com/news/lewis-hamilton-mercedes-copy-red-bull"

contexte:
  - id: "mosquito-radiateurs"
    annee: 1940
    categorie: "technologie"
    titre: "Les radiateurs dans l'aile du Mosquito"
    texte: "Le bimoteur de Havilland Mosquito vole pour la première fois le 25 novembre 1940 ; ses radiateurs sont logés dans le bord d'attaque des ailes, de part et d'autre du fuselage, un emplacement qui réduit la traînée. Selon Motor Sport, Tony Rudd, ancien motoriste de Rolls-Royce aviation, se souvient de ce montage quand Lotus cherche où placer les radiateurs de la future Lotus 78 : enfouis dans des conduits, l'air ressortant plus en arrière. L'équipe teste en soufflerie des pontons conçus pour produire de l'appui ; essayée à l'envers, une section de maquette donne satisfaction, et l'Imperial College fait savoir à Noël : « The Mosquito flies »."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "atteste"
        pourquoi: "Selon Doug Nye, Tony Rudd, ancien motoriste de Rolls-Royce aviation, se souvient des radiateurs du Mosquito quand Lotus cherche où placer ceux de la Lotus 78."
    sources:
      - titre: "Motor Sport, Doug Nye, « Lotus 78: F1’s first true ground effect car » (février 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "Wikipédia, « de Havilland Mosquito » (version du 23 octobre 2026)"
        url: "https://en.wikipedia.org/wiki/De_Havilland_Mosquito"
  - id: "formule-500"
    annee: 1946
    categorie: "reglement"
    titre: "La formule 500 cm³ du 500 Club"
    texte: "En décembre 1945, à Bristol, des passionnés fondent le 500 Club et rédigent une formule de petites monoplaces de 500 cm³ adaptée aux restrictions de l'après-guerre. Charles et John Cooper, garagistes du Surrey, s'y engagent avec un prototype dont le moteur est placé derrière le pilote, « par commodité autant que pour toute autre raison », selon Motor Sport."
    liens:
      - jalon: "cooper-500"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La formule du 500 Club crée la catégorie pour laquelle les Cooper construisent leur prototype ; la source ne dit pas que le moteur arrière découle du règlement (Damien Smith)."
    sources:
      - titre: "Motor Sport, Damien Smith, « One-pot dictator » (juillet 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/88/one-pot-dictator/"
  - id: "championnat-1950"
    annee: 1950
    categorie: "economie"
    titre: "Premier championnat du monde"
    texte: "Le 13 mai 1950, le Grand Prix d'Europe disputé à Silverstone ouvre le premier championnat du monde. Son règlement reprend celui de 1947 : moteurs atmosphériques de 4,5 litres ou moteurs suralimentés de 1,5 litre, hérités de la catégorie voiturette d'avant-guerre. La voiture favorite, l'Alfa Romeo 158, a alors treize ans : c'est une conception d'avant-guerre, née en 1937 comme voiturette, dont le huit-cylindres en ligne à compresseur dépasse désormais 400 ch. Face à des Maserati, ERA, Talbot et Alta vieillissantes, Farina, Fagioli et Parnell offrent à Alfa Romeo les trois premières places."
    sources:
      - titre: "Formula 1, « 10 fascinating facts about the very first F1 Grand Prix, held on this day 70 years ago » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/10-fascinating-facts-about-the-very-first-f1-grand-prix-held-on-this-day-70.14iQuQ4N2IbV93EZj4Ruuj"
      - titre: "Formula 1, David Tremayne, « Why is it called Formula 1 – and 12 other questions about the championship’s origins » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/why-is-it-called-formula-1-and-12-other-questions-about-the-championships.1GHeel6u4jga6hMpX2eFs1"
      - titre: "Formula 1, Mark Hughes, « Under the bodywork of the Alfa Romeo ‘Alfetta’ – 70 years after it won the first ever F1 race » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/under-bodywork-of-the-alfa-romeo-alfetta-70-years-after-it-won-the-first.3pnyQUiSHqUdEN3Dk85nnq.html"
  - id: "formule-2-5-litres"
    annee: 1954
    categorie: "reglement"
    titre: "La formule 2,5 litres"
    texte: "En 1954 entre en vigueur une nouvelle Formule 1 à moteurs de 2,5 litres. Elle suscite des voitures neuves aux conceptions très éloignées, dont la Lancia D50 et la Mercedes W196, si différentes qu'on avait peine à croire qu'elles répondaient au même règlement. La Mercedes, longue et carénée, combine treillis tubulaire, injection et soupapes desmodromiques ; elle gagne 11 de ses 14 courses en 1954-1955. La Lancia, courte, porte ses réservoirs en nacelles entre les roues, ce qui stabilise la répartition des masses quand le carburant baisse et améliore l'aérodynamique ; son V8, élément de la structure du châssis, est décalé de huit degrés pour abaisser le pilote."
    liens:
      - jalon: "lancia-d50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La D50 est conçue pour la nouvelle formule de 1954, qui suscite des voitures neuves aux conceptions très éloignées (Motor Sport, Chris Nixon)."
    sources:
      - titre: "Motor Sport Magazine, Chris Nixon, « Too good for their own good? » (avril 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/april-2002/87/too-good-for-their-own-good/"
  - id: "jaguar-d-type-monocoque"
    annee: 1954
    categorie: "technologie"
    titre: "La Jaguar D-Type et la monocoque d'avion"
    texte: "La Jaguar D-Type, voiture de sport produite à partir de 1954 pour gagner les 24 Heures du Mans, applique des techniques aéronautiques : son aérodynamicien Malcolm Sayer vient de la Bristol Aeroplane Company, et sa section centrale monocoque en tôles d'alliage d'aluminium, de section elliptique et réduite, allie rigidité en torsion et faible traînée. Elle gagne au Mans en 1955, 1956 et 1957. Doug Nye la cite parmi les précédents de la Lotus 25 et rappelle que la monocoque était depuis cinquante ans l'élément structurel majeur de l'aéronautique ; en course, le treillis tubulaire reste pourtant la règle jusqu'en 1962. Chez Lotus, Mike Costin, venu de l'industrie aéronautique, conseille l'assemblage riveté de la coque."
    liens:
      - jalon: "lotus-25"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Doug Nye range la D-Type parmi les précédents de la Lotus 25, et Mike Costin, venu de l'aéronautique, conseille l'assemblage riveté de la coque."
    sources:
      - titre: "Motor Sport, Doug Nye, « Colin Chapman: chassis pioneer » (mars 2022)"
        url: "https://motorsportmagazine.com/archive/article/march-2022/23/colin-chapman-chassis-pioneer"
      - titre: "Motor Sport, John Tipler, « A new frame of reference » (mai 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/"
      - titre: "Wikipédia, « Jaguar D-Type » (version du 18 août 2026)"
        url: "https://en.wikipedia.org/wiki/Jaguar_D-Type"
  - id: "formule-2-1957"
    annee: 1957
    categorie: "reglement"
    titre: "La Formule 2 de 1,5 litre"
    texte: "De 1957 à 1960, une nouvelle Formule 2 limite les moteurs à 1 500 cm³. Selon Motor Sport, elle est « un cadeau » pour la nouvelle Cooper-Climax à moteur central. Conçues pour cette catégorie, les Cooper deviennent de plus en plus compétitives en F1 à mesure que leur moteur s'approche des 2,5 litres permis : avec 2 495 cm³, elles égalent au moins les meilleures voitures de conception classique."
    liens:
      - jalon: "cooper-argentine"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La Cooper de Moss est une Formule 2 adaptée, au moteur porté à 2 litres et configurée pour des courses courtes, sans arrêt au stand (Mark Hughes)."
      - jalon: "cooper-titres"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Conçues pour la limite de 1 500 cm³ de la Formule 2, les Cooper sont au moins au niveau des meilleures F1 une fois dotées d'un moteur de 2 495 cm³ (Motor Sport)."
    sources:
      - titre: "Formula1.com, Mark Hughes, « Argentina '58: Moss bluffs his way to victory – and ushers in new era » (avril 2020)"
        url: "https://www.formula1.com/en/latest/article.argentina-58-moss-bluffs-his-way-to-victory-and-ushers-in-new-era.g34lnPj7q41eIAS0HbA9d.html"
      - titre: "Motor Sport, « From the archives – Cooper » (mai 1991)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1991/29/from-the-archives-cooper/"
  - id: "carburant-commercial-1958"
    annee: 1958
    categorie: "reglement"
    titre: "Le carburant du commerce obligatoire"
    texte: "En 1958, le règlement remplace les mélanges à base d'alcool par l'essence du commerce. Vanwall et BRM n'ont pas adapté leurs moteurs à temps pour le Grand Prix d'Argentine, et Vanwall libère Stirling Moss, qui court sur la petite Cooper de Rob Walker. À cause de la chaleur, la course est en outre raccourcie de 400 à 313 km."
    liens:
      - jalon: "cooper-argentine"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Faute de moteurs Vanwall adaptés au nouveau carburant, Moss est libre de piloter la Cooper de Rob Walker en Argentine (Mark Hughes)."
    sources:
      - titre: "Formula1.com, Mark Hughes, « Argentina '58: Moss bluffs his way to victory – and ushers in new era » (avril 2020)"
        url: "https://www.formula1.com/en/latest/article.argentina-58-moss-bluffs-his-way-to-victory-and-ushers-in-new-era.g34lnPj7q41eIAS0HbA9d.html"
      - titre: "Wikipédia, « 1958 Argentine Grand Prix » (consulté en octobre 2026)"
        url: "https://en.wikipedia.org/wiki/1958_Argentine_Grand_Prix"
      - titre: "Goodwood, Russell Campbell, « Cooper T43: Formula 1's groundbreaking rear-engined winner » (mai 2025)"
        url: "https://www.goodwood.com/grr/f1/cooper-t43-formula-1s-groundbreaking-rear-engined-winner/"
  - id: "carbone-farnborough"
    annee: 1963
    categorie: "technologie"
    titre: "La fibre de carbone du Royal Aircraft Establishment"
    texte: "En 1963, W. Watt, L. N. Phillips et W. Johnson mettent au point au Royal Aircraft Establishment de Farnborough un procédé qui révèle le potentiel de résistance de la fibre de carbone. Breveté par le ministère britannique de la Défense et concédé notamment à Rolls-Royce, il est ensuite exploité par l'industrie aéronautique. Le lien avec la McLaren MP4/1 reste indirect : John Barnard dit avoir eu l'idée d'une coque en carbone en voyant British Aerospace fabriquer en composite carbone le capot du réacteur Rolls-Royce RB211. Il cherchait une coque étroite, pour agrandir le soubassement à effet de sol, sans perte de rigidité ; la MP4/1 gagne dès le Grand Prix de Grande-Bretagne 1981."
    liens:
      - jalon: "mp4-1"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "John Barnard dit avoir pensé au carbone en voyant British Aerospace fabriquer un capot de réacteur en composite ; le procédé de Farnborough n'y mène qu'indirectement, par l'industrie aéronautique."
    sources:
      - titre: "Wikipédia, « Carbon fibers » (version du 18 octobre 2026)"
        url: "https://en.wikipedia.org/wiki/Carbon_fibers"
      - titre: "Motor Sport, James Elson, « John Barnard remembers his McLaren MP4/1 eureka moment » (septembre 2021)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/john-barnard-remembers-his-mclaren-mp4-1-eureka-moment"
      - titre: "Motor Sport, Rob Widdows, « Carbon natural » (mai 2007)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2007/73/carbon-natural"
  - id: "chaparral-ailerons"
    annee: 1966
    categorie: "technologie"
    titre: "Les ailerons des Chaparral"
    texte: "En Can-Am et en sport-prototypes, les Chaparral de Jim Hall portent dès 1966 de grands ailerons sur supports, réglables en roulant, et déplacent les radiateurs dans des pontons latéraux. Partie d'une première Chaparral 2 qui souffrait de portance, Hall a voulu aller « au-delà du zéro », vers l'appui ; une pédale aplatit l'aileron pour réduire la traînée en ligne droite, et son support fixé aux moyeux fait porter l'appui sur les roues plutôt que sur le châssis. Chris Amon, pilote de la Ferrari à aileron de Spa en 1968, s'étonne que la F1 ait tant tardé alors que ces ailerons « marchaient » ; Goodwood estime que Chapman s'est inspiré des radiateurs latéraux de Hall pour la Lotus 72."
    liens:
      - jalon: "ailerons"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "Les Chaparral portent des ailerons depuis 1966 et Chris Amon le rappelle, mais aucune source ne dit que Ferrari s'en est inspiré : seule l'antériorité est établie."
      - jalon: "lotus-72"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Goodwood écrit que Chapman a repris pour la Lotus 72 les radiateurs en pontons latéraux de Jim Hall."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, « 1968 Belgian Grand Prix: Nigel Roebuck’s F1 Legends » (octobre 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/october-1998/18/legends-11/"
      - titre: "Goodwood, Damien Smith, « Winging it: When F1 really started to fly » (mars 2025)"
        url: "https://www.goodwood.com/grr/f1/winging-it-when-f1-really-started-to-fly/"
      - titre: "Motor Sport, Paul Fearnley, « Chaparral and Jim Hall's techno brilliance: when America took the lead in racing innovation » (novembre 2003)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2003/38/jim-hall-its-safe-to-say-was-ahead-of-the-techno-game"
  - id: "formule-3-litres"
    annee: 1966
    categorie: "reglement"
    titre: "Le « retour à la puissance » : la formule 3 litres"
    texte: "En 1966, la cylindrée des moteurs atmosphériques double pour passer à 3 litres ; annoncé trois ans plus tôt, le changement trouve pourtant beaucoup d'équipes mal préparées. Coventry Climax s'étant retiré fin 1965, les équipes britanniques manquent d'un moteur vendu à tous : Cooper se rabat sur des V12 Maserati, Lotus sur un Climax de 2 litres puis sur le H16 de BRM, complexe et lourd. Jack Brabham est champion avec un V8 Repco dérivé d'un bloc Oldsmobile, moins puissant mais fiable. Le vide sera comblé par le Cosworth DFV, financé par Ford pour 100 000 livres à l'initiative de Walter Hayes."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le passage à 3 litres et le retrait de Coventry Climax laissent les équipes britanniques sans moteur vendu à tous : le DFV comble ce vide (David Tremayne)."
    sources:
      - titre: "Motor Sport Magazine, « 1966 F1 World Championship » (base de données, non datée)"
        url: "https://www.motorsportmagazine.com/database/championships/f1/1966-f1-world-championship"
      - titre: "GrandPrix.com, David Tremayne, « The Father of the DFV » (janvier 2001), reproduit sur walterhayes.co.uk"
        url: "https://walterhayes.co.uk/motorsport-article/the-father-of-the-dfv-grandprix-com-january-26th-20001/"
  - id: "stewart-campagne-securite"
    annee: 1966
    categorie: "securite"
    titre: "Accident de Jackie Stewart à Spa et campagne pour la sécurité"
    texte: "Au Grand Prix de Belgique 1966, Jackie Stewart reste longtemps coincé dans sa BRM, imbibé de carburant, et doit être dégagé par Graham Hill et Bob Bondurant faute de commissaires. Il fait ensuite campagne pour la sécurité, d'abord avec peu de soutien des circuits et de l'autorité sportive ; il réclame casques intégraux, ceintures obligatoires, services médicaux et, après la mort de Jim Clark en 1968, des rails Armco pour éloigner les voitures des arbres. Côté voiture, il exige dès 1967 des ceintures de sécurité dans sa BRM, alors que l'arceau rudimentaire, obligatoire depuis 1961, était à peu près la seule exigence."
    sources:
      - titre: "Motor Sport Magazine, « A year of living dangerously » (août 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/august-2010/46/a-year-of-living-dangerously/"
      - titre: "Formula 1, Katy Roberts, « 5 crucial milestone moments in F1 safety technology » (mai 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "formule-2-1600"
    annee: 1967
    categorie: "reglement"
    titre: "La Formule 2 de 1,6 litre"
    texte: "Le 1er janvier 1967 entre en vigueur une Formule 2 limitée à 1 600 cm³, dont le bloc-cylindres doit provenir d'une voiture de série produite à au moins 500 exemplaires en 22 mois. Cosworth y répond par le FVA, dessiné autour du bloc de la Ford Cortina. Le projet commun annoncé avec Ford couvre aussi un moteur de F1 : le DFV, formé de deux culasses de FVA sur un bloc commun."
    liens:
      - jalon: "dfv-fva"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le FVA est conçu pour la limite de 1 600 cm³ de la nouvelle Formule 2, qui impose un bloc de série : Cosworth part de celui de la Ford Cortina (Mike Doodson, Denis Jenkinson)."
    sources:
      - titre: "Motor Sport, Mike Doodson, « Keith Duckworth » (janvier 1970)"
        url: "https://www.motorsportmagazine.com/archive/article/january-1970/41/keith-duckworth"
      - titre: "Motor Sport, Denis Jenkinson, « Prospects for Formula Two » (mars 1967)"
        url: "https://www.motorsportmagazine.com/archive/article/march-1967/16/prospects-for-formula-two/"
  - id: "dfv-clients-1968"
    annee: 1968
    categorie: "economie"
    titre: "Le DFV en vente libre"
    texte: "Pour 1968, Lotus perd l'exclusivité du Cosworth DFV, financé par Ford ; Walter Hayes, chez Ford, juge que le moteur tuerait la compétition s'il n'était pas partagé. Matra, engagée par Ken Tyrrell (un moyen de garder Jackie Stewart chez Ford), et McLaren en sont les premiers clients, et dès 1969 deux tiers des voitures du plateau en sont équipées. Léger, rigide et court, il sert aussi d'élément porteur du châssis. Vendu à un prix abordable, il ouvre l'ère dite des « kit cars », où des équipes sans motoriste associent leur propre châssis à un moteur acheté et à une boîte Hewland ; il faut attendre 1975 pour qu'une voiture sans DFV soit championne."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La fin de l'exclusivité Lotus, voulue par Walter Hayes chez Ford, fait du DFV le moteur de deux tiers du plateau dès 1969."
    sources:
      - titre: "Motor Sport, « F1 non-championship races – Part two: the ’60s » (septembre 2008)"
        url: "https://www.motorsportmagazine.com/archive/article/september-2008/92/f1-non-championship-races-part-two-60s/"
      - titre: "Goodwood, « Thank Frankel It's Friday: The greatest engine of all » (octobre 2016)"
        url: "https://www.goodwood.com/grr/columnists/andrew-frankel/2016/10/thank-frankel-its-friday-the-greatest-engine-of-all/"
      - titre: "The Race, Gary Anderson, « The good, bad and ugly of Ford in F1 » (février 2023)"
        url: "https://the-race.com/formula-1/gary-anderson-the-good-bad-and-ugly-of-ford-in-f1/"
  - id: "sponsors-1968"
    annee: 1968
    categorie: "economie"
    titre: "La publicité hors automobile"
    texte: "La F1, devenue plus technique et plus coûteuse, ne peut plus vivre sans commanditaires. Après le départ de commanditaires historiques comme Esso et BP, les règles internationales sur le parrainage sont assouplies fin 1967 : il n'est plus réservé aux produits liés à l'automobile. Team Lotus court en 1968 aux couleurs de la marque de cigarettes Gold Leaf, d'Imperial Tobacco, que les restrictions sur la publicité télévisée poussent vers le sport ; le rouge, blanc et or remplace le vert et jaune national. Motor Sport rappelle que les Brabham de Team Gunston ont porté une livrée commerciale dès le Grand Prix d'Afrique du Sud, le 1er janvier 1968. Les équipes trouvent là un financement indépendant des industriels de l'automobile."
    sources:
      - titre: "Sports Car Digest, « Gold Leaf Team Lotus: The Deal and the First Glory » (avril 2024)"
        url: "https://sportscardigest.com/gold-leaf-team-lotus-the-deal-and-the-first-glory/"
      - titre: "Motor Sport, « Letters from readers, February 2004 » (février 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2004/5/letters-readers-february-2004/"
  - id: "interdiction-ailerons-hauts"
    annee: 1969
    categorie: "reglement"
    titre: "Les ailerons sur supports hauts interdits"
    texte: "Depuis 1968, Lotus fixe ses ailerons sur de longs supports reliés à la suspension arrière, pour transmettre l'appui directement aux roues, et toutes les équipes l'imitent, certaines ajoutant un aileron au-dessus du nez. Au Grand Prix d'Espagne 1969, les deux Lotus 49 d'usine sortent violemment de la piste après la rupture de leurs ailerons. La CSI réunit une séance d'urgence pendant le week-end de Monaco et interdit aussitôt les ailerons non réglementés, malgré les équipes qui jugeaient leurs voitures conçues autour de ces appendices. Graham Hill gagne à Monaco avec un arrière en coin improvisé ; dès le Grand Prix des Pays-Bas, les équipes essaient des ailerons intégrés à la carrosserie."
    liens:
      - jalon: "ailerons"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "L'interdiction suit directement la rupture des ailerons des deux Lotus 49 d'usine au Grand Prix d'Espagne 1969."
      - jalon: "ailerons"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La CSI interdit les ailerons non réglementés, ce qui met fin aux ailerons sur hauts supports."
    sources:
      - titre: "Motor Sport Magazine, « 1969 F1 World Championship » (base de données, non datée)"
        url: "https://motorsportmagazine.com/database/championships/1969-f1-world-championship"
      - titre: "Goodwood, Damien Smith, « Winging it: When F1 really started to fly » (mars 2025)"
        url: "https://www.goodwood.com/grr/f1/winging-it-when-f1-really-started-to-fly/"
  - id: "chaparral-2j"
    annee: 1970
    categorie: "technologie"
    titre: "La Chaparral 2J aspirante"
    texte: "En Can-Am, la Chaparral 2J de 1970 utilise deux ventilateurs entraînés par un moteur auxiliaire pour aspirer l'air sous la voiture. Jim Hall la présente comme une réponse à l'interdiction, pour 1970, des ailerons fixés aux moyeux ; des jupes articulées maintiennent un faible jeu avec le sol, et la voiture vire selon lui à près de 2 g. D'abord acceptée, elle est exclue de la série après les protestations des concurrents, qui y voient un dispositif aérodynamique mobile. Les sources divergent sur sa filiation avec la Brabham BT46B : Motor Sport la présente comme l'inspiration et cite Gordon Murray (« le concept de base, oui, il vient de là »), tandis que Goodwood juge l'influence incertaine."
    liens:
      - jalon: "bt46b"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Gordon Murray dit que le concept de base vient de la Chaparral 2J (Motor Sport), mais Goodwood juge l'influence incertaine."
    sources:
      - titre: "Motor Sport, Adam Cooper, « Vacuum clean-up » (mai 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1998/65/vacuum-clean"
      - titre: "Goodwood, Russell Campbell, « Too fast for Formula 1: the Brabham BT46B fan car » (mai 2025)"
        url: "https://www.goodwood.com/grr/f1/too-fast-for-formula-1-the-brabham-bt46b-fan-car/"
      - titre: "Motor Sport, Paul Fearnley, « Chaparral and Jim Hall's techno brilliance: when America took the lead in racing innovation » (novembre 2003)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2003/38/jim-hall-its-safe-to-say-was-ahead-of-the-techno-game"
      - titre: "Wikipédia, « Chaparral 2J » (consulté en octobre 2026)"
        url: "https://en.wikipedia.org/wiki/Chaparral_2J"
  - id: "imperial-tapis-roulant"
    annee: 1974
    categorie: "technologie"
    titre: "La soufflerie à tapis roulant de l'Imperial College"
    texte: "La soufflerie de l'Imperial College, à Londres, dispose d'un tapis roulant conçu par John Stollery, ancien aérodynamicien de Donald Campbell, qui reproduit le défilement du sol sous la maquette. Les essais aéronautiques se contentaient d'un sol fixe ou d'une maquette suspendue ; c'est dans cette soufflerie que Peter Wright mène, au milieu des années 1970, les recherches de Lotus qui aboutissent à la Lotus 78, avec quelque 400 heures d'essais sur des maquettes au quart. Le tapis se soulève sous les pontons, signe d'une dépression. Selon Wright, Ferrari aurait essayé une copie de la 78 dans une soufflerie sans sol mobile et conclu que le principe ne marchait pas."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Le tapis roulant, qui reproduit le défilement du sol, permet à Peter Wright de mener dans cette soufflerie les recherches qui aboutissent à la Lotus 78 (Gordon Kirby, Doug Nye)."
    sources:
      - titre: "Motor Sport, Gordon Kirby, « Lotus’s ground-effect revolution, part one » (octobre 2015)"
        url: "https://motorsportmagazine.com/articles/history/lotuss-ground-effect-revolution-part-one"
      - titre: "Motor Sport, Doug Nye, « Lotus 78: F1’s first true ground effect car » (février 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "Motor Sport, Gordon Cruickshank, « Venturi capitalists » (juillet 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/134/venturi-capitalists/"
  - id: "renault-1977"
    annee: 1977
    categorie: "economie"
    titre: "Renault arrive avec le turbo"
    texte: "Renault, avec son partenaire pétrolier Elf, engage la RS01 au Grand Prix de Grande-Bretagne 1977, avec un six-cylindres turbo de 1,5 litre, d'abord éprouvé en endurance en version 2 litres, face aux V8 et aux douze-cylindres atmosphériques de 3 litres. Les casses sont fréquentes au début, treize en dix-sept courses, et les fumées valent à la voiture le surnom de « théière ». Mais la RS10 gagne à Dijon en 1979, sur un circuit dont l'altitude favorise le turbo. Au début des années 1980, face à la puissance des turbos, les équipes restées au DFV misent sur le châssis et l'effet de sol, avant d'adopter à leur tour des moteurs turbo."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La victoire de Dijon couronne le programme turbo que Renault et Elf engagent en 1977, malgré les casses des débuts."
    sources:
      - titre: "Renault, The Originals, « Renault RS01 » (page non datée)"
        url: "https://theoriginals.renault.com/en/f1-rs-01"
      - titre: "Motor Sport, Nigel Roebuck, « 1980s » (mai 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Motor Sport Magazine, « Teapots, turbos and titles: Renault's wild F1 ride » (décembre 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
  - id: "ventilateur-ecarte-1978"
    annee: 1978
    categorie: "reglement"
    titre: "La voiture à ventilateur écartée"
    texte: "En 1978, la règle qui interdit les dispositifs aérodynamiques mobiles admet ceux dont la fonction première n'est pas aérodynamique. La Brabham BT46B s'y engouffre : son ventilateur est présenté comme servant au refroidissement du moteur. Après sa victoire en Suède, les équipes rivales, menées par Colin Chapman, protestent. Les sources divergent sur la suite : selon The Race et Goodwood, la CSI juge la voiture conforme et Bernie Ecclestone la retire de lui-même ; selon Motor Sport, la CSI l'interdit « pour raisons de sécurité ». La rédaction du règlement ne change qu'en 1979."
    liens:
      - jalon: "bt46b"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "Le ventilateur exploite la tolérance de 1978 pour les dispositifs mobiles dont la fonction première n'est pas aérodynamique (Edd Straw) : il suit la lettre du règlement, sinon son esprit (Goodwood)."
      - jalon: "bt46b"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "La victoire de la BT46B déclenche les protestations des équipes rivales, menées par un Colin Chapman furieux (Adam Cooper)."
      - jalon: "bt46b"
        mecanisme: "ferme"
        preuve: "discute"
        pourquoi: "La voiture ne court plus après la Suède, mais les sources divergent : retrait volontaire par Ecclestone (The Race, Goodwood) ou interdiction par la CSI « pour raisons de sécurité » (Motor Sport)."
    sources:
      - titre: "The Race, Edd Straw, « Nine things you may not know about Brabham's iconic F1 fan car » (décembre 2022)"
        url: "https://www.the-race.com/formula-1/nine-things-you-may-not-know-about-brabhams-iconic-f1-fan-car/"
      - titre: "Goodwood, Russell Campbell, « Too fast for Formula 1: the Brabham BT46B fan car » (mai 2025)"
        url: "https://www.goodwood.com/grr/f1/too-fast-for-formula-1-the-brabham-bt46b-fan-car/"
      - titre: "Motor Sport, Adam Cooper, « Vacuum clean-up » (mai 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1998/65/vacuum-clean"
  - id: "cranfield-commandes-de-vol"
    annee: 1980
    categorie: "technologie"
    titre: "Des commandes de vol électriques à la suspension active"
    texte: "Partenaire de Lotus depuis 1976 pour l'instrumentation des voitures en essais, l'Institut de technologie de Cranfield développe des ressorts synthétiques pour le manche à sensation artificielle d'un avion de recherche à commandes électriques. En 1980, Lotus ne maîtrise plus l'appui des voitures à effet de sol, quatre fois supérieur à celui de la Lotus 79 : le « marsouinage » de la Lotus 80 rappelle au professeur David Williams le flottement des ailes d'avion. Il propose alors à Peter Wright ses ressorts, des vérins hydrauliques pilotés par ordinateur qui tiennent la hauteur de caisse : ils donnent la suspension active de Lotus, en course dès 1983 sur la Lotus 92. Le système Williams, lui, dérive d'un système routier d'Automotive Products."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "En 1980, le professeur David Williams, de Cranfield, propose à Peter Wright le principe des ressorts synthétiques conçus pour un avion à commandes électriques (Keith Howard)."
      - jalon: "active-gagne"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Le lien vaut pour la Lotus 99T, héritière du système de Cranfield ; la suspension Williams, elle, dérive d'un système routier d'Automotive Products."
    sources:
      - titre: "Motor Sport, Keith Howard, « Active suspension » (décembre 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension"
      - titre: "Motor Sport, Andrew Frankel, « The Lotus that brought active suspension to F1: Colin Chapman’s last big thing » (mars 2012)"
        url: "https://www.motorsportmagazine.com/archive/article/march-2012/80/chapmans-last-big-thing/"
  - id: "chaparral-2k"
    annee: 1980
    categorie: "technologie"
    titre: "La Chaparral 2K gagne à Indianapolis"
    texte: "La Chaparral 2K, dessinée par John Barnard, gagne les 500 Miles d'Indianapolis 1980. Selon Motor Sport, c'est en réglant les problèmes de tringlerie de boîte de cette voiture que Barnard trouve le germe de la boîte commandée au volant, qu'il installe neuf ans plus tard sur la Ferrari 640. Interrogé, Barnard lui-même met plutôt en avant l'encombrement du levier dans un cockpit qu'il voulait très étroit."
    liens:
      - jalon: "ferrari-640"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Motor Sport situe le germe de la boîte à palettes dans la tringlerie de la Chaparral 2K, mais Barnard, interrogé, n'évoque que l'encombrement du cockpit et les valves électroniques de la suspension active."
    sources:
      - titre: "Motor Sport, James Elson, « Ferrari's 640: the 1989 flawed masterpiece ‘that's still influencing F1 design’ » (juin 2022)"
        url: "https://motorsportmagazine.com/archive/article/june-2022/114/ferraris-640-the-1989-flawed-masterpiece-thats-still-influencing-f1-design"
      - titre: "Motor Sport, « The Motor Sport interview: John Barnard » (février 2025)"
        url: "https://motorsportmagazine.com/archive/article/february-2025/115/the-motor-sport-interview-john-barnard"
      - titre: "Motor Sport, Keith Howard, « X-ray spec – Ferrari 640 » (juin 2005)"
        url: "https://www.motorsportmagazine.com/archive/article/june-2005/70/ferrari-640/"
  - id: "concorde-1981"
    annee: 1981
    categorie: "economie"
    titre: "Guerre FISA-FOCA et accords Concorde"
    texte: "Pendant l'hiver 1980-1981, la FISA de Jean-Marie Balestre et l'association des constructeurs (FOCA) menée par Bernie Ecclestone s'affrontent, sur fond de querelle sur les jupes aérodynamiques ; la FOCA va jusqu'à annoncer un championnat dissident. Le premier accord Concorde y met fin : Wikipédia le date du 19 janvier 1981, Motor Sport d'avril 1981. La FIA garde le règlement, la FOCA obtient le droit exclusif de négocier avec les organisateurs, ce qui fixe le partage entre pouvoir sportif et revenus commerciaux ; pour Nigel Roebuck, c'était là le véritable enjeu de la guerre. Les équipes s'engagent aussi à disputer toutes les courses, une garantie offerte aux télévisions."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, « 1980s » (mai 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Wikipédia, « Concorde Agreement » (consulté en octobre 2026)"
        url: "https://en.wikipedia.org/wiki/Concorde_Agreement"
  - id: "fin-des-jupes"
    annee: 1981
    categorie: "reglement"
    titre: "La fin des jupes"
    texte: "Pour freiner l'effet de sol, dont l'appui devient imprévisible et disparaît quand une jupe se coince ou se brise, le règlement 1981 interdit les jupes et impose une garde au sol de 6 cm. Balestre invoque la sécurité ; les équipes de la FOCA, sans turbo, y perdent leur principal avantage face à Ferrari, Renault et Alfa Romeo. Les équipes cherchent aussitôt à contourner la règle : la Lotus 88 à double châssis est interdite avant d'avoir couru, mais la Brabham BT49, qui s'abaisse en piste, est autorisée puis copiée. Les jupes, tolérées de nouveau en 1982 au prix de suspensions quasi rigides, disparaissent pour de bon avec le fond plat obligatoire de 1983."
    liens:
      - jalon: "lotus-78"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "Selon formula1.com, les jupes sont interdites pour limiter les gains de l'effet de sol inauguré par la Lotus 78, face à l'envolée des vitesses en virage."
      - jalon: "lotus-88"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "La Lotus 88 à double châssis cherche à garder l'effet de sol malgré l'interdiction des jupes ; elle est interdite avant d'avoir couru."
      - jalon: "fond-plat"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Le fond plat de 1983 achève ce que l'interdiction des jupes avait commencé ; formula1.com le relie aux graves accidents de la saison 1982."
      - jalon: "bt52"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "L'annonce du fond plat pour 1983 fait abandonner la BT51 à effet de sol : la BT52 est conçue et construite en six semaines, son poids reporté sur l'essieu arrière pour compenser la perte d'appui (Mark Hughes)."
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rule book - Part 1: from wing cars to flat bottoms » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU"
      - titre: "Motor Sport, Nigel Roebuck, « 1980s » (mai 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Formula1.com, Mark Hughes, « TECH TUESDAY: The ground-breaking Brabham BT52 » (août 2018)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-the-ground-breaking-brabham-bt52.64UP95DePCCSQ8cm0oAMUK"
  - id: "tag-financement"
    annee: 1981
    categorie: "economie"
    titre: "TAG finance le moteur Porsche"
    texte: "Dès octobre 1981, Porsche s'engage à produire un moteur turbo aux cotes strictes imposées par John Barnard. Mais selon Barnard, McLaren n'a de quoi payer que son étude. Ron Dennis convainc alors Techniques d'Avant Garde (TAG), groupe de la famille Ojjeh déjà commanditaire de Williams, de former avec McLaren une société commune, TAG Turbo Engines, qui finance le V6."
    liens:
      - jalon: "mp4-2"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "Selon Barnard, McLaren ne pouvait payer que l'étude du moteur ; le financement de TAG permet de le faire construire par Porsche, aux cotes qu'il impose."
    sources:
      - titre: "Autosport, Gary Watkins, « When TAG engines ruled Formula 1 » (mars 2016)"
        url: "https://www.autosport.com/f1/news/when-tag-engines-ruled-formula-1-5105275/5105275/"
      - titre: "Formula1.com, Mark Hughes, « How Niki Lauda's final title-winning car, the 1984 McLaren MP4/2, changed F1 » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/how-niki-laudas-final-title-winning-car-the-1984-mclaren-mp4-2-changed-f1.7vGiQXahtUbaKo70ZJ8OGQ"
  - id: "guerre-des-pneus-1982"
    annee: 1982
    categorie: "economie"
    titre: "La guerre des pneus"
    texte: "Au début des années 1980, Goodyear, Michelin et Pirelli se disputent la F1. Selon Doug Nye, une voiture partie à demi-pleine peut alors tenir au moins une demi-course sur des gommes plus tendres sans les détruire. Pour les Brabham à moteur turbo BMW, gourmandes et très lourdes au départ d'un Grand Prix de 200 milles, un arrêt pour le carburant et les pneus devient rentable."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Selon Doug Nye, la guerre des pneus rend l'arrêt rentable : une Brabham allégée peut courir sur des gommes plus tendres au lieu de partir lourdement chargée."
    sources:
      - titre: "Motor Sport, Doug Nye, « They stop to conquer » (novembre 2007)"
        url: "https://www.motorsportmagazine.com/archive/article/november-2007/122/doug-nye"
  - id: "carburant-220-litres-1984"
    annee: 1984
    categorie: "reglement"
    titre: "220 litres et ravitaillement interdit"
    texte: "Comme prévu, la dotation de carburant en course tombe à 220 litres en 1984 ; à bref délai, le ravitaillement en course est aussi interdit, pour raisons de sécurité. La gestion électronique du moteur devient alors décisive : McLaren-TAG l'emporte avec des V6 Porsche puissants, fiables et sobres, grâce à un système Bosch entièrement électronique. Le ravitaillement ne revient qu'en 1994."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Le ravitaillement en course, arme tactique de Brabham depuis 1982, est interdit pour 1984 pour raisons de sécurité (Doug Nye)."
      - jalon: "mp4-2"
        mecanisme: "ouvre"
        preuve: "discute"
        pourquoi: "Avec 220 litres pour toute la course, l'injection séquentielle plus économe du moteur TAG devient un avantage décisif ; mais le moteur était conçu avant la règle, qui a récompensé un choix plus qu'elle ne l'a suscité (Mark Hughes, Doug Nye)."
    sources:
      - titre: "Motor Sport, Doug Nye, « Doug Nye: ‘McLaren rewrote the history books in 1980s F1 turbo era’ » (avril 2024)"
        url: "https://motorsportmagazine.com/archive/article/april-2024/25/doug-nye-mclaren-rewrote-the-history-books-in-1980s-f1-turbo-era"
      - titre: "Formula1.com, Mark Hughes, « How Niki Lauda's final title-winning car, the 1984 McLaren MP4/2, changed F1 » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/how-niki-laudas-final-title-winning-car-the-1984-mclaren-mp4-2-changed-f1.7vGiQXahtUbaKo70ZJ8OGQ"
      - titre: "Motorsport.com, « Why was refuelling banned in F1? History of refuelling and previous accidents » (janvier 2024)"
        url: "https://au.motorsport.com/f1/news/why-was-refuelling-banned-in-f1/10555081/"
      - titre: "Formula 1, « Re-writing the F1 rulebook - Part 2: from driver aids to increased safety » (janvier 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
  - id: "crash-test-frontal"
    annee: 1985
    categorie: "securite"
    titre: "Premier crash-test obligatoire"
    texte: "La FIA introduit en 1985 un premier essai de choc frontal, encore simple : il suffit de présenter un nez et une petite partie du châssis. Vers 1998, l'essai porte sur un châssis complet et s'accompagne des premiers essais de charge statique. Les essais se multiplient ensuite (arceaux, structures latérales et arrière, panneaux anti-intrusion), souvent en réponse directe à un accident, et la structure de la voiture doit désormais réussir des essais de plus en plus exigeants pour être homologuée. Pour Jo Bauer, délégué technique de la FIA, ces essais ont sauvé la vie de Robert Kubica au Grand Prix du Canada 2007."
    sources:
      - titre: "FIA, « Breaking the barriers of safety » (mai 2013)"
        url: "https://fia.com/node/5643"
  - id: "fin-du-turbo"
    annee: 1989
    categorie: "reglement"
    titre: "Le turbo bridé puis interdit"
    texte: "Au milieu des années 1980, les turbos de 1,5 litre dépassent 1 000 ch en qualification ; la FIA veut réduire la puissance sans éloigner les constructeurs. À partir de 1987, la pression de suralimentation est limitée à 4 bars, et des moteurs atmosphériques de 3,5 litres sont admis à côté des turbos ; en 1988, la limite passe à 2,5 bars, avec 150 litres de carburant au lieu de 195. Honda répond par un V6 au rendement thermique d'environ 30 %, qui gagne 15 des 16 courses avec McLaren. En 1989, seuls les moteurs atmosphériques de 3,5 litres restent autorisés. Renault revient alors avec un V10 3,5 litres à rappel pneumatique des soupapes, le RS1."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Bridés en 1987 et 1988, les moteurs turbo sont interdits en 1989 : l'ère ouverte par la victoire de 1979 se referme."
      - jalon: "v10-renault"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La formule atmosphérique 3,5 litres de 1989 est celle pour laquelle Renault revient avec son V10 RS1."
      - jalon: "mp4-4"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "Selon Steve Nichols, son concepteur en chef, la dotation ramenée à 150 litres permet un réservoir petit et bas : avec le moteur Honda abaissé, on peut allonger le pilote et abaisser toute la voiture."
      - jalon: "march-881"
        mecanisme: "ouvre"
        preuve: "atteste"
        pourquoi: "L'arrivée progressive des moteurs atmosphériques permet le retour de March ; face à un déficit de puissance énorme sur les turbos, Newey ne voit d'autre issue qu'une voiture d'une grande efficacité aérodynamique."
    sources:
