# Chronologie des innovations (page /chronologie/).
# Chaque jalon reprend un fait deja verifie et source dans les entrees citees
# (les sources sont dans ces entrees). Champs :
#   id       : ancre (#j-<id>)
#   annee    : position sur la frise
#   voie     : architecture | aero | moteur | transmission | methode
#   titre    : intitule court
#   texte    : une ou deux phrases
#   entrees  : identifiants d'entrees (_ingenieurs/<id>.md)
#   termes   : identifiants du glossaire (_data/glossaire.yml), facultatif

voies:
  - id: architecture
    nom: "Architecture et structure"
  - id: aero
    nom: "Aérodynamique"
  - id: moteur
    nom: "Moteur"
  - id: transmission
    nom: "Transmission et électronique"
  - id: methode
    nom: "Méthode et course"

# Evenements de contexte (sous l'axe, affiches a la demande) : ce ne sont pas des
# innovations, mais ce qui les explique. Chaque evenement a ses propres sources.
#   categorie : reglement | securite | economie | technologie
#   liens     : liens de cause a effet avec les jalons (facultatif), chacun :
#                 jalon     : identifiant du jalon
#                 mecanisme : ouvre | ferme | contourne | transfert | provoque
#                 preuve    : atteste | etabli | discute | chronologique
#                 pourquoi  : une phrase, ce qui relie les deux et d'apres quelle source
#               Methode : _dossiers/causalite.md.
#   sources   : liste de { titre, url }
categories:
  - id: "reglement"
    nom: "Règlement"
  - id: "securite"
    nom: "Sécurité"
  - id: "economie"
    nom: "Économie"
  - id: "technologie"
    nom: "Technologie"

# Mecanismes et niveaux de preuve des liens (voir _dossiers/causalite.md).
mecanismes:
  - id: "ouvre"
    nom: "Ouvre"
    cote_contexte: "ouvre la voie à"
    cote_jalon: "rendu possible par"
  - id: "ferme"
    nom: "Ferme"
    cote_contexte: "met fin à"
    cote_jalon: "condamné par"
  - id: "contourne"
    nom: "Contourne"
    cote_contexte: "contourné par"
    cote_jalon: "contourne"
  - id: "transfert"
    nom: "Transfère"
    cote_contexte: "inspire"
    cote_jalon: "emprunte à"
  - id: "provoque"
    nom: "Provoque"
    cote_contexte: "provoqué par"
    cote_jalon: "provoque"
preuves:
  - id: "atteste"
    nom: "attesté"
    definition: "le concepteur ou un témoin direct affirme le lien"
  - id: "etabli"
    nom: "établi"
    definition: "un texte réglementaire ou une source historique l'affirme"
  - id: "discute"
    nom: "discuté"
    definition: "les sources divergent, ou le lien est indirect"
  - id: "chronologique"
    nom: "chronologique"
    definition: "seule l'antériorité est établie"

jalons:
  - id: lancia-d50
    annee: 1954
    voie: architecture
    titre: "Le moteur porteur de la Lancia D50"
    texte: "Le V8 de la D50 sert d'élément structurel du châssis, monté de biais pour que la transmission passe à gauche du pilote. Une équipe Lancia dirigée par Vittorio Jano en définit les principes."
    entrees: [vittorio-jano, ettore-zaccone-mina]
    termes: [moteur-porteur]

  - id: cooper-argentine
    annee: 1958
    voie: architecture
    titre: "Première victoire d'une voiture à moteur central"
    texte: "Stirling Moss gagne en Argentine sur une Cooper au châssis à tubes courbes. C'est la première victoire en Grand Prix de championnat d'une voiture à moteur central."
    entrees: [owen-maddock, john-cooper]
    termes: [moteur-central-arriere, chassis-tubulaire]

  - id: cooper-titres
    annee: 1959
    voie: architecture
    titre: "Le moteur arrière s'impose"
    texte: "Les titres Cooper de 1959 et 1960 rendent l'architecture à moteur avant rapidement obsolète. Owen Maddock est le chef designer de l'équipe."
    entrees: [john-cooper, owen-maddock]
    termes: [moteur-central-arriere]

  - id: lotus-25
    annee: 1962
    voie: architecture
    titre: "La monocoque aluminium de la Lotus 25"
    texte: "Colin Chapman généralise la coque monocoque en aluminium, qui remplace le châssis tubulaire comme architecture de référence."
    entrees: [colin-chapman]
    termes: [monocoque, chassis-tubulaire]

  - id: dfv
    annee: 1967
    voie: moteur
    titre: "Le Cosworth DFV et la Lotus 49"
    texte: "Le DFV, compact et porteur, forme la partie arrière de la Lotus 49. Disponible pour de nombreuses équipes, il remporte 155 Grands Prix."
    entrees: [keith-duckworth, mike-costin, colin-chapman]
    termes: [moteur-porteur]

  - id: ailerons
    annee: 1968
    voie: aero
    titre: "Les ailerons sur supports"
    texte: "Au Grand Prix de Belgique, Mauro Forghieri fait monter des ailerons sur supports sur la Ferrari de Chris Amon, qui signe la pole. D'autres les avaient utilisés avant lui."
    entrees: [mauro-forghieri]
    termes: [aileron]

  - id: ferrari-312t
    annee: 1975
    voie: transmission
    titre: "La boîte transversale de la Ferrari 312T"
    texte: "Première boîte de vitesses transversale de la F1, au service de la centralisation des masses ; elle est ensuite adoptée par tout le plateau."
    entrees: [mauro-forghieri, franco-rocchi]
    termes: [boite-transversale, centralisation-des-masses]

  - id: lotus-78
    annee: 1977
    voie: aero
    titre: "L'effet de sol de la Lotus 78"
    texte: "Issue des recherches de Peter Wright et Tony Rudd, la première F1 à effet de sol est dessinée par Ralph Bellamy, avec Martin Ogilvie aux suspensions, dans un programme dirigé par Colin Chapman."
    entrees: [peter-wright, tony-rudd, ralph-bellamy, martin-ogilvie, colin-chapman, tony-southgate]
    termes: [effet-de-sol, venturi, jupes]

  - id: bt46b
    annee: 1978
    voie: aero
    titre: "La voiture à ventilateur"
    texte: "La Brabham BT46B de Gordon Murray gagne le Grand Prix de Suède, sa seule course. Les sources divergent sur la suite : retrait volontaire par Brabham, ou interdiction par l'autorité sportive."
    entrees: [gordon-murray]
    termes: [voiture-a-ventilateur]

  - id: turbo-victoire
    annee: 1979
    voie: moteur
    titre: "Première victoire d'un moteur turbo"
    texte: "Renault gagne le Grand Prix de France. Le moteur dérive du V6 conçu par François Castaing et Jean-Pierre Boudy ; Bernard Dudot mène le programme moteur."
    entrees: [francois-castaing, bernard-dudot, jean-terramorsi]
    termes: [turbocompresseur]

  - id: mp4-1
    annee: 1981
    voie: architecture
    titre: "La monocoque carbone de la McLaren MP4/1"
    texte: "Première F1 à monocoque intégral en composite carbone à courir en Grand Prix, conçue par John Barnard entouré notamment de Steve Nichols et d'Alan Jenkins."
    entrees: [john-barnard, steve-nichols, alan-jenkins]
    termes: [composite-carbone, monocoque]

  - id: ravitaillement
    annee: 1982
    voie: methode
    titre: "Le ravitaillement tactique"
    texte: "Brabham et Gordon Murray réintroduisent le ravitaillement comme arme de course. Riccardo Patrese prend quatre pneus et 24 gallons en 15,6 secondes."
    entrees: [gordon-murray]
    termes: [ravitaillement]

  - id: bt52
    annee: 1983
    voie: moteur
    titre: "Premier champion du monde sur moteur turbo"
    texte: "Conçue en six semaines après l'annonce du fond plat obligatoire, qui interdit les fonds à effet de sol et les jupes, la Brabham BT52 mène Nelson Piquet au titre."
    entrees: [gordon-murray]
    termes: [turbocompresseur]

  - id: lotus-92-active
    annee: 1983
    voie: transmission
    titre: "La suspension active en course"
    texte: "La suspension active de Peter Wright est utilisée sur la Lotus 92 de Nigel Mansell lors des deux premières courses de la saison."
    entrees: [peter-wright]
    termes: [suspension-active]

  - id: rappel-pneumatique
    annee: 1986
    voie: moteur
    titre: "Le rappel pneumatique des soupapes"
    texte: "Introduit sur le moteur Renault EF15 B, il équipe tous les moteurs de F1 à partir des années 1990."
    entrees: [bernard-dudot]
    termes: [rappel-pneumatique]

  - id: active-gagne
    annee: 1987
    voie: transmission
    titre: "La suspension active gagne"
    texte: "La Lotus 99T d'Ayrton Senna devient la première F1 à suspension active à gagner un Grand Prix ; le système Williams conçu par Frank Dernie gagne à Monza avec Nelson Piquet."
    entrees: [peter-wright, frank-dernie, steve-wise, paddy-lowe]
    termes: [suspension-active]

  - id: ferrari-640
    annee: 1989
    voie: transmission
    titre: "La boîte semi-automatique au volant"
    texte: "John Barnard introduit sur la Ferrari 640 la boîte commandée par palettes : fin du levier, mains sur le volant, cockpit plus compact."
    entrees: [john-barnard]
    termes: [boite-semi-automatique]

  - id: v10-renault
    annee: 1989
    voie: moteur
    titre: "Le V10 Renault"
    texte: "Le V10 à 67° conçu sous la direction de Bernard Dudot impose l'architecture V10 à l'ensemble du plateau."
    entrees: [bernard-dudot]

  - id: tyrrell-019
    annee: 1990
    voie: aero
    titre: "Le nez relevé"
    texte: "La Tyrrell 019 de Harvey Postlethwaite et Jean-Claude Migeot relève le nez pour mieux alimenter le dessous de la voiture ; la Leyton House d'Adrian Newey le fait la même année."
    entrees: [jean-claude-migeot, harvey-postlethwaite, adrian-newey]
    termes: [nez-releve]

  - id: fw14b
    annee: 1992
    voie: transmission
    titre: "Le titre de la suspension active"
    texte: "La Williams FW14B mène Nigel Mansell au titre, avec une suspension active dont Paddy Lowe a écrit l'essentiel du logiciel."
    entrees: [paddy-lowe, patrick-head, adrian-newey]
    termes: [suspension-active]

  - id: programme-anticipe
    annee: 1993
    voie: methode
    titre: "Le programme lancé un an à l'avance"
    texte: "Chez Benetton, Ross Brawn fait commencer la conception de la voiture de 1994 dès le début de 1993, ce qui était presque inédit."
    entrees: [ross-brawn, rory-byrne]

  - id: double-diffuseur
    annee: 2009
    voie: aero
    titre: "Le double diffuseur de la Brawn BGP 001"
    texte: "Lancée chez Honda, la BGP 001 exploite une faille du nouveau règlement ; le concept de double plancher vient d'un ingénieur japonais."
    entrees: [ross-brawn]
    termes: [diffuseur]

  - id: hybride
    annee: 2014
    voie: moteur
    titre: "Le groupe propulseur hybride Mercedes"
    texte: "Turbo séparé de part et d'autre du moteur, intégration avec le châssis : Mercedes domine l'ère hybride, imposée par le règlement."
    entrees: [andy-cowell, aldo-costa, ross-brawn]
    termes: [groupe-propulseur-hybride]

  - id: rendement-50
    annee: 2017
    voie: moteur
    titre: "50 % de rendement thermique"
    texte: "Le moteur Mercedes, à 44 % de rendement en 2014, franchit pour la première fois la barre des 50 % au banc."
    entrees: [andy-cowell]
    termes: [groupe-propulseur-hybride]

  - id: cooper-500
    annee: 1946
    voie: architecture
    titre: "Le moteur derrière le pilote, en 500 cm³"
    texte: "Le prototype de John Cooper et Eric Brandon place le moteur au milieu, « pour des raisons largement pratiques ». La disposition fera son chemin jusqu'à la F1."
    entrees: [john-cooper]
    termes: [moteur-central-arriere]

  - id: dfv-fva
    annee: 1966
    voie: moteur
    titre: "Le Cosworth FVA"
    texte: "Premier moteur conçu par Keith Duckworth à partir d'une feuille blanche, ce quatre cylindres de Formule 2 prépare le DFV."
    entrees: [keith-duckworth, mike-costin]

  - id: lotus-72
    annee: 1970
    voie: aero
    titre: "La Lotus 72 et ses radiateurs latéraux"
    texte: "Conçue par Maurice Philippe avec Colin Chapman, elle place les radiateurs sur les flancs ; avec ses évolutions, elle remporte cinq titres mondiaux et 20 Grands Prix selon Lotus (22 selon Classic Team Lotus)."
    entrees: [colin-chapman]

  - id: lotus-88
    annee: 1981
    voie: aero
    titre: "La Lotus 88 à double châssis"
    texte: "Deux caisses suspendues séparément : le concept, auquel Peter Wright prend une part clé, est contesté et la voiture ne court jamais."
    entrees: [colin-chapman, peter-wright]
    termes: [effet-de-sol]

  - id: fond-plat
    annee: 1983
    voie: aero
    titre: "Le fond plat obligatoire"
    texte: "Annoncé le 3 novembre 1982, il interdit les fonds à effet de sol et les jupes ; le diffuseur arrière reste autorisé."
    entrees: [gordon-murray]
    termes: [fond-plat, effet-de-sol, jupes]

  - id: mp4-2
    annee: 1984
    voie: moteur
    titre: "Le moteur aux cotes du châssis"
    texte: "Pour la McLaren MP4/2, John Barnard impose à Porsche les dimensions du V6 turbo TAG, au service de l'aérodynamique ; la voiture gagne 12 des 16 courses."
    entrees: [john-barnard]
    termes: [turbocompresseur]

  - id: march-881
    annee: 1988
    voie: aero
    titre: "Le nez intégré de la March 881"
    texte: "Adrian Newey intègre entièrement le nez et l'aileron avant, creusés dessous pour mieux alimenter le plancher."
    entrees: [adrian-newey]
    termes: [aileron]

  - id: mp4-4
    annee: 1988
    voie: architecture
    titre: "La McLaren MP4/4, quinze victoires sur seize"
    texte: "La McLaren MP4/4 gagne 15 des 16 courses de 1988. Sa paternité reste discutée : Steve Nichols, son concepteur en chef, y voit une évolution de la MP4/3 ; Gordon Murray conteste ce récit. Autosport cite aussi Bob Bell, David North, Matthew Jeffreys et Steve Nielsen parmi ses auteurs."
    entrees: [steve-nichols, gordon-murray]

  - id: fw17b
    annee: 1995
    voie: aero
    titre: "Le diffuseur surélevé de la Williams FW17B"
    texte: "Apparu fin 1995, ce diffuseur à sortie surélevée devient un atout majeur de la Williams 1996."
    entrees: [adrian-newey]
    termes: [diffuseur]

  - id: rb6
    annee: 2010
    voie: aero
    titre: "Le diffuseur soufflé de la Red Bull RB6"
    texte: "Adrian Newey « réinvente » le diffuseur soufflé par les échappements."
    entrees: [adrian-newey]
    termes: [diffuseur]

contexte:
  - id: "mosquito-radiateurs"
    annee: 1940
    categorie: "technologie"
    titre: "Les radiateurs dans l'aile du Mosquito"
    texte: "Le bimoteur de Havilland Mosquito vole pour la première fois le 25 novembre 1940 ; ses radiateurs sont logés dans le bord d'attaque des ailes. Selon Motor Sport, Tony Rudd, ancien motoriste de Rolls-Royce aviation, se souvient de ce montage quand Lotus cherche où placer les radiateurs de la future Lotus 78, et l'équipe teste en soufflerie des pontons conçus pour produire de l'appui."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "atteste"
        pourquoi: "Selon Doug Nye, Tony Rudd, ancien motoriste de Rolls-Royce aviation, se souvient des radiateurs du Mosquito quand Lotus cherche où placer ceux de la Lotus 78."
    sources:
      - titre: "Motor Sport, Doug Nye, « Lotus 78: F1’s first true ground effect car » (février 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "Wikipédia, « de Havilland Mosquito » (version du 23 octobre 2026)"
        url: "https://en.wikipedia.org/wiki/De_Havilland_Mosquito"
  - id: "championnat-1950"
    annee: 1950
    categorie: "economie"
    titre: "Premier championnat du monde"
    texte: "Le 13 mai 1950, le Grand Prix d'Europe disputé à Silverstone ouvre le premier championnat du monde. La voiture favorite, l'Alfa Romeo 158, a alors treize ans : c'est une conception d'avant-guerre."
    sources:
      - titre: "Formula 1, « 10 fascinating facts about the very first F1 Grand Prix, held on this day 70 years ago » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/10-fascinating-facts-about-the-very-first-f1-grand-prix-held-on-this-day-70.14iQuQ4N2IbV93EZj4Ruuj"
  - id: "formule-2-5-litres"
    annee: 1954
    categorie: "reglement"
    titre: "La formule 2,5 litres"
    texte: "En 1954 entre en vigueur une nouvelle Formule 1 à moteurs de 2,5 litres. Elle suscite des voitures neuves aux conceptions très éloignées, dont la Lancia D50 et la Mercedes W196, si différentes qu'on avait peine à croire qu'elles répondaient au même règlement."
    liens:
      - jalon: "lancia-d50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La D50 est conçue pour la nouvelle formule de 1954, qui suscite des voitures neuves aux conceptions très éloignées (Motor Sport, Chris Nixon)."
    sources:
      - titre: "Motor Sport Magazine, Chris Nixon, « Too good for their own good? » (avril 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/april-2002/87/too-good-for-their-own-good/"
  - id: "jaguar-d-type-monocoque"
    annee: 1954
    categorie: "technologie"
    titre: "La Jaguar D-Type et la monocoque d'avion"
    texte: "La Jaguar D-Type, voiture de sport produite à partir de 1954, applique des techniques aéronautiques, dont une section centrale monocoque en tôles d'alliage d'aluminium. Doug Nye la cite parmi les précédents de la Lotus 25 et rappelle que la monocoque était depuis cinquante ans l'élément structurel majeur de l'aéronautique ; chez Lotus, Mike Costin, venu de l'industrie aéronautique, conseille l'assemblage riveté de la coque."
    liens:
      - jalon: "lotus-25"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Doug Nye range la D-Type parmi les précédents de la Lotus 25, et Mike Costin, venu de l'aéronautique, conseille l'assemblage riveté de la coque."
    sources:
      - titre: "Motor Sport, Doug Nye, « Colin Chapman: chassis pioneer » (mars 2022)"
        url: "https://motorsportmagazine.com/archive/article/march-2022/23/colin-chapman-chassis-pioneer"
      - titre: "Motor Sport, John Tipler, « A new frame of reference » (mai 2002)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2002/27/a-new-frame-of-referance/"
      - titre: "Wikipédia, « Jaguar D-Type » (version du 18 août 2026)"
        url: "https://en.wikipedia.org/wiki/Jaguar_D-Type"
  - id: "carbone-farnborough"
    annee: 1963
    categorie: "technologie"
    titre: "La fibre de carbone du Royal Aircraft Establishment"
    texte: "En 1963, W. Watt, L. N. Phillips et W. Johnson mettent au point au Royal Aircraft Establishment de Farnborough un procédé qui révèle le potentiel de résistance de la fibre de carbone, ensuite exploitée par l'industrie aéronautique. Le lien avec la McLaren MP4/1 reste indirect : John Barnard dit avoir eu l'idée d'une coque en carbone en voyant British Aerospace fabriquer en composite carbone le capot du réacteur Rolls-Royce RB211."
    liens:
      - jalon: "mp4-1"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "John Barnard dit avoir pensé au carbone en voyant British Aerospace fabriquer un capot de réacteur en composite ; le procédé de Farnborough n'y mène qu'indirectement, par l'industrie aéronautique."
    sources:
      - titre: "Wikipédia, « Carbon fibers » (version du 18 octobre 2026)"
        url: "https://en.wikipedia.org/wiki/Carbon_fibers"
      - titre: "Motor Sport, James Elson, « John Barnard remembers his McLaren MP4/1 eureka moment » (septembre 2021)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/john-barnard-remembers-his-mclaren-mp4-1-eureka-moment"
      - titre: "Motor Sport, Rob Widdows, « Carbon natural » (mai 2007)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2007/73/carbon-natural"
  - id: "chaparral-ailerons"
    annee: 1966
    categorie: "technologie"
    titre: "Les ailerons des Chaparral"
    texte: "En Can-Am et en sport-prototypes, les Chaparral de Jim Hall portent dès 1966 de grands ailerons sur supports, réglables en roulant, et déplacent les radiateurs dans des pontons latéraux. Chris Amon, pilote de la Ferrari à aileron de Spa en 1968, s'étonne que la F1 ait tant tardé alors que ces ailerons « marchaient » ; Goodwood estime que Chapman s'est inspiré des radiateurs latéraux de Hall pour la Lotus 72."
    liens:
      - jalon: "ailerons"
        mecanisme: "transfert"
        preuve: "chronologique"
        pourquoi: "Les Chaparral portent des ailerons depuis 1966 et Chris Amon le rappelle, mais aucune source ne dit que Ferrari s'en est inspiré : seule l'antériorité est établie."
      - jalon: "lotus-72"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Goodwood écrit que Chapman a repris pour la Lotus 72 les radiateurs en pontons latéraux de Jim Hall."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, « 1968 Belgian Grand Prix: Nigel Roebuck’s F1 Legends » (octobre 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/october-1998/18/legends-11/"
      - titre: "Goodwood, Damien Smith, « Winging it: When F1 really started to fly » (mars 2025)"
        url: "https://www.goodwood.com/grr/f1/winging-it-when-f1-really-started-to-fly/"
  - id: "formule-3-litres"
    annee: 1966
    categorie: "reglement"
    titre: "Le « retour à la puissance » : la formule 3 litres"
    texte: "En 1966, la cylindrée des moteurs atmosphériques double pour passer à 3 litres ; annoncé trois ans plus tôt, le changement trouve pourtant beaucoup d'équipes mal préparées. Coventry Climax s'étant retiré fin 1965, les équipes britanniques manquent d'un moteur vendu à tous, vide que viendra combler le Cosworth DFV."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le passage à 3 litres et le retrait de Coventry Climax laissent les équipes britanniques sans moteur vendu à tous : le DFV comble ce vide (David Tremayne)."
    sources:
      - titre: "Motor Sport Magazine, « 1966 F1 World Championship » (base de données, non datée)"
        url: "https://www.motorsportmagazine.com/database/championships/f1/1966-f1-world-championship"
      - titre: "GrandPrix.com, David Tremayne, « The Father of the DFV » (janvier 2001), reproduit sur walterhayes.co.uk"
        url: "https://walterhayes.co.uk/motorsport-article/the-father-of-the-dfv-grandprix-com-january-26th-20001/"
  - id: "stewart-campagne-securite"
    annee: 1966
    categorie: "securite"
    titre: "Accident de Jackie Stewart à Spa et campagne pour la sécurité"
    texte: "Au Grand Prix de Belgique 1966, Jackie Stewart reste longtemps coincé dans sa BRM, imbibé de carburant, et doit être dégagé par Graham Hill et Bob Bondurant faute de commissaires. Il fait ensuite campagne pour la sécurité, d'abord avec peu de soutien des circuits et de l'autorité sportive. Côté voiture, il exige dès 1967 des ceintures de sécurité dans sa BRM, alors que l'arceau rudimentaire, obligatoire depuis 1961, était à peu près la seule exigence."
    sources:
      - titre: "Motor Sport Magazine, « A year of living dangerously » (août 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/august-2010/46/a-year-of-living-dangerously/"
  - id: "dfv-clients-1968"
    annee: 1968
    categorie: "economie"
    titre: "Le DFV en vente libre"
    texte: "Pour 1968, Lotus perd l'exclusivité du Cosworth DFV, financé par Ford ; Walter Hayes, chez Ford, juge que le moteur tuerait la compétition s'il n'était pas partagé. Matra, engagée par Ken Tyrrell, et McLaren en sont les premiers clients, et dès 1969 deux tiers des voitures du plateau en sont équipées. Vendu à un prix abordable, il ouvre l'ère dite des « kit cars », où des équipes sans motoriste associent leur propre châssis à un moteur acheté."
    liens:
      - jalon: "dfv"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La fin de l'exclusivité Lotus, voulue par Walter Hayes chez Ford, fait du DFV le moteur de deux tiers du plateau dès 1969."
    sources:
      - titre: "Motor Sport, « F1 non-championship races – Part two: the ’60s » (septembre 2008)"
        url: "https://www.motorsportmagazine.com/archive/article/september-2008/92/f1-non-championship-races-part-two-60s/"
      - titre: "Goodwood, « Thank Frankel It's Friday: The greatest engine of all » (octobre 2016)"
        url: "https://www.goodwood.com/grr/columnists/andrew-frankel/2016/10/thank-frankel-its-friday-the-greatest-engine-of-all/"
      - titre: "The Race, Gary Anderson, « The good, bad and ugly of Ford in F1 » (février 2023)"
        url: "https://the-race.com/formula-1/gary-anderson-the-good-bad-and-ugly-of-ford-in-f1/"
  - id: "sponsors-1968"
    annee: 1968
    categorie: "economie"
    titre: "La publicité hors automobile"
    texte: "Après le départ de commanditaires historiques comme Esso et BP, les règles internationales sur le parrainage sont assouplies fin 1967 : il n'est plus réservé aux produits liés à l'automobile. Team Lotus court en 1968 aux couleurs de la marque de cigarettes Gold Leaf, mais Motor Sport rappelle que les Brabham de Team Gunston ont porté une livrée commerciale dès le Grand Prix d'Afrique du Sud, le 1er janvier 1968. Les équipes trouvent là un financement indépendant des industriels de l'automobile."
    sources:
      - titre: "Sports Car Digest, « Gold Leaf Team Lotus: The Deal and the First Glory » (avril 2024)"
        url: "https://sportscardigest.com/gold-leaf-team-lotus-the-deal-and-the-first-glory/"
      - titre: "Motor Sport, « Letters from readers, February 2004 » (février 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2004/5/letters-readers-february-2004/"
  - id: "interdiction-ailerons-hauts"
    annee: 1969
    categorie: "reglement"
    titre: "Les ailerons sur supports hauts interdits"
    texte: "Au Grand Prix d'Espagne 1969, les deux Lotus 49 d'usine sortent violemment de la piste après la rupture de leurs ailerons. La CSI réunit une séance d'urgence pendant le week-end de Monaco et interdit aussitôt les ailerons non réglementés, malgré les équipes qui jugeaient leurs voitures conçues autour de ces appendices."
    liens:
      - jalon: "ailerons"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "L'interdiction suit directement la rupture des ailerons des deux Lotus 49 d'usine au Grand Prix d'Espagne 1969."
      - jalon: "ailerons"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La CSI interdit les ailerons non réglementés, ce qui met fin aux ailerons sur hauts supports."
    sources:
      - titre: "Motor Sport Magazine, « 1969 F1 World Championship » (base de données, non datée)"
        url: "https://motorsportmagazine.com/database/championships/1969-f1-world-championship"
  - id: "chaparral-2j"
    annee: 1970
    categorie: "technologie"
    titre: "La Chaparral 2J aspirante"
    texte: "En Can-Am, la Chaparral 2J de 1970 utilise deux ventilateurs entraînés par un moteur auxiliaire pour aspirer l'air sous la voiture, avant d'être exclue de la série. Les sources divergent sur sa filiation avec la Brabham BT46B : Motor Sport la présente comme l'inspiration et cite Gordon Murray (« le concept de base, oui, il vient de là »), tandis que Goodwood juge l'influence incertaine."
    liens:
      - jalon: "bt46b"
        mecanisme: "transfert"
        preuve: "discute"
        pourquoi: "Gordon Murray dit que le concept de base vient de la Chaparral 2J (Motor Sport), mais Goodwood juge l'influence incertaine."
    sources:
      - titre: "Motor Sport, Adam Cooper, « Vacuum clean-up » (mai 1998)"
        url: "https://www.motorsportmagazine.com/archive/article/may-1998/65/vacuum-clean"
      - titre: "Goodwood, Russell Campbell, « Too fast for Formula 1: the Brabham BT46B fan car » (mai 2025)"
        url: "https://www.goodwood.com/grr/f1/too-fast-for-formula-1-the-brabham-bt46b-fan-car/"
  - id: "imperial-tapis-roulant"
    annee: 1974
    categorie: "technologie"
    titre: "La soufflerie à tapis roulant de l'Imperial College"
    texte: "La soufflerie de l'Imperial College, à Londres, dispose d'un tapis roulant conçu par John Stollery, ancien aérodynamicien de Donald Campbell, qui reproduit le défilement du sol sous la maquette. Les essais aéronautiques se contentaient d'un sol fixe ou d'une maquette suspendue ; c'est dans cette soufflerie que Peter Wright mène, à partir de 1974, les recherches de Lotus qui aboutissent à la Lotus 78."
    liens:
      - jalon: "lotus-78"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Le tapis roulant, qui reproduit le défilement du sol, permet à Peter Wright de mener dans cette soufflerie les recherches qui aboutissent à la Lotus 78 (Gordon Kirby, Doug Nye)."
    sources:
      - titre: "Motor Sport, Gordon Kirby, « Lotus’s ground-effect revolution, part one » (octobre 2015)"
        url: "https://motorsportmagazine.com/articles/history/lotuss-ground-effect-revolution-part-one"
      - titre: "Motor Sport, Doug Nye, « Lotus 78: F1’s first true ground effect car » (février 2020)"
        url: "https://motorsportmagazine.com/archive/article/february-2020/111/lotus-78-2"
      - titre: "Motor Sport, Gordon Cruickshank, « Venturi capitalists » (juillet 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2004/134/venturi-capitalists/"
  - id: "renault-1977"
    annee: 1977
    categorie: "economie"
    titre: "Renault arrive avec le turbo"
    texte: "Renault, avec son partenaire pétrolier Elf, engage la RS01 au Grand Prix de Grande-Bretagne 1977, avec un six-cylindres turbo de 1,5 litre face aux V8 et aux douze-cylindres atmosphériques. Les casses sont fréquentes au début, mais la RS10 gagne à Dijon en 1979. Au début des années 1980, face à la puissance des turbos, les équipes restées au DFV misent sur le châssis et l'effet de sol."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La victoire de Dijon couronne le programme turbo que Renault et Elf engagent en 1977, malgré les casses des débuts."
    sources:
      - titre: "Renault, The Originals, « Renault RS01 » (page non datée)"
        url: "https://theoriginals.renault.com/en/f1-rs-01"
      - titre: "Motor Sport, Nigel Roebuck, « 1980s » (mai 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
  - id: "cranfield-commandes-de-vol"
    annee: 1980
    categorie: "technologie"
    titre: "Des commandes de vol électriques à la suspension active"
    texte: "Partenaire de Lotus depuis 1976 pour l'instrumentation des voitures en essais, l'Institut de technologie de Cranfield développe des ressorts synthétiques pour le manche à sensation artificielle d'un avion de recherche à commandes électriques. En 1980, le professeur David Williams propose ce principe à Peter Wright : il donne la suspension active de Lotus, en course dès 1983 sur la Lotus 92. Le système Williams, lui, dérive d'un système routier d'Automotive Products."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "En 1980, le professeur David Williams, de Cranfield, propose à Peter Wright le principe des ressorts synthétiques conçus pour un avion à commandes électriques (Keith Howard)."
      - jalon: "active-gagne"
        mecanisme: "transfert"
        preuve: "etabli"
        pourquoi: "Le lien vaut pour la Lotus 99T, héritière du système de Cranfield ; la suspension Williams, elle, dérive d'un système routier d'Automotive Products."
    sources:
      - titre: "Motor Sport, Keith Howard, « Active suspension » (décembre 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2001/69/active-suspension"
      - titre: "Motor Sport, Andrew Frankel, « The Lotus that brought active suspension to F1: Colin Chapman’s last big thing » (mars 2012)"
        url: "https://www.motorsportmagazine.com/archive/article/march-2012/80/chapmans-last-big-thing/"
  - id: "concorde-1981"
    annee: 1981
    categorie: "economie"
    titre: "Guerre FISA-FOCA et accords Concorde"
    texte: "Pendant l'hiver 1980-1981, la FISA de Jean-Marie Balestre et l'association des constructeurs (FOCA) menée par Bernie Ecclestone s'affrontent, sur fond de querelle sur les jupes aérodynamiques. Le premier accord Concorde y met fin : Wikipédia le date du 19 janvier 1981, Motor Sport d'avril 1981. La FIA garde le règlement, la FOCA obtient le droit exclusif de négocier avec les organisateurs, ce qui fixe le partage entre pouvoir sportif et revenus commerciaux."
    sources:
      - titre: "Motor Sport, Nigel Roebuck, « 1980s » (mai 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/may-2010/74/1980s/"
      - titre: "Wikipédia, « Concorde Agreement » (consulté en octobre 2026)"
        url: "https://en.wikipedia.org/wiki/Concorde_Agreement"
  - id: "fin-des-jupes"
    annee: 1981
    categorie: "reglement"
    titre: "La fin des jupes"
    texte: "Pour freiner l'effet de sol, le règlement 1981 interdit les jupes et impose une garde au sol de 6 cm. Les équipes cherchent aussitôt à contourner la règle : la Lotus 88 à double châssis est interdite avant d'avoir couru. Les jupes, tolérées de nouveau en 1982, disparaissent pour de bon avec le fond plat obligatoire de 1983."
    liens:
      - jalon: "lotus-78"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "Selon formula1.com, les jupes sont interdites pour limiter les gains de l'effet de sol inauguré par la Lotus 78, face à l'envolée des vitesses en virage."
      - jalon: "lotus-88"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "La Lotus 88 à double châssis cherche à garder l'effet de sol malgré l'interdiction des jupes ; elle est interdite avant d'avoir couru."
      - jalon: "fond-plat"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Le fond plat de 1983 achève ce que l'interdiction des jupes avait commencé ; formula1.com le relie aux graves accidents de la saison 1982."
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rule book - Part 1: from wing cars to flat bottoms » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rule-book-part-1-from-wing-cars-to-flat-bottoms.EJZ73Lnn0c6EgcMKMAWOU"
  - id: "crash-test-frontal"
    annee: 1985
    categorie: "securite"
    titre: "Premier crash-test obligatoire"
    texte: "La FIA introduit en 1985 un premier essai de choc frontal, encore simple : il suffit de présenter un nez et une petite partie du châssis. Les essais se multiplient ensuite (charges statiques, arceaux, structures latérales et arrière), et la structure de la voiture doit désormais réussir des essais de plus en plus exigeants pour être homologuée."
    sources:
      - titre: "FIA, « Breaking the barriers of safety » (mai 2013)"
        url: "https://fia.com/node/5643"
  - id: "fin-du-turbo"
    annee: 1989
    categorie: "reglement"
    titre: "Le turbo bridé puis interdit"
    texte: "À partir de 1987, la pression de suralimentation est limitée à 4 bars, puis à 2,5 bars en 1988, avec 150 litres de carburant au lieu de 195. En 1989, seuls les moteurs atmosphériques de 3,5 litres restent autorisés. Renault revient alors avec un V10 3,5 litres à rappel pneumatique des soupapes, le RS1."
    liens:
      - jalon: "turbo-victoire"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Bridés en 1987 et 1988, les moteurs turbo sont interdits en 1989 : l'ère ouverte par la victoire de 1979 se referme."
      - jalon: "v10-renault"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "La formule atmosphérique 3,5 litres de 1989 est celle pour laquelle Renault revient avec son V10 RS1."
    sources:
      - titre: "Motor Sport Magazine, « When F1 had two sets of engine rules, and why that wouldn't work today » (avril 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/when-f1-had-two-sets-of-engine-rules-and-why-that-wouldnt-work-today/"
      - titre: "Honda, « RA168E » (site du constructeur, non daté)"
        url: "https://global.honda/en/POWEREDbyHONDA/1988_ra168e/"
      - titre: "Motor Sport Magazine, « Teapots, turbos and titles: Renault's wild F1 ride » (décembre 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
  - id: "fin-aides-electroniques"
    annee: 1994
    categorie: "reglement"
    titre: "Les aides électroniques interdites"
    texte: "Pour 1994, les aides au pilotage apparues au début des années 1990 sont interdites : suspension active, antipatinage et antiblocage. Les équipes doivent repartir d'une feuille blanche et chercher l'adhérence par l'aérodynamique et la mécanique."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active est interdite pour 1994 avec les autres aides au pilotage."
      - jalon: "active-gagne"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active est interdite pour 1994 avec les autres aides au pilotage."
      - jalon: "fw14b"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active de la FW14B est interdite pour 1994 avec les autres aides au pilotage."
    sources:
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Motor Sport Magazine, « That was 1994 » (décembre 2004)"
        url: "https://www.motorsportmagazine.com/archive/article/december-2004/42/that-was-1994/"
  - id: "imola-1994"
    annee: 1994
    categorie: "securite"
    titre: "Imola 1994 : mort de Ratzenberger et de Senna"
    texte: "Roland Ratzenberger et Ayrton Senna meurent au Grand Prix de Saint-Marin 1994. La FIA ralentit aussitôt les voitures : diffuseur raccourci et ailerons avant modifiés dès l'Espagne, puis planche sous le fond, qui oblige à relever toute la voiture. En 1995, le fond à marche réduit l'appui du soubassement jusqu'à 50 % selon les estimations, tandis que le cockpit est allongé, ses flancs relevés et l'essai de choc frontal durci."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, « Imola ‘94 and the lasting safety legacy » (mai 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
      - titre: "Formula 1, « Re-writing the F1 rulebook - Part 2: from driver aids to increased safety » (2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
  - id: "protections-laterales-cockpit"
    annee: 1996
    categorie: "securite"
    titre: "Flancs de cockpit relevés et appuie-tête latéraux"
    texte: "Après des flancs déjà relevés en 1995 pour couvrir les épaules, la FIA impose en 1996 des flancs de cockpit plus hauts et des appuie-tête latéraux de 75 mm, avec des essais de charge statique sur le bord du cockpit. La tête du pilote, jusque-là largement exposée, est désormais entourée par la structure de la voiture."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, « Re-writing the F1 rulebook - Part 2: from driver aids to increased safety » (2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-2--from-driver-aids-to-stepped.6ng1HQEGGsImQKekgaG4sw"
  - id: "prius-hybride"
    annee: 1997
    categorie: "technologie"
    titre: "La Toyota Prius, première hybride de série"
    texte: "En 1997, Toyota lance la Prius, premier véhicule hybride produit en série, qui récupère l'énergie perdue au freinage. Le sens de l'emprunt avec la F1 est discuté : à l'arrivée du KERS en 2009, Toyota le juge « primitif » et sans rapport avec ses hybrides routiers, tandis que formula1.com affirme en 2014 que les progrès des KERS de F1 ont profité aux hybrides de série."
    sources:
      - titre: "IEEE, Engineering and Technology History Wiki, « Milestones: Toyota Prius, the World's First Mass-Produced Hybrid Vehicle, 1997 » (février 2025)"
        url: "https://ethw.org/Milestones:Toyota_Prius,_the_World%27s_First_Mass-Produced_Hybrid_Vehicle,_1997"
      - titre: "New Atlas, « Formula One KERS explained » (mars 2009)"
        url: "https://newatlas.com/formula-one-kers/11324/"
      - titre: "Formula1.com, « Hybrid update for Mercedes' car name » (mai 2014)"
        url: "https://www.formula1.com/en/latest/headlines/2014/5/Hybrid-update-for-Mercedes-car-name.html"
  - id: "hans"
    annee: 2003
    categorie: "securite"
    titre: "Le HANS devient obligatoire"
    texte: "Le système de retenue de la tête et du cou HANS, conçu par Robert Hubbard et Jim Downing puis adapté aux monoplaces avec le concours de DaimlerChrysler, devient obligatoire en F1 en 2003. La FIA reconnaît qu'il relève légèrement le centre de gravité de la voiture et autorise les équipes à l'adapter à leur cockpit, sous réserve de son accord."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "GrandPrix.com, « FIA stands by HANS device » (mars 2003)"
        url: "https://www.grandprix.com/news/fia-stands-by-hans-device.html"
      - titre: "Formula 1, « 5 crucial milestone moments in F1 safety technology » (mai 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "honda-brawn-2008"
    annee: 2008
    categorie: "economie"
    titre: "Honda se retire, Brawn GP naît"
    texte: "Fin 2008, en pleine crise économique mondiale, Honda quitte la Formule 1. Ross Brawn et Nick Fry négocient le rachat de l'équipe par sa direction, Honda apportant près de 100 millions de livres. La voiture 2009, déjà étudiée chez Honda, court sous le nom de Brawn avec son double diffuseur."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le rachat par la direction, financé par Honda, permet à la voiture étudiée chez Honda de courir en 2009 sous le nom de Brawn."
    sources:
      - titre: "The Race, Scott Mitchell-Malm, « The last time Honda withdrew from F1 – by those it left behind » (avril 2021)"
        url: "https://the-race.com/formula-1/the-last-time-honda-withdrew-from-f1-by-those-it-left-behind"
  - id: "economies-2009"
    annee: 2009
    categorie: "economie"
    titre: "Fin des essais privés en saison"
    texte: "En décembre 2008, quelques jours après le départ de Honda, le Conseil mondial adopte avec les équipes un plan d'économies. À partir de 2009, plus aucun essai n'est permis après le début de la saison, et les souffleries ne peuvent plus accueillir de maquettes à l'échelle réelle, 60 % devenant le maximum. Les vendredis de Grand Prix prennent une place nouvelle dans la mise au point."
    sources:
      - titre: "Motor Sport, Adam Cooper, « Formula 1 costs slashed for 2009 » (février 2009)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2009/12/formula-1-costs-slashed-for-2009/"
  - id: "refonte-aero-2009"
    annee: 2009
    categorie: "reglement"
    titre: "La refonte aérodynamique de 2009"
    texte: "Le règlement 2009 supprime les déflecteurs et appendices et vise une réduction d'appui de 50 %, avec un diffuseur redessiné. Williams, Brawn et Toyota exploitent une faille dans la rédaction du texte et créent le « double diffuseur »."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "Williams, Brawn et Toyota exploitent chacune une faille dans la rédaction du nouveau règlement aérodynamique."
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "bianchi-voiture-securite-virtuelle"
    annee: 2014
    categorie: "securite"
    titre: "Accident de Jules Bianchi et voiture de sécurité virtuelle"
    texte: "Après l'accident de Jules Bianchi au Grand Prix du Japon 2014, qui lui sera finalement fatal, la FIA introduit en 2015 la voiture de sécurité virtuelle, qui impose un temps au tour minimal pour faire ralentir les pilotes. Les panneaux anti-intrusion en Zylon de la cellule de survie sont aussi prolongés jusqu'au bord du cockpit, le long de la tête du pilote."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
  - id: "groupe-propulseur-2014"
    annee: 2014
    categorie: "reglement"
    titre: "Le groupe propulseur hybride obligatoire"
    texte: "En 2014, les V8 atmosphériques de 2,4 litres cèdent la place à un V6 turbo de 1,6 litre associé à deux systèmes de récupération d'énergie. Le carburant est limité à 100 kg par course et le débit à 100 kg/h : le rendement devient un critère de performance central."
    liens:
      - jalon: "hybride"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le règlement 2014 impose le V6 turbo hybride ; le groupe propulseur Mercedes en est la réponse dominante."
      - jalon: "rendement-50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "En limitant le carburant à 100 kg et le débit à 100 kg/h, le règlement fait du rendement un critère central de performance."
    sources:
      - titre: "Formula1.com, « A racing revolution? Understanding 2014's technical regulations » (janvier 2014)"
        url: "https://www.formula1.com/en/latest/article/a-racing-revolution-understanding-2014s-technical-regulations.1bTbN3OAEksY00PVE62KvC"
  - id: "halo"
    annee: 2018
    categorie: "securite"
    titre: "Introduction du halo"
    texte: "Après avoir étudié trois types de protection frontale, dont un pare-brise, la FIA impose en 2018 le halo, un arceau en titane à trois branches fixé devant et au-dessus du cockpit. Critiqué au départ pour son esthétique, il met fin au cockpit entièrement ouvert et devient obligatoire dans toutes les monoplaces de la FIA."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, « 5 crucial milestone moments in F1 safety technology » (mai 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "grosjean-bahrein"
    annee: 2020
    categorie: "securite"
    titre: "Accident de Romain Grosjean à Bahreïn"
    texte: "Au Grand Prix de Bahreïn 2020, la Haas de Romain Grosjean percute le rail à 192 km/h, traverse la glissière et prend feu ; le pilote s'en échappe, blessé. L'enquête de la FIA conclut que la cellule de survie, l'appuie-tête, le HANS et le halo ont rempli leur rôle, mais elle lance une révision de la géométrie avant de la cellule, des appuie-tête et de l'installation des réservoirs souples et de leurs trappes."
    sources:
      - titre: "FIA, « FIA concludes investigation into Romain Grosjean's accident at 2020 Bahrain Formula 1 Grand Prix and releases 2021 circuit racing safety initiatives » (mars 2021)"
        url: "https://api.fia.com/news/fia-concludes-investigation-romain-grosjeans-accident-2020-bahrain-formula-1-grand-prix-and"
  - id: "essais-aero-echelonnes-2021"
    annee: 2021
    categorie: "economie"
    titre: "Essais aérodynamiques échelonnés"
    texte: "Longtemps illimité, le développement aérodynamique est rationné à partir de 2021 : le temps de soufflerie et de calcul CFD de chaque équipe dépend de son classement au championnat précédent. En 2021, le champion a droit à 90 % de l'allocation de référence et le dixième à 112,5 % ; l'écart s'élargit à 70 % et 115 % à partir de 2022. Le dispositif vise à réduire les coûts et à resserrer la hiérarchie."
    sources:
      - titre: "Formula 1, Lawrence Barretto, « How F1's new sliding scale aero testing rules work – and what impact they will have on racing » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/how-f1s-new-sliding-scale-aero-testing-rules-work-and-what-impact-they-will.pn0sG8N4A0cjbNRbdYx8a"
  - id: "plafond-budgetaire-2021"
    annee: 2021
    categorie: "economie"
    titre: "Le plafond budgétaire"
    texte: "En 2021, un règlement financier rejoint pour la première fois les règlements sportif et technique. Il plafonne les dépenses annuelles qui touchent à la performance de la voiture, fixées à 145 millions de dollars après la pandémie, puis 140 et 135 millions. Le coût du développement devient lui-même une contrainte de conception."
    sources:
      - titre: "Formula 1, Lawrence Barretto, « The 2021 F1 cost cap explained – what has changed, and why? » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/the-2021-f1-cost-cap-explained-what-has-changed-and-why.5O1Te8udKLmkUl4PyVZtUJ"
  - id: "retour-effet-de-sol"
    annee: 2022
    categorie: "reglement"
    titre: "Le retour de l'effet de sol"
    texte: "Le règlement 2022 rend au fond de la voiture le rôle principal dans la production d'appui, comme au début des années 1980. Les ailerons sont redéfinis, les jantes agrandies et les bargeboards disparaissent."
    sources:
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "motoristes-2026"
    annee: 2026
    categorie: "economie"
    titre: "Audi et les nouveaux motoristes"
    texte: "Le règlement moteur de 2026 avait d'abord pour but d'attirer de nouveaux motoristes. Audi reprend Sauber et devient une équipe d'usine avec son propre groupe propulseur, Red Bull s'associe à Ford et Honda revient comme constructeur à part entière avec Aston Martin. La grille compte ainsi cinq motoristes, aux côtés de Mercedes et Ferrari."
    sources:
      - titre: "FIA, « F1 – FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry » (octobre 2022)"
        url: "https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry"
      - titre: "Formula 1, « 2026 REGULATIONS EXPLAINED: All you need to know about F1’s new power units » (janvier 2026)"
        url: "https://www.formula1.com/en/latest/article/all-you-need-to-know-about-f1s-new-power-units.14jfv7a36905uDJDdNyfQd"
  - id: "reglement-2026"
    annee: 2026
    categorie: "reglement"
    titre: "Le règlement moteur et châssis de 2026"
    texte: "Dévoilé par la FIA en juin 2024, le règlement 2026 répartit la puissance à parts égales entre moteur thermique et électricité, avec des carburants durables. Les voitures perdent 30 kg et reçoivent des ailerons avant et arrière mobiles."
    sources:
      - titre: "Formula1.com, « FIA unveils Formula 1 regulations for 2026 and beyond featuring more agile cars and active aerodynamics » (juin 2024)"
        url: "https://www.formula1.com/en/latest/article/fia-unveils-formula-1-regulations-for-2026-and-beyond-featuring-more-agile.75qJiYOHXgeJqsVQtDr2UB"
