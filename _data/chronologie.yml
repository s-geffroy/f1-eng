        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
      - titre: "Formula 1, Matt Youson, « Imola ‘94 and the lasting safety legacy » (mai 2019)"
        url: "https://www.formula1.com/en/latest/article/imola-94-and-the-legacy-of-improved-safety.5P8zqEzNjKzYw8qdckoYFF"
  - id: "honda-brawn-2008"
    annee: 2008
    categorie: "economie"
    titre: "Honda se retire, Brawn GP naît"
    texte: "Fin 2008, en pleine crise économique mondiale, Honda quitte la Formule 1 ; l'annonce, le 5 décembre, surprend une équipe qui venait de recevoir une soufflerie neuve. Ross Brawn et Nick Fry négocient le rachat de l'équipe par sa direction, Honda apportant près de 100 millions de livres, l'équivalent du coût d'une fermeture. La voiture 2009, déjà étudiée chez Honda, qui avait renoncé à sa saison 2008 pour s'y consacrer, court sous le nom de Brawn avec son double diffuseur et un moteur Mercedes. Environ 350 salariés sont licenciés ; Jenson Button gagne six des sept premières courses et le titre."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le rachat par la direction, financé par Honda, permet à la voiture étudiée chez Honda de courir en 2009 sous le nom de Brawn."
    sources:
      - titre: "The Race, Scott Mitchell-Malm, « The last time Honda withdrew from F1 – by those it left behind » (avril 2021)"
        url: "https://the-race.com/formula-1/the-last-time-honda-withdrew-from-f1-by-those-it-left-behind"
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "economies-2009"
    annee: 2009
    categorie: "economie"
    titre: "Fin des essais privés en saison"
    texte: "En décembre 2008, quelques jours après le départ de Honda, le Conseil mondial adopte avec les équipes un plan d'économies, tous craignant d'autres départs de constructeurs ; la FIA en attend jusqu'à 30 % de dépenses en moins. À partir de 2009, plus aucun essai n'est permis après le début de la saison, et les souffleries ne peuvent plus accueillir de maquettes à l'échelle réelle, 60 % devenant le maximum. Chaque moteur doit tenir trois week-ends, avec un régime ramené de 19 000 à 18 000 tr/min, et les prix des moteurs clients sont divisés par deux. Les vendredis de Grand Prix prennent une place nouvelle dans la mise au point."
    liens:
      - jalon: "simulateur"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "En supprimant les essais en saison, le plan d'économies de 2009 déplace la mise au point des circuits vers les usines, où le simulateur prend le relais de la piste (Joe Saward) ; McLaren l'avait lancé bien avant, selon Paddy Lowe."
    sources:
      - titre: "Motor Sport, Adam Cooper, « Formula 1 costs slashed for 2009 » (février 2009)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2009/12/formula-1-costs-slashed-for-2009/"
      - titre: "GrandPrix.com, Joe Saward, « Formula 1's virtual reality » (janvier 2009)"
        url: "https://www.grandprix.com/features/joe-saward/insight-formula-1s-virtual-reality.html"
      - titre: "Autosport, Edd Straw, « Does F1 still need in-season testing? » (avril 2012)"
        url: "https://www.autosport.com/f1/news/does-f1-still-need-in-season-testing-5098577/5098577/"
  - id: "refonte-aero-2009"
    annee: 2009
    categorie: "reglement"
    titre: "La refonte aérodynamique de 2009"
    texte: "À la fin des années 2000, les voitures, couvertes d'appendices, perdent beaucoup d'appui dans le sillage d'une autre, et les dépassements se raréfient. S'appuyant sur les essais d'un groupe de travail sur le dépassement, auquel participent Paddy Lowe, Pat Symonds et Rory Byrne, le règlement 2009 supprime les déflecteurs et appendices et vise une réduction d'appui de 50 %, avec un aileron arrière plus haut et plus étroit, un aileron avant plus bas, plus large et réglable par le pilote, et un diffuseur redessiné. Les pneus lisses reviennent après onze ans. Williams, Brawn et Toyota exploitent une faille dans la rédaction du texte et créent le « double diffuseur », que les réclamations ne font pas interdire."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "Williams, Brawn et Toyota exploitent chacune une faille dans la rédaction du nouveau règlement aérodynamique."
      - jalon: "rb6"
        mecanisme: "ouvre"
        preuve: "discute"
        pourquoi: "Le double diffuseur né du règlement 2009 offre l'occasion de souffler sa partie haute, ce que Newey exploite sur la RB6 ; le lien passe par le double diffuseur et reste indirect (Edd Straw)."
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Formula1.com, Edd Straw, « An innovator and trendsetter – Adrian Newey's greatest F1 contributions » (mai 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
  - id: "kers-autorise-2009"
    annee: 2009
    categorie: "reglement"
    titre: "Le KERS autorisé"
    texte: "Annoncé dès 2007, le règlement 2009 autorise un système de récupération d'énergie au freinage, qui rend jusqu'à 60 kW pendant 6,6 secondes par tour, stockée dans des batteries ou, chez Williams, un volant d'inertie électrique. Lourd, complexe et souvent peu fiable, il n'est utilisé que par quatre équipes. Resté dans le règlement en 2010, il n'est plus employé, les équipes s'étant entendues pour y renoncer ; elles réclament son retour pour 2011."
    liens:
      - jalon: "kers"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Selon Andy Cowell, Mercedes décide de concevoir son propre KERS dès la publication du règlement, en 2007."
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Autosport, Scott Mitchell, « The 2007 decision that built Mercedes' hybrid empire » (août 2019)"
        url: "https://www.autosport.com/f1/news/the-2007-decision-that-built-mercedes-hybrid-empire-5112574/5112574/"
      - titre: "Motor Sport, Adam Cooper, « Teams call for KERS in 2011 » (juillet 2010)"
        url: "https://www.motorsportmagazine.com/archive/article/july-2010/13/teams-call-for-kers-in-2011/"
  - id: "ravitaillement-interdit-2010"
    annee: 2010
    categorie: "reglement"
    titre: "Le ravitaillement interdit de nouveau"
    texte: "Réintroduit en 1994, le ravitaillement en course est de nouveau interdit à partir de 2010. Selon Motor Sport, la décision tient surtout à la sécurité et aux coûts, après une série d'incendies dans les stands ; Motorsport.com met surtout en avant la sécurité des pilotes."
    liens:
      - jalon: "ravitaillement"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "À partir de 2010, le ravitaillement en course est de nouveau interdit, ce qui clôt l'ère des stratégies fondées sur lui."
    sources:
      - titre: "Motor Sport, Pablo Elizalde, « F1 in reverse again: V8s and refuelling set to come back from bans? » (juillet 2026)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/f1-in-reverse-again-v8s-and-refuelling-set-to-come-back-from-bans/"
      - titre: "Motorsport.com, « Why was refuelling banned in F1? History of refuelling and previous accidents » (janvier 2024)"
        url: "https://au.motorsport.com/f1/news/why-was-refuelling-banned-in-f1/10555081/"
  - id: "double-diffuseur-interdit"
    annee: 2011
    categorie: "reglement"
    titre: "Le double diffuseur interdit"
    texte: "En janvier 2010, les directeurs techniques des équipes s'accordent officiellement pour interdire le double diffuseur à partir de la saison suivante. Admis en 2009 malgré les réclamations, il a provoqué une course au développement dans tout le plateau. À partir de 2011, la faille du règlement qui l'avait permis est refermée."
    liens:
      - jalon: "double-diffuseur"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "À partir de 2011, la faille du règlement qui avait permis le double diffuseur est refermée (Autosport)."
    sources:
      - titre: "Autosport, Jonathan Noble, « Double diffusers banned from 2011 » (janvier 2010)"
        url: "https://www.autosport.com/f1/news/double-diffusers-banned-from-2011-4434892/4434892/"
      - titre: "Autosport, Matt Somerfield et Giorgio Piola, « Banned: The double diffuser that triggered an F1 development race » (mai 2020)"
        url: "https://www.autosport.com/news/report.php/id/149491"
  - id: "drs-2011"
    annee: 2011
    categorie: "reglement"
    titre: "Le DRS remplace le F-duct"
    texte: "Écarté pour raisons de coût et de sécurité lors d'une réunion au Grand Prix d'Espagne 2010, le F-duct cède la place en 2011 au DRS, un aileron arrière réglable que le pilote peut ouvrir dans une zone définie, derrière une autre voiture. Gary Anderson y voit dès 2011 « un pansement », en attendant un règlement qui permette aux voitures de se suivre."
    liens:
      - jalon: "f-duct"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "Le F-duct conduit la FIA à interdire ce décrochage d'aileron et à le remplacer par un dispositif réglementé, le DRS (Gary Anderson)."
      - jalon: "f-duct"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Écarté pour raisons de coût et de sécurité lors d'une réunion au Grand Prix d'Espagne 2010, le F-duct est remplacé par le DRS en 2011 (Matt Somerfield)."
    sources:
      - titre: "Autosport, Gary Anderson, « Drag Reduction System: Did it work? » (décembre 2011)"
        url: "https://www.autosport.com/f1/news/drag-reduction-system-did-it-work-5098191/5098191/"
      - titre: "Autosport, Matt Somerfield, « Banned: The 2010 Formula 1 season's F-duct » (avril 2020)"
        url: "https://www.autosport.com/f1/news/149090/banned-the-f1-2010-season-fduct"
  - id: "echappements-2012"
    annee: 2012
    categorie: "reglement"
    titre: "Les sorties d'échappement encadrées"
    texte: "Dès 2011, la FIA modifie les règles sur l'emplacement des échappements pour décourager le soufflage du diffuseur ; elle prévoit ensuite d'interdire en cours de saison le soufflage moteur coupé, puis y renonce sous la pression des équipes. Pour 2012, le règlement délimite une zone où doit se trouver la sortie d'échappement. Les diffuseurs soufflés de l'époque disparaissent, mais les équipes trouvent vite d'autres moyens d'utiliser les gaz, avec des gains de plus en plus modestes."
    liens:
      - jalon: "rb6"
        mecanisme: "provoque"
        preuve: "etabli"
        pourquoi: "La FIA modifie les règles d'échappement pour décourager le soufflage du diffuseur relancé par la RB6 (Matt Somerfield, Giorgio Piola)."
      - jalon: "rb6"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La zone imposée en 2012 pour la sortie d'échappement met fin aux diffuseurs soufflés de l'époque ; Red Bull continue d'exploiter les gaz, avec des gains de plus en plus modestes (Edd Straw)."
    sources:
      - titre: "Motorsport.com, Matt Somerfield et Giorgio Piola, « Banned: Why exhaust blown diffusers were outlawed » (mai 2020)"
        url: "https://au.motorsport.com/f1/news/banned-tech-exhaust-blown-diffusers/4796376/"
      - titre: "Formula1.com, Edd Straw, « An innovator and trendsetter – Adrian Newey's greatest F1 contributions » (mai 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
  - id: "bianchi-voiture-securite-virtuelle"
    annee: 2014
    categorie: "securite"
    titre: "Accident de Jules Bianchi et voiture de sécurité virtuelle"
    texte: "Au Grand Prix du Japon 2014, sous la pluie, Jules Bianchi perd le contrôle de sa Marussia dans une zone sous double drapeau jaune et percute à 126 km/h la grue qui dégage la Sauber d'Adrian Sutil ; l'accident lui sera finalement fatal. Le panel d'enquête de la FIA juge impossible de rendre un tel choc survivable, et recommande plutôt une limitation de vitesse dans les secteurs sous double drapeau jaune. En 2015, la FIA introduit la voiture de sécurité virtuelle, qui impose un temps au tour minimal pour faire ralentir les pilotes. Les panneaux anti-intrusion en Zylon de la cellule de survie sont aussi prolongés jusqu'au bord du cockpit, le long de la tête du pilote."
    liens:
      - evenement: "halo"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "Selon formula1.com, Mercedes imagine le concept du halo peu après l'accident mortel de Jules Bianchi à Suzuka ; la FIA le retient ensuite face à deux autres protections."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "FIA, « Accident Panel » (décembre 2014)"
        url: "https://api.fia.com/news/accident-panel"
      - titre: "Formula 1, Katy Roberts, « 5 crucial milestone moments in F1 safety technology » (mai 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "groupe-propulseur-2014"
    annee: 2014
    categorie: "reglement"
    titre: "Le groupe propulseur hybride obligatoire"
    texte: "En 2014, les V8 atmosphériques de 2,4 litres cèdent la place à un V6 turbo de 1,6 litre associé à deux systèmes de récupération d'énergie, au freinage et sur les gaz d'échappement ; d'environ 600 ch, il reçoit quelque 160 ch électriques pendant environ 33 secondes par tour. Le carburant est limité à 100 kg par course, un tiers de moins qu'auparavant, et le débit à 100 kg/h : le rendement devient un critère de performance central. Le refroidissement élargit les pontons, le poids minimal passe de 642 à 690 kg, et l'échappement unique et central met fin aux diffuseurs soufflés. Mercedes gagne 51 des 59 courses des trois premières saisons."
    liens:
      - jalon: "hybride"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le règlement 2014 impose le V6 turbo hybride ; le groupe propulseur Mercedes en est la réponse dominante."
      - jalon: "rendement-50"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "En limitant le carburant à 100 kg et le débit à 100 kg/h, le règlement fait du rendement un critère central de performance."
    sources:
      - titre: "Formula1.com, « A racing revolution? Understanding 2014's technical regulations » (janvier 2014)"
        url: "https://www.formula1.com/en/latest/article/a-racing-revolution-understanding-2014s-technical-regulations.1bTbN3OAEksY00PVE62KvC"
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
  - id: "halo"
    annee: 2018
    categorie: "securite"
    titre: "Introduction du halo"
    texte: "Imaginé par Mercedes peu après l'accident de Jules Bianchi, le halo l'emporte sur deux autres protections frontales étudiées par la FIA, dont un pare-brise. Imposé en 2018, cet arceau à trois branches en titane de qualité aéronautique, fixé devant et au-dessus du cockpit, doit résister à une charge verticale de 116 kN ; on l'a éprouvé en projetant une roue contre lui. Critiqué au départ pour son esthétique, il met fin au cockpit entièrement ouvert et devient obligatoire dans toutes les monoplaces de la FIA. Il protège notamment Lewis Hamilton à Monza en 2021 et Zhou Guanyu à Silverstone en 2022."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
      - titre: "Formula 1, « 5 crucial milestone moments in F1 safety technology » (mai 2025)"
        url: "https://www.formula1.com/en/latest/article/5-crucial-milestone-moments-in-f1-safety-technology.4rlVLaoq24DjmJKtusZ0tp"
  - id: "grosjean-bahrein"
    annee: 2020
    categorie: "securite"
    titre: "Accident de Romain Grosjean à Bahreïn"
    texte: "Au Grand Prix de Bahreïn 2020, après un contact avec la voiture de Daniil Kvyat, la Haas de Romain Grosjean percute le rail à 192 km/h, avec un pic de 67 g, traverse la glissière et prend feu ; le pilote s'en échappe, brûlé aux mains. L'enquête de la FIA conclut que la cellule de survie, l'appuie-tête, le HANS et le halo ont rempli leur rôle. Mais le groupe propulseur s'est séparé de la cellule, et la trappe du réservoir comme le raccord d'alimentation, arrachés, ont laissé fuir le carburant : la FIA lance une révision de la géométrie avant de la cellule de survie et de l'installation des réservoirs souples, de leurs raccords et de leurs trappes."
    sources:
      - titre: "FIA, « FIA concludes investigation into Romain Grosjean's accident at 2020 Bahrain Formula 1 Grand Prix and releases 2021 circuit racing safety initiatives » (mars 2021)"
        url: "https://api.fia.com/news/fia-concludes-investigation-romain-grosjeans-accident-2020-bahrain-formula-1-grand-prix-and"
  - id: "essais-aero-echelonnes-2021"
    annee: 2021
    categorie: "economie"
    titre: "Essais aérodynamiques échelonnés"
    texte: "Longtemps illimité, au point que certaines équipes faisaient tourner leurs souffleries jour et nuit, voire plusieurs à la fois, le développement aérodynamique est rationné à partir de 2021 : le temps de soufflerie et de calcul CFD de chaque équipe dépend de son classement au championnat précédent. L'allocation de référence tombe de 65 à 40 passages en soufflerie par semaine. En 2021, le champion a droit à 90 % de cette allocation et le dixième à 112,5 % ; l'écart s'élargit à 70 % et 115 % à partir de 2022. Le dispositif vise à réduire les coûts et à resserrer la hiérarchie, sur plusieurs saisons plutôt qu'en une seule."
    sources:
      - titre: "Formula 1, Lawrence Barretto, « How F1's new sliding scale aero testing rules work – and what impact they will have on racing » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/how-f1s-new-sliding-scale-aero-testing-rules-work-and-what-impact-they-will.pn0sG8N4A0cjbNRbdYx8a"
  - id: "plafond-budgetaire-2021"
    annee: 2021
    categorie: "economie"
    titre: "Le plafond budgétaire"
    texte: "En 2021, un règlement financier rejoint pour la première fois les règlements sportif et technique, avec le même statut. Annoncé en octobre 2019 pour équilibrer le championnat et assurer la stabilité financière des équipes, il plafonne les dépenses annuelles qui touchent à la performance de la voiture, hors marketing, salaires des pilotes et des trois cadres les mieux payés. D'abord fixé à 175 millions de dollars, le plafond est ramené à 145 millions après la pandémie, puis à 140 et 135 millions ; les voitures 2020 sont reconduites en 2021. Le coût du développement devient lui-même une contrainte de conception."
    sources:
      - titre: "Formula 1, Lawrence Barretto, « The 2021 F1 cost cap explained – what has changed, and why? » (mai 2020)"
        url: "https://www.formula1.com/en/latest/article/the-2021-f1-cost-cap-explained-what-has-changed-and-why.5O1Te8udKLmkUl4PyVZtUJ"
  - id: "retour-effet-de-sol"
    annee: 2022
    categorie: "reglement"
    titre: "Le retour de l'effet de sol"
    texte: "Le règlement 2022, d'abord prévu pour 2021 et retardé par la pandémie, rend au fond de la voiture le rôle principal dans la production d'appui, comme au début des années 1980, mais sans jupes. Il vise à permettre aux voitures de se suivre : selon la F1, celles d'alors perdent 35 % de leur appui à 20 mètres d'une autre et 47 % à 10 mètres, contre 4 % et 18 % prévus en 2022. Des canaux profilés remplacent le fond à marche, et l'appui ne dépend plus des tourbillons, sensibles au sillage, que créaient les bargeboards, qui disparaissent. Les ailerons sont redéfinis et les jantes agrandies, avec des pneus de 18 pouces."
    liens:
      - jalon: "inerter"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "Le règlement 2022 interdit les inerters, devenus un équipement standard depuis une vingtaine d'années (Mark Hughes et Giorgio Piola)."
      - jalon: "rb18"
        mecanisme: "ouvre"
        preuve: "etabli"
        pourquoi: "Le retour des voitures à effet de sol par venturis permet à Newey de donner de nouveau le ton, grâce à son expérience de ces voitures (Edd Straw)."
    sources:
      - titre: "Mercedes-AMG Petronas F1 Team, « The Past Six New F1 Eras: What Changed and What Happened? » (mars 2026)"
        url: "https://www.mercedesamgf1.com/news/the-past-six-new-f1-eras-what-changed-and-what-happened"
      - titre: "Formula 1, Greg Stuart, « 10 things you need to know about the all-new 2022 F1 car » (juillet 2021)"
        url: "https://www.formula1.com/en/latest/article/10-things-you-need-to-know-about-the-all-new-2022-f1-car.4OLg8DrXyzHzdoGrbqp6ye"
      - titre: "Formula1.com, Mark Hughes et Giorgio Piola, « Tech Tuesday: How 2022's suspension overhaul could shuffle the competitive order » (février 2022)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-how-2022s-suspension-overhaul-could-shuffle-the-competitive.4PoTMQ9jbaWotbTdd4bp8j"
      - titre: "Formula1.com, Edd Straw, « An innovator and trendsetter – Adrian Newey's greatest F1 contributions » (mai 2024)"
        url: "https://www.formula1.com/en/latest/article/an-innovator-and-trendsetter-adrian-neweys-greatest-f1-contributions.3tFYlbhEcckb7cJAwKFTuy"
  - id: "motoristes-2026"
    annee: 2026
    categorie: "economie"
    titre: "Audi et les nouveaux motoristes"
    texte: "Le règlement moteur de 2026 avait d'abord pour but d'attirer de nouveaux motoristes : il supprime le MGU-H, que les constructeurs n'ont pas repris sur route, pour un groupe propulseur plus simple. Audi, engagée en août 2022 après l'adoption de ces règles, reprend Sauber, présente en F1 depuis 1993, et devient une équipe d'usine avec son propre groupe propulseur, conçu à Neuburg an der Donau. Red Bull s'associe à Ford et Honda revient comme constructeur à part entière avec Aston Martin. La grille compte ainsi cinq motoristes, aux côtés de Mercedes et Ferrari, alors que Renault cesse d'en produire et qu'Alpine devient cliente de Mercedes."
    sources:
      - titre: "FIA, « F1 – FIA welcomes Audi partnership with Sauber Motorsport for Formula 1 entry » (octobre 2022)"
        url: "https://www.fia.com/news/f1-fia-welcomes-audi-partnership-sauber-motorsport-formula-1-entry"
      - titre: "Formula 1, « 2026 REGULATIONS EXPLAINED: All you need to know about F1’s new power units » (janvier 2026)"
        url: "https://www.formula1.com/en/latest/article/all-you-need-to-know-about-f1s-new-power-units.14jfv7a36905uDJDdNyfQd"
      - titre: "Motor Sport Magazine, « Teapots, turbos and titles: Renault's wild F1 ride » (décembre 2025)"
        url: "https://www.motorsportmagazine.com/articles/single-seaters/f1/teapots-turbos-and-titles-renaults-wild-f1-ride/"
  - id: "reglement-2026"
    annee: 2026
    categorie: "reglement"
    titre: "Le règlement moteur et châssis de 2026"
    texte: "Dévoilé par la FIA en juin 2024, le règlement 2026 répartit la puissance à parts égales entre moteur thermique et électricité, avec des carburants durables : le moteur thermique passe d'environ 550 à 400 kW, l'électrique de 120 à 350 kW, et l'énergie récupérée au freinage double. Le châssis est redéfini en fonction de ces besoins énergétiques. Les voitures perdent 30 kg, pour un minimum de 768 kg, et reçoivent des ailerons avant et arrière mobiles : une position pour l'appui en virage, une autre à faible traînée en ligne droite. L'empattement maximal perd 200 mm et la largeur 100 mm."
    sources:
      - titre: "Formula1.com, « FIA unveils Formula 1 regulations for 2026 and beyond featuring more agile cars and active aerodynamics » (juin 2024)"
        url: "https://www.formula1.com/en/latest/article/fia-unveils-formula-1-regulations-for-2026-and-beyond-featuring-more-agile.75qJiYOHXgeJqsVQtDr2UB"
