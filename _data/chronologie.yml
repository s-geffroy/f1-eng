  - id: "imola-1994"
    annee: 1994
    categorie: "securite"
    titre: "Imola 1994 : mort de Ratzenberger et de Senna"
    texte: "Roland Ratzenberger et Ayrton Senna meurent au Grand Prix de Saint-Marin 1994 ; deux semaines plus tard, Karl Wendlinger est grièvement blessé à Monaco. La FIA ralentit aussitôt les voitures : diffuseur raccourci et ailerons avant modifiés dès l'Espagne, boîte à air percée au Canada pour réduire la puissance, puis planche sous le fond, à l'usure limitée à 1 mm, qui oblige à relever toute la voiture. Elle engage aussi un programme de modification des circuits et limite la vitesse dans la voie des stands à 80 km/h aux essais et 120 km/h en course. En 1995, le fond à marche réduit l'appui du soubassement jusqu'à 50 % selon les estimations et la cylindrée passe de 3,5 à 3 litres, tandis que le cockpit est allongé, ses flancs relevés et l'essai de choc frontal durci."
    liens:
      - jalon: "fw17b"
        mecanisme: "contourne"
        preuve: "etabli"
        pourquoi: "Selon Edd Straw, Newey voit que le fond à marche imposé en 1995 n'oblige pas la carrosserie à aller jusqu'à l'arrière, ce qui permet de relever la sortie du diffuseur."
      - evenement: "protections-laterales-cockpit"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "Selon GrandPrix.com, les règles de 1996 sont le fruit des travaux du groupe d'experts de la FIA sur la sécurité depuis les accidents d'Imola et de Monaco en 1994."
      - evenement: "roues-retenues"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "Pat Symonds range les câbles de retenue des roues parmi les mesures de sécurité qui suivent Imola ; la FIA les compte dans l'effort lancé après la mort de Senna."
      - evenement: "hans"
        mecanisme: "declenche"
        preuve: "etabli"
        pourquoi: "En F1, l'adoption du HANS commence après l'accident de Ratzenberger, mort d'une fracture de la base du crâne (Matt Youson) ; après les morts de Senna et de Ratzenberger, la FIA associe Mercedes-Benz à l'amélioration de la sécurité (Katy Roberts)."
      - evenement: "halo"
        mecanisme: "declenche"
        preuve: "discute"
        pourquoi: "Pat Symonds range le halo dans l'héritage d'Imola, mais le concept naît chez Mercedes après l'accident de Jules Bianchi : le lien avec Imola est indirect, à vingt-quatre ans de distance."
    sources:
      - titre: "FIA, « Legacy of Safety – How the FIA responded to the tragedy of Imola 1994 and launched a drive for safer racing » (mai 2024)"
        url: "https://fia.com/node/51351"
