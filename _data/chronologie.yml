  - id: "fin-aides-electroniques"
    annee: 1994
    categorie: "reglement"
    titre: "Les aides électroniques interdites"
    texte: "Annoncée par la FIA au milieu de 1993, l'interdiction vise à freiner les dépenses et à répondre à ceux qui jugent que le pilote compte de moins en moins. Pour 1994, les aides au pilotage apparues au début des années 1990 sont interdites : suspension active, antipatinage et antiblocage ; seule la boîte semi-automatique est conservée. Les Williams championnes en 1992 et 1993 devaient beaucoup à ces technologies. Les équipes doivent repartir d'une feuille blanche et chercher l'adhérence par l'aérodynamique et la mécanique, d'autant que le ravitaillement en course, absent depuis 1983, revient. Pour la première fois, la FIA contrôle les logiciels des voitures."
    liens:
      - jalon: "lotus-92-active"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active est interdite pour 1994 avec les autres aides au pilotage."
      - jalon: "active-gagne"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active est interdite pour 1994 avec les autres aides au pilotage."
      - jalon: "fw14b"
        mecanisme: "ferme"
        preuve: "etabli"
        pourquoi: "La suspension active de la FW14B est interdite pour 1994 avec les autres aides au pilotage."
