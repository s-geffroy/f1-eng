# Chronologie des innovations (page /chronologie/).
# Chaque jalon reprend un fait deja verifie et source dans les entrees citees
# (les sources sont dans ces entrees). Champs :
#   id       : ancre (#j-<id>)
#   annee    : position sur la frise
#   voie     : architecture | aero | moteur | transmission | methode
#   titre    : intitule court
#   texte    : une ou deux phrases
#   entrees  : identifiants d'entrees (_ingenieurs/<id>.md)
#   sources  : liste de { titre, url }, quand les faits ne sont pas deja sources
#              dans une entree (facultatif ; il faut des entrees ou des sources)
#   termes   : identifiants du glossaire (_data/glossaire.yml), facultatif

voies:
  - id: architecture
    nom: "Architecture et structure"
  - id: aero
    nom: "Aérodynamique"
  - id: moteur
    nom: "Moteur"
  - id: transmission
    nom: "Transmission et électronique"
  - id: methode
    nom: "Méthode et course"

# Evenements de contexte (sous l'axe, affiches a la demande) : ce ne sont pas des
# innovations, mais ce qui les explique. Chaque evenement a ses propres sources.
#   categorie : reglement | securite | economie | technologie
#   liens     : liens de cause a effet avec les jalons (facultatif), chacun :
#                 jalon     : identifiant du jalon, ou
#                 evenement : identifiant d'un autre evenement de contexte (mecanisme declenche)
#                 mecanisme : ouvre | ferme | contourne | transfert | provoque | declenche
#                 preuve    : atteste | etabli | discute | chronologique
#                 pourquoi  : une phrase, ce qui relie les deux et d'apres quelle source
#               Methode : _dossiers/causalite.md.
#   sources   : liste de { titre, url }
categories:
  - id: "reglement"
    nom: "Règlement"
  - id: "securite"
    nom: "Sécurité"
  - id: "economie"
    nom: "Économie"
  - id: "technologie"
    nom: "Technologie"

# Mecanismes et niveaux de preuve des liens (voir _dossiers/causalite.md).
mecanismes:
  - id: "ouvre"
    nom: "Ouvre"
    cote_contexte: "ouvre la voie à"
    cote_jalon: "rendu possible par"
  - id: "ferme"
    nom: "Ferme"
    cote_contexte: "met fin à"
    cote_jalon: "condamné par"
  - id: "contourne"
    nom: "Contourne"
    cote_contexte: "contourné par"
    cote_jalon: "contourne"
  - id: "transfert"
    nom: "Transfère"
    cote_contexte: "inspire"
    cote_jalon: "emprunte à"
  - id: "provoque"
    nom: "Provoque"
    cote_contexte: "provoqué par"
    cote_jalon: "provoque"
  - id: "declenche"
    nom: "Déclenche"
    cote_contexte: "déclenche"
    cote_jalon: "déclenché par"
preuves:
  - id: "atteste"
    nom: "attesté"
    definition: "le concepteur ou un témoin direct affirme le lien"
  - id: "etabli"
    nom: "établi"
    definition: "un texte réglementaire ou une source historique l'affirme"
  - id: "discute"
    nom: "discuté"
    definition: "les sources divergent, ou le lien est indirect"
  - id: "chronologique"
    nom: "chronologique"
    definition: "seule l'antériorité est établie"

jalons:
  - id: lancia-d50
    annee: 1954
    voie: architecture
    titre: "Le moteur porteur de la Lancia D50"
    texte: "Le V8 de la D50 sert d'élément structurel du châssis, monté de biais pour que la transmission passe à gauche du pilote. Une équipe Lancia dirigée par Vittorio Jano en définit les principes."
    entrees: [vittorio-jano, ettore-zaccone-mina]
    termes: [moteur-porteur]

  - id: cooper-argentine
    annee: 1958
    voie: architecture
    titre: "Première victoire d'une voiture à moteur central"
    texte: "Stirling Moss gagne en Argentine sur une Cooper au châssis à tubes courbes. C'est la première victoire en Grand Prix de championnat d'une voiture à moteur central."
    entrees: [owen-maddock, john-cooper]
    termes: [moteur-central-arriere, chassis-tubulaire]

  - id: cooper-titres
    annee: 1959
    voie: architecture
    titre: "Le moteur arrière s'impose"
    texte: "Les titres Cooper de 1959 et 1960 rendent l'architecture à moteur avant rapidement obsolète. Owen Maddock est le chef designer de l'équipe."
    entrees: [john-cooper, owen-maddock]
    termes: [moteur-central-arriere]

  - id: lotus-25
    annee: 1962
    voie: architecture
    titre: "La monocoque aluminium de la Lotus 25"
    texte: "Colin Chapman généralise la coque monocoque en aluminium, qui remplace le châssis tubulaire comme architecture de référence."
    entrees: [colin-chapman]
    termes: [monocoque, chassis-tubulaire]

  - id: dfv
    annee: 1967
    voie: moteur
    titre: "Le Cosworth DFV et la Lotus 49"
    texte: "Le DFV, compact et porteur, forme la partie arrière de la Lotus 49. Disponible pour de nombreuses équipes, il remporte 155 Grands Prix."
    entrees: [keith-duckworth, mike-costin, colin-chapman]
    termes: [moteur-porteur]

  - id: ailerons
    annee: 1968
    voie: aero
    titre: "Les ailerons sur supports"
    texte: "Au Grand Prix de Belgique, Mauro Forghieri fait monter des ailerons sur supports sur la Ferrari de Chris Amon, qui signe la pole. D'autres les avaient utilisés avant lui."
    entrees: [mauro-forghieri]
    termes: [aileron]

  - id: ferrari-312t
    annee: 1975
    voie: transmission
    titre: "La boîte transversale de la Ferrari 312T"
    texte: "Première boîte de vitesses transversale de la F1, au service de la centralisation des masses ; elle est ensuite adoptée par tout le plateau."
    entrees: [mauro-forghieri, franco-rocchi]
    termes: [boite-transversale, centralisation-des-masses]

  - id: lotus-78
    annee: 1977
    voie: aero
    titre: "L'effet de sol de la Lotus 78"
    texte: "Issue des recherches de Peter Wright et Tony Rudd, la première F1 à effet de sol est dessinée par Ralph Bellamy, avec Martin Ogilvie aux suspensions, dans un programme dirigé par Colin Chapman."
    entrees: [peter-wright, tony-rudd, ralph-bellamy, martin-ogilvie, colin-chapman, tony-southgate]
    termes: [effet-de-sol, venturi, jupes]

  - id: bt46b
    annee: 1978
    voie: aero
    titre: "La voiture à ventilateur"
    texte: "La Brabham BT46B de Gordon Murray gagne le Grand Prix de Suède, sa seule course. Les sources divergent sur la suite : retrait volontaire par Brabham, ou interdiction par l'autorité sportive."
    entrees: [gordon-murray]
    termes: [voiture-a-ventilateur]

  - id: turbo-victoire
    annee: 1979
    voie: moteur
    titre: "Première victoire d'un moteur turbo"
    texte: "Renault gagne le Grand Prix de France. Le moteur dérive du V6 conçu par François Castaing et Jean-Pierre Boudy ; Bernard Dudot mène le programme moteur."
    entrees: [francois-castaing, bernard-dudot, jean-terramorsi, jean-pierre-boudy]
    termes: [turbocompresseur]

  - id: mp4-1
    annee: 1981
    voie: architecture
    titre: "La monocoque carbone de la McLaren MP4/1"
    texte: "Première F1 à monocoque intégral en composite carbone à courir en Grand Prix, conçue par John Barnard entouré notamment de Steve Nichols et d'Alan Jenkins."
    entrees: [john-barnard, steve-nichols, alan-jenkins]
    termes: [composite-carbone, monocoque]

  - id: ravitaillement
    annee: 1982
    voie: methode
    titre: "Le ravitaillement tactique"
    texte: "Brabham et Gordon Murray réintroduisent le ravitaillement comme arme de course. Riccardo Patrese prend quatre pneus et 24 gallons en 15,6 secondes."
    entrees: [gordon-murray]
    termes: [ravitaillement]

  - id: bt52
    annee: 1983
    voie: moteur
    titre: "Premier champion du monde sur moteur turbo"
    texte: "Conçue en six semaines selon Mark Hughes, en trois mois selon Gordon Murray, après l'annonce du fond plat obligatoire, qui interdit les fonds à effet de sol et les jupes, la Brabham BT52 mène Nelson Piquet au titre."
    entrees: [gordon-murray, paul-rosche]
    termes: [turbocompresseur]
    sources:
      - titre: "Motor Sport, Keith Howard, « Harnessing the power » (janvier 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/january-2001/40/harnessing-the-power/"

  - id: lotus-92-active
    annee: 1983
    voie: transmission
    titre: "La suspension active en course"
    texte: "La suspension active de Peter Wright est utilisée sur la Lotus 92 de Nigel Mansell lors des deux premières courses de la saison."
    entrees: [peter-wright]
    termes: [suspension-active]

  - id: rappel-pneumatique
    annee: 1986
    voie: moteur
    titre: "Le rappel pneumatique des soupapes"
    texte: "Introduit sur le moteur Renault EF15 B, il équipe tous les moteurs de F1 à partir des années 1990."
    entrees: [bernard-dudot, jean-pierre-boudy]
    termes: [rappel-pneumatique]

  - id: active-gagne
    annee: 1987
    voie: transmission
    titre: "La suspension active gagne"
    texte: "La Lotus 99T d'Ayrton Senna devient la première F1 à suspension active à gagner un Grand Prix ; le système Williams conçu par Frank Dernie gagne à Monza avec Nelson Piquet."
    entrees: [peter-wright, frank-dernie, steve-wise, paddy-lowe]
    termes: [suspension-active]

  - id: ferrari-640
    annee: 1989
    voie: transmission
    titre: "La boîte semi-automatique au volant"
    texte: "John Barnard introduit sur la Ferrari 640 la boîte commandée par palettes : fin du levier, mains sur le volant, cockpit plus compact."
    entrees: [john-barnard]
    termes: [boite-semi-automatique]

  - id: v10-renault
    annee: 1989
    voie: moteur
    titre: "Le V10 Renault"
    texte: "Le V10 à 67° conçu sous la direction de Bernard Dudot impose l'architecture V10 à l'ensemble du plateau."
    entrees: [bernard-dudot]

  - id: tyrrell-019
    annee: 1990
    voie: aero
    titre: "Le nez relevé"
    texte: "La Tyrrell 019 de Harvey Postlethwaite et Jean-Claude Migeot relève le nez pour mieux alimenter le dessous de la voiture ; la Leyton House d'Adrian Newey le fait la même année."
    entrees: [jean-claude-migeot, harvey-postlethwaite, adrian-newey, mike-gascoyne]
    termes: [nez-releve]

  - id: fw14b
    annee: 1992
    voie: transmission
    titre: "Le titre de la suspension active"
    texte: "La Williams FW14B mène Nigel Mansell au titre, avec une suspension active dont Paddy Lowe a écrit l'essentiel du logiciel."
    entrees: [paddy-lowe, patrick-head, adrian-newey]
    termes: [suspension-active]

  - id: programme-anticipe
    annee: 1993
    voie: methode
    titre: "Le programme lancé un an à l'avance"
    texte: "Chez Benetton, Ross Brawn fait commencer la conception de la voiture de 1994 dès le début de 1993, ce qui était presque inédit."
    entrees: [ross-brawn, rory-byrne]

  - id: double-diffuseur
    annee: 2009
    voie: aero
    titre: "Le double diffuseur de la Brawn BGP 001"
    texte: "Lancée chez Honda, la BGP 001 exploite une faille du nouveau règlement ; le concept de double plancher vient d'un ingénieur japonais."
    entrees: [ross-brawn]
    termes: [diffuseur]

  - id: hybride
    annee: 2014
    voie: moteur
    titre: "Le groupe propulseur hybride Mercedes"
    texte: "Turbo séparé de part et d'autre du moteur, intégration avec le châssis : Mercedes domine l'ère hybride, imposée par le règlement."
    entrees: [andy-cowell, aldo-costa, ross-brawn]
    termes: [groupe-propulseur-hybride]

  - id: rendement-50
    annee: 2017
    voie: moteur
    titre: "50 % de rendement thermique"
    texte: "Le moteur Mercedes, à 44 % de rendement en 2014, franchit pour la première fois la barre des 50 % au banc."
    entrees: [andy-cowell]
    termes: [groupe-propulseur-hybride]

  - id: cooper-500
    annee: 1946
    voie: architecture
    titre: "Le moteur derrière le pilote, en 500 cm³"
    texte: "Le prototype de John Cooper et Eric Brandon place le moteur au milieu, « pour des raisons largement pratiques ». La disposition fera son chemin jusqu'à la F1."
    entrees: [john-cooper]
    termes: [moteur-central-arriere]

  - id: dfv-fva
    annee: 1966
    voie: moteur
    titre: "Le Cosworth FVA"
    texte: "Premier moteur conçu par Keith Duckworth à partir d'une feuille blanche, ce quatre cylindres de Formule 2 prépare le DFV."
    entrees: [keith-duckworth, mike-costin]

  - id: lotus-72
    annee: 1970
    voie: aero
    titre: "La Lotus 72 et ses radiateurs latéraux"
    texte: "Créditée à Maurice Philippe et Colin Chapman, la part de chacun restant discutée, elle place les radiateurs sur les flancs ; avec ses évolutions, elle remporte cinq titres mondiaux et 20 Grands Prix selon Lotus (22 selon Classic Team Lotus)."
    entrees: [colin-chapman]

  - id: lotus-88
    annee: 1981
    voie: aero
    titre: "La Lotus 88 à double châssis"
    texte: "Deux caisses suspendues séparément : le concept, auquel Peter Wright prend une part clé, est contesté et la voiture ne court jamais."
    entrees: [colin-chapman, peter-wright]
    termes: [effet-de-sol]

  - id: fond-plat
    annee: 1983
    voie: aero
    titre: "Le fond plat obligatoire"
    texte: "Annoncé le 3 novembre 1982, il interdit les fonds à effet de sol et les jupes ; le diffuseur arrière reste autorisé."
    entrees: [gordon-murray]
    termes: [fond-plat, effet-de-sol, jupes]

  - id: mp4-2
    annee: 1984
    voie: moteur
    titre: "Le moteur aux cotes du châssis"
    texte: "Pour la McLaren MP4/2, John Barnard impose à Porsche les dimensions du V6 turbo TAG, au service de l'aérodynamique ; la voiture gagne 12 des 16 courses."
    entrees: [john-barnard]
    termes: [turbocompresseur]

  - id: march-881
    annee: 1988
    voie: aero
    titre: "Le nez intégré de la March 881"
    texte: "Adrian Newey intègre entièrement le nez et l'aileron avant, creusés dessous pour mieux alimenter le plancher."
    entrees: [adrian-newey]
    termes: [aileron]

  - id: mp4-4
    annee: 1988
    voie: architecture
    titre: "La McLaren MP4/4, quinze victoires sur seize"
    texte: "La McLaren MP4/4 gagne 15 des 16 courses de 1988. Sa paternité reste discutée : Steve Nichols, son concepteur en chef, y voit une évolution de la MP4/3 ; Gordon Murray conteste ce récit. Autosport cite aussi Bob Bell, David North, Matthew Jeffreys et Steve Nielsen parmi ses auteurs."
    entrees: [steve-nichols, gordon-murray, bob-bell]

  - id: fw17b
    annee: 1995
    voie: aero
    titre: "Le diffuseur surélevé de la Williams FW17B"
    texte: "Apparu fin 1995, ce diffuseur à sortie surélevée devient un atout majeur de la Williams 1996."
    entrees: [adrian-newey]
    termes: [diffuseur]

  - id: rb6
    annee: 2010
    voie: aero
    titre: "Le diffuseur soufflé de la Red Bull RB6"
    texte: "Adrian Newey « réinvente » le diffuseur soufflé par les échappements."
    entrees: [adrian-newey]
    termes: [diffuseur]

  - id: "tyrrell-p34"
    annee: 1976
    voie: "aero"
    titre: "La Tyrrell P34 à six roues"
    texte: "La P34 de Derek Gardner est la seule voiture à six roues à prendre le départ d'un Grand Prix. Son vrai but n'est pas de réduire la surface frontale mais l'appui : quatre petites roues avant, moins exposées, engendrent moins de portance. À Anderstorp, personne ne la bat."
    entrees: [derek-gardner]
    termes: [appui]
    sources:
      - titre: "Motor Sport, Andrew Frankel, « Two too many » (février 2001)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2001/42/two-too-many"
      - titre: "Motor Sport, Nigel Roebuck, « When six worked better than four » (février 2011)"
        url: "https://www.motorsportmagazine.com/archive/article/february-2011/74/when-six-worked-better-four"

  - id: "donnees-tyrrell"
    annee: 1978
    voie: "methode"
    titre: "Les données entrent dans le réglage"
    texte: "Venu de la division course de Goodyear, Karl Kempf équipe les Tyrrell de capteurs dont les mesures, enregistrées sur cassette, servent au réglage. Il ne se dit pas le premier à mesurer, mais le premier à « utiliser vraiment les mesures de façon régulière » ; la date varie selon les sources."
    entrees: []
    termes: [acquisition-de-donnees]
    sources:
      - titre: "Racer, Mark Glendenning, « Tales of the tape: Early adventures in F1 data logging » (avril 2024)"
        url: "https://racer.com/2024/04/04/tales-of-the-tape-early-adventures-in-f1-data-logging/"
      - titre: "Jalopnik, Elizabeth Blackstock, « Formula One Telemetry: Explained » (décembre 2020)"
        url: "https://jalopnik.com/formula-one-telemetry-explained-1845819678/"

  - id: "telemetrie-course"
    annee: 1986
    voie: "methode"
    titre: "La télémétrie en course"
    texte: "Chez Williams-Honda, les ingénieurs suivent depuis le stand les relevés des instruments pendant la course. Développé à partir de mi-1985 par l'équipe électronique de Honda, le système est bientôt imité par les autres équipes, au point de devenir un équipement standard ; la primauté revendiquée par Honda reste discutée."
    entrees: []
    termes: [acquisition-de-donnees]
    sources:
      - titre: "Motor Sport, « Williams FW11 – Honda RA163FV6 » (janvier 1987)"
        url: "https://www.motorsportmagazine.com/archive/article/january-1987/49/williams-fw11-honda-ra163fv6"
      - titre: "Honda, « What Telemetry Said About Nigel Mansell » (site du constructeur, non daté)"
        url: "https://global.honda/en/mansell/Telemetry/"
      - titre: "Honda, « 1986 RA166E » (site du constructeur, non daté)"
        url: "https://global.honda/en/POWEREDbyHONDA/1986_ra166e/"
      - titre: "McLaren, Chris Alexander, « A brief history of computing in F1 » (janvier 2016)"
        url: "https://www.mclaren.com/racing/team/a-brief-history-of-computing-in-f1-1052199/"

  - id: "cfd-benetton"
    annee: 1993
    voie: "methode"
    titre: "La simulation numérique des écoulements"
    texte: "Chez Benetton, l'aérodynamique cesse d'être purement empirique : dès la fin des années 1980, un calcul simplifié sur station de travail étudie la répartition des pressions sur les ailerons arrière. En 1993, l'équipe s'associe à l'éditeur du logiciel de CFD Fluent, quand les codes commerciaux progressent."
    entrees: []
    termes: [cao]
    sources:
      - titre: "Autosport, Pat Symonds, « How a dynamic design tool has grown in F1 importance » (mars 2023)"
        url: "https://autosport.com/all/news/how-a-dynamic-design-tool-has-grown-in-f1-importance/10441847/"
      - titre: "Racecar Engineering, « Renault F1 extends Fluent relations » (mai 2004)"
        url: "https://www.racecar.com/news/6225/motorsport/renault-f1-extends-fluent-relations"

  - id: "boite-sans-coupure"
    annee: 2005
    voie: "transmission"
    titre: "La boîte sans rupture de couple"
    texte: "Sur la BAR 007, Honda fait engager le rapport suivant pendant que le précédent transmet encore le couple, avec un embrayage unidirectionnel par rapport ; le gain moyen est de 0,4 s au tour. En 2008, toutes les équipes ont un système semblable."
    entrees: []
    sources:
      - titre: "Motor Sport, Lawrence Butcher, « Honda's paradigm shifter that flew in the face of convention » (mai 2020)"
        url: "https://motorsportmagazine.com/articles/single-seaters/f1/hondas-paradigm-shifter-that-flew-in-the-face-of-convention"
      - titre: "Honda, « 2005 | F1 » (site du constructeur, non daté)"
        url: "https://global.honda/en/F1/2005"

  - id: "inerter"
    annee: 2005
    voie: "transmission"
    titre: "L'inerter de McLaren"
    texte: "Imaginé à Cambridge par Malcolm Smith, ce volant d'inertie logé dans la suspension court pour la première fois sur la McLaren victorieuse en Espagne, sous le nom de code « J-damper ». Ouvert à toutes les équipes en 2008, il reste un équipement standard jusqu'à son interdiction en 2022."
    entrees: []
    termes: [inerter]
    sources:
      - titre: "Université de Cambridge, « Secrets of the inerter revealed » (août 2008)"
        url: "https://www.cam.ac.uk/research/news/secrets-of-the-inerter-revealed"
      - titre: "Formula1.com, Mark Hughes et Giorgio Piola, « Tech Tuesday: How 2022's suspension overhaul could shuffle the competitive order » (février 2022)"
        url: "https://www.formula1.com/en/latest/article/tech-tuesday-how-2022s-suspension-overhaul-could-shuffle-the-competitive.4PoTMQ9jbaWotbTdd4bp8j"

  - id: "kers"
    annee: 2009
    voie: "moteur"
    titre: "Le KERS gagne en Hongrie"
    texte: "Récupérée au freinage, l'énergie rend jusqu'à 60 kW pendant 6,6 secondes par tour. Lewis Hamilton gagne en Hongrie avec la McLaren équipée du KERS de Mercedes, conçu à Brixworth avec Zytek : c'est la première victoire d'une voiture ainsi équipée. Selon Autosport, Mercedes en fait le socle de son groupe propulseur de 2014 ; Andy Cowell relativise."
    entrees: []
    termes: [kers]
    sources:
      - titre: "Formula1.com, « Re-writing the F1 rulebook - Part 4: cleaner cars, KERS and the return of slicks » (février 2017)"
        url: "https://www.formula1.com/en/latest/article/re-writing-the-f1-rulebook-part-4-cleaner-cars-kers-and-the-return-of-slicks.1NUrjfG83a6aE0QSuAkGK8"
      - titre: "Autosport, Scott Mitchell, « The 2007 decision that built Mercedes' hybrid empire » (août 2019)"
        url: "https://www.autosport.com/f1/news/the-2007-decision-that-built-mercedes-hybrid-empire-5112574/5112574/"
      - titre: "Crash.net, Matt Salisbury, « Zytek revealed as McLaren KERS supplier » (2009)"
        url: "https://www.crash.net/f1/news/150836/1/zytek-revealed-as-mclaren-kers-supplier"

  - id: "simulateur"
    annee: 2009
    voie: "methode"
    titre: "Le simulateur remplace la piste"
    texte: "Les essais en saison interdits, la mise au point passe des circuits aux usines : le pilote y roule dans une F1 virtuelle. McLaren, qui a lancé son simulateur dès 1996 avec Paddy Lowe et le soutien de Martin Whitmarsh, a de l'avance ; Ferrari reconnaît devoir rattraper son retard."
    entrees: [paddy-lowe]
    sources:
      - titre: "GrandPrix.com, Joe Saward, « Formula 1's virtual reality » (janvier 2009)"
        url: "https://www.grandprix.com/features/joe-saward/insight-formula-1s-virtual-reality.html"
